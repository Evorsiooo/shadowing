/* ---------- UI state ---------- */
const UI = {
  videoId: lsGet('videoId', null),
  clipId: null,
  sel: null, // {start, end, clipId?, label}
  view: 'pitch',
  loop: true,
  rate: 1,
  volume: lsGet('volume', 1),
  queue: [],
  drawer: false,
  addOpen: false,
  addForm: { title: '', url: '', speaker: '' },
  editVideoId: null,
  editVideo: null,
  showArchivedClips: false,
  cutMode: false,
  showAllClips: {},
  overlay: lsGet('overlay', false),
};

/* ---------- video player with custom controls ---------- */
const Player = {
  v: null,
  loopTimer: null,
  waitingLoop: false,
  rafOn: false,
  durationKnown: 0,
  tickHooks: new Set(),

  init() {
    this.v = $('#video');
    const v = this.v;
    v.preservesPitch = true; v.mozPreservesPitch = true; v.webkitPreservesPitch = true;
    v.volume = UI.volume;
    v.addEventListener('loadedmetadata', () => { this.durationKnown = v.duration; this.hideError(); renderScrubber(); renderControls(); renderPanel(); });
    v.addEventListener('play', () => { this.startRaf(); renderControls(); syncPlaySelButton(); });
    v.addEventListener('pause', () => { renderControls(); setTimeout(syncPlaySelButton, 0); });
    v.addEventListener('ratechange', () => renderControls());
    v.addEventListener('error', () => this.showError());
    v.addEventListener('timeupdate', () => { if (!this.rafOn) this.paintHead(); });
    this.bindScrubber();
  },

  current() { return Store.get('videos', UI.videoId); },
  load(videoId, { keepClip = false } = {}) {
    if (Session.active && videoId !== UI.videoId) { toast('Finish or end the current session before opening another video.'); return; }
    const vid = Store.get('videos', videoId);
    UI.videoId = vid ? vid.id : null;
    lsSet('videoId', UI.videoId);
    if (!keepClip) { UI.clipId = null; UI.sel = null; }
    this.durationKnown = 0;
    const src = videoSrc(vid);
    this.hideError();
    if (!vid) { this.v.removeAttribute('src'); this.v.load(); }
    else if (this.v.getAttribute('src') !== src) { this.v.src = src; this.v.load(); }
    this.v.playbackRate = UI.rate;
    $('#playerEmpty').hidden = !!vid;
    if (!vid) renderPlayerEmpty();
    renderAll();
    if (vid) ensureModels(vid);
  },
  reloadSrc() {
    const vid = this.current();
    if (!vid) return;
    const t = this.v.currentTime;
    this.v.src = videoSrc(vid);
    this.v.load();
    this.v.addEventListener('loadedmetadata', () => { this.v.currentTime = t; }, { once: true });
  },
  duration() { return isFinite(this.v.duration) && this.v.duration > 0 ? this.v.duration : this.durationKnown || 0; },
  time() { return this.v.currentTime || 0; },

  async play() {
    AudioEng.getCtx();
    try { await this.v.play(); return true; } catch (e) { if (e.name !== 'AbortError') this.showError(e); return false; }
  },
  pause() { this.v.pause(); clearTimeout(this.loopTimer); this.waitingLoop = false; syncPlaySelButton(); },
  toggle() {
    if (Session.active) { Session.togglePause(); return; }
    if (this.v.paused) {
      const r = activeRange();
      if (r && UI.loop && (this.time() < r.start - 0.05 || this.time() >= r.end - 0.05)) this.seek(r.start);
      this.play();
    } else this.pause();
  },
  seek(t) { const d = this.duration(); this.v.currentTime = clamp(t, 0, d || t); this.paintHead(); },
  /* seek and wait until the video has actually landed there (or 1.5 s pass) */
  seekAndWait(t) {
    return new Promise((res) => {
      const v = this.v;
      const done = () => { clearTimeout(timer); v.removeEventListener('seeked', done); res(); };
      const timer = setTimeout(done, 1500);
      v.addEventListener('seeked', done);
      this.seek(t);
      if (Math.abs(v.currentTime - t) < 0.01 && !v.seeking) done();
    });
  },
  replayLoop() {
    const r = activeRange();
    if (!r) { this.seek(Math.max(0, this.time() - 3)); this.play(); return; }
    if (Session.active) { Session.repeatPass(); return; }
    this.seek(r.start); this.play();
  },
  setRate(r) { UI.rate = r; this.v.playbackRate = r; this.v.preservesPitch = true; renderControls(); },
  stepRate(dir) { const rates = [0.5, 0.75, 1]; const i = rates.indexOf(UI.rate); this.setRate(rates[clamp((i < 0 ? 2 : i) + dir, 0, 2)]); },
  setVolume(x) { UI.volume = x; this.v.volume = x; this.v.muted = x === 0; lsSet('volume', x); },

  startRaf() {
    if (this.rafOn) return;
    this.rafOn = true;
    const step = () => {
      this.paintHead();
      this.checkLoop();
      for (const fn of this.tickHooks) fn(this.time());
      if (!this.v.paused || this.waitingLoop || Session.needsTick()) requestAnimationFrame(step);
      else this.rafOn = false;
    };
    requestAnimationFrame(step);
  },
  checkLoop() {
    if (Session.active) return; // the session runs its own passes
    const r = activeRange();
    if (!r || !UI.loop || this.v.paused || this.waitingLoop) return;
    if (this.time() >= r.end - 0.02) {
      this.v.pause();
      this.waitingLoop = true;
      this.loopTimer = setTimeout(() => {
        this.waitingLoop = false;
        const r2 = activeRange();
        if (!r2 || !UI.loop) return;
        this.seek(r2.start); this.play();
      }, settings().loopGap * 1000);
    }
  },
  paintHead() {

    $('#scrubHead').style.left = pct + '%';
    const tl = $('#timeLabel');
    if (tl) tl.textContent = `${fmtTime(t)} / ${fmtTime(d)}`;

  },

  showError(e) {

    const el = $('#playerError');
    const url = vid.url || '';
    const share = /drive\.google|docs\.google|mega\.nz|mega\.io|dropbox\.com\/s\/|youtube\.com|youtu\.be|onedrive|1drv/i.test(url);
    const reason = share
      ? 'This looks like a share page, not a direct video file. Share pages from Google Drive, MEGA, YouTube and similar sites don\'t play here. Use a direct link that ends in .mp4.'
      : vid.r2Key ? 'The stored copy didn’t load. If you were signed out, reload the page; otherwise upload the file again.'
      : Caps.inArtifact && !LocalFiles.get(vid.id) && !vid.assetId
        ? 'Inside a Claude artifact, videos from other websites are blocked by the page\'s security rules. Pick the same video file from this device, or store a short copy here (20 MB maximum).'
        : 'The link didn\'t load as a video. Check it opens directly as an .mp4 file in a new tab.';
    mount(el,
      h('h3', null, "This video won't play"),
      h('p', null, reason),
      h('div', { class: 'row', style: { justifyContent: 'center' } },
        filePickButton('Use a file from this device', 'video/*', (f) => useLocalFile(vid, f), { kind: 'primary', icon: 'folder' }),
        Store.mode === 'cloud' ? filePickButton('Upload the file to my storage', 'video/*', (f) => storeVideoCopy(vid, f), { icon: 'upload' })
          : Caps.assets && Store.blobMode === 'assets' ? filePickButton('Store a copy (under 20 MB)', 'video/mp4,video/webm', (f) => storeVideoCopy(vid, f), { icon: 'upload' }) : null,
        url ? h('a', { class: 'btn', href: url, target: '_blank', rel: 'noopener' }, icon('link'), h('span', { class: 'txt' }, 'Open original link')) : null));

      } else if (e.type === 'pointerup') this.seek(tAt(e.clientX));
    };
    sc.addEventListener('pointerup', end);
    sc.addEventListener('pointercancel', end);
  },
};

function activeRange() {
  if (UI.sel) return { start: UI.sel.start, end: UI.sel.end };

async function storeVideoCopy(vid, file) {
  if (Store.mode === 'cloud') {
    toast('Uploading… keep this page open.');
    try {
      const r = await Api.uploadVideo(file, () => {});
      Store.patch('videos', vid.id, { r2Key: r.key, size: r.size });
      VideoAudio.cache.delete(vid.id);
      Player.reloadSrc();
      Player.hideError();
      toast('Uploaded. It now plays on every device.', 'good');
    } catch (e) { toast(e.message, 'bad', 7000); }
    return;
  }

  toast('Uploading a copy…');

  } catch (e) {
    toast(`Upload failed (${e.code || 'error'}). ${e.code === 'quota_or_state' ? 'Storage is full.' : ''}`, 'bad');
  }

function setCutMode(on) {
  if (Session.active && on) return;
  UI.cutMode = on;
  if (!on && UI.sel && !UI.sel.clipId) UI.sel = null;
  $('#player').classList.toggle('cutting', on);
  if (on) toast('Clip mode: drag on the timeline to select a clip, or press I and O while it plays.');

function markEdge(which) {
  if (!Player.current() || Session.active) return;
  if (!UI.cutMode) { UI.cutMode = true; $('#player').classList.add('cutting'); }
  const t = Player.time();
  const s = settings();
  if (!UI.sel) {
    const c = Store.get('clips', UI.clipId);
    UI.sel = which === 'start' ? { start: t, end: Math.min(Player.duration() || t + s.clipMax, t + (s.clipMin + s.clipMax) / 2), label: '' }
      : { start: Math.max(0, t - (s.clipMin + s.clipMax) / 2), end: t, label: '' };
    if (c) UI.clipId = null;
  } else if (which === 'start') {
    UI.sel.start = t;
    if (UI.sel.end <= t) UI.sel.end = t + s.clipMin;
  } else {
    UI.sel.end = t;
    if (UI.sel.start >= t) UI.sel.start = Math.max(0, t - s.clipMin);
  }
  toast(which === 'start' ? `Clip start marked at ${fmtTime(t, 1)}` : `Clip end marked at ${fmtTime(t, 1)}`);
  renderScrubber(); renderPanel();
  loadSelAudio();
}

/* ---------- render: scrubber brackets ---------- */

/* ---------- clip helpers ---------- */
function videoClips(videoId) {
  return Store.all('clips').filter((c) => c.videoId === videoId).sort((a, b) => a.start - b.start);
}
function clipName(c, idx) {
  if (c.label) return c.label;
  const list = videoClips(c.videoId);
  const i = idx != null ? idx : list.findIndex((x) => x.id === c.id);
  return `Clip ${i + 1} (${fmtTime(c.start)})`;
}
function selectClip(id, { seek = true, play = false } = {}) {
  if (Session.active && Session.clipId !== id) { toast('Finish or end the current session first.'); return; }
  const c = Store.get('clips', id);
  if (!c) return;
  if (c.videoId !== UI.videoId) Player.load(c.videoId, { keepClip: true });
  UI.clipId = id;
  UI.sel = null;
  if (seek) Player.seek(c.start);
  if (play) Player.play();
  renderAll();
  if (!c.model) ensureModels(Store.get('videos', c.videoId));
}
function editClip(id) {
  const c = Store.get('clips', id);
  if (!c || Session.active) return;
  if (c.videoId !== UI.videoId) Player.load(c.videoId, { keepClip: true });
  UI.clipId = null;
  UI.sel = { start: c.start, end: c.end, clipId: c.id, label: c.label || '' };
  Player.seek(c.start);
  renderAll();
  loadSelAudio();
}

/* work out (and store) the model line for clips that don't have one yet */
async function ensureModels(vid) {
  if (!vid) return;
  const missing = videoClips(vid.id).filter((c) => !c.model && !c.archived);
  for (const c of missing) {
    // only the clip's own stretch of audio is fetched and decoded
    const st = await VideoAudio.ensure(vid, c.start, c.end);
    if (!st || st.status === 'error') break;
    await sleep(10);
    computeModel(Store.get('clips', c.id) || c);
  }
  renderPanel();
}
/* audio around the selection being edited (the zoomed editor shows a margin either side) */
function loadSelAudio() {
  const vid = Player.current();
  if (!vid || !UI.sel) return Promise.resolve();
  return VideoAudio.ensure(vid, UI.sel.start - 4, UI.sel.end + 4).then(() => renderPanel());
}

function computeModel(c) {
  const x = VideoAudio.slice(c.videoId, c.start, c.end);
  if (!x || x.length < SR) return false;
  const m = DSP.modelFromSamples(x, settings().pitchSmoothing);
  m.start = c.start; m.end = c.end; m.at = new Date().toISOString();
  Store.patch('clips', c.id, { model: m });
  return true;
}

/* ---- 50-panel.js ---- */
/* ---------- analysis panel: pitch / waveform lanes, or the zoomed clip editor ---------- */
const Panel = {
  key: null,
  canvas: null,
  refs: {},
  live: null, // {points:[{t, st, db}]} during a recorded/live pass, clip time
  lastPass: null, // {st:[], db:[], hop, offset, lag, score}
  editor: null, // {w0, w1, db:Float32Array, pauses, thr}
  drag: null,

  onTime(t) {
    if (!this.canvas) return;
    if (this.key && this.key.startsWith('editor')) this.drawEditor(t);
    else if (this.key && this.key.startsWith('clip')) this.drawAnalysis(t);
  },
};

function renderPanel() {
  applyLayout();
  const el = $('#panel');
  const vid = Player.current();
  const clip = Store.get('clips', UI.clipId);
  let key;
  if (UI.sel && vid) key = `editor:${UI.sel.clipId || 'new'}:${VideoAudio.state(vid.id).status}`;
  else if (UI.cutMode && !Session.active) key = 'empty-cut';
  else if (clip) key = `clip:${clip.id}:${Session.active}:${UI.view}:${UI.overlay}:${!!clip.model}:${VideoAudio.state(clip.videoId).status}`;
  else key = UI.cutMode ? 'empty-cut' : 'empty';

  if (key !== Panel.key) {
    Panel.key = key;
    Panel.canvas = null;
    Panel.refs = {};
    if (key.startsWith('empty')) mount(el, panelEmpty());
    else if (key.startsWith('editor')) mount(el, buildEditor(vid));
    else mount(el, buildAnalysis(clip));
  }
  if (key.startsWith('editor')) updateEditor();
  if (key.startsWith('clip')) updateAnalysisHead(clip);
  Panel.onTime(Player.time());
}

function panelEmpty() {
  if (UI.cutMode) return [
    h('div', { class: 'panel-head' }, h('h3', null, 'New clip'), h('span', { class: 'spacer' }), btn('Done', () => setCutMode(false), { size: 'sm', kind: 'ghost', title: 'Leave clip mode (Esc)' })),
    h('div', { class: 'newclip-box' },
      h('p', null, h('strong', null, 'Select a part of the video on the scrub bar'), ' by dragging along it.'),
      h('p', { class: 'muted' }, 'Or play the video and press ', h('strong', null, 'Start'), ' (I) under the video where the sentence begins, then ', h('strong', null, 'End'), ' (O) where it finishes.'))];
  return h('div', { class: 'panel-msg' },
    h('h3', null, 'Analysis panel'),
    h('p', null, 'Select a clip to see the speaker’s pitch line, or press Cut clips under the video to make a new one.'));
}

/* ---------- analysis view ---------- */
function buildAnalysis(clip) {
  const vid = Store.get('videos', clip.videoId);
  const audio = VideoAudio.state(clip.videoId);
  const canvas = h('canvas', { class: 'analysis', 'aria-label': UI.overlay ? 'Pitch or loudness of the speaker and you on one chart' : 'Pitch or loudness lanes: speaker on top, you below' });
  Panel.canvas = canvas;
  const head = h('div', { class: 'panel-head' },
    h('div', { class: 'seg', role: 'group', 'aria-label': 'View' },
      h('button', { type: 'button', class: UI.view === 'pitch' ? 'on' : '', onclick: () => { UI.view = 'pitch'; renderPanel(); } }, 'Pitch'),
      h('button', { type: 'button', class: UI.view === 'wave' ? 'on' : '', onclick: () => { UI.view = 'wave'; renderPanel(); } }, 'Waveform')),
    h('div', { class: 'seg', role: 'group', 'aria-label': 'Layout' },
      h('button', { type: 'button', class: UI.overlay ? '' : 'on', title: 'Speaker on top, you below', onclick: () => setOverlay(false) }, 'Separate'),
      h('button', { type: 'button', class: UI.overlay ? 'on' : '', title: 'Both lines on one chart', onclick: () => setOverlay(true) }, 'Overlaid')),
    h('span', { class: 'lag', id: 'lagLabel' }),
    h('span', { class: 'spacer' }),
    h('span', { class: 'small muted', id: 'relLabel' }),
    !Session.active ? btn('Edit clip', () => editClip(clip.id), { icon: 'scissors', title: 'Change the clip’s start, end, length or label' }) : null,
    btn(clip.noisy ? 'Flagged noisy' : 'Too noisy?', () => { Store.patch('clips', clip.id, { noisy: !clip.noisy }); toast(clip.noisy ? 'Clip flagged as too noisy. Its pitch line is shown faded.' : 'Noisy flag removed.'); renderPanel(); renderSidebar(); },
      { icon: 'flag', on: clip.noisy, title: 'Flag this clip as too noisy for a reliable pitch line' }));
  if (!clip.model) {
    let msg;
    if (audio.status === 'loading' || audio.status === 'decoding') msg = h('p', null, `Reading the video’s sound… ${audio.progress ? Math.round(audio.progress * 100) + '%' : ''}`);
    else if (audio.status === 'error') msg = [h('p', null, audio.error), filePickButton('Load the video file from this device', 'video/*,audio/*', (f) => useLocalFile(vid, f), { kind: 'primary', icon: 'folder' })];
    else msg = [h('p', null, 'The model line for this clip hasn’t been worked out yet.'), btn('Work it out now', () => ensureModels(vid).then(renderPanel), { kind: 'primary' })];
    return [head, h('div', { class: 'panel-msg' }, msg), canvas];
  }
  bindAnalysisCanvas(canvas, clip);
  return [head, canvas];
}

function setOverlay(on) {
  UI.overlay = on;
  lsSet('overlay', on);
  renderPanel();
}

function bindAnalysisCanvas(canvas, clip) {
  canvas.addEventListener('pointerdown', (e) => {
    if (Session.active) return;
    const r = canvas.getBoundingClientRect();
    const t = clip.start + ((e.clientX - r.left) / r.width) * (clip.end - clip.start);
    Player.seek(t);
  });
}

function updateAnalysisHead(clip) {
  const lag = $('#lagLabel');
  if (lag) lag.textContent = Panel.lastPass && Panel.lastPass.clipId === clip.id ? `Last pass: ${fmtLag(Panel.lastPass.lag)}${Panel.lastPass.manual ? ' (manual offset)' : ''}` : '';
  const rel = $('#relLabel');
  if (rel && clip.model) rel.textContent = clip.model.reliability < 0.55 || clip.noisy ? 'Pitch line unreliable in places' : '';
}

/* tiny "higher / lower" marks so it's clear which way is up on a pitch chart */
function pitchHints(g, W, dpr, lanes, color) {
  g.save();
  g.fillStyle = color;
  g.globalAlpha = 0.75;
  g.font = `700 ${9.5 * dpr}px Nunito, system-ui, sans-serif`;
  g.textAlign = 'right';
  for (const L of lanes) {
    g.fillText('▲ higher', W - 8 * dpr, L.top + 13 * dpr);
    g.fillText('▼ lower', W - 8 * dpr, L.top + L.h - 6 * dpr);
  }
  g.restore();
}

function sizeCanvas(c) {
  const r = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const W = Math.max(10, Math.round(r.width * dpr)), H = Math.max(10, Math.round(r.height * dpr));
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  return { W, H, dpr };
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* draws the speaker and you either in two lanes, or overlaid on one chart */
Panel.drawAnalysis = function (t) {
  const c = this.canvas;
  const clip = Store.get('clips', UI.clipId);
  if (!c || !clip || !clip.model) return;
  const { W, H, dpr } = sizeCanvas(c);
  const g = c.getContext('2d');
  g.clearRect(0, 0, W, H);
  const dur = clip.end - clip.start;
  const x = (ct) => (ct / dur) * W;
  const ov = !!UI.overlay;
  const green = cssVar('--green'), sky = cssVar('--sky');
  const lanes = ov
    ? [{ top: 0, h: H, name: 'Speaker', color: green }, { top: 0, h: H, name: 'You', color: sky }]
    : [{ top: 0, h: H / 2 - 2 * dpr, name: 'Speaker', color: green }, { top: H / 2 + 2 * dpr, h: H / 2 - 2 * dpr, name: 'You', color: sky }];
  const muted = cssVar('--muted'), line = cssVar('--line');
  g.font = `800 ${11 * dpr}px Nunito, system-ui, sans-serif`;
  for (const L of ov ? lanes.slice(0, 1) : lanes) {
    g.fillStyle = line;
    g.globalAlpha = 0.6;
    g.fillRect(0, L.top + L.h / 2, W, 1 * dpr);
    g.globalAlpha = 1;
  }
  if (ov) {
    // legend: coloured names
    let lx = 8 * dpr;
    for (const L of lanes) {
      g.fillStyle = L.color; g.fillRect(lx, 7 * dpr, 10 * dpr, 4 * dpr);
      g.fillStyle = muted; g.fillText(L.name, lx + 14 * dpr, 14 * dpr);
      lx += g.measureText(L.name).width + 30 * dpr;
    }
  } else for (const L of lanes) { g.fillStyle = muted; g.fillText(L.name, 8 * dpr, L.top + 14 * dpr); }
  if (UI.view === 'pitch') {
    g.fillStyle = muted;
    g.textAlign = 'right';
    if (ov) g.fillText('each voice’s own average', W - 8 * dpr, H / 2 - 5 * dpr);
    else {
      g.fillText('speaker’s average', W - 8 * dpr, lanes[0].top + lanes[0].h / 2 - 5 * dpr);
      g.fillText('your average', W - 8 * dpr, lanes[1].top + lanes[1].h / 2 - 5 * dpr);
    }
    g.textAlign = 'left';
  }
  if (UI.view === 'pitch') pitchHints(g, W, dpr, ov ? [{ top: 0, h: H }] : lanes, muted);
  // time ticks
  g.globalAlpha = 0.5;
  for (let s = 1; s < dur; s++) { g.fillStyle = line; g.fillRect(x(s), 0, 1 * dpr, H); }
  g.globalAlpha = 1;

  const m = clip.model;
  const faded = clip.noisy || m.reliability < 0.4;
  const drawSeries = (L, series, hop, offset, color, alpha = 1, width = 3) => {
    if (UI.view === 'pitch') {
      const range = 12; // ± semitones
      g.strokeStyle = color; g.lineWidth = width * dpr; g.lineJoin = 'round'; g.lineCap = 'round'; g.globalAlpha = alpha;
      g.beginPath();
      let pen = false, prev = null;
      for (let i = 0; i < series.st.length; i++) {
        const v = series.st[i];
        const ct = offset + i * hop;
        // gaps, out-of-range readings and sudden jumps break the line instead of drawing a straight connector
        if (v == null || ct < 0 || ct > dur || Math.abs(v) > range) { pen = false; prev = null; continue; }
        if (prev != null && Math.abs(v - prev) > 4) pen = false;
        prev = v;
        const y = L.top + L.h / 2 - (v / range) * (L.h / 2 - 6 * dpr);
        if (!pen) { g.moveTo(x(ct), y); pen = true; } else g.lineTo(x(ct), y);
      }
      g.stroke();
      g.globalAlpha = 1;
    } else {
      const db = series.db;
      const peak = percentile(db.filter((v) => v != null), 0.98);
      g.fillStyle = color; g.globalAlpha = alpha * (ov ? 0.5 : 0.85);
      const bw = Math.max(1, x(hop) - 0.5);
      for (let i = 0; i < db.length; i++) {
        const ct = offset + i * hop;
        if (db[i] == null || ct < 0 || ct > dur) continue;
        const a = clamp((db[i] - (peak - 45)) / 45, 0, 1);
        const hh = a * (L.h / 2 - 4 * dpr);
        g.fillRect(x(ct), L.top + L.h / 2 - hh, bw, hh * 2);
      }
      g.globalAlpha = 1;
    }
  };
  drawSeries(lanes[0], m, m.hop, 0, lanes[0].color, (faded ? 0.45 : 1) * (ov ? 0.6 : 1), ov ? 5 : 3);

  // you: live trace during a pass, otherwise the last analysed pass for this clip
  if (this.live && this.live.clipId === clip.id && this.live.points.length) {
    const sh = this.live.shift || 0;
    const pts = this.live.points.map((p) => ({ t: p.t - sh, st: p.st, db: p.db }));
    const series = { st: pts.map((p) => p.st), db: pts.map((p) => p.db) };
    // live points are irregular in time; draw as polyline
    if (UI.view === 'pitch') {
      g.strokeStyle = lanes[1].color; g.lineWidth = 3 * dpr; g.lineJoin = 'round'; g.beginPath();
      let pen = false, prevT = -1, prevV = null;
      for (const p of pts) {
        if (p.st == null || p.t < 0 || p.t > dur || p.t - prevT > 0.08 || (prevV != null && Math.abs(p.st - prevV) > 4)) pen = false;
        prevT = p.t;
        prevV = p.st;
        if (p.st == null || p.t < 0 || p.t > dur) continue;
        const L = lanes[1];
        const y = L.top + L.h / 2 - (p.st / 12) * (L.h / 2 - 6 * dpr);
        if (!pen) { g.moveTo(x(p.t), y); pen = true; } else g.lineTo(x(p.t), y);
      }
      g.stroke();
    } else {
      const peak = percentile(series.db, 0.98);
      g.fillStyle = lanes[1].color;
      if (ov) g.globalAlpha = 0.5;
      for (const p of pts) {
        if (p.t < 0 || p.t > dur) continue;
        const a = clamp((p.db - (peak - 45)) / 45, 0, 1);
        const L = lanes[1], hh = a * (L.h / 2 - 4 * dpr);
        g.fillRect(x(p.t), L.top + L.h / 2 - hh, Math.max(1, x(0.012)), hh * 2);
      }
      g.globalAlpha = 1;
    }
  } else if (this.lastPass && this.lastPass.clipId === clip.id) {
    const p = this.lastPass;
    drawSeries(lanes[1], p, p.hop, p.offset, lanes[1].color);
  } else {
    g.fillStyle = muted;
    g.textAlign = 'center';
    g.fillText(Mic.error && Session.active ? 'Microphone unavailable' : 'Your line appears here when you record a pass', W / 2, ov ? H - 12 * dpr : lanes[1].top + lanes[1].h * 0.25);
    g.textAlign = 'left';
  }

  // playhead
  if (t >= clip.start - 0.5 && t <= clip.end + 0.5) {
    g.fillStyle = cssVar('--ochre');
    g.fillRect(x(clamp(t - clip.start, 0, dur)) - dpr, 0, 2 * dpr, H);
  }
};

/* ---------- zoomed clip editor ---------- */
const MARGIN = 1.5;
function buildEditor(vid) {
  const s = settings();
  const audio = VideoAudio.state(vid.id);
  const canvas = h('canvas', { class: 'editor', 'aria-label': 'Zoomed waveform of the selection; drag the yellow edges onto quiet gaps' });
  Panel.canvas = canvas;
  bindEditorCanvas(canvas);
  const R = Panel.refs;
  const nudge = (which, d) => () => {
    UI.sel[which] = clamp(round(UI.sel[which] + d, 2), 0, Player.duration() || 1e9);
    if (UI.sel.end - UI.sel.start < 0.5) UI.sel[which === 'start' ? 'start' : 'end'] -= d;
    Panel.editor = null; updateEditor(); renderScrubber();
  };
  R.len = h('span', { class: 'len' });
  R.warn = h('div', { class: 'warnline', role: 'status' });
  // typed times: m:ss.s or plain seconds; length moves the end
  const applyTyped = (which, raw) => {
    const v = parseTime(raw);
    if (v == null) { toast('Type a time like 3:35.2 or a number of seconds.'); updateEditor(); return; }
    const d = Player.duration() || 1e9;
    if (which === 'start') UI.sel.start = clamp(round(v, 2), 0, UI.sel.end - 0.5);
    else if (which === 'end') UI.sel.end = clamp(round(v, 2), UI.sel.start + 0.5, d);
    else UI.sel.end = clamp(round(UI.sel.start + Math.max(0.5, v), 2), UI.sel.start + 0.5, d);
    Panel.editor = null; updateEditor(); renderScrubber(); loadSelAudio();
  };
  const timeInput = (which, id) => h('input', { type: 'text', id, class: 'num time-in', inputmode: 'decimal', 'aria-label': which,
    onchange: (e) => applyTyped(which, e.target.value), onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); } });
  R.startT = timeInput('start', 'selStart');
  R.endT = timeInput('end', 'selEnd');
  R.lenT = timeInput('length', 'selLen');
  R.label = h('input', { type: 'text', id: 'clipLabel', placeholder: 'A few words of what’s said (optional)', value: UI.sel.label || '', oninput: (e) => { UI.sel.label = e.target.value; } });
  let msg = null;
  if (audio.status === 'loading' || audio.status === 'decoding') msg = h('p', { class: 'small muted', id: 'audioMsg' }, 'Reading the video’s sound for the zoomed waveform…');
  else if (audio.status === 'error') msg = h('div', { class: 'row small' }, h('p', { class: 'grow muted' }, audio.error + ' You can still cut the clip with the nudge buttons and by ear.'), filePickButton('Load the file', 'video/*,audio/*', (f) => useLocalFile(vid, f), { size: 'sm', icon: 'folder' }));
  const editing = UI.sel.clipId;
  return [
    h('div', { class: 'panel-head' },

      h('span', { class: 'spacer' }),

      h('div', { class: 'stack' }, h('label', { class: 'label', for: 'selStart' }, 'Start'),
        h('div', { class: 'nudge' }, R.startT, btn('−0.1 s', nudge('start', -0.1), { size: 'sm' }), btn('+0.1 s', nudge('start', 0.1), { size: 'sm' }), btn('Snap to gap', () => snapEdge('start'), { size: 'sm', title: 'Move the start into the nearest pause' }))),
      h('div', { class: 'stack' }, h('label', { class: 'label', for: 'selEnd' }, 'End'),
        h('div', { class: 'nudge' }, R.endT, btn('−0.1 s', nudge('end', -0.1), { size: 'sm' }), btn('+0.1 s', nudge('end', 0.1), { size: 'sm' }), btn('Snap to gap', () => snapEdge('end'), { size: 'sm' }))),
      h('div', { class: 'stack' }, h('label', { class: 'label', for: 'selLen' }, 'Length (s)'), h('div', { class: 'nudge' }, R.lenT)),
      h('label', { class: 'field', for: 'clipLabel' }, 'Label', R.label)),
    h('div', { class: 'row', style: { marginTop: '12px' } },

}

function togglePlaySelection() {
  if (!UI.sel) return;
  if (!Player.v.paused || Player.waitingLoop) { Player.pause(); return; }
  if (Player.time() < UI.sel.start - 0.05 || Player.time() >= UI.sel.end - 0.05) Player.seek(UI.sel.start);
  Player.play();
}
/* keep the editor's play button in step with the player */
function syncPlaySelButton() {
  const b = $('#playSelBtn');
  if (!b) return;
  const playing = !Player.v.paused || Player.waitingLoop;
  const next = btn(playing ? 'Stop' : 'Play selection', () => togglePlaySelection(), { icon: playing ? 'stop' : 'play', size: 'sm', id: 'playSelBtn' });
  b.replaceWith(next);
  Panel.refs.playSel = next;
}

function editorData(vid) {
  const sel = UI.sel;
  const w0 = Math.max(0, sel.start - MARGIN), w1 = Math.min(Player.duration() || sel.end + MARGIN, sel.end + MARGIN);
  const E = Panel.editor;
  if (E && E.vid === vid.id && E.w0 <= w0 + 0.01 && E.w1 >= w1 - 0.01 && E.ready) return E;
  // keep a wider window so small nudges don't recompute
  const W0 = Math.max(0, w0 - 2), W1 = Math.min(Player.duration() || w1 + 2, w1 + 2);
  const x = VideoAudio.slice(vid.id, W0, W1);
  if (!x || x.length < WIN * 2) {
    // not decoded yet: fetch just this window, then the editor redraws
    if (VideoAudio.state(vid.id).status !== 'loading' && VideoAudio.state(vid.id).status !== 'error') VideoAudio.ensure(vid, W0, W1);
    Panel.editor = { vid: vid.id, w0: W0, w1: W1, ready: false };
    return Panel.editor;
  }
  const n = Math.floor((x.length - WIN) / HOP);
  const db = new Float32Array(n);
  for (let i = 0; i < n; i++) db[i] = DSP.rmsDb(x, i * HOP, WIN);
  // pause detection uses the loudness spread of the wider window
  const { pauses, thr } = DSP.pauses(db, 12);
  Panel.editor = { vid: vid.id, w0: W0, w1: W1, db, pauses, thr, ready: true };
  return Panel.editor;
}

function edgeOnSpeech(E, t) {
  if (!E || !E.ready) return false;
  const i = Math.round((t - E.w0) / HOP_S);
  let loud = 0;
  for (let k = i - 3; k <= i + 3; k++) if (E.db[k] != null && E.db[k] > E.thr + 3) loud++;
  return loud >= 4;
}

function snapEdge(which) {
  const vid = Player.current();
  const E = editorData(vid);
  if (!E.ready) { toast('The waveform isn’t available, so there are no gaps to snap to. Nudge by ear instead.'); return; }
  const t = UI.sel[which];
  let best = null;
  for (const p of E.pauses) {
    const a = E.w0 + p.a * HOP_S, b = E.w0 + p.b * HOP_S;
    const mid = which === 'start' ? Math.max(a, b - 0.15) : Math.min(b, a + 0.15);
    const d = Math.abs(mid - t);
    if (d < 2 && (!best || d < best.d)) best = { d, t: mid };
  }
  if (!best) { toast('No pause found within 2 seconds of that edge.'); return; }
  UI.sel[which] = round(best.t, 2);
  if (UI.sel.end - UI.sel.start < 1) { toast('Snapping there would make the clip too short.'); return; }
  updateEditor(); renderScrubber();
}

function updateEditor() {
  const s = settings();
  const R = Panel.refs;
  const sel = UI.sel;
  if (!sel || !R.len) return;
  const len = sel.end - sel.start;
  const lo = s.clipMin, hi = s.clipMax, slack = Math.max(2, (hi - lo) * 0.25);
  const cls = len >= lo && len <= hi ? 'good' : len >= lo - slack && len <= hi + slack ? 'warn' : 'bad';
  R.len.className = `len ${cls}`;
  R.len.textContent = fmtSec(len);
  // don't overwrite a field while it's being typed in
  if (document.activeElement !== R.startT) R.startT.value = fmtTime(sel.start, 1);
  if (document.activeElement !== R.endT) R.endT.value = fmtTime(sel.end, 1);
  if (document.activeElement !== R.lenT) R.lenT.value = len.toFixed(1);
  const E = editorData(Player.current());
  const warns = [];
  if (E.ready) {
    if (edgeOnSpeech(E, sel.start)) warns.push('The start lands mid-word. Move it into a gap.');
    if (edgeOnSpeech(E, sel.end)) warns.push('The end lands mid-word. Move it into a gap so the sentence isn’t cut in half.');
  }
  R.warn.textContent = warns.join(' ');
  Panel.drawEditor(Player.time());
}

Panel.drawEditor = function (t) {
  const c = this.canvas;
  const vid = Player.current();
  if (!c || !UI.sel || !vid) return;
  const { W, H, dpr } = sizeCanvas(c);
  const g = c.getContext('2d');
  g.clearRect(0, 0, W, H);
  const sel = UI.sel;
  const v0 = Math.max(0, sel.start - MARGIN), v1 = Math.min(Player.duration() || sel.end + MARGIN, sel.end + MARGIN);
  const X = (tt) => ((tt - v0) / (v1 - v0)) * W;
  const E = editorData(vid);
  // selection backdrop
  g.fillStyle = cssVar('--wattle-soft');
  g.fillRect(X(sel.start), 0, X(sel.end) - X(sel.start), H);
  if (E.ready) {
    // pauses
    g.fillStyle = cssVar('--green-soft');
    for (const p of E.pauses) {
      const a = E.w0 + p.a * HOP_S, b = E.w0 + p.b * HOP_S;
      if (b < v0 || a > v1) continue;
      g.fillRect(X(a), H - 8 * dpr, X(b) - X(a), 8 * dpr);
    }
    const peak = percentile(Array.from(E.db), 0.99);
    g.fillStyle = cssVar('--fg');
    g.globalAlpha = 0.75;
    const i0 = Math.max(0, Math.floor((v0 - E.w0) / HOP_S)), i1 = Math.min(E.db.length, Math.ceil((v1 - E.w0) / HOP_S));
    const bw = Math.max(1, (W / (i1 - i0)) * 0.8);
    for (let i = i0; i < i1; i++) {
      const a = clamp((E.db[i] - (peak - 48)) / 48, 0, 1);
      const hh = a * (H / 2 - 12 * dpr);
      g.fillRect(X(E.w0 + i * HOP_S), H / 2 - hh, bw, hh * 2);
    }
    g.globalAlpha = 1;
  } else {
    g.fillStyle = cssVar('--muted');
    g.font = `800 ${12 * dpr}px Nunito, system-ui, sans-serif`;
    g.textAlign = 'center';
    g.fillText('Waveform unavailable', W / 2, H / 2);
    g.textAlign = 'left';
  }
  // edges as brackets
  const wat = cssVar('--wattle');
  g.fillStyle = wat;
  for (const [tt, dir] of [[sel.start, 1], [sel.end, -1]]) {
    const xx = X(tt);
    g.fillRect(xx - 2 * dpr, 0, 4 * dpr, H);
    g.fillRect(dir > 0 ? xx : xx - 12 * dpr, 0, 12 * dpr, 4 * dpr);
    g.fillRect(dir > 0 ? xx : xx - 12 * dpr, H - 4 * dpr, 12 * dpr, 4 * dpr);
  }
  // playhead
  if (t >= v0 && t <= v1) { g.fillStyle = cssVar('--ochre'); g.fillRect(X(t) - dpr, 0, 2 * dpr, H); }
};

function bindEditorCanvas(c) {
  const tAt = (e) => {
    const r = c.getBoundingClientRect();
    const sel = UI.sel;
    const v0 = Math.max(0, sel.start - MARGIN), v1 = Math.min(Player.duration() || sel.end + MARGIN, sel.end + MARGIN);
    return { t: v0 + ((e.clientX - r.left) / r.width) * (v1 - v0), px: (v1 - v0) / r.width };
  };
  c.addEventListener('pointerdown', (e) => {
    if (!UI.sel) return;
    const { t, px } = tAt(e);
    const ds = Math.abs(t - UI.sel.start), de = Math.abs(t - UI.sel.end);
    const which = ds < de ? 'start' : 'end';
    if (Math.min(ds, de) < px * 14) {
      // freeze the view while dragging so the edge follows the pointer
      Panel.drag = { which, v0: Math.max(0, UI.sel.start - MARGIN), v1: Math.min(Player.duration() || UI.sel.end + MARGIN, UI.sel.end + MARGIN) };
      c.setPointerCapture(e.pointerId);
    } else Player.seek(t);
  });
  c.addEventListener('pointermove', (e) => {
    const D = Panel.drag;
    if (!D) return;
    const r = c.getBoundingClientRect();
    const t = D.v0 + ((e.clientX - r.left) / r.width) * (D.v1 - D.v0);
    if (D.which === 'start') UI.sel.start = clamp(round(t, 2), 0, UI.sel.end - 0.5);
    else UI.sel.end = clamp(round(t, 2), UI.sel.start + 0.5, Player.duration() || 1e9);
    updateEditor();
  });
  const end = () => { if (Panel.drag) { Panel.drag = null; renderScrubber(); updateEditor(); } };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
}

function saveSelection(shadowNow) {
  const sel = UI.sel;
  const vid = Player.current();
  if (!sel || !vid) return;
  let clip;
  if (sel.clipId) {
    clip = Store.patch('clips', sel.clipId, { start: round(sel.start, 2), end: round(sel.end, 2), label: (sel.label || '').trim(), model: null });
    toast('Clip updated.', 'good');
  } else {
    clip = Store.put('clips', { videoId: vid.id, start: round(sel.start, 2), end: round(sel.end, 2), label: (sel.label || '').trim(), done: false, archived: false, noisy: false, created: new Date().toISOString() });
    toast('Clip saved. Cut another, or shadow it now.', 'good');
  }
  if (!computeModel(clip)) ensureModels(vid);
  UI.sel = null;
  UI.clipId = clip.id;
  renderAll();
  if (shadowNow) Session.start([clip.id]);
}

function progressBar(label) {
  const bar = h('div', { class: 'bar' }, h('i', { style: { width: '0%' } }));
  const txt = h('p', { class: 'small muted' }, label);
  return { el: h('div', { class: 'stack' }, txt, bar), set: (f, t) => { bar.firstChild.style.width = Math.round(f * 100) + '%'; if (t) txt.textContent = t; } };
}

async function submitAdd(status) {
  const F = UI.addForm;
  const cloud = Store.mode === 'cloud';
  const submitBtn = $('#addSubmit');
  if (cloud && F.source === 'upload') {
    if (!F.file) { mount(status, h('p', { class: 'formerr' }, 'Choose a video file first.')); return; }
    const p = progressBar(`Uploading ${(F.file.size / 1048576).toFixed(0)} MB…`);
    mount(status, p.el);
    if (submitBtn) submitBtn.disabled = true;
    try {
      const r = await Api.uploadVideo(F.file, (f) => p.set(f, `Uploading… ${Math.round(f * 100)}%`));
      finishAdd({ r2Key: r.key, size: r.size, fallbackTitle: F.file.name.replace(/\.\w+$/, '') });
    } catch (e) {
      mount(status, h('p', { class: 'formerr' }, e.message));
    } finally { if (submitBtn) submitBtn.disabled = false; }
    return;
  }
  const url = F.url;
  if (!/^https?:\/\//i.test(url)) { mount(status, h('p', { class: 'formerr' }, 'Paste a full link starting with https://')); return; }
  const share = /drive\.google|docs\.google|mega\.nz|mega\.io|youtube\.com|youtu\.be|dropbox\.com\/s\/|onedrive|1drv/i.test(url);
  if (share) {
    mount(status, h('p', { class: 'formerr' }, 'That’s a share page, not a video file. Links from Google Drive, MEGA, YouTube or Dropbox share pages won’t play. Download the file and use “Upload a file” instead.'));
    return;
  }
  if (cloud && F.copy) {
    mount(status, h('p', { class: 'small muted' }, 'Copying the video into your storage… this can take a minute for long videos.'));
    if (submitBtn) submitBtn.disabled = true;
    try {
      const r = await Api.req('POST', '/api/import', { url });
      finishAdd({ url, r2Key: r.key, size: r.size, fallbackTitle: guessTitle(url) });
    } catch (e) {
      mount(status, h('p', { class: 'formerr' }, e.message), h('div', { class: 'row' }, btn('Add the link without a copy', () => finishAdd({ url, fallbackTitle: guessTitle(url) }), { size: 'sm' })));
    } finally { if (submitBtn) submitBtn.disabled = false; }
    return;
  }
  mount(status, h('p', { class: 'small muted' }, 'Checking the link plays…'));
  const result = await checkPlayable(url);
  const add = () => finishAdd({ url, fallbackTitle: guessTitle(url) });
  if (result.ok) { add(); return; }
  mount(status,
    h('p', { class: 'formerr' }, result.reason),
    h('div', { class: 'row' }, btn('Add it anyway', add, { size: 'sm' })));
}

function guessTitle(url) {
  try { return decodeURIComponent(new URL(url).pathname.split('/').pop()).replace(/\.\w+$/, '') || 'Untitled video'; } catch { return 'Untitled video'; }
}

function checkPlayable(url) {
  return new Promise((res) => {
    const v = document.createElement('video');
    v.muted = true; v.preload = 'metadata';
    let done = false;
    const finish = (r) => { if (done) return; done = true; v.removeAttribute('src'); v.load(); res(r); };
    v.onloadedmetadata = () => finish(v.duration > 0 ? { ok: true, duration: v.duration } : { ok: false, reason: 'The link loaded but has no playable video.' });
    v.onerror = () => {
      const code = v.error && v.error.code;

/* ---- 70-session.js ---- */
/* ---------- guided shadowing session ---------- */
function buildPlan(mode) {
  const s = settings();
  if (mode === 'badday') {
    return [
      { key: 'listen', name: 'Listen', passes: s.badListenPasses, minutes: Math.max(1, Math.round(s.badMinutes * 0.3)), speak: false },
      { key: 'shadow', name: 'Shadow', passes: s.badShadowPasses, minutes: Math.max(1, Math.round(s.badMinutes * 0.7)), speak: true },
    ];
  }
  if (mode === 'review') {
    return [
      { key: 'listen', name: 'Listen', passes: 1, minutes: 1, speak: false },
      { key: 'shadow', name: 'Shadow', passes: s.reviewShadowPasses, minutes: 3, speak: true },
      { key: 'record', name: 'Record & compare', passes: 1, minutes: 1, speak: true, recordLast: 'step3' },
    ];
  }
  return [
    { key: 'listen', name: 'Listen', passes: s.listenPasses, minutes: s.listenMinutes, speak: false },
    { key: 'shadow', name: 'Shadow', passes: s.shadowPasses, minutes: s.shadowMinutes, speak: true },
    { key: 'record', name: 'Record & compare', passes: 1, minutes: s.recordMinutes, speak: true, recordLast: 'step3' },
    { key: 'again', name: 'Shadow again', passes: s.againPasses + 1, minutes: s.againMinutes, speak: true, recordLast: 'final' },
  ];
}
const STEP_HELP = {
  listen: 'Just listen. Don’t speak yet; take in the rhythm and melody.',
  shadow: 'Speak along at the same time as the speaker. Copy everything: rhythm, melody and sounds.',
  record: 'Headphones on. Shadow one pass while it records, then compare it with the original.',
  again: 'Shadow again, copying as closely as you can. The last pass records so you can compare it with step 3.',
};

const Session = {
  active: false,
  doc: null,
  clipId: null,
  queue: [],
  mode: 'full',
  plan: [],
  stepIdx: 0,
  pass: 0,
  phase: 'idle', // intro | playing | gap | armed | recording | review | paused | done
  pausedFrom: null,
  elapsed: 0,
  lastWall: 0,
  timer: null,
  gapTimer: null,
  rec: null,
  recordingThisPass: false,
  liveThisPass: false,
  clipZero: [],
  review: null, // {recId, analysis, kind}
  preview: null, // {stopAt, then}
  cantKeepUp: 0,

  needsTick() { return this.active && (this.phase === 'playing' || this.phase === 'recording' || !!this.preview); },
  clip() { return Store.get('clips', this.clipId); },
  step() { return this.plan[this.stepIdx]; },
  totalMinutes() { return this.plan.reduce((s, p) => s + p.minutes, 0); },
  isRecordedPass() { const st = this.step(); return !!(st && st.recordLast && this.pass === st.passes - 1); },

  start(clipIds, mode = 'full') {
    if (this.active) { toast('A session is already running.'); return; }
    const ids = clipIds.filter((id) => Store.get('clips', id));
    if (!ids.length) { toast('Pick a clip first.'); return; }
    this.queue = ids.slice(1);
    this.begin(ids[0], mode);
  },
  begin(clipId, mode) {
    const clip = Store.get('clips', clipId);
    if (!clip) return;
    UI.sel = null;
    UI.cutMode = false;
    $('#player').classList.remove('cutting');
    if (clip.videoId !== UI.videoId) Player.load(clip.videoId, { keepClip: true });
    UI.clipId = clip.id;
    this.active = true;
    this.clipId = clip.id;
    this.mode = mode;
    this.plan = buildPlan(mode);
    this.stepIdx = 0; this.pass = 0; this.elapsed = 0; this.cantKeepUp = 0;
    this.review = null;
    this.doc = Store.put('sessions', {
      date: dayKey(), startedAt: new Date().toISOString(), clipId: clip.id, videoId: clip.videoId, mode,
      stepsCompleted: [], stepsSkipped: [], passes: [], minutes: 0, complete: false, recs: {},
    });
    this.phase = 'intro';
    this.startClock();
    Player.pause();
    Player.seek(clip.start);
    Player.tickHooks.add(this.onTick);
    if (!clip.model) ensureModels(Store.get('videos', clip.videoId));
    renderAll();
  },
  startClock() {
    clearInterval(this.timer);
    this.lastWall = performance.now();
    this.timer = setInterval(() => {
      const now = performance.now();
      if (this.phase !== 'paused' && this.phase !== 'intro' && this.phase !== 'review') this.elapsed += (now - this.lastWall) / 1000;
      this.lastWall = now;
      const el = $('#sessTimer');
      if (el) el.textContent = this.timerText();
    }, 500);
  },
  timerText() {
    const total = this.totalMinutes() * 60;
    const left = total - this.elapsed;
    return left >= 0 ? `${fmtTime(left)} left` : `${fmtTime(-left)} over · that’s fine`;
  },

  /* ---------- passes ---------- */
  async beginPass() {
    clearTimeout(this.gapTimer);
    const clip = this.clip();
    const st = this.step();
    if (!clip || !st) return;
    this.recordingThisPass = this.isRecordedPass();
    this.liveThisPass = false;
    if (this.recordingThisPass && this.phase !== 'armed-go') { this.phase = 'armed'; renderSession(); return; }
    // live pitch on ordinary speaking passes (optional, off by default to keep the screen calm)
    if (!this.recordingThisPass && st.speak && settings().livePitchAllPasses && !Mic.error) this.liveThisPass = await Mic.open();
    if (this.recordingThisPass || this.liveThisPass) {
      if (!(await Mic.open())) {
        if (this.recordingThisPass) { this.phase = 'armed'; renderSession(); return; }
        this.liveThisPass = false;
      }
    }
    this.clipZero = [];
    this.zero = null;
    this.lastTickT = null;
    Panel.live = null;
    // land on the clip start before anything is timed against it
    await Player.seekAndWait(clip.start);
    if (this.recordingThisPass || this.liveThisPass) {
      this.rec = new Recording();
      this.rec.start();
      Panel.live = { clipId: clip.id, points: [], frames: 0, ref: (Store.get('meta', 'voice') || {}).refHz || null, f0s: [], userOnset: null, shift: 0 };
      this.liveOff = Mic.on(() => this.liveAnalyse());
    }
    this.phase = this.recordingThisPass ? 'recording' : 'playing';
    document.body.classList.toggle('calm', st.speak);
    renderSession();
    const ok = await Player.play();
    if (!ok) { this.phase = 'paused'; this.pausedFrom = 'playing'; renderSession(); }
  },
  onTick: (t) => {
    const S = Session;
    if (S.preview) {
      if (t >= S.preview.stopAt - 0.02) { Player.v.pause(); const then = S.preview.then; S.preview = null; then && then(); }
      return;
    }
    if (!S.active || (S.phase !== 'playing' && S.phase !== 'recording')) return;
    const clip = S.clip();
    if (!clip) return;
    // when did the clip start, on the audio clock? Sample only while the video is really advancing,
    // then freeze the estimate so every point of your line is timed against the same zero.
    if (S.rec && S.zero == null && !Player.v.paused && S.lastTickT != null && t > S.lastTickT && t > clip.start + 0.02) {
      S.clipZero.push(AudioEng.getCtx().currentTime - (t - clip.start) / (Player.v.playbackRate || 1));
      if (S.clipZero.length >= 12) S.zero = median(S.clipZero);
    }
    S.lastTickT = t;
    if (t >= clip.end - 0.02) S.endPass();
  },
  async endPass() {
    const st = this.step();
    const clip = this.clip();
    Player.v.pause();
    const phase = this.phase;
    this.phase = 'gap';
    let entry = { step: st.key, n: this.pass + 1, recorded: false, lag: null, at: new Date().toISOString() };
    if (this.rec) {
      await sleep(700); // catch the tail of a trailing voice
      if (this.liveOff) { this.liveOff(); this.liveOff = null; }
      const res = await this.rec.stop();
      this.rec = null;
      const an = analysePass(res, clip, this.zero != null ? this.zero : median(this.clipZero), Player.v.playbackRate || 1, Panel.live);
      if (an) {
        entry.lag = an.lag;
        Panel.lastPass = { ...an, clipId: clip.id };
      }
      Panel.live = null;
      if (phase === 'recording') {
        const keep = st.recordLast || settings().keepAllPassRecordings;
        let recId = null;
        if (keep && res.blob.size) {
          try {
            const ref = await Store.putBlob(res.blob);
            const r = Store.put('recordings', {
              kind: 'pass', sessionId: this.doc.id, clipId: clip.id, step: st.key, pass: this.pass + 1, slot: st.recordLast,
              ref, mime: res.blob.type, created: new Date().toISOString(), lag: an ? an.lag : null, score: an ? an.score : null,
              analysis: an ? { st: an.st, db: an.db, hop: an.hop, offset: an.offset } : null, durationSec: round(res.samples.length / SR, 1),
            });
            recId = r.id;
            this.doc.recs[st.recordLast] = recId;
          } catch (e) {
            toast(`The recording couldn’t be saved (${e.code || e.message || 'error'}). You can still listen to it now.`, 'bad', 6000);
          }
        }
        entry.recorded = true; entry.recId = recId;
        this.review = { recId, blob: res.blob, url: URL.createObjectURL(res.blob), analysis: an, slot: st.recordLast, clipId: clip.id };
        this.doc.passes.push(entry);
        this.pass++;
        this.saveDoc();
        this.phase = 'review';
        document.body.classList.remove('calm');
        renderSession(); renderPanel();
        return;
      }
    }
    this.doc.passes.push(entry);
    this.pass++;
    this.saveDoc();
    renderPanel();
    if (this.pass >= st.passes) { this.completeStep(); return; }
    renderSession();
    this.gapTimer = setTimeout(() => { if (this.phase === 'gap') this.beginPass(); }, settings().loopGap * 1000);
  },
  liveAnalyse() {
    const L = Panel.live;
    if (!L || !this.rec || this.zero == null || this.rec.startCtx == null) return; // samples wait in the buffer until timing is known
    const clip = this.clip();
    const x = this.rec.liveSamples();
    const diff = new Float32Array(Math.floor(SR / F0_MIN) + 2);
    const rate = Player.v.playbackRate || 1;
    const maxFrame = Math.floor((x.length - WIN - Math.floor(SR / F0_MIN)) / HOP);
    for (let i = L.frames; i < maxFrame; i++) {
      const db = DSP.rmsDb(x, i * HOP, WIN);
      // noise floor follows quiet stretches, so speech is judged against your room, not a fixed level
      L.floor = L.floor == null ? db : db < L.floor ? L.floor * 0.8 + db * 0.2 : L.floor * 0.999 + db * 0.001;
      const voiceGate = Math.max(L.floor + 8, -75);
      const [f, c] = DSP.yin(x, i * HOP, diff);
      let st = null;
      if (c > 0.75 && f >= F0_MIN && f <= F0_MAX && db > voiceGate) {
        L.f0s.push(f);
        if (!L.ref && L.f0s.length > 40) L.ref = median(L.f0s);
        const ref = L.ref || median(L.f0s);
        let v = 12 * Math.log2(f / ref);
        // octave slips show up as jumps of about 12 semitones: fold them back
        if (v > 9 && v - 12 > -6) v -= 12;
        else if (v < -9 && v + 12 < 6) v += 12;
        if (Math.abs(v) <= 12) {
          L.recent = (L.recent || []).concat(v).slice(-3);
          st = median(L.recent);
        } else L.recent = [];
      } else L.recent = [];
      // raw clip time; the live sync shift is applied when drawing, so it moves the whole line at once
      const ct = (this.rec.startCtx + i * HOP_S - this.zero) * rate;
      if (L.userOnset == null && db > Math.max(L.floor + 15, -65)) {
        L.loudRun = (L.loudRun || 0) + 1;
        if (L.loudRun >= 5) {
          L.userOnset = ct - 4 * HOP_S;
          const m = clip.model ? clip.model.onset : 0;
          L.shift = clamp(L.userOnset - m, -0.5, 1.5);
        }
      } else if (L.userOnset == null) L.loudRun = 0;
      L.points.push({ t: ct, st, db });
    }
    L.frames = Math.max(L.frames, maxFrame);
  },
  completeStep() {
    const st = this.step();
    if (!this.doc.stepsCompleted.includes(st.key)) this.doc.stepsCompleted.push(st.key);
    this.stepIdx++;
    this.pass = 0;
    this.saveDoc();
    document.body.classList.remove('calm');
    if (this.stepIdx >= this.plan.length) { this.finish(false); return; }
    this.phase = 'intro';
    renderSession();
  },

  /* ---------- controls ---------- */
  go() { // start the current step / armed recording
    if (this.phase === 'intro') { this.beginPass(); return; }
    if (this.phase === 'armed') { this.phase = 'armed-go'; this.beginPass(); }
  },
  async cancelPassCapture() {
    if (this.liveOff) { this.liveOff(); this.liveOff = null; }
    if (this.rec) { try { await this.rec.stop(); } catch { /* ignore */ } this.rec = null; }
    Panel.live = null;
  },
  togglePause() {
    if (!this.active) return;
    if (this.phase === 'paused') {
      const from = this.pausedFrom;
      this.phase = from === 'recording' ? 'armed' : 'gap';
      this.pausedFrom = null;
      if (from === 'recording') { this.phase = 'armed-go'; this.beginPass(); } else this.beginPass();
      return;
    }
    if (this.phase === 'playing' || this.phase === 'recording' || this.phase === 'gap') {
      this.pausedFrom = this.phase;
      this.phase = 'paused';
      clearTimeout(this.gapTimer);
      Player.v.pause();
      this.cancelPassCapture();
      document.body.classList.remove('calm');
      renderSession();
    } else if (this.phase === 'intro' || this.phase === 'armed') this.go();
  },
  async repeatPass() {
    if (!this.active) return;
    clearTimeout(this.gapTimer);
    Player.v.pause();
    await this.cancelPassCapture();
    if (this.phase === 'review') { this.phase = 'armed'; this.pass = Math.max(0, this.pass - 1); this.doc.passes.pop(); renderSession(); return; }
    if (this.recordingThisPass) { this.phase = 'armed-go'; }
    this.beginPass();
  },
  async skipStep() {
    if (!this.active) return;
    clearTimeout(this.gapTimer);
    Player.v.pause();
    await this.cancelPassCapture();
    const st = this.step();
    if (st && !this.doc.stepsSkipped.includes(st.key)) this.doc.stepsSkipped.push(st.key);
    this.stepIdx++;
    this.pass = 0;
    this.review = null;
    this.saveDoc();
    if (this.stepIdx >= this.plan.length) { this.finish(false); return; }
    this.phase = 'intro';
    renderSession();
  },
  continueAfterReview() {
    const st = this.step();
    this.review = null;
    Player2.stop();
    if (this.pass >= st.passes) { this.completeStep(); return; }
    this.phase = 'gap';
    this.beginPass();
  },
  switchToBadDay() {
    if (!this.active) return;
    if (this.stepIdx > 1) { toast('You’re past the shadowing step already. Finish or end the session instead.'); return; }
    const done = this.pass;
    const key = this.step().key;
    this.mode = 'badday';
    this.plan = buildPlan('badday');
    this.doc.mode = 'badday';
    this.stepIdx = this.plan.findIndex((p) => p.key === key);
    this.pass = Math.min(done, this.step().passes - 1);
    this.saveDoc();
    toast('Switched to the 5-minute version. Every bit counts.');
    renderSession();
  },
  flagCantKeepUp() {
    this.cantKeepUp++;
    this.doc.cantKeepUp = this.cantKeepUp;
    this.saveDoc();
    const clip = this.clip();
    const len = clip.end - clip.start;
    openModal([
      modalHead('Can’t keep up?'),
      h('p', null, `This clip is ${fmtSec(len)} long. Shadowing gets much easier with a shorter clip: try cutting it to one sentence${len > 12 ? ` of about ${Math.max(6, Math.round(len * 0.6))} seconds` : ''}. Slowing to 0.75x also helps for a few passes.`),
      h('div', { class: 'row' },
        btn('Slow to 0.75x', () => { Player.setRate(0.75); closeModal(); }, { kind: 'primary' }),
        btn('End and shorten the clip', async () => { closeModal(); await this.finish(true); editClip(clip.id); }, { icon: 'scissors' }),
        btn('Keep going', () => closeModal(), { kind: 'ghost' })),
    ], { narrow: true });
  },
  saveDoc() {
    if (!this.doc) return;
    this.doc.minutes = round(this.elapsed / 60, 1);
    Store.put('sessions', this.doc);
  },

  async finish(early) {
    clearTimeout(this.gapTimer);
    clearInterval(this.timer);
    Player.v.pause();
    await this.cancelPassCapture();
    Mic.close();
    Player.tickHooks.delete(this.onTick);
    document.body.classList.remove('calm');
    const clip = this.clip();
    const fullDone = !early && this.mode === 'full' && this.plan.every((p) => this.doc.stepsCompleted.includes(p.key));
    const anyPass = this.doc.passes.length > 0;
    this.doc.complete = !early && this.plan.every((p) => this.doc.stepsCompleted.includes(p.key));
    this.doc.endedAt = new Date().toISOString();
    this.saveDoc();
    if (!anyPass) Store.patch('sessions', this.doc.id, { empty: true });
    const before = streakInfo(this.doc.id).streak;
    let tickNew = false;
    if (fullDone && clip && !clip.done) { Store.patch('clips', clip.id, { done: true, doneAt: dayKey() }); tickNew = true; }
    if (this.mode === 'review' && this.doc.complete && clip) Store.patch('clips', clip.id, { reviewedAt: dayKey() });
    if (clip) Store.patch('clips', clip.id, { lastPractised: dayKey() });
    const summary = { minutes: this.doc.minutes, passes: this.doc.passes.length, mode: this.mode, complete: this.doc.complete, tickNew, recs: { ...this.doc.recs }, clipId: this.clipId, sessionId: this.doc.id };
    this.active = false;
    this.phase = 'idle';
    this.review = null;
    const next = this.queue.shift();
    await Store.flushAll().catch(() => {});
    renderAll();
    if (anyPass) showSessionSummary(summary, before, next);
  },
};

/* align a recorded pass against the model and measure the lag */
function analysePass(res, clip, clipZero, rate, live) {
  if (!res || !res.samples || res.samples.length < SR || !clip) return null;
  const s = settings();
  const a = DSP.analyse(res.samples);
  const clean = DSP.cleanPitch(a.f0, a.conf, s.pitchSmoothing);
  const { st, refHz } = DSP.toSemitones(clean);
  if (refHz) {
    // remember the speaker's own average so live lines sit at the right height next time
    const cur = Store.get('meta', 'voice') || { id: 'voice' };
    const prev = cur.refHz || refHz;
    Store.put('meta', { ...cur, refHz: Math.round(prev * 0.7 + refHz * 0.3) });
  }
  const userHop = HOP_S * rate; // clip-time seconds per user frame
  const zeroOK = isFinite(clipZero) && res.startCtx != null;
  const offsetUser = zeroOK ? (res.startCtx - clipZero) * rate : 0;
  let lagClip = null, score = null, manual = false;
  const m = clip.model;
  if (m && s.alignMode === 'auto') {
    const modelEnv = DSP.envForAlign(m.db);
    const userEnv = DSP.envForAlign(a.db);
    // resample the user envelope on the model's clip-time grid
    const grid = new Array(modelEnv.length + 200).fill(0).map((_, k) => {
      const i = Math.round((k * m.hop - offsetUser) / userHop);
      return i >= 0 && i < userEnv.length ? userEnv[i] : 0;
    });
    const r = DSP.xcorr(modelEnv, grid, -50, 150);
    score = round(r.score, 2);
    if (r.score > 0.3 && r.margin > 0.03) lagClip = r.lag * m.hop;
  }
  // auto-alignment unsure: fall back to the live start detection, then to the manual offset
  if (lagClip == null && s.alignMode === 'auto' && live && live.userOnset != null && zeroOK) lagClip = live.shift;
  if (lagClip == null) { lagClip = (s.manualOffsetMs / 1000) * rate; manual = true; }
  const lag = round(lagClip / rate - s.latencyMs / 1000, 2);
  return {
    st: st.map((v) => (v == null ? null : Math.round(v * 10) / 10)),
    db: Array.from(a.db, (v) => Math.round(v)),
    hop: userHop,
    offset: round(offsetUser - lagClip, 3),
    lag, score, manual, refHz: refHz && Math.round(refHz),
  };
}

  mount(el,
    h('div', { class: 'row', style: { marginBottom: '10px' } },

Session.skipRecording = function () {
  const st = this.step();
  this.doc.passes.push({ step: st.key, n: this.pass + 1, recorded: false, lag: null, skippedRecording: true });
  this.pass++;
  this.saveDoc();
  if (this.pass >= st.passes) this.completeStep(); else { this.phase = 'gap'; this.beginPass(); }
};

async function uploadPassRecording(file) {
  const S = Session;
  const clip = S.clip();
  const st = S.step();
  try {
    const samples = await AudioEng.decodeBlob(file);
    const an = analysePass({ samples, startCtx: null }, clip, NaN, 1);
    const ref = await Store.putBlob(file);
    const r = Store.put('recordings', { kind: 'pass', sessionId: S.doc.id, clipId: clip.id, step: st.key, pass: S.pass + 1, slot: st.recordLast, ref, mime: file.type, created: new Date().toISOString(), lag: an && !an.manual ? an.lag : null, analysis: an ? { st: an.st, db: an.db, hop: an.hop, offset: an.offset } : null, uploaded: true, durationSec: round(samples.length / SR, 1) });
    S.doc.recs[st.recordLast] = r.id;
    S.doc.passes.push({ step: st.key, n: S.pass + 1, recorded: true, recId: r.id, lag: r.lag, uploaded: true });
    S.pass++;
    S.saveDoc();
    if (an) Panel.lastPass = { ...an, clipId: clip.id };
    S.review = { recId: r.id, url: URL.createObjectURL(file), analysis: an, slot: st.recordLast, clipId: clip.id };
    S.phase = 'review';
    renderSession(); renderPanel();
  } catch (e) {
    toast(`That file couldn’t be read as audio (${e.message || 'error'}).`, 'bad');
  }
}

/* playback options after a recorded pass */
function playOriginal(clip, then) {
  Player2.stop();
  Player.v.muted = UI.volume === 0;
  Session.preview = { stopAt: clip.end, then };
  Player.seek(clip.start);
  Player.play();
}
/* play your recording lined up with the clip: the video runs alongside (muted for "Mine",
   audible for "Both together"), so the scrub bar and the chart's playhead follow along */
function playSynced(clip, url, analysis, { withOriginal = false, then } = {}) {
  Player2.stop();
  const a = new window.Audio(url);
  Player2.el = a;
  const rate = Player.v.playbackRate || 1;
  const startAt = analysis ? -analysis.offset / rate : 0; // seconds into the recording that line up with the clip start
  const restoreMute = () => { Player.v.muted = UI.volume === 0; };
  const go = async () => {
    Player.v.muted = !withOriginal || UI.volume === 0;
    Session.preview = { stopAt: clip.end, then: () => { a.pause(); restoreMute(); then && then(); } };
    await Player.seekAndWait(clip.start);
    Player.play();
    if (startAt >= 0) { a.currentTime = startAt; a.play().catch(() => {}); } else setTimeout(() => a.play().catch(() => {}), -startAt * 1000);
  };
  a.addEventListener('error', () => { restoreMute(); toast('The recording couldn’t play.', 'bad'); }, { once: true });
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, { once: true });
  a.load();
  return a;
}
function playMine(clip, url, analysis, then) { return playSynced(clip, url, analysis, { then }); }
function playBoth(clip, url, analysis) { return playSynced(clip, url, analysis, { withOriginal: true }); }

function passReviewCard() {

    h('div', { class: 'row' },
      btn('Original', () => playOriginal(clip), { size: 'sm', icon: 'play' }),
      btn('Mine', () => playMine(clip, R.url, an), { size: 'sm', icon: 'mic' }),
      btn('Original then mine', () => playOriginal(clip, () => setTimeout(() => playMine(clip, R.url, an), 300)), { size: 'sm' }),
      btn('Both together', () => playBoth(clip, R.url, an), { size: 'sm' }),

function idleSession() {
  const clip = Store.get('clips', UI.clipId);

  const queued = UI.queue.filter((id) => Store.get('clips', id));
  const reviewDue = s.review ? reviewDueClips() : [];
  return h('div', { class: 'stack' },
    h('div', { class: 'idle-cta' },
      h('div', { class: 'grow' },
        h('span', { class: 'label' }, `${DAYS[new Date().getDay()]} · ${sugg.title}`),
        h('p', null, sugg.text)),
      sugg.clipId && sugg.clipId !== UI.clipId ? btn('Select it', () => selectClip(sugg.clipId), { size: 'sm' }) : null),
    h('div', { class: 'row' },
      btn(queued.length > 1 ? `Start queue (${queued.length} clips)` : 'Start 15-minute session', () => Session.start(queued.length ? queued : [UI.clipId], 'full'),
        { kind: 'primary', size: 'big', icon: 'play', disabled: !clip && !queued.length }),

}

function rotationSuggestion() {
  const today = new Date().getDay();
  const yesterday = addDays(dayKey(), -1);
  const lastSess = Store.all('sessions').filter((x) => x.date === yesterday && !x.empty).sort((a, b) => (a.startedAt < b.startedAt ? 1 : -1))[0];
  if (today === 0) return { title: 'Rest day', text: 'Sunday is the suggested rest day. A short session still counts if you feel like it.' };
  if ([2, 4, 6].includes(today) && lastSess) {
    const c = Store.get('clips', lastSess.clipId);
    if (c) return { title: 'Repeat day', text: `Suggested: repeat yesterday’s clip, “${clipName(c)}”.`, clipId: c.id };
  }
  if ([1, 3, 5].includes(today)) return { title: 'New clip day', text: 'Suggested: start a new clip today (Mon, Wed and Fri are new-clip days).' };
  return { title: 'Practice day', text: 'Pick any clip. The rotation is only a suggestion.' };
}
function reviewDueClips() {
  const s = settings();
  const today = dayKey();
  return Store.all('clips').filter((c) => c.done && !c.archived && c.doneAt && (!c.reviewedAt || c.reviewedAt < c.doneAt) && daysBetween(c.doneAt, today) >= Math.max(1, s.reviewAfterDays - 1) && daysBetween(c.doneAt, today) <= s.reviewAfterDays + 3);
}

function showSessionSummary(sum, streakBefore, nextClipId) {
  const info = streakInfo();
  const grew = info.streak > streakBefore;
  const clip = Store.get('clips', sum.clipId);
  if (sum.tickNew || grew) celebrate(sum.tickNew ? 1.2 : 0.8);
  const recs = [sum.recs.step3, sum.recs.final].filter(Boolean);
  openModal([
    modalHead(sum.complete ? 'Session complete!' : 'Session saved'),
    h('div', { class: 'card celebrate' },
      h('div', { class: 'big-num' }, `${info.streak}`),
      h('p', null, h('strong', null, `day streak${grew ? ' · it grew!' : ''}`)),
      h('p', { class: 'muted' }, `${sum.passes} passes · ${sum.minutes} min · ${info.weekCount}/${settings().weeklyTarget} sessions this week`),
      sum.tickNew ? h('p', { class: 'formok' }, `“${clipName(clip)}” gets its tick.`) : null,
      !sum.complete && sum.mode === 'full' ? h('p', { class: 'small muted' }, 'Progress so far is saved. The clip gets its tick after one complete session.') : null),
    recs.length === 2 ? btn('Compare step 3 with your final pass', () => openCompare(sum.recs.step3, sum.recs.final), { kind: 'blue' }) : null,
    h('div', { class: 'row' },
      nextClipId ? btn('Next clip in the queue', () => { closeModal(); Session.begin(nextClipId, sum.mode === 'review' ? 'review' : 'full'); }, { kind: 'primary', size: 'big', icon: 'play' }) : btn('Done', () => closeModal(), { kind: 'primary', size: 'big' }),
      btn('Clip history', () => openHistory(sum.clipId), { icon: 'history' }),
      h('span', { class: 'spacer' }),
      deleteSessionButton(sum.sessionId, () => closeModal())),
  ], { narrow: true });
}

/* ---------- "what sounded off" notes, Claude feedback, issues ---------- */
const noteDrafts = new Map();

function noteForm(ctx) {
  const key = ctx.recId || `${ctx.sessionId}:${ctx.pass}`;
  const clip = Store.get('clips', ctx.clipId);
  if (!noteDrafts.has(key)) noteDrafts.set(key, { sentence: clip.sentence || clip.label || '', off: '', aim: '', issue: '', reply: null, saved: null, open: false });

  const replyBox = h('div');

  const issueNames = Store.all('issues').filter((i) => !i.mergedInto).map((i) => i.name);

  const ask = async (askBtn) => {
    if (!D.off.trim()) { mount(status, h('span', { class: 'formerr' }, 'Write what sounded off first.')); return; }
    if (Store.mode === 'cloud') {
      askBtn.disabled = true;
      mount(status, h('span', { class: 'muted' }, 'Thinking…'));
      try {
        const { reply } = await Api.req('POST', '/api/claude', { sentence: D.sentence, off: D.off, aim: D.aim, issues: issueNames });
        D.reply = normaliseReply(reply);
        if (D.reply.issue && !D.issue) { D.issue = D.reply.issue; const inp = $(`#issue-${key}`); if (inp) inp.value = D.issue; }
        status.replaceChildren();
        drawReply();
        if (D.saved) saveNote(ctx, D, true);
      } catch (e) {
        mount(status, h('span', { class: 'formerr' }, e.message), ' ', btn('Copy prompt instead', () => openCopyPrompt(D, issueNames, drawReply), { size: 'sm', kind: 'ghost' }));
      } finally { askBtn.disabled = false; }
      return;
    }
    if (!Caps.sample) { openCopyPrompt(D, issueNames, () => { drawReply(); }); return; }
    askBtn.disabled = true;
    mount(status, h('span', { class: 'muted' }, 'Thinking… (this uses your Claude plan)'));
    try {
      const r = await Caps.sample.json(claudePrompt(D, issueNames), { cache: false });
      D.reply = normaliseReply(r);
      if (D.reply.issue && !D.issue) { D.issue = D.reply.issue; const inp = $(`#issue-${key}`); if (inp) inp.value = D.issue; }
      status.replaceChildren();
      drawReply();
      if (D.saved) saveNote(ctx, D, true);
    } catch (e) {
      const code = e && e.code;
      const msg = code === 'not_granted' || code === 'sampling_disabled' ? 'Claude isn’t allowed for this page. Use “Copy prompt” and paste the reply instead.'

        : code === 'invalid_json' && e.text ? null
        : `Claude didn’t answer (${code || 'error'}).`;
      if (code === 'invalid_json' && e.text) { D.reply = { text: e.text }; drawReply(); status.replaceChildren(); }
      else mount(status, h('span', { class: 'formerr' }, msg));
    } finally { askBtn.disabled = false; }
  };

  const askBtn = btn(Caps.sample || Store.mode === 'cloud' ? 'Ask Claude' : 'Copy prompt for Claude', () => ask(askBtn), { kind: 'blue', size: 'sm', icon: 'sparkle' });
  const body = h('div', { class: 'stack' },
    h('label', { class: 'field', for: `off-${key}` }, 'What sounded off?',
      h('textarea', { id: `off-${key}`, rows: 2, placeholder: 'e.g. the vowel in “go” sounds too pure, it doesn’t glide', value: D.off, oninput: (e) => { D.off = e.target.value; } })),
    h('div', { class: 'cards', style: { gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))' } },
      h('label', { class: 'field', for: `sent-${key}` }, 'Sentence (optional)',
        h('input', { type: 'text', id: `sent-${key}`, value: D.sentence, placeholder: 'What the speaker says', oninput: (e) => { D.sentence = e.target.value; } })),

  // remove from any other issue first
  for (const i of all) if (i.noteIds && i.noteIds.includes(note.id) && (!iss || i.id !== iss.id)) Store.patch('issues', i.id, { noteIds: i.noteIds.filter((x) => x !== note.id) });

/* ---------- compare & history ---------- */
/* one chart with several voices overlaid on the clip's time axis (pitch or loudness) */
function overlayChart(clip, layers, view = 'pitch') {
  const c = h('canvas', { style: { height: '220px', width: '100%', display: 'block', borderRadius: '11px', background: 'var(--surface-2)' }, 'aria-label': `${view === 'pitch' ? 'Pitch' : 'Loudness'} of ${layers.map((l) => l.label).join(', ')} on one chart` });
  const draw = () => {
    if (!c.isConnected) return;
    const { W, H, dpr } = sizeCanvas(c);
    const g = c.getContext('2d');
    g.clearRect(0, 0, W, H);
    const dur = clip.end - clip.start;
    const X = (t) => (t / dur) * W;
    g.fillStyle = cssVar('--line');
    g.fillRect(0, H / 2, W, dpr);
    for (let s = 1; s < dur; s++) g.fillRect(X(s), 0, dpr, H);
    if (view === 'pitch') pitchHints(g, W, dpr, [{ top: 0, h: H }], cssVar('--muted'));
    for (const L of layers) {
      const sr = L.series;
      if (!sr || L.hidden) continue;
      g.globalAlpha = L.alpha ?? 1;
      if (view === 'pitch') {
        g.strokeStyle = L.color; g.lineWidth = (L.width || 2.5) * dpr; g.lineJoin = 'round'; g.lineCap = 'round'; g.beginPath();
        let pen = false, prev = null;
        sr.st.forEach((v, i) => {
          const t = (sr.offset || 0) + i * sr.hop;
          if (v == null || t < 0 || t > dur || Math.abs(v) > 12) { pen = false; prev = null; return; }
          if (prev != null && Math.abs(v - prev) > 4) pen = false;
          prev = v;
          const y = H / 2 - (v / 12) * (H / 2 - 6 * dpr);
          if (!pen) { g.moveTo(X(t), y); pen = true; } else g.lineTo(X(t), y);
        });
        g.stroke();
      } else {
        const db = sr.db || [];
        const peak = percentile(db.filter((v) => v != null), 0.98);
        g.fillStyle = L.color;
        g.globalAlpha = (L.alpha ?? 1) * 0.45;
        const bw = Math.max(1, X(sr.hop) - 0.5);
        db.forEach((v, i) => {
          const t = (sr.offset || 0) + i * sr.hop;
          if (v == null || t < 0 || t > dur) return;
          const hh = clamp((v - (peak - 45)) / 45, 0, 1) * (H / 2 - 4 * dpr);
          g.fillRect(X(t), H / 2 - hh, bw, hh * 2);
        });
      }
      g.globalAlpha = 1;
    }
  };
  c.redraw = draw;
  requestAnimationFrame(() => requestAnimationFrame(draw));
  return c;
}

async function deleteSession(sessionId) {
  const sess = Store.get('sessions', sessionId);
  if (!sess) return;
  const drop = (col, id) => { delete Store.data[col][id]; Store.schedule(col, id, 0); };
  for (const r of Store.all('recordings').filter((x) => x.sessionId === sessionId)) {
    await Store.deleteBlob(r.ref);
    drop('recordings', r.id);
  }
  const noteIds = new Set(Store.all('notes').filter((n) => n.sessionId === sessionId).map((n) => n.id));
  for (const id of noteIds) drop('notes', id);
  for (const i of Store.all('issues')) {
    if ((i.noteIds || []).some((id) => noteIds.has(id))) Store.patch('issues', i.id, { noteIds: i.noteIds.filter((id) => !noteIds.has(id)) });
  }
  drop('sessions', sessionId);
  // the clip keeps its tick only if another complete full session remains
  const clip = Store.get('clips', sess.clipId);
  if (clip) {
    const rest = Store.all('sessions').filter((x) => x.clipId === clip.id && !x.empty);
    const stillDone = rest.some((x) => x.complete && x.mode === 'full');
    const last = rest.map((x) => x.date).sort().pop() || null;
    if (clip.done && !stillDone && sess.complete && sess.mode === 'full') Store.patch('clips', clip.id, { done: false, doneAt: null, lastPractised: last });
    else Store.patch('clips', clip.id, { lastPractised: last });
  }
  toast('Session deleted.');
  renderAll();
}

  if (!clip) return;
  const sessions = Store.all('sessions').filter((s) => s.clipId === clipId && !s.empty).sort((a, b) => (a.startedAt < b.startedAt ? 1 : -1));
  const recs = Store.all('recordings').filter((r) => r.clipId === clipId);
  const notes = Store.all('notes').filter((n) => n.clipId === clipId);
  const items = await Promise.all(sessions.map(async (s) => {
    const rs = recs.filter((r) => r.sessionId === s.id).sort((a, b) => a.pass - b.pass);

    const ns = notes.filter((n) => n.sessionId === s.id);

        s.complete ? h('span', { class: 'tick done' }, icon('check', 'stroke-width="3.4"')) : null),

        h('span', { class: 'small', style: { minWidth: '120px', fontWeight: 800 } }, r.slot === 'step3' ? 'Step 3' : r.slot === 'final' ? 'Final' : `Pass ${r.pass}`),
        await recAudio(r),
        h('span', { class: 'small muted' }, fmtLag(r.lag)))))) : null,
      h('div', { class: 'row' },
        s.recs && s.recs.step3 && s.recs.final ? btn('Compare step 3 and final', () => openCompare(s.recs.step3, s.recs.final), { size: 'sm', kind: 'blue' }) : null,

    items.length ? items : h('p', { class: 'muted' }, 'No sessions on this clip yet.'),
  ]);
}

/* ---- 85-progress.js ---- */
/* ---------- habit tracking ---------- */
function practisedDays(excludeId) {
  const map = new Map(); // day -> 'full' | 'bad'
  for (const s of Store.all('sessions')) {
    if (s.empty || s.id === excludeId || !s.passes || !s.passes.length) continue;
    const kind = s.mode === 'badday' ? 'bad' : 'full';
    if (map.get(s.date) !== 'full') map.set(s.date, kind);
  }
  return map;
}
function streakInfo(excludeId) {
  const days = practisedDays(excludeId);
  const today = dayKey();
  const first = [...days.keys()].sort()[0];
  let streak = 0;
  if (first) {
    let d = days.has(today) ? today : addDays(today, -1);
    let gap = 0;
    while (d >= first) {
      if (days.has(d)) { streak++; gap = 0; } else if (++gap >= 2) break;
      d = addDays(d, -1);
    }
  }
  const ws = weekStart(today);
  let weekCount = 0;
  for (const k of days.keys()) if (k >= ws && k <= today) weekCount++;
  const minutes = Store.all('sessions').reduce((s, x) => s + (x.minutes || 0), 0);
  const yesterday = addDays(today, -1);
  return { streak, weekCount, minutes: minutes < 10 ? round(minutes, 1) : Math.round(minutes), days, practisedToday: days.has(today), missedYesterday: days.size > 0 && !days.has(yesterday) && !days.has(today) };
}

/* small SVG line chart, drawn to one scale */
function trendChart(points, { unit = '', dec = 1, ref = null, refLabel = 'speaker' } = {}) {
  const W = 560, H = 170, L = 46, R = 14, T = 14, B = 28;
  const ys = points.map((p) => p.y).concat(ref != null ? [ref] : []).filter((v) => v != null && isFinite(v));
  if (!ys.length) return h('p', { class: 'muted small' }, 'Not enough data yet.');
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.15; lo -= pad; hi += pad;
  const X = (i) => L + (points.length === 1 ? (W - L - R) / 2 : (i / (points.length - 1)) * (W - L - R));
  const Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('role', 'img');
  const el = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; svg.appendChild(e); return e; };
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
  for (const t of ticks) {
    el('line', { x1: L, x2: W - R, y1: Y(t), y2: Y(t), stroke: 'var(--line)', 'stroke-width': 1 });
    el('text', { x: L - 6, y: Y(t) + 4, 'text-anchor': 'end' }, t.toFixed(dec) + unit);
  }
  if (ref != null) {
    el('line', { x1: L, x2: W - R, y1: Y(ref), y2: Y(ref), stroke: 'var(--green)', 'stroke-width': 2, 'stroke-dasharray': '6 5' });
    el('text', { x: W - R, y: Y(ref) - 5, 'text-anchor': 'end', fill: 'var(--green)' }, refLabel);
  }
  const valid = points.map((p, i) => [i, p.y]).filter(([, y]) => y != null && isFinite(y));
  if (valid.length > 1) el('polyline', { points: valid.map(([i, y]) => `${X(i)},${Y(y)}`).join(' '), fill: 'none', stroke: 'var(--sky)', 'stroke-width': 3, 'stroke-linejoin': 'round' });
  valid.forEach(([i, y], k) => el('circle', { cx: X(i), cy: Y(y), r: k === valid.length - 1 ? 6 : 4, fill: 'var(--sky)', stroke: 'var(--surface)', 'stroke-width': 2 }));
  points.forEach((p, i) => el('text', { x: X(i), y: H - 8, 'text-anchor': 'middle' }, p.x));
  return h('div', { class: 'trend' }, svg);
}

function checkinRecordControls(week, task, redraw) {
  const wrap = h('div', { class: 'row' });

  const cur = checkinFor(week);
  const has = cur && cur.recs && cur.recs[task.key] && cur.recs[task.key].length;
  const stop = async () => {
    clearInterval(timer);
    if (!rec) return;
    const res = await rec.stop();

    await saveCheckinTake(week, task.key, res.blob, res.samples);
    toast('Saved.', 'good');

  const start = async () => {
    if (task.key === 'answer') {
