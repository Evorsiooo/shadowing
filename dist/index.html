async function deleteCheckinTake(week, key, recId) {
  const c = checkinFor(week);
  if (!c) return;
  const list = c.recs[key] || [];
  const idx = list.indexOf(recId);
  if (idx < 0) return;
  const rec = Store.get('recordings', recId);
  const recs = { ...c.recs, [key]: list.filter((x) => x !== recId) };
  const fields = { recs };
  // each answer take has its own question; drop it too (it stays marked as seen)
  if (key === 'answer' && c.questions) fields.questions = c.questions.filter((_, i) => i !== idx);
  // measures follow the latest remaining take
  const measures = { ...(c.measures || {}) };
  const last = Store.get('recordings', recs[key].slice(-1)[0]);
  if (last && last.measures) measures[key] = last.measures; else delete measures[key];
  fields.measures = measures;
  Store.patch('checkins', c.id, fields);
  if (rec) {
    await Store.deleteBlob(rec.ref);
    delete Store.data.recordings[recId];
    Store.schedule('recordings', recId, 0);
  }
  toast('Take deleted.');
}

function pickQuestion() {
  const meta = appMeta();
  const used = new Set(meta.usedQuestions || []);
  const fresh = QUESTIONS.filter((q) => !used.has(q));
  const q = (fresh.length ? fresh : QUESTIONS)[Math.floor(Math.random() * (fresh.length || QUESTIONS.length))];
  Store.patch('meta', 'app', { usedQuestions: [...used, q] });
  return q;
}

async function saveCheckinTake(week, key, blob, samples) {
  const c = ensureCheckin(week);
  let ref;
  try { ref = await Store.putBlob(blob, 'checkin'); } catch (e) { toast(`The recording couldn’t be stored (${e.message || e.code || 'error'}).`, 'bad', 6000); return; }
  let measures = null, analysis = null;
  if (samples && samples.length > SR) {
    const m = DSP.modelFromSamples(samples, settings().pitchSmoothing);
    measures = m.measures;
    analysis = { onset: m.onset };
  }
  const r = Store.put('recordings', { kind: 'checkin', week, task: key, ref, mime: blob.type, created: new Date().toISOString(), measures, analysis, durationSec: samples ? round(samples.length / SR, 1) : null });
  const recs = { ...c.recs, [key]: [...(c.recs[key] || []), r.id] };
  const lagWin = sessionsLagBefore(c.date || dayKey());
  const allMeasures = { ...(c.measures || {}) };
  if (measures) allMeasures[key] = measures;
  allMeasures.lag = lagWin;
  Store.patch('checkins', c.id, { recs, measures: allMeasures, date: c.date || dayKey() });
  if (week === 0 && !settings().programmeStart) saveSettings({ programmeStart: c.date || dayKey() });
  if (checkinHasAll(checkinFor(week))) { celebrate(1); toast(`Week ${week} check-in complete!`, 'good'); }
}
function sessionsLagBefore(date) {
  const from = addDays(date, -28);
  const lags = [];
  for (const s of Store.all('sessions')) if (s.date >= from && s.date <= date) for (const p of s.passes || []) if (p.lag != null) lags.push(p.lag);
  return lags.length ? round(mean(lags), 2) : null;
}

/* ---------- blind listener pack ---------- */
async function exportListenerPack() {
  toast('Building the pack… this can take a little while.');
  const items = [];
  for (const w of CHECKIN_WEEKS) {
    const c = checkinFor(w);
    if (!c) continue;
    const id = (c.recs.answer || []).slice(-1)[0] || (c.recs.retell || []).slice(-1)[0];
    const r = Store.get('recordings', id);
    if (!r) continue;
    const blob = await Store.getBlob(r.ref);
    if (!blob) continue;
    try {
      const x = await AudioEng.decodeBlob(blob);
      items.push({ kind: 'checkin', week: w, samples: excerpt(x, 20) });
    } catch { /* skip undecodable */ }
  }
  // one or two real Australian clips from your library
  const clips = shuffle(Store.all('clips').filter((c) => !c.archived && !c.noisy));
  for (const c of clips) {
    if (items.filter((i) => i.kind === 'model').length >= 2) break;
    const v = Store.get('videos', c.videoId);
    const st = await VideoAudio.ensure(v, c.start, Math.min(c.end, c.start + 20));
    if (!st || st.status !== 'ready') continue;
    items.push({ kind: 'model', clipId: c.id, samples: VideoAudio.slice(v.id, c.start, Math.min(c.end, c.start + 20)) });
  }
  if (items.filter((i) => i.kind === 'checkin').length < 1) { toast('Record at least one check-in first.', 'bad'); return; }
  const mixed = shuffle(items);
  const letters = 'ABCDEFGHIJ';
  const enc = new TextEncoder();
  const files = mixed.map((it, i) => ({ name: `Sample ${letters[i]}.wav`, data: DSP.wav(it.samples) }));
  const sheet = ['Listener name,Sample,Rating (1 = no foreign accent; 9 = very strong accent),What gave it away?']
    .concat(mixed.map((_, i) => `,${letters[i]},,`)).join('\n');
  files.push({ name: 'rating-sheet.csv', data: enc.encode(sheet) });
  files.push({ name: 'instructions.txt', data: enc.encode(`Thanks for helping!\n\nListen to each sample once or twice, in any order. For each one, rate how strong a foreign (non-Australian) accent you hear:\n1 = no foreign accent at all, 9 = very strong foreign accent.\nThen write a few words on what gave it away (a sound, the rhythm, the melody...).\nFill in rating-sheet.csv and send it back.\n`) });
  const zip = makeZip(files);
  const pack = Store.put('meta', { id: `pack-${uid()}`, kind: 'listenerPack', created: new Date().toISOString(), items: mixed.map((it, i) => ({ label: letters[i], kind: it.kind, week: it.week, clipId: it.clipId })), ratings: [] });
  const name = `listener-pack-${dayKey()}.zip`;
  if (Caps.downloads) {
    try { await Caps.downloads.save({ filename: name, data: zip }); toast('Pack saved.', 'good'); } catch (e) { if (e.code !== 'declined') toast(`Couldn’t save the file (${e.code}).`, 'bad'); }
  } else {
    const a = h('a', { href: URL.createObjectURL(zip), download: name });
    document.body.appendChild(a); a.click(); a.remove();
  }
  toast(`Pack ${fmtDay(dayKey())} keeps the answer key here, so the listeners can't see which is which.`);
  return pack;
}
function excerpt(x, secs) {
  const a = DSP.analyse(x.length > SR * 90 ? x.subarray(0, SR * 90) : x);
  const on = DSP.onset(a.db) * HOP;
  return x.subarray(on, Math.min(x.length, on + secs * SR));
}
function listenerPacks() { return Store.all('meta').filter((m) => m.kind === 'listenerPack').sort((a, b) => (a.created < b.created ? 1 : -1)); }

function openRatings() {
  const packs = listenerPacks();
  if (!packs.length) { toast('Export a listener pack first.'); return; }
  const pack = packs[0];
  const F = { listener: '', vals: {} };
  const form = h('form', { class: 'stack', onsubmit: (e) => {
    e.preventDefault();
    const rows = pack.items.map((it) => ({ label: it.label, rating: +F.vals[it.label]?.rating || null, comment: F.vals[it.label]?.comment || '' })).filter((r) => r.rating >= 1 && r.rating <= 9);
    if (!rows.length) { toast('Enter at least one rating from 1 to 9.'); return; }
    Store.patch('meta', pack.id, { ratings: [...(pack.ratings || []), { listener: F.listener.trim() || 'Listener', rows, at: dayKey() }] });
    toast('Ratings saved.', 'good');
    openProgress('measures');
  } },
  h('label', { class: 'field', for: 'rListener' }, 'Listener name', h('input', { type: 'text', id: 'rListener', oninput: (e) => { F.listener = e.target.value; } })),
  h('div', { class: 'table-wrap' }, h('table', null, h('thead', null, h('tr', null, h('th', null, 'Sample'), h('th', null, 'Rating 1–9'), h('th', null, 'What gave it away?'))),
    h('tbody', null, pack.items.map((it) => h('tr', null, h('td', null, it.label),
      h('td', null, h('input', { type: 'number', min: 1, max: 9, id: `r-${it.label}`, style: { width: '80px' }, oninput: (e) => { (F.vals[it.label] ||= {}).rating = e.target.value; } })),
      h('td', null, h('input', { type: 'text', id: `c-${it.label}`, oninput: (e) => { (F.vals[it.label] ||= {}).comment = e.target.value; } }))))))),
  h('div', { class: 'row' }, h('button', { type: 'submit', class: 'btn primary' }, h('span', null, 'Save ratings'))));
  openModal([modalHead('Enter listener ratings', `Pack from ${fmtDay(dayKey(new Date(pack.created)))} · ${(pack.ratings || []).length} listener(s) so far`), form]);
}
function ratingAverages() {
  const out = new Map();
  for (const p of listenerPacks()) {
    for (const r of p.ratings || []) for (const row of r.rows) {
      const it = p.items.find((i) => i.label === row.label);
      if (!it) continue;
      const label = it.kind === 'model' ? 'Australian speaker (reference)' : it.week === 0 ? 'Baseline' : `Week ${it.week}`;
      if (!out.has(label)) out.set(label, []);
      out.get(label).push(row.rating);
    }
  }
  return [...out.entries()].map(([label, arr]) => ({ label, avg: mean(arr), n: arr.length }));
}

async function checkStorage() {
  if (Store.mode === 'cloud') {
    await Api.req('PUT', '/api/docs/meta/probe', { at: new Date().toISOString() });
    await Api.req('DELETE', '/api/docs/meta/probe');
    return { state: 'ok', msg: `Your Cloudflare database saves and reads back${Api.email ? ` (signed in as ${Api.email})` : ''}. Your data follows you to any device.` };
  }
  if (Store.mode === 'artifact') {
    const ref = Caps.db.collection('meta').doc('probe');
    await ref.set({ at: new Date().toISOString() });
    const snap = await ref.get();
    await ref.delete();
    return snap.exists ? { state: 'ok', msg: 'The artifact’s database saves and reads back. Your data follows you to any device.' } : { state: 'fail', msg: 'A test write didn’t read back.' };
  }
  if (Store.mode === 'local') return { state: 'warn', msg: 'Saving works, but only in this browser on this device. Use Settings → Data → Export backup to move it.' };
  return { state: 'fail', msg: 'Storage is blocked here; nothing is kept.' };
}
async function checkFiles() {
  if (Store.blobMode === 'r2') {
    const ref = await Store.putBlob(new Blob([new Uint8Array(4096)], { type: 'audio/webm' }), 'misc');
    const back = await Store.getBlob(ref);
    await Store.deleteBlob(ref);
    return back && back.size === 4096 ? { state: 'ok', msg: 'Recordings and videos are stored in your R2 bucket and play on every device.' } : { state: 'fail', msg: 'A test file didn’t read back.' };
  }
  if (Store.blobMode === 'assets') {
    const blob = new Blob([new Uint8Array(2048)], { type: 'video/webm' });
    const r = await Caps.assets.upload(blob, { type: 'video/webm' });
    const list = await Caps.assets.list();
    await Caps.assets.delete(r.id);
    const u = list.usage;
    const mins = Math.floor((u.maxBytes - u.bytes) / (16000 * 60));
    return { state: 'ok', msg: `File storage works. ${(u.bytes / 1048576).toFixed(1)} of ${(u.maxBytes / 1048576).toFixed(0)} MB used, ${u.files}/${u.maxFiles} files; 20 MB per recording maximum (about ${mins} more minutes of recordings at typical quality).` };
  }
  if (Store.blobMode === 'local') {
    let est = '';
    try { const q = await navigator.storage.estimate(); est = ` About ${((q.quota - q.usage) / 1073741824).toFixed(1)} GB free for this browser.`; } catch { /* no estimate */ }
    return { state: 'warn', msg: `Recordings are kept in this browser only.${est}` };
  }
  return { state: 'fail', msg: 'Recordings can’t be kept here.' };
}
async function checkMic() {
  AudioEng.getCtx();
  const ok = await Mic.open();
  if (!ok) return { state: 'fail', msg: Mic.error };
  let peak = -100;
  const off = Mic.on((x) => { for (let i = 0; i < x.length; i += 40) peak = Math.max(peak, 20 * Math.log10(Math.abs(x[i]) + 1e-6)); });
  await sleep(1500);
  off();
  if (!Session.active) Mic.close();
  return peak > -70 ? { state: 'ok', msg: `The microphone works (peak level ${peak.toFixed(0)} dB in 1.5 s).` } : { state: 'warn', msg: 'The microphone opened but heard silence. Check the input device.' };
}
async function checkVideoPlays() {
  const v = Player.current();
  if (!v) return { state: '', msg: 'Open a video first.' };
  if (LocalFiles.get(v.id)) return { state: 'warn', msg: 'Playing from a file on this device, so the link wasn’t tested.' };
  const r = await checkPlayable(videoSrc(v));
  return r.ok ? { state: 'ok', msg: `“${v.title}” plays from its ${v.r2Key || v.assetId ? 'stored copy' : 'link'} (${fmtTime(r.duration)} long).` } : { state: 'fail', msg: r.reason };
}
async function checkVideoSound() {
  const v = Player.current();
  if (!v) return { state: '', msg: 'Open a video first.' };
  VideoAudio.cache.delete(v.id);
  const t0 = performance.now();
  const r = await VideoAudio.ensure(v, 0, 10);
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  if (r.status === 'ready') return { state: 'ok', msg: r.method === 'partial'
    ? `The app reads just the part of “${v.title}” it needs (10 s of sound in ${secs} s). Pitch and waveform will work.`
    : `The app can read the sound of “${v.title}”, but has to download the whole file each visit (${secs} s here)${r.mp4Failed ? `: ${r.mp4Failed}` : ''}.` };
  return { state: 'fail', msg: r.error };
}
async function checkClaude() {
  if (Store.mode === 'cloud') {
    if (!Api.claude) return { state: 'fail', msg: 'The server has no Claude API key yet. Add the ANTHROPIC_API_KEY secret to the Cloudflare project.' };
    const { reply } = await Api.req('POST', '/api/claude', { sentence: 'Go and grab the car.', off: 'the vowel in go sounds too pure', aim: '', issues: [] });
    return reply && (reply.feature || reply.text || reply.unsure) ? { state: 'ok', msg: `Claude answered (model: ${Api.claudeModel || 'unknown'}). Feedback on notes uses your Claude API key.` } : { state: 'warn', msg: 'Claude answered in an unexpected format.' };
  }
  if (!Caps.sample) return { state: 'fail', msg: Caps.inArtifact ? 'Claude access isn’t available in this view.' : 'This standalone version can’t reach Claude. Notes offer “Copy prompt for Claude” instead.' };
  const r = await Caps.sample('Reply with just the word OK.', { modelTier: 'quick', cache: false });
  return /ok/i.test(r.text) ? { state: 'ok', msg: 'Claude answered. Feedback on notes will use your Claude plan.' } : { state: 'warn', msg: `Claude answered unexpectedly: “${r.text.slice(0, 60)}”` };
}
async function checkPitch() {
  const clips = Store.all('clips').filter((c) => c.model);
  if (!clips.length) return { state: '', msg: 'Save a clip whose sound can be read first.' };
  const rel = clips.map((c) => c.model.reliability || 0);
  const avg = mean(rel);
  const weak = clips.filter((c) => (c.model.reliability || 0) < 0.55);
  return { state: avg > 0.7 ? 'ok' : avg > 0.5 ? 'warn' : 'fail', msg: `On average ${Math.round(avg * 100)}% of voiced speech gets a reliable pitch reading across ${clips.length} clip${clips.length === 1 ? '' : 's'}.${weak.length ? ` ${weak.length} clip${weak.length === 1 ? ' is' : 's are'} patchy (background noise); flag them as noisy if the line jumps.` : ''}` };
}
async function checkAlign() {
  const recs = Store.all('recordings').filter((r) => r.kind === 'pass' && r.score != null).sort((a, b) => (a.created < b.created ? 1 : -1)).slice(0, 12);
  if (!recs.length) return { state: '', msg: 'Record a few passes first.' };
  const good = recs.filter((r) => r.score > 0.3);
  const share = good.length / recs.length;
  return { state: share > 0.75 ? 'ok' : share > 0.4 ? 'warn' : 'fail', msg: `${good.length} of the last ${recs.length} recorded passes lined up automatically (average match ${mean(recs.map((r) => r.score)).toFixed(2)}). When it fails, the manual offset in Settings is used.` };
}

/* ---- 99-main.js ---- */
/* ---------- boot, global rendering, keyboard ---------- */
/* what shows where depends on what you're doing:
   browsing -> today's card under the player; cutting -> the clip editor there;
   in a session -> session card in the right column, pitch/waveform under the player */
const wideLayout = window.matchMedia ? matchMedia('(min-width: 901px)') : { matches: true };
function applyLayout() {
  const mode = Session.active ? 'session' : UI.cutMode || UI.sel ? 'cut' : 'idle';
  const layout = $('.layout'), sess = $('#session'), panel = $('#panel');
  layout.classList.toggle('in-session', mode === 'session');
  layout.classList.toggle('cutting', mode === 'cut');
  if (mode === 'session' && wideLayout.matches) { if (sess.parentElement !== $('#sideSlot')) $('#sideSlot').appendChild(sess); }
  else if (sess.parentElement !== $('#below')) $('#below').insertBefore(sess, panel);
  if (mode !== 'cut' && panel.parentElement !== $('#below')) { $('#below').appendChild(panel); layout.classList.remove('panel-side'); }
  sess.hidden = mode === 'cut';
  panel.hidden = mode === 'idle';
  if (UI.layoutMode !== mode) { UI.layoutMode = mode; requestAnimationFrame(() => Panel.onTime(Player.time())); }
  scheduleFit();
}

/* Size the player from the video's own shape: as tall as the screen allows once the row
   underneath has its space, and exactly as wide as that height needs (no black side bars).
   The right column gets the remaining width; in a session the session card matches the player's height. */
let fitQueued = false;
function scheduleFit() {
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => { fitQueued = false; fitLayout(); fitLayout(); });
}
function fitLayout() {
  const L = $('.layout');
  const sess = $('#session'), below = $('#below');
  if (!wideLayout.matches) {
    L.classList.remove('fit', 'panel-side', 'no-below');
    if ($('#panel').parentElement !== below) below.appendChild($('#panel'));
    ['--stage-w', '--video-h', '--side-h', '--below-h'].forEach((v) => L.style.removeProperty(v));
    below.classList.remove('capped');
    sess.style.height = '';
    return;
  }
  L.classList.add('fit');
  const v = Player.v;
  const ar = v && v.videoWidth && v.videoHeight ? v.videoWidth / v.videoHeight : 16 / 9;
  L.style.setProperty('--video-ar', String(ar));
  const css = getComputedStyle(L);
  const padT = parseFloat(css.paddingTop), padB = parseFloat(css.paddingBottom), padX = parseFloat(css.paddingLeft) + parseFloat(css.paddingRight);
  const gapY = parseFloat(css.rowGap) || 14, gapX = parseFloat(css.columnGap) || 16;
  const top = L.getBoundingClientRect().top;
  const avail = Math.max(320, window.innerHeight - top - padT - padB);
  // natural height of the row underneath (chart at its usual size)
  L.style.setProperty('--below-h', 'auto');
  // the clip editor needs room: on a short screen it moves into the right column instead (the library hides)
  const panel = $('#panel'), inSide = panel.parentElement === $('#sideSlot');
  if ((UI.sel || UI.cutMode) && !Session.active && !fitLayout.moving) {
    const arMin = ar >= 1 ? Math.min(L.clientWidth - padX - gapX - 340, 700) / ar : 200;
    const need = arMin + $('#controls').offsetHeight + 6 + gapY + panel.scrollHeight;
    const wantSide = need > avail + (inSide ? 60 : 0);
    if (wantSide !== inSide) {
      if (wantSide) $('#sideSlot').appendChild(panel); else below.appendChild(panel);
      L.classList.toggle('panel-side', wantSide);
      fitLayout.moving = true;
      try { fitLayout(); } finally { fitLayout.moving = false; }
      return;
    }
  }
  const belowVisible = [...below.children].some((c) => !c.hidden);
  L.classList.toggle('no-below', !belowVisible); // an empty row would still take space
  const belowH = belowVisible ? below.scrollHeight + gapY : 0;
  const ctrlH = $('#controls').offsetHeight + 6; // player border
  const sideMin = 340;
  const totalW = L.clientWidth - padX - gapX;
  let vh = Math.max(200, avail - belowH - ctrlH);
  let w = vh * ar;
  if (w > totalW - sideMin) { w = totalW - sideMin; vh = w / ar; }
  // never squeeze the player into a sliver: narrow, the controls wrap and the row underneath
  // grows, which would shrink the video further. The chart gives up some height instead.
  const minW = Math.min(totalW - sideMin, Session.active ? 560 : 700); // in a session the controls are shorter
  if (w < minW && ar >= 1) { w = minW; vh = w / ar; }
  L.style.setProperty('--stage-w', `${Math.floor(w)}px`);
  L.style.setProperty('--video-h', `${Math.floor(vh)}px`);
  // library: full height of the right column; the row underneath fills what's left to the bottom
  L.style.setProperty('--side-h', `${Math.floor(avail)}px`);
  const room = Math.max(60, Math.floor(avail - $('#player').offsetHeight - gapY));
  L.style.setProperty('--below-h', belowVisible ? `${room}px` : 'auto');
  below.classList.toggle('capped', belowVisible && below.scrollHeight > below.clientHeight + 1);
  // session card: same height as the player
  sess.style.height = Session.active && sess.parentElement === $('#sideSlot') ? `${$('#player').offsetHeight}px` : '';
  Panel.onTime(Player.time()); // the chart may have changed size
}

function renderAll() {
  applyLayout();
  renderChips();
  renderBanners();
  renderControls();
  renderScrubber();
  renderSession();
  renderPanel();
  renderSidebar();
  $('#playerEmpty').hidden = !!Player.current();
  if (!Player.current()) renderPlayerEmpty();
}

function onKey(e) {
  const tag = (e.target && e.target.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (isModalOpen()) { if (e.key === 'Escape') closeModal(); return; }
  const k = e.key;
  if (k === ' ' || k === 'Spacebar') {
    if (tag === 'BUTTON') return; // let the focused button act
    e.preventDefault(); Player.toggle();
  } else if (k === 'r' || k === 'R') Player.replayLoop();
  else if (k === 'i' || k === 'I' || k === '[') markEdge('start');
  else if (k === 'o' || k === 'O' || k === ']') markEdge('end');
  else if (k === ',' || k === '<') Player.stepRate(-1);
  else if (k === '.' || k === '>') Player.stepRate(1);
  else if (k === 'l' || k === 'L') { UI.loop = !UI.loop; renderControls(); toast(UI.loop ? 'Loop on' : 'Loop off'); }
  else if (k === 'ArrowLeft') { e.preventDefault(); Player.seek(Player.time() - 2); }
  else if (k === 'ArrowRight') { e.preventDefault(); Player.seek(Player.time() + 2); }
  else if (k === 'Enter' && Session.active && (Session.phase === 'intro' || Session.phase === 'armed')) Session.go();
  else if (k === 'c' || k === 'C') { if (Player.current() && !Session.active) setCutMode(!UI.cutMode); }
  else if (k === 'Escape') { if (UI.drawer) closeDrawer(); else if (UI.sel && !Session.active) { UI.sel = null; renderAll(); } else if (UI.cutMode) setCutMode(false); }
  else if (k === '?') openShortcuts();
}

async function boot() {
  Player.init();
  renderControls();
  mount($('#panel'), h('div', { class: 'panel-msg' }, 'Loading your practice data…'));
  await Store.init();
  if (Store.mode === 'offline') {
    mount($('#panel'), h('div', { class: 'panel-msg' }, 'Not connected.'));
    openModal([
      modalHead(Api.signedOut ? 'Please sign in again' : 'The server isn’t ready'),
      h('p', null, Api.signedOut ? 'Your sign-in has expired. Reload the page to sign in with your email code.' : `The app’s server answered with a problem: ${Api.problem}`),
      btn('Reload', () => location.reload(), { kind: 'primary', size: 'big' }),
    ], { narrow: true });
    return;
  }
  appMeta();
  applyTheme();
  UI.view = settings().defaultView || 'pitch';
  if (UI.videoId && !Store.get('videos', UI.videoId)) UI.videoId = null;
  if (!UI.videoId) {
    const first = Store.all('videos').filter((v) => !v.archived).sort((a, b) => (a.added < b.added ? 1 : -1))[0];
    UI.videoId = first ? first.id : null;
  }
  Player.load(UI.videoId);
  const last = lastClipId();
  if (last && Store.get('clips', last) && Store.get('clips', last).videoId === UI.videoId) { UI.clipId = last; renderAll(); }
  document.addEventListener('keydown', onKey);
  $('#drawerBack').addEventListener('click', closeDrawer);
  Bus.on('videoaudio', () => { Panel.editor = null; renderPanel(); });
  Bus.on('signedout', () => renderBanners());
  window.addEventListener('resize', () => Panel.onTime(Player.time()));
  if (wideLayout.addEventListener) wideLayout.addEventListener('change', () => applyLayout());
  window.addEventListener('resize', scheduleFit);
  Player.v.addEventListener('loadedmetadata', scheduleFit);
  // the row under the player and the banners change height as you work: refit when they do
  if (window.ResizeObserver) { const ro = new window.ResizeObserver(scheduleFit); ro.observe($('#below')); ro.observe($('#banners')); ro.observe($('#controls')); }
  window.addEventListener('beforeunload', () => { Store.flushAll(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flushAll(); });
  // first launch: the baseline must come before the first practice
  const base = checkinFor(0);
  if (!checkinHasAll(base) && !Store.all('sessions').some((s) => !s.empty) && !lsGet('dismissed', {}).baseline && !lsGet('welcomed', false)) {
    lsSet('welcomed', true);
    openModal([
      modalHead('G’day, Adrien'),
      h('p', null, 'Before your first shadowing session, record your week 0 baseline: six sentences read aloud, a 60-second retelling and a 60-second answer to a question you haven’t seen. It takes about 3 minutes, and every later check-in is compared with it.'),
      h('div', { class: 'row' }, btn('Record my baseline', () => openCheckins(0), { kind: 'primary', size: 'big', icon: 'mic' }), btn('Later', () => closeModal(), { kind: 'ghost' })),
    ], { narrow: true });
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
