<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Shadowing Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one working screen — player + session strip + analysis panel on the left, tall video library on the right (drawer on phones). */
:root {
  --bg: #f4f8f1;
  --surface: #ffffff;
  --surface-2: #eaf2e5;
  --line: #d5e2cd;
  --fg: #1d2a19;
  --muted: #5b6b55;
  --green: #45b52a;
  --green-dark: #2f8a19;
  --green-soft: #def3d3;
  --green-ink: #2f8a19;
  --on-green: #ffffff;
  --wattle: #f2b705;
  --wattle-dark: #c08f00;
  --wattle-soft: #fff1c4;
  --ochre: #ff8a1f;
  --sky: #1c95e0;
  --sky-dark: #136fa8;
  --sky-soft: #d9eefb;
  --red: #e0474c;
  --red-soft: #fde1e1;
  --amber: #e89b00;
  --shadow: 0 2px 0 rgba(29, 42, 25, 0.08);
  --video-bg: #0f140e;
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 11px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111710;
    --surface: #192118;
    --surface-2: #212c1f;
    --line: #2d3a2a;
    --fg: #e6efe2;
    --muted: #97a891;
    --green: #5ccc3c;
    --green-dark: #3a9a20;
    --green-soft: #22391b;
    --green-ink: #5ccc3c;
    --on-green: #0d1a09;
    --wattle: #ffc928;
    --wattle-dark: #c99a00;
    --wattle-soft: #3a3214;
    --ochre: #ff9a3d;
    --sky: #4cb2f2;
    --sky-dark: #2580bb;
    --sky-soft: #15303f;
    --red: #ff6b6f;
    --red-soft: #3d1c1d;
    --amber: #ffb52e;
    --shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    --video-bg: #050705;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111710;
  --surface: #192118;
  --surface-2: #212c1f;
  --line: #2d3a2a;
  --fg: #e6efe2;
  --muted: #97a891;
  --green: #5ccc3c;
  --green-dark: #3a9a20;
  --green-soft: #22391b;
  --green-ink: #5ccc3c;
  --on-green: #0d1a09;
  --wattle: #ffc928;
  --wattle-dark: #c99a00;
  --wattle-soft: #3a3214;
  --ochre: #ff9a3d;
  --sky: #4cb2f2;
  --sky-dark: #2580bb;
  --sky-soft: #15303f;
  --red: #ff6b6f;
  --red-soft: #3d1c1d;
  --amber: #ffb52e;
  --shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
  --video-bg: #050705;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.12rem; }
h4 { font-size: 0.98rem; }
p { margin: 0; }
a { color: var(--sky); }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num { font-variant-numeric: tabular-nums; }
.label {
  font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1 1 auto; min-width: 0; }
.spacer { flex: 1 1 auto; }

/* ---------- buttons ---------- */
.btn {
  --b-bg: var(--surface);
  --b-fg: var(--fg);
  --b-edge: var(--line);
  appearance: none;
  border: 2px solid var(--b-edge);
  border-bottom-width: 4px;
  background: var(--b-bg);
  color: var(--b-fg);
  font: 800 0.88rem/1 var(--font-body);
  letter-spacing: 0.02em;
  height: 40px;
  padding: 0 14px;
  border-radius: var(--r-sm);
  flex: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  white-space: nowrap;
  transition: transform 0.06s, filter 0.15s;
  text-decoration: none;
}
.btn:hover { filter: brightness(1.04); }
.btn:active { transform: translateY(2px); filter: brightness(0.96); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { --b-bg: var(--green); --b-fg: var(--on-green); --b-edge: var(--green-dark); }
.btn.blue { --b-bg: var(--sky); --b-fg: #fff; --b-edge: var(--sky-dark); }
.btn.wattle { --b-bg: var(--wattle); --b-fg: #2a2000; --b-edge: var(--wattle-dark); }
.btn.danger { --b-bg: var(--surface); --b-fg: var(--red); --b-edge: var(--red); }
.btn.ghost { border-color: transparent; background: transparent; border-bottom-width: 2px; padding: 0 10px; }
/* three sizes, each a fixed height, so buttons in a row always line up */
.btn.sm { height: 32px; padding: 0 10px; font-size: 0.8rem; border-bottom-width: 3px; }
.btn.big { height: 50px; padding: 0 22px; font-size: 1rem; border-radius: var(--r-md); }
.btn.icon { width: 40px; padding: 0; }
.btn.icon.sm { width: 32px; }
.btn.icon.big { width: 50px; }
.btn.on { --b-bg: var(--green-soft); --b-edge: var(--green); --b-fg: var(--green-ink); }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.seg button {
  appearance: none; border: 0; background: var(--surface); color: var(--fg); font: 800 0.8rem/1 var(--font-body);
  height: 36px; padding: 0 11px; cursor: pointer;
}
.seg.sm button { height: 28px; padding: 0 9px; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button.on { background: var(--green); color: var(--on-green); }

input[type="text"], input[type="url"], input[type="number"], input[type="date"], textarea, select {
  font: inherit; color: var(--fg); background: var(--surface); border: 2px solid var(--line);
  border-radius: var(--r-sm); padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--sky); }
label.field { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 0.85rem; }
label.check { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; font-size: 0.88rem; cursor: pointer; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); }
input[type="range"] { accent-color: var(--green); }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 2px solid var(--line); background: var(--surface);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; color: var(--green); display: flex; align-items: baseline; gap: 6px; }
.brand small { font-family: var(--font-body); font-size: 0.78rem; font-weight: 800; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  background: var(--surface-2); font-weight: 800; font-size: 0.85rem; border: 2px solid transparent;
}
.chip { color: var(--fg); }
button.chip { font-family: inherit; cursor: pointer; }
.chip svg { width: 18px; height: 18px; color: var(--green); }
.chip.streak svg { color: var(--ochre); }
.chip.streak.cold svg { color: var(--muted); }
.topnav { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.only-phone { display: none !important; }

/* ---------- banners ---------- */
.banners { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 0; }
.banner {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r-md);
  background: var(--wattle-soft); border: 2px solid var(--wattle); font-weight: 700;
}
.banner.info { background: var(--sky-soft); border-color: var(--sky); }
.banner.good { background: var(--green-soft); border-color: var(--green); }
.banner p { flex: 1 1 260px; min-width: 0; }

/* ---------- layout ---------- */
/* The player is sized from the video's own shape so it fills the height with no side bars
   (fitLayout() sets --stage-w and --video-h); the right column takes the rest of the width.
   Browsing / clip mode: library runs full height on the right, the card or editor sits under the video.
   Session: the session card sits beside the video at the same height; the pitch panel runs full width below. */
.layout {
  display: grid; grid-template-columns: var(--stage-w, minmax(0, 1fr)) minmax(320px, 1fr); gap: 14px 16px; padding: 14px 16px 16px;
  grid-template-areas: "player side" "below side"; align-items: start;
}
.layout.in-session { grid-template-areas: "player side" "below below"; }
.layout.fit.no-below { grid-template-areas: "player side"; }
.layout.fit.no-below > .below { display: none; }
.player { grid-area: player; min-width: 0; }
.below { grid-area: below; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.below.capped { overflow: auto; }
#sideSlot:empty { display: none; }
.side { grid-area: side; }

/* ---------- player ---------- */
.player {
  position: relative; background: var(--video-bg); border-radius: var(--r-lg); overflow: hidden;
  border: 3px solid var(--line);
}
.vidwrap { position: relative; }
.player video { display: block; width: 100%; height: var(--video-h, auto); aspect-ratio: var(--video-ar, 16 / 9); background: var(--video-bg); object-fit: contain; }
.player-empty, .player-error {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 20px; color: #e6efe2;
}
.player-empty h2 { color: #fff; }
.player-error { background: rgba(10, 14, 9, 0.88); }
.player-error p { max-width: 52ch; }
.controls { background: #0b100a; padding: 8px 14px 10px; color: #fff; }
.scrubber { position: relative; height: 34px; cursor: pointer; touch-action: none; user-select: none; }
.scrub-track { position: absolute; left: 0; right: 0; top: 19px; height: 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.25); }
.scrub-progress { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ochre); border-radius: 4px; }
.scrub-head { position: absolute; top: 14px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; border: 3px solid var(--ochre); pointer-events: none; }
.player.cutting .scrubber { cursor: crosshair; }
.player.cutting .scrub-track { background: rgba(76, 178, 242, 0.45); }
.scrub-sel { position: absolute; top: 10px; height: 24px; background: rgba(76, 178, 242, 0.35); border: 2px solid var(--sky); border-radius: 6px; pointer-events: none; }
.bracket {
  position: absolute; top: 9px; height: 26px; min-width: 12px; border: 3px solid var(--wattle); border-top-width: 3px;
  border-radius: 3px; background: transparent; cursor: pointer; padding: 0;
  -webkit-mask: linear-gradient(#000 0 0) left / 5px 100% no-repeat, linear-gradient(#000 0 0) right / 5px 100% no-repeat;
          mask: linear-gradient(#000 0 0) left / 5px 100% no-repeat, linear-gradient(#000 0 0) right / 5px 100% no-repeat;
}
.bracket-hit { position: absolute; top: 4px; height: 30px; min-width: 14px; cursor: pointer; background: transparent; border: 0; padding: 0; }
.bracket-hit:hover + .bracket, .bracket.sel { border-color: #fff; }
.bracket.sel { border-width: 4px; }
.bracket-tick { position: absolute; top: -10px; width: 20px; height: 18px; margin-left: -10px; color: var(--green); pointer-events: none; filter: drop-shadow(0 1px 0 rgba(0,0,0,.5)); }
.ctrl-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.ctrl-row .btn { --b-bg: rgba(255, 255, 255, 0.12); --b-fg: #fff; --b-edge: rgba(255, 255, 255, 0.18); }
.ctrl-row .btn.on { --b-bg: var(--green); --b-edge: var(--green-dark); --b-fg: var(--on-green); }
.ctrl-row .seg { border-color: rgba(255, 255, 255, 0.2); }
.ctrl-row .seg button { background: rgba(255, 255, 255, 0.1); color: #fff; }
.ctrl-row .seg button + button { border-left-color: rgba(255, 255, 255, 0.2); }
.ctrl-row .seg button.on { background: var(--green); color: var(--on-green); }
.time { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 0.85rem; padding: 0 6px; }
.vol { width: 80px; }
/* keep the controls on one row when the player is narrow: drop the volume slider, then labels */
.controls { container-type: inline-size; }
@container (max-width: 860px) { .vol { display: none; } #loopBtn .txt, #cutBtn .txt { display: none; } }
@container (max-width: 700px) { #kbBtn { display: none; } }
.hover-time { position: absolute; top: -16px; transform: translateX(-50%); font-size: 0.72rem; font-weight: 800; background: #000; color: #fff; padding: 1px 6px; border-radius: 6px; pointer-events: none; }

/* ---------- session strip ---------- */
.session { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow); }
.session.active { border-color: var(--green); }
.steps { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; }
.step { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.step-name { font-weight: 800; font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.cur .step-name { color: var(--green-ink); }
.bar { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 999px; transition: width 0.3s; }
.step.done .bar > i { width: 100%; }
.bar.big { height: 16px; }
.session-main { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.counter { font-family: var(--font-display); font-weight: 600; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.counter small { font-size: 1rem; color: var(--muted); }
.timer { font-weight: 800; font-variant-numeric: tabular-nums; }
.session-hint { font-weight: 700; color: var(--muted); }
.pass-card { margin-top: 12px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
.lag { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.idle-cta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.idle-cta .grow p { margin-top: 2px; }
.queue-pill { font-size: 0.8rem; font-weight: 800; background: var(--sky-soft); color: var(--sky-dark); padding: 3px 9px; border-radius: 999px; }

/* ---------- analysis panel ---------- */
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px 14px; box-shadow: var(--shadow); }
.panel-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.panel canvas { display: block; width: 100%; height: 220px; border-radius: var(--r-sm); background: var(--surface-2); touch-action: none; }
.panel canvas.editor { height: 170px; cursor: ew-resize; }
/* wide screens: the row under the player is given an exact height (fitLayout); the chart stretches or
   shrinks to fill it, so there's never empty space at the bottom */
.layout.fit .below { height: var(--below-h, auto); }
.layout.fit .below > .panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.layout.fit .below > .panel > * { flex-shrink: 0; }
.layout.fit .below > .panel > canvas { flex: 1 1 220px; height: auto; min-height: 130px; }
.layout.fit .below > .panel > canvas.editor { flex-basis: 150px; min-height: 100px; }
.panel-msg { padding: 22px 12px; text-align: center; color: var(--muted); font-weight: 700; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.editor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 14px; margin-top: 10px; align-items: end; }
.nudge { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.len { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; padding: 3px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.len.good { background: var(--green-soft); color: var(--green-ink); }
.len.warn { background: var(--wattle-soft); color: var(--wattle-dark); }
.len.bad { background: var(--red-soft); color: var(--red); }
.warnline { color: var(--red); font-weight: 700; font-size: 0.86rem; }

/* ---------- sidebar ---------- */
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sidebar {
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 12px;
  height: var(--side-h, auto); max-height: var(--side-h, calc(100vh - 96px)); overflow: auto; box-shadow: var(--shadow);
}
/* during a session the session card takes the right column (and the library steps aside) */
.layout.in-session .side .sidebar, .layout.panel-side .side .sidebar { display: none; }
.side .panel { max-height: var(--side-h, none); overflow: auto; }
.side .session { overflow: auto; }
.side .session .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.side .session .counter { font-size: 1.6rem; }
.vlist { display: flex; flex-direction: column; gap: 8px; }
.vitem { border: 2px solid var(--line); border-radius: var(--r-md); padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.vitem.open { border-color: var(--green); background: var(--green-soft); }
.vitem-title { font-weight: 800; cursor: pointer; overflow-wrap: anywhere; }
.vitem .meta { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
.vprog { height: 8px; }
.clist { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.citem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: var(--r-sm); background: var(--surface); border: 2px solid var(--line); }
.citem.sel { border-color: var(--wattle); }
.citem .clabel { font-weight: 800; font-size: 0.86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.citem .cmeta { font-size: 0.75rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.tick { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.tick.done { background: var(--green); color: var(--on-green); }
.tick svg { width: 14px; height: 14px; }
details.archived > summary { cursor: pointer; font-weight: 800; color: var(--muted); font-size: 0.88rem; padding: 4px 0; }
.addform { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: var(--r-md); background: var(--surface-2); }
.formerr { color: var(--red); font-weight: 700; font-size: 0.85rem; }
.formok { color: var(--green-ink); font-weight: 700; font-size: 0.85rem; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(8, 12, 7, 0.55); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px 24px; overflow: auto; }
.modal { background: var(--bg); border: 2px solid var(--line); border-radius: var(--r-lg); width: min(880px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal.narrow { width: min(520px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.stat { font-family: var(--font-display); font-weight: 600; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.cal { display: grid; grid-template-columns: auto repeat(7, minmax(0, 30px)); justify-content: start; gap: 4px; font-size: 0.72rem; font-weight: 800; color: var(--muted); align-items: center; }
.cal .d { aspect-ratio: 1; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; color: transparent; max-width: 100%; }
.cal .d.full { background: var(--green); color: var(--on-green); }
.cal .d.bad { background: var(--wattle); color: #2a2000; }
.cal .d.today { outline: 2px solid var(--sky); outline-offset: 1px; }
.cal .d.future { opacity: 0.35; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; }
.table-wrap { overflow-x: auto; }

/* ---------- tiny CSV + zip writer (stored, no compression) ---------- */
function csvCell(v) { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf) { let c = 0xffffffff; for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
function makeZip(files) {
  // files: [{name, data: Uint8Array}]
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, f.data.length, true); lh.setUint32(22, f.data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, f.data.length, true); ch.setUint32(24, f.data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + f.data.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

/* ---- 10-store.js ---- */
/* ---------- storage: artifact database + file storage, or this browser (IndexedDB) ---------- */
const COLS = ['videos', 'clips', 'sessions', 'recordings', 'notes', 'issues', 'checkins', 'meta'];

const Caps = { db: null, assets: null, sample: null, downloads: null, inArtifact: false };

async function resolveCaps() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  Caps.inArtifact = true;
  const get = (n) => c.use(n).catch(() => null);
  const [db, assets, sample, downloads] = await Promise.all([get('db'), get('assets'), get('sample'), get('downloads')]);
  Object.assign(Caps, { db, assets, sample, downloads });
}

/* IndexedDB: one store for documents, one for recording blobs */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open('shadowing-practice', 1); } catch (e) { rej(e); return; }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs');
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
      };
      req.onsuccess = () => { this.db = req.result; res(this.db); };
      req.onerror = () => rej(req.error);
    });
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const s = t.objectStore(store);
      const out = fn(s);
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  async all(store) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, 'readonly');
      const s = t.objectStore(store);
      const keys = s.getAllKeys();
      const vals = s.getAll();
      t.oncomplete = () => res(keys.result.map((k, i) => [k, vals.result[i]]));
      t.onerror = () => rej(t.error);
    });
  },
  put(store, key, val) { return this.tx(store, 'readwrite', (s) => s.put(val, key)); },
  del(store, key) { return this.tx(store, 'readwrite', (s) => s.delete(key)); },
  get(store, key) { return this.tx(store, 'readonly', (s) => s.get(key)); },
};

/* ---------- cloud backend (Cloudflare Pages Functions: D1 + R2 + Claude) ---------- */
const Api = {
  on: false,
  email: null,
  claude: false,
  signedOut: false,
  problem: null,
  async req(method, path, body, { raw = false, headers = {} } = {}) {
    let resp;
    try {
      resp = await fetch(path, {
        method, credentials: 'same-origin', redirect: 'manual',
        headers: body != null && !raw ? { 'content-type': 'application/json', ...headers } : headers,
        body: body == null ? undefined : raw ? body : JSON.stringify(body),
      });
    } catch (e) {
      throw Object.assign(new Error('The server couldn’t be reached. Check your connection.'), { code: 'network' });
    }
    if (resp.type === 'opaqueredirect' || resp.status === 401) {
      this.signedOut = true;
      Bus.emit('signedout');
      throw Object.assign(new Error('Your sign-in has expired. Reload the page to sign in again.'), { code: 'signedout' });
    }
    const ct = resp.headers.get('content-type') || '';
    const data = ct.includes('application/json') ? await resp.json().catch(() => ({})) : null;
    if (!resp.ok) throw Object.assign(new Error((data && data.error) || `Server error ${resp.status}`), { code: `http_${resp.status}`, status: resp.status });
    return data;
  },
  async probe() {
    if (location.protocol === 'file:') return false;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch('/api/health', { credentials: 'same-origin', redirect: 'manual', signal: ctl.signal });
      if (r.type === 'opaqueredirect' || r.status === 401) { this.signedOut = true; return false; }
      if (!(r.headers.get('content-type') || '').includes('application/json')) return false;
      const d = await r.json();
      if (!r.ok) { this.problem = d.error || `Server error ${r.status}`; return false; }
      this.on = true; this.email = d.email; this.claude = !!d.claude; this.claudeModel = d.claudeModel || null;
      return true;
    } catch { return false; } finally { clearTimeout(timer); }
  },
  /* one part per request with upload progress (fetch can't report upload progress) */
  xhr(method, url, body, onProgress) {
    return new Promise((res, rej) => {
      const x = new XMLHttpRequest();
      x.open(method, url);
      x.withCredentials = true;
      x.responseType = 'json';
      if (onProgress) x.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded);
      x.onload = () => (x.status >= 200 && x.status < 300 ? res(x.response) : rej(Object.assign(new Error((x.response && x.response.error) || `Upload failed (${x.status})`), { status: x.status })));
      x.onerror = () => rej(new Error('The upload was interrupted. Check your connection and try again.'));
      x.send(body);
    });
  },
  async uploadVideo(file, onProgress) {
    const { key, uploadId, partSize } = await this.req('POST', '/api/uploads', { filename: file.name, type: file.type || 'video/mp4' });
    const parts = [];
    let done = 0;
    try {
      for (let i = 0, n = 1; i < file.size || n === 1; i += partSize, n++) {
        const chunk = file.slice(i, Math.min(file.size, i + partSize));
        let tries = 0;
        for (;;) {
          try {
            const r = await this.xhr('PUT', `/api/uploads/${encodeURIComponent(uploadId)}/${n}?key=${encodeURIComponent(key)}`, chunk, (l) => onProgress && onProgress((done + l) / file.size));
            parts.push({ partNumber: r.partNumber, etag: r.etag });
            break;
          } catch (e) { if (++tries >= 3 || e.status === 401) throw e; await sleep(1500 * tries); }
        }
        done += chunk.size;
        if (i + partSize >= file.size) break;
      }
      return await this.req('POST', `/api/uploads/${encodeURIComponent(uploadId)}/complete?key=${encodeURIComponent(key)}`, { parts });
    } catch (e) {
      this.req('DELETE', `/api/uploads/${encodeURIComponent(uploadId)}?key=${encodeURIComponent(key)}`).catch(() => {});
      throw e;
    }
  },
};

const Store = {
  mode: 'memory', // 'cloud' | 'artifact' | 'local' | 'memory'
  blobMode: 'memory', // 'r2' | 'assets' | 'local' | 'memory'
  data: Object.fromEntries(COLS.map((c) => [c, {}])),
  timers: new Map(),
  chains: new Map(),
  memBlobs: new Map(),
  urlCache: new Map(),
  lastError: null,

  async init() {
    await resolveCaps();
    if (!Caps.inArtifact && (await Api.probe())) {
      try {
        const { data } = await Api.req('GET', '/api/docs');
        for (const col of COLS) Object.assign(this.data[col], data[col] || {});
        this.mode = 'cloud';
        this.blobMode = 'r2';
        return;
      } catch (e) { this.lastError = e; Api.problem = e.message; }
    }
    if (Api.signedOut || Api.problem) { this.mode = 'offline'; this.blobMode = 'memory'; return; }
    if (Caps.db) {
      try {
        await Promise.all(COLS.map(async (col) => {
          const snap = await Caps.db.collection(col).get();
          for (const d of snap.docs) this.data[col][d.id] = { ...d.data(), id: d.id };
        }));
        this.mode = 'artifact';
      } catch (e) {
        this.lastError = e;
        console.warn('artifact db unavailable', e);
      }
    }
    if (this.mode !== 'artifact') {
      try {
        const rows = await IDB.all('docs');
        for (const [key, val] of rows) {
          const [col, id] = String(key).split('/');
          if (this.data[col]) this.data[col][id] = val;
        }
        this.mode = 'local';
      } catch (e) {
        this.lastError = e;
        this.mode = 'memory';
      }
    }
    this.blobMode = Caps.assets && this.mode === 'artifact' ? 'assets' : this.mode === 'memory' ? 'memory' : 'local';
  },

  all(col) { return Object.values(this.data[col]); },
  get(col, id) { return id ? this.data[col][id] : undefined; },
  put(col, obj) {
    if (!obj.id) obj.id = uid();
    this.data[col][obj.id] = obj;
    this.schedule(col, obj.id);
    return obj;
  },
  patch(col, id, fields) {
    const cur = this.data[col][id];
    if (!cur) return;
    Object.assign(cur, fields);
    this.schedule(col, id);
    return cur;
  },
  /* coalesce a burst of edits into one write per document, one write at a time */
  schedule(col, id, delay = 400) {
    const key = `${col}/${id}`;
    clearTimeout(this.timers.get(key));
    this.timers.set(key, setTimeout(() => this.flushKey(key), delay));
  },
  flushKey(key) {
    this.timers.delete(key);
    const [col, id] = key.split('/');
    const prev = this.chains.get(key) || Promise.resolve();
    const next = prev.then(() => this.write(col, id)).then(() => { this.failed = 0; }).catch((e) => this.onWriteError(e, key));
    this.chains.set(key, next);
    return next;
  },
  async flushAll() {
    const keys = [...this.timers.keys()];
    for (const k of keys) clearTimeout(this.timers.get(k));
    await Promise.all(keys.map((k) => this.flushKey(k)));
  },
  async write(col, id) {
    const doc = this.data[col][id];
    const body = doc ? JSON.parse(JSON.stringify(doc)) : null;
    if (this.mode === 'cloud') {
      const path = `/api/docs/${col}/${encodeURIComponent(id)}`;
      if (body) { delete body.id; await Api.req('PUT', path, body); } else await Api.req('DELETE', path);
    } else if (this.mode === 'artifact') {
      const ref = Caps.db.collection(col).doc(id);
      if (body) { delete body.id; await ref.set(body); } else await ref.delete();
    } else if (this.mode === 'local') {
      if (body) await IDB.put('docs', `${col}/${id}`, body); else await IDB.del('docs', `${col}/${id}`);
    }
  },
  onWriteError(e, key) {
    console.error('save failed', e);
    const code = e && e.code;
    if (code === 'signedout') return; // the sign-in banner explains it; nothing is lost on screen
    if (this.mode === 'cloud' && key && (code === 'network' || (e.status && e.status >= 500))) {
      // keep retrying quietly; the change is still on screen
      this.failed = (this.failed || 0) + 1;
      if (this.failed <= 3 || this.failed % 10 === 0) toast('Couldn’t save to the server. Retrying…', 'bad');
      setTimeout(() => this.schedule(...key.split('/'), 0), Math.min(60000, 3000 * this.failed));
      return;
    }
    if (code === 'quota_exceeded') toast('Storage is full. Archive or remove old recordings in Settings → Data.', 'bad', 7000);
    else toast(`Couldn't save a change (${code || 'error'}). It is kept on screen; try again shortly.`, 'bad');
  },

  /* ---------- recordings & small files ---------- */
  async putBlob(blob, kind = 'rec') {
    if (this.blobMode === 'r2') {
      const type = (blob.type || 'audio/webm').split(';')[0];
      const r = await Api.req('POST', `/api/files?kind=${kind}&name=${encodeURIComponent(blob.name || '')}`, blob, { raw: true, headers: { 'content-type': type } });
      return r.ref;
    }
    if (this.blobMode === 'assets') {
      const type = /mp4|m4a|aac/.test(blob.type) ? 'video/mp4' : 'video/webm';
      try {
        const r = await Caps.assets.upload(blob, { type });
        this.urlCache.set(`asset:${r.id}`, r.url);
        return `asset:${r.id}`;
      } catch (e) {
        if (e && e.code === 'store_unavailable') {
          await sleep(800 + Math.random() * 600);
          const r = await Caps.assets.upload(blob, { type });
          return `asset:${r.id}`;
        }
        throw e;
      }
    }
    const id = uid();
    if (this.blobMode === 'local') {
      try { await IDB.put('blobs', id, blob); return `idb:${id}`; } catch (e) { console.warn(e); }
    }
    this.memBlobs.set(id, blob);
    return `mem:${id}`;
  },
  async blobUrl(ref) {
    if (!ref) return null;
    if (this.urlCache.has(ref)) return this.urlCache.get(ref);
    const [kind, id] = ref.split(':');
    let url = null;
    if (kind === 'asset') url = '/_blob/' + id;
    else if (kind === 'r2') url = '/api/files/' + ref.slice(3);
    else {
      const b = await this.getBlob(ref);
      if (b) url = URL.createObjectURL(b);
    }
    if (url) this.urlCache.set(ref, url);
    return url;
  },
  async getBlob(ref) {
    if (!ref) return null;
    const [kind, id] = ref.split(':');
    if (kind === 'mem') return this.memBlobs.get(id) || null;
    if (kind === 'idb') { try { return (await IDB.get('blobs', id)) || null; } catch { return null; } }
    if (kind === 'r2') {
      const r = await fetch('/api/files/' + ref.slice(3), { credentials: 'same-origin' });
      return r.ok ? r.blob() : null;
    }
    if (kind === 'asset') {
      const url = this.urlCache.get(ref) || '/_blob/' + id;
      const r = await fetch(url);
      if (!r.ok) return null;
      return r.blob();
    }
    return null;
  },
  async deleteBlob(ref) {
    if (!ref) return;
    const [kind, id] = ref.split(':');
    this.urlCache.delete(ref);
    if (kind === 'mem') this.memBlobs.delete(id);
    else if (kind === 'idb') await IDB.del('blobs', id).catch(() => {});
    else if (kind === 'asset' && Caps.assets) await Caps.assets.delete(id).catch(() => {});
    else if (kind === 'r2') await Api.req('DELETE', '/api/files/' + ref.slice(3)).catch(() => {});
  },

  /* ---------- backup ---------- */
  exportJSON() {
    return JSON.stringify({ app: 'shadowing-practice', version: 1, exportedAt: new Date().toISOString(), data: this.data }, null, 1);
  },
  async importJSON(text) {
    const parsed = JSON.parse(text);
    if (!parsed || parsed.app !== 'shadowing-practice' || !parsed.data) throw new Error('This file is not a Shadowing Practice backup.');
    let n = 0;
    for (const col of COLS) {
      for (const [id, doc] of Object.entries(parsed.data[col] || {})) {
        if (!this.data[col][id]) { this.data[col][id] = { ...doc, id }; this.schedule(col, id, 50 + n * 5); n++; }
      }
    }
    return n;
  },
};

/* ---- 20-dsp.js ---- */
/* ---------- signal analysis: pitch (YIN), loudness, alignment, rough measures ---------- */
const SR = 16000; // analysis sample rate
const HOP = 160; // 10 ms
const HOP_S = HOP / SR;
const WIN = 400; // 25 ms analysis window
const F0_MIN = 65;
const F0_MAX = 450;

const DSP = {
  /* simple anti-aliased decimation (box filter + linear interpolation) */
  resample(input, fromRate, toRate = SR) {
    if (fromRate === toRate) return Float32Array.from(input);
    const ratio = fromRate / toRate;
    const n = Math.floor(input.length / ratio);
    const out = new Float32Array(n);
    const half = Math.max(0, Math.floor(ratio / 2));
    for (let i = 0; i < n; i++) {
      const c = i * ratio;
      const j = Math.floor(c);
      if (half > 0) {
        let s = 0, cnt = 0;
        for (let k = j - half; k <= j + half; k++) if (k >= 0 && k < input.length) { s += input[k]; cnt++; }
        out[i] = cnt ? s / cnt : 0;
      } else {
        const f = c - j;
        out[i] = (input[j] || 0) * (1 - f) + (input[j + 1] || 0) * f;
      }
    }
    return out;
  },

  /* YIN pitch estimate on x[start .. start+WIN+tauMax) */
  yin(x, start, diff) {
    const tauMin = Math.floor(SR / F0_MAX);
    const tauMax = Math.floor(SR / F0_MIN);
    if (start + WIN + tauMax > x.length) return [0, 0];
    diff[0] = 1;
    let running = 0;
    for (let tau = 1; tau <= tauMax; tau++) {
      let s = 0;
      for (let j = 0; j < WIN; j++) {
        const d = x[start + j] - x[start + j + tau];
        s += d * d;
      }
      running += s;
      diff[tau] = running > 0 ? (s * tau) / running : 1;
    }
    const thr = 0.15;
    let tau = -1;
    for (let t = tauMin; t <= tauMax; t++) {
      if (diff[t] < thr) {
        while (t + 1 <= tauMax && diff[t + 1] < diff[t]) t++;
        tau = t;
        break;
      }
    }
    if (tau < 0) {
      // no dip under threshold: take the global minimum but report low confidence
      let best = tauMin;
      for (let t = tauMin; t <= tauMax; t++) if (diff[t] < diff[best]) best = t;
      tau = best;
    }
    const a = diff[tau - 1] ?? diff[tau], b = diff[tau], c = diff[tau + 1] ?? diff[tau];
    const denom = a - 2 * b + c;
    const shift = denom ? (0.5 * (a - c)) / denom : 0;
    const t = tau + clamp(shift, -1, 1);
    return [SR / t, clamp(1 - b, 0, 1)];
  },

  rmsDb(x, start, len) {
    let s = 0;
    const end = Math.min(x.length, start + len);
    for (let i = start; i < end; i++) s += x[i] * x[i];
    const r = Math.sqrt(s / Math.max(1, end - start));
    return 20 * Math.log10(r + 1e-6);
  },

  /* analyse a mono 16 kHz signal: per 10 ms frame, f0 (Hz, 0 = none), confidence, loudness (dB) */
  analyse(x) {
    const n = Math.max(0, Math.floor((x.length - WIN) / HOP));
    const f0 = new Float32Array(n), conf = new Float32Array(n), db = new Float32Array(n);
    const diff = new Float32Array(Math.floor(SR / F0_MIN) + 2);
    for (let i = 0; i < n; i++) db[i] = this.rmsDb(x, i * HOP, WIN);
    const loud = percentile(Array.from(db), 0.95);
    const gate = loud - 30;
    for (let i = 0; i < n; i++) {
      if (db[i] < gate) continue;
      const [f, c] = this.yin(x, i * HOP, diff);
      f0[i] = f; conf[i] = c;
    }
    return { f0, conf, db, hop: HOP_S };
  },

  /* smooth, remove unreliable stretches and octave jumps; returns Float32 Hz with NaN for gaps */
  cleanPitch(f0, conf, smoothing = 5) {
    const n = f0.length;
    const out = new Float32Array(n).fill(NaN);
    for (let i = 0; i < n; i++) if (f0[i] > 0 && conf[i] > 0.75) out[i] = f0[i];
    // octave-jump fix against a running median
    const med = median(Array.from(out));
    if (isFinite(med)) {
      for (let i = 0; i < n; i++) {
        const v = out[i];
        if (!isFinite(v)) continue;
        const r = v / med;
        if (r > 1.8 && r < 2.3) out[i] = v / 2;
        else if (r < 0.56 && r > 0.43) out[i] = v * 2;
        else if (r > 2.6 || r < 0.38) out[i] = NaN;
      }
    }
    // median filter
    const k = Math.max(1, Math.floor(smoothing / 2));
    const sm = new Float32Array(n).fill(NaN);
    for (let i = 0; i < n; i++) {
      if (!isFinite(out[i])) continue;
      const win = [];
      for (let j = i - k; j <= i + k; j++) if (j >= 0 && j < n && isFinite(out[j])) win.push(out[j]);
      sm[i] = median(win);
    }
    // drop islands shorter than 40 ms
    let i = 0;
    while (i < n) {
      if (!isFinite(sm[i])) { i++; continue; }
      let j = i;
      while (j < n && isFinite(sm[j])) j++;
      if (j - i < 4) for (let q = i; q < j; q++) sm[q] = NaN;
      i = j;
    }
    return sm;
  },

  /* semitones relative to the speaker's own median pitch */
  toSemitones(hz) {
    const ref = median(Array.from(hz));
    const st = Array.from(hz, (v) => (isFinite(v) && isFinite(ref) ? 12 * Math.log2(v / ref) : null));
    return { st, refHz: isFinite(ref) ? ref : null };
  },

  /* the compact "model line" stored with each clip */
  modelFromSamples(x, smoothing) {
    const a = this.analyse(x);
    const clean = this.cleanPitch(a.f0, a.conf, smoothing);
    const { st, refHz } = this.toSemitones(clean);
    const voiced = Array.from(a.f0).filter((v) => v > 0).length;
    const reliable = st.filter((v) => v != null).length;
    return {
      hop: HOP_S,
      st: st.map((v) => (v == null ? null : Math.round(v * 10) / 10)),
      db: Array.from(a.db, (v) => Math.round(v)),
      refHz: refHz && Math.round(refHz),
      onset: this.onset(a.db) * HOP_S,
      reliability: voiced ? round(reliable / voiced, 2) : 0,
      measures: this.measures(a.db, st),
    };
  },

  /* first frame where loudness rises well above the noise floor for 50 ms */
  onset(db, startAt = 0) {
    const arr = Array.from(db);
    const floor = percentile(arr, 0.1);
    const peak = percentile(arr, 0.97);
    const thr = Math.max(floor + 12, peak - 28);
    for (let i = startAt; i < arr.length - 5; i++) {
      let ok = true;
      for (let k = 0; k < 5; k++) if (arr[i + k] < thr) { ok = false; break; }
      if (ok) return i;
    }
    return 0;
  },

  /* normalised envelope for alignment */
  envForAlign(db) {
    const arr = Array.from(db, (v) => (v == null ? -80 : v));
    const floor = percentile(arr, 0.15);
    const peak = percentile(arr, 0.98);
    const span = Math.max(6, peak - floor);
    const e = arr.map((v) => clamp((v - floor) / span, 0, 1));
    const m = mean(e);
    return e.map((v) => v - m);
  },

  /* best shift d (frames) such that user[t + d] ~ model[t]; positive d = user behind */
  xcorr(model, user, minLag, maxLag) {
    let best = 0, bestScore = -Infinity;
    const scores = [];
    for (let d = minLag; d <= maxLag; d++) {
      let s = 0, na = 0, nb = 0;
      for (let t = 0; t < model.length; t++) {
        const u = t + d;
        if (u < 0 || u >= user.length) continue;
        s += model[t] * user[u]; na += model[t] * model[t]; nb += user[u] * user[u];
      }
      const score = na && nb ? s / Math.sqrt(na * nb) : -1;
      scores.push(score);
      if (score > bestScore) { bestScore = score; best = d; }
    }
    // confidence: how much the peak stands out from the rest
    const sorted = scores.slice().sort((a, b) => b - a);
    const second = sorted[Math.min(sorted.length - 1, 25)] ?? -1;
    return { lag: best, score: bestScore, margin: bestScore - second };
  },

  /* syllable-ish nuclei: loudness peaks in voiced stretches */
  nuclei(db, st) {
    const n = db.length;
    const sm = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0, c = 0;
      for (let k = -3; k <= 3; k++) if (i + k >= 0 && i + k < n) { s += db[i + k]; c++; }
      sm[i] = s / c;
    }
    const peak = percentile(Array.from(sm), 0.97);
    const peaks = [];
    for (let i = 4; i < n - 4; i++) {
      if (sm[i] < peak - 22) continue;
      if (!(sm[i] >= sm[i - 1] && sm[i] > sm[i + 1])) continue;
      const voiced = st ? [i - 2, i, i + 2].some((j) => st[j] != null) : true;
      if (!voiced) continue;
      // prominence: dip of at least 2 dB to each side before the next peak
      let l = i, r = i;
      while (l > 0 && sm[l - 1] <= sm[l] + 0.2 && i - l < 25) l--;
      while (r < n - 1 && sm[r + 1] <= sm[r] + 0.2 && r - i < 25) r++;
      if (sm[i] - Math.max(sm[l], sm[r]) < 2) continue;
      if (peaks.length && i - peaks[peaks.length - 1].i < 8) {
        if (sm[i] > peaks[peaks.length - 1].v) peaks[peaks.length - 1] = { i, v: sm[i], l, r };
        continue;
      }
      peaks.push({ i, v: sm[i], l, r });
    }
    // width at -6 dB as a rough syllable length
    for (const p of peaks) {
      let a = p.i, b = p.i;
      while (a > 0 && sm[a] > p.v - 6) a--;
      while (b < n - 1 && sm[b] > p.v - 6) b++;
      p.dur = (b - a) * HOP_S;
    }
    return peaks;
  },

  /* rough, clearly-labelled measures (not an accent score) */
  measures(db, st) {
    const arr = Array.from(db);
    const floor = percentile(arr, 0.1), peak = percentile(arr, 0.97);
    const speech = arr.filter((v) => v > Math.max(floor + 10, peak - 30)).length * HOP_S;
    const peaks = this.nuclei(arr, st);
    const vols = peaks.map((p) => p.v);
    const cut = percentile(vols, 0.7);
    const stressed = peaks.filter((p) => p.v >= cut).map((p) => p.dur);
    const unstressed = peaks.filter((p) => p.v < cut).map((p) => p.dur);
    const stv = (st || []).filter((v) => v != null);
    return {
      rate: speech > 0.5 ? round(peaks.length / speech, 2) : null,
      stressRatio: stressed.length && unstressed.length ? round(mean(stressed) / mean(unstressed), 2) : null,
      range: stv.length > 20 ? round(percentile(stv, 0.9) - percentile(stv, 0.1), 1) : null,
      syllables: peaks.length,
      speechSec: round(speech, 1),
    };
  },

  /* quiet stretches (pauses) in a dB envelope: [{a, b}] in frames */
  pauses(db, minFrames = 15) {
    const arr = Array.from(db);
    const floor = percentile(arr, 0.1), peak = percentile(arr, 0.97);
    const thr = Math.max(floor + 8, peak - 26);
    const out = [];
    let i = 0;
    while (i < arr.length) {
      if (arr[i] >= thr) { i++; continue; }
      let j = i;
      while (j < arr.length && arr[j] < thr) j++;
      if (j - i >= minFrames) out.push({ a: i, b: j });
      i = j;
    }
    return { pauses: out, thr };
  },

  /* 16-bit mono WAV encoder (used for the blind listener pack) */
  wav(samples, rate = SR) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data');
    v.setUint32(40, samples.length * 2, true);
    let peak = 0;
    for (let i = 0; i < samples.length; i++) peak = Math.max(peak, Math.abs(samples[i]));
    const g = peak > 0 ? 0.89 / peak : 1;
    for (let i = 0; i < samples.length; i++) v.setInt16(44 + i * 2, clamp(samples[i] * g, -1, 1) * 32767, true);
    return new Uint8Array(buf);
  },
};

/* ---- 25-mp4audio.js ---- */
/* ---------- read just a stretch of audio from an MP4, without downloading the whole video ----------
   Finds the audio track's sample table in the file's index (moov box), fetches only the byte
   ranges that hold the audio for the requested time span, and decodes them with WebCodecs.
   Throws on anything it can't handle (not MP4, not AAC, no WebCodecs), so callers can fall back. */
const Mp4Audio = {
  tables: new Map(), // cache key -> parsed audio track (sample table etc.)

  /* a byte reader over a URL (HTTP Range) or a local File */
  reader(src) {
    if (src instanceof Blob) {
      return { size: async () => src.size, read: async (a, b) => new Uint8Array(await src.slice(a, b + 1).arrayBuffer()) };
    }
    let total = null;
    const read = async (a, b) => {
      const r = await fetch(src, { headers: { range: `bytes=${a}-${b}` }, credentials: 'same-origin' });
      if (r.status !== 206) throw new Error(r.ok ? 'no range support' : `HTTP ${r.status}`);
      const cr = r.headers.get('content-range');
      if (cr && total == null) total = +cr.split('/')[1];
      return new Uint8Array(await r.arrayBuffer());
    };
    return { read, size: async () => { if (total == null) await read(0, 15); return total; } };
  },

  async track(key, rd) {
    if (this.tables.has(key)) return this.tables.get(key);
    const total = await rd.size();
    // walk the top-level boxes until we reach moov (often at the end of downloaded videos)
    let off = 0, moov = null;
    while (off < total) {
      const hb = await rd.read(off, Math.min(total - 1, off + 15));
      const dv = new DataView(hb.buffer, hb.byteOffset, hb.byteLength);
      let size = dv.getUint32(0);
      const type = String.fromCharCode(hb[4], hb[5], hb[6], hb[7]);
      if (size === 1) size = Number(dv.getBigUint64(8));
      else if (size === 0) size = total - off;
      if (size < 8) throw new Error('bad box');
      if (type === 'moov') { moov = await rd.read(off, off + size - 1); break; }
      off += size;
    }
    if (!moov) throw new Error('no moov');
    const t = this.parseMoov(moov);
    this.tables.set(key, t);
    return t;
  },

  boxes(u8, start, end) {
    const out = [];
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let p = start;
    while (p + 8 <= end) {
      let size = dv.getUint32(p), hdr = 8;
      const type = String.fromCharCode(u8[p + 4], u8[p + 5], u8[p + 6], u8[p + 7]);
      if (size === 1) { size = Number(dv.getBigUint64(p + 8)); hdr = 16; } else if (size === 0) size = end - p;
      if (size < hdr) break;
      out.push({ type, start: p, body: p + hdr, end: Math.min(end, p + size) });
      p += size;
    }
    return out;
  },
  child(u8, box, type) { return this.boxes(u8, box.body, box.end).find((b) => b.type === type); },

  parseMoov(u8) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const moov = this.boxes(u8, 0, u8.length)[0];
    for (const trak of this.boxes(u8, moov.body, moov.end).filter((b) => b.type === 'trak')) {
      const mdia = this.child(u8, trak, 'mdia');
      const hdlr = mdia && this.child(u8, mdia, 'hdlr');
      if (!hdlr || String.fromCharCode(...u8.subarray(hdlr.body + 8, hdlr.body + 12)) !== 'soun') continue;
      const mdhd = this.child(u8, mdia, 'mdhd');
      const timescale = u8[mdhd.body] === 1 ? dv.getUint32(mdhd.body + 20) : dv.getUint32(mdhd.body + 12);
      // edit list: media time where the track starts (skips encoder priming)
      let mediaStart = 0;
      const edts = this.child(u8, trak, 'edts');
      const elst = edts && this.child(u8, edts, 'elst');
      if (elst) {
        const v = u8[elst.body], n = dv.getUint32(elst.body + 4);
        for (let i = 0, p = elst.body + 8; i < n; i++) {
          const mt = v === 1 ? Number(dv.getBigInt64(p + 8)) : dv.getInt32(p + 4);
          p += v === 1 ? 20 : 12;
          if (mt >= 0) { mediaStart = mt; break; }
        }
      }
      const stbl = this.child(u8, this.child(u8, mdia, 'minf'), 'stbl');
      const cfg = this.audioConfig(u8, dv, this.child(u8, stbl, 'stsd'));
      // sample sizes
      const stsz = this.child(u8, stbl, 'stsz');
      const fixed = dv.getUint32(stsz.body + 4), count = dv.getUint32(stsz.body + 8);
      const sizes = new Uint32Array(count);
      for (let i = 0; i < count; i++) sizes[i] = fixed || dv.getUint32(stsz.body + 12 + i * 4);
      // chunk offsets
      const stco = this.child(u8, stbl, 'stco'), co64 = this.child(u8, stbl, 'co64');
      const cb = stco || co64, nChunks = dv.getUint32(cb.body + 4);
      const chunkOff = new Float64Array(nChunks);
      for (let i = 0; i < nChunks; i++) chunkOff[i] = co64 ? Number(dv.getBigUint64(cb.body + 8 + i * 8)) : dv.getUint32(cb.body + 8 + i * 4);
      // samples per chunk -> byte offset of every sample
      const stsc = this.child(u8, stbl, 'stsc'), nStsc = dv.getUint32(stsc.body + 4);
      const offsets = new Float64Array(count);
      let s = 0;
      for (let e = 0; e < nStsc; e++) {
        const first = dv.getUint32(stsc.body + 8 + e * 12) - 1, per = dv.getUint32(stsc.body + 12 + e * 12);
        const last = e + 1 < nStsc ? dv.getUint32(stsc.body + 8 + (e + 1) * 12) - 1 : nChunks;
        for (let c = first; c < last && s < count; c++) {
          let o = chunkOff[c];
          for (let k = 0; k < per && s < count; k++) { offsets[s] = o; o += sizes[s]; s++; }
        }
      }
      // decode times
      const stts = this.child(u8, stbl, 'stts'), nStts = dv.getUint32(stts.body + 4);
      const dts = new Float64Array(count);
      let t = 0; s = 0;
      for (let e = 0; e < nStts; e++) {
        const n = dv.getUint32(stts.body + 8 + e * 8), d = dv.getUint32(stts.body + 12 + e * 8);
        for (let k = 0; k < n && s < count; k++) { dts[s++] = t; t += d; }
      }
      return { timescale, mediaStart, sizes, offsets, dts, count, ...cfg };
    }
    throw new Error('no audio track');
  },

  audioConfig(u8, dv, stsd) {
    const entry = this.boxes(u8, stsd.body + 8, stsd.end)[0];
    if (!entry || (entry.type !== 'mp4a' && entry.type !== 'Opus')) throw new Error(`audio codec ${entry && entry.type} not supported`);
    const b = entry.body;
    const version = dv.getUint16(b + 8);
    const channels = dv.getUint16(b + 16);
    const rate = dv.getUint32(b + 24) >>> 16;
    const childStart = b + 28 + (version === 1 ? 16 : version === 2 ? 36 : 0);
    if (entry.type === 'Opus') return { codec: 'opus', channels, rate: 48000, asc: undefined };
    const esds = this.boxes(u8, childStart, entry.end).find((x) => x.type === 'esds');
    if (!esds) throw new Error('no esds');
    // walk the MPEG-4 descriptors down to DecoderSpecificInfo (the AudioSpecificConfig)
    let p = esds.body + 4;
    const desc = () => { const tag = u8[p++]; let len = 0, c; do { c = u8[p++]; len = (len << 7) | (c & 0x7f); } while (c & 0x80); return { tag, len }; };
    let d = desc();
    if (d.tag !== 3) throw new Error('bad esds');
    p += 2; const flags = u8[p++];
    if (flags & 0x80) p += 2;
    if (flags & 0x40) p += 1 + u8[p];
    if (flags & 0x20) p += 2;
    d = desc();
    if (d.tag !== 4) throw new Error('bad esds');
    const oti = u8[p];
    if (oti !== 0x40 && oti !== 0x66 && oti !== 0x67) throw new Error('not AAC');
    p += 13;
    d = desc();
    if (d.tag !== 5) throw new Error('no AudioSpecificConfig');
    const asc = u8.slice(p, p + d.len);
    let aot = asc[0] >> 3;
    if (aot === 31) aot = 32 + (((asc[0] & 7) << 3) | (asc[1] >> 5));
    return { codec: `mp4a.40.${aot}`, channels, rate, asc };
  },

  /* decode [t0, t1] seconds to mono 16 kHz */
  async extract(key, src, t0, t1, onProgress) {
    if (typeof AudioDecoder === 'undefined') throw new Error('no WebCodecs');
    const rd = this.reader(src);
    const T = await this.track(key, rd);
    const cfg = { codec: T.codec, sampleRate: T.rate, numberOfChannels: T.channels };
    if (T.asc) cfg.description = T.asc;
    const sup = await AudioDecoder.isConfigSupported(cfg);
    if (!sup.supported) throw new Error(`${T.codec} not decodable here`);
    const secOf = (i) => (T.dts[i] - T.mediaStart) / T.timescale;
    let i0 = 0, i1 = T.count - 1;
    while (i0 < T.count - 1 && secOf(i0 + 1) <= t0) i0++;
    i0 = Math.max(0, i0 - 2); // a little pre-roll for the decoder
    while (i1 > i0 && secOf(i1) > t1) i1--;
    // group samples into byte ranges (audio sits in chunks between video data)
    const ranges = [];
    for (let i = i0; i <= i1; i++) {
      const a = T.offsets[i], b = a + T.sizes[i] - 1;
      const last = ranges[ranges.length - 1];
      if (last && a - last.b <= 16384) { last.b = Math.max(last.b, b); last.i1 = i; } else ranges.push({ a, b, i0: i, i1: i });
    }
    const bufs = new Array(ranges.length);
    let done = 0, next = 0;
    const worker = async () => {
      while (next < ranges.length) {
        const k = next++;
        bufs[k] = await rd.read(ranges[k].a, ranges[k].b);
        done++;
        onProgress && onProgress(done / ranges.length);
      }
    };
    await Promise.all(Array.from({ length: Math.min(6, ranges.length) }, worker));
    // decode
    const startSec = secOf(i0);
    const outRate = T.rate;
    const total = Math.ceil((secOf(i1) - startSec + 0.2) * outRate);
    const mono = new Float32Array(total);
    let err = null;
    const dec = new AudioDecoder({
      output: (ad) => {
        const n = ad.numberOfFrames, ch = ad.numberOfChannels;
        const at = Math.round((ad.timestamp / 1e6 - startSec) * outRate);
        const tmp = new Float32Array(n);
        for (let c = 0; c < ch; c++) {
          ad.copyTo(tmp, { planeIndex: c, format: 'f32-planar' });
          for (let j = 0; j < n; j++) if (at + j >= 0 && at + j < total) mono[at + j] += tmp[j] / ch;
        }
        ad.close();
      },
      error: (e) => { err = e; },
    });
    dec.configure(cfg);
    ranges.forEach((r, k) => {
      for (let i = r.i0; i <= r.i1; i++) {
        const o = T.offsets[i] - r.a;
        dec.decode(new EncodedAudioChunk({ type: 'key', timestamp: Math.round(secOf(i) * 1e6), data: bufs[k].subarray(o, o + T.sizes[i]) }));
      }
    });
    await dec.flush();
    dec.close();
    if (err) throw err;
    // trim to the asked span and resample
    const a = Math.max(0, Math.round((t0 - startSec) * outRate));
    const b = Math.min(total, Math.round((t1 - startSec) * outRate));
    return { samples: DSP.resample(mono.subarray(a, b), outRate, SR), t0: startSec + a / outRate, t1: startSec + b / outRate };
  },
};

/* ---- 30-audio.js ---- */
/* ---------- audio plumbing: context, reading video audio, microphone, recording ---------- */
const AudioEng = {
  ctx: null,
  getCtx() {
    if (!this.ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C({ latencyHint: 'interactive' });
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  /* decode any audio/video bytes to mono 16 kHz */
  async decode(arrayBuffer) {
    const C = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const off = new C(1, SR, SR);
    const ab = await new Promise((res, rej) => {
      const p = off.decodeAudioData(arrayBuffer, res, rej);
      if (p && p.then) p.then(res, rej);
    });
    if (ab.sampleRate === SR && ab.numberOfChannels === 1) return ab.getChannelData(0).slice();
    const ch0 = ab.getChannelData(0);
    let mono = ch0;
    if (ab.numberOfChannels > 1) {
      mono = new Float32Array(ch0.length);
      for (let c = 0; c < ab.numberOfChannels; c++) {
        const d = ab.getChannelData(c);
        for (let i = 0; i < d.length; i++) mono[i] += d[i] / ab.numberOfChannels;
      }
    }
    return DSP.resample(mono, ab.sampleRate, SR);
  },
  async decodeBlob(blob) { return this.decode(await blob.arrayBuffer()); },
};

/* reading a video's soundtrack (needs CORS from the host, a stored copy, or a local file) */
const VideoAudio = {
  cache: new Map(), // videoId -> {status, segments: [{t0, t1, samples}], full, error, progress, mp4Failed, chain}
  state(videoId) { return this.cache.get(videoId) || { status: 'idle' }; },
  entry(videoId) {
    if (!this.cache.has(videoId)) this.cache.set(videoId, { status: 'idle', segments: [], full: null, chain: Promise.resolve() });
    return this.cache.get(videoId);
  },
  /* samples for [t0, t1] if already decoded, else null */
  slice(videoId, t0, t1) {
    const e = this.cache.get(videoId);
    if (!e) return null;
    if (e.full) {
      const a = clamp(Math.floor(t0 * SR), 0, e.full.length), b = clamp(Math.floor(t1 * SR), 0, e.full.length);
      return e.full.subarray(a, b);
    }
    const seg = e.segments.find((g) => g.t0 <= t0 + 0.02 && g.t1 >= t1 - 0.02);
    if (!seg) return null;
    const a = clamp(Math.round((t0 - seg.t0) * SR), 0, seg.samples.length), b = clamp(Math.round((t1 - seg.t0) * SR), 0, seg.samples.length);
    return seg.samples.subarray(a, b);
  },
  /* make sure [t0, t1] is decoded: reads only that stretch of an MP4; falls back to the whole file */
  ensure(video, t0, t1, onProgress) {
    const e = this.entry(video.id);
    t0 = Math.max(0, t0);
    const job = e.chain.then(async () => {
      if (this.slice(video.id, t0, t1)) return e;
      e.status = 'loading'; e.progress = 0;
      Bus.emit('videoaudio', video.id);
      const local = LocalFiles.get(video.id);
      const src = local || videoSrc(video);
      if (!e.mp4Failed) {
        try {
          // a little extra either side, so small edge nudges don't need another fetch
          const want0 = Math.max(0, t0 - 1), want1 = t1 + 1;
          const r = await Mp4Audio.extract(`${video.id}|${local ? local.name : src}`, src, want0, want1, (f) => { e.progress = f; onProgress && onProgress(f); });
          // pad with silence where the file has no audio (before the track starts, past the end), so the span is fully covered
          const pre = Math.max(0, Math.round((r.t0 - want0) * SR)), post = Math.max(0, Math.round((want1 - r.t1) * SR));
          const samples = new Float32Array(pre + r.samples.length + post);
          samples.set(r.samples, pre);
          e.segments.push({ t0: Math.min(want0, r.t0), t1: Math.max(want1, r.t1), samples });
          if (e.segments.length > 24) e.segments.shift();
          e.status = 'ready'; e.error = null; e.method = 'partial';
          Bus.emit('videoaudio', video.id);
          return e;
        } catch (err) {
          e.mp4Failed = err.message || String(err);
          console.info('partial audio read unavailable, decoding the whole file:', e.mp4Failed);
        }
      }
      await this.decodeWhole(video, e, onProgress);
      Bus.emit('videoaudio', video.id);
      return e;
    });
    e.chain = job.catch(() => {});
    return job;
  },
  async decodeWhole(video, entry, onProgress) {
    try {
      let buf;
      const local = LocalFiles.get(video.id);
      if (local) buf = await local.arrayBuffer();
      else {
        const src = videoSrc(video);
        let resp;
        try {
          resp = await fetch(src, src.startsWith('/') ? { credentials: 'same-origin' } : { mode: 'cors', credentials: 'omit' });
        } catch (e) {
          throw Object.assign(new Error('blocked'), { code: 'blocked' });
        }
        if (!resp.ok) throw Object.assign(new Error(`HTTP ${resp.status}`), { code: 'http' });
        const total = +resp.headers.get('content-length') || 0;
        if (resp.body && total) {
          const reader = resp.body.getReader();
          const parts = [];
          let got = 0;
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            parts.push(value); got += value.length;
            entry.progress = got / total;
            onProgress && onProgress(entry.progress);
          }
          const all = new Uint8Array(got);
          let o = 0;
          for (const p of parts) { all.set(p, o); o += p.length; }
          buf = all.buffer;
        } else buf = await resp.arrayBuffer();
      }
      entry.status = 'decoding';
      entry.full = await AudioEng.decode(buf);
      entry.status = 'ready'; entry.error = null; entry.method = 'whole';
    } catch (e) {
      entry.status = 'error';
      entry.error = e.code === 'blocked'
        ? "This video's host doesn't let the app read its sound (no CORS permission, or the page's security rules block it). Playback still works if the video plays. For the waveform and pitch line, load a copy of the video file from this device."
        : e.code === 'http' ? `The video link answered with an error (${e.message}).` : `The sound couldn't be decoded (${e.message || 'unknown error'}).`;
    }
  },
};

/* local copies of video files picked on this device (kept for this visit only) */
const LocalFiles = {
  map: new Map(),
  urls: new Map(),
  set(videoId, file) {
    this.map.set(videoId, file);
    const old = this.urls.get(videoId);
    if (old) URL.revokeObjectURL(old);
    this.urls.set(videoId, URL.createObjectURL(file));
    VideoAudio.cache.delete(videoId);
  },
  get(videoId) { return this.map.get(videoId); },
  url(videoId) { return this.urls.get(videoId); },
};

function videoSrc(v) {
  if (!v) return '';
  return LocalFiles.url(v.id) || (v.r2Key ? '/api/files/' + v.r2Key : v.assetId ? '/_blob/' + v.assetId : v.url);
}

/* ---------- microphone ---------- */
const Mic = {
  stream: null, source: null, gain: null, proc: null, sink: null, dest: null,
  listeners: new Set(),
  error: null,
  level: -100, // last chunk's loudness (dBFS, after gain)
  speech: null, // running estimate of speech loudness, for automatic gain
  async open() {
    if (this.stream && this.stream.active) return true;
    const s = settings();
    const ctx = AudioEng.getCtx();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      this.error = 'This browser view has no microphone access.';
      return false;
    }
    try {
      const audio = { echoCancellation: !!s.echoCancellation, noiseSuppression: !!s.noiseSuppression, autoGainControl: !!s.micAuto, channelCount: 1 };
      try {
        this.stream = await navigator.mediaDevices.getUserMedia({ audio: s.micDeviceId ? { ...audio, deviceId: { exact: s.micDeviceId } } : audio });
      } catch (e) {
        // the chosen mic is unplugged: fall back to the default one
        if (!s.micDeviceId || (e.name !== 'OverconstrainedError' && e.name !== 'NotFoundError')) throw e;
        this.stream = await navigator.mediaDevices.getUserMedia({ audio });
        toast('Your chosen microphone isn’t connected, so the default one is being used.');
      }
    } catch (e) {
      this.error = e && e.name === 'NotAllowedError'
        ? (Caps.inArtifact
          ? 'Microphone access was refused. Inside a Claude artifact the microphone is blocked; use the website version to record, or upload recordings from your phone.'
          : 'Microphone access was refused. Allow the microphone for this site in your browser’s address bar, then try again.')
        : e && e.name === 'NotFoundError' ? 'No microphone was found.' : `The microphone couldn't start (${(e && e.name) || 'error'}).`;
      return false;
    }
    this.error = null;
    // mic → gain (sensitivity) → analysis + recording
    this.source = ctx.createMediaStreamSource(this.stream);
    this.gain = ctx.createGain();
    this.gain.gain.value = s.micAuto ? (this.autoGain || 1) : s.micGain;
    this.dest = ctx.createMediaStreamDestination();
    this.proc = ctx.createScriptProcessor(2048, 1, 1);
    this.sink = ctx.createGain();
    this.sink.gain.value = 0;
    this.source.connect(this.gain);
    this.gain.connect(this.proc);
    this.gain.connect(this.dest);
    this.proc.connect(this.sink);
    this.sink.connect(ctx.destination);
    let carry = new Float32Array(0);
    this.proc.onaudioprocess = (e) => {
      const input = e.inputBuffer.getChannelData(0);
      const t = ctx.currentTime - input.length / ctx.sampleRate; // approx. capture time of first sample
      let sum = 0;
      for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
      this.level = 20 * Math.log10(Math.sqrt(sum / input.length) + 1e-6);
      this.adapt();
      // resample with carry-over so chunks join cleanly
      const joined = new Float32Array(carry.length + input.length);
      joined.set(carry); joined.set(input, carry.length);
      const ratio = ctx.sampleRate / SR;
      const n = Math.floor(joined.length / ratio);
      const out = DSP.resample(joined.subarray(0, Math.floor(n * ratio)), ctx.sampleRate, SR);
      carry = joined.slice(Math.floor(n * ratio));
      for (const fn of this.listeners) fn(out, t);
    };
    return true;
  },
  /* automatic sensitivity: nudge the gain so speech sits around -20 dBFS */
  adapt() {
    if (!this.gain || !settings().micAuto) return;
    const lvl = this.level;
    const g = this.gain.gain.value;
    const raw = lvl - 20 * Math.log10(g); // level before our gain
    // background noise: follows quiet chunks fast, loud ones very slowly
    this.noise = this.noise == null ? raw : raw < this.noise ? this.noise * 0.7 + raw * 0.3 : this.noise * 0.998 + raw * 0.002;
    if (lvl < -65 || raw < this.noise + 12) return; // only speech, well above the room's noise, sets the volume
    // follow loud stretches quickly, quiet ones slowly, so only speech sets the level
    this.speech = this.speech == null ? raw : raw > this.speech ? this.speech * 0.7 + raw * 0.3 : this.speech * 0.995 + raw * 0.005;
    const want = clamp(10 ** ((-20 - this.speech) / 20), 1, 30);
    const next = g + (want - g) * 0.08;
    this.gain.gain.value = next;
    this.autoGain = next;
  },
  async reopen() {
    const listeners = this.listeners;
    const wasOpen = !!this.stream;
    this.close();
    this.listeners = listeners;
    if (wasOpen) await this.open();
  },
  async devices() {
    try { return (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput'); } catch { return []; }
  },
  setGain(x) {
    if (this.gain) this.gain.gain.value = x;
  },
  /* stream for MediaRecorder: the boosted signal when available */
  recordStream() { return this.dest ? this.dest.stream : this.stream; },
  close() {
    try { [this.proc, this.source, this.gain, this.sink].forEach((n) => n && n.disconnect()); } catch { /* already closed */ }
    if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
    this.stream = this.source = this.gain = this.proc = this.sink = this.dest = null;
    this.level = -100;
    this.noise = null;
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
};

/* a small mic control: live level meter, automatic volume on/off, manual boost */
function micControl() {
  const s = settings();
  const fill = h('i', { style: { width: '0%' } });
  const meter = h('div', { class: 'bar mic-meter', title: 'Microphone level' }, fill);
  const val = h('span', { class: 'small muted num' });
  const slider = h('input', { type: 'range', id: 'micGain', min: 0.5, max: 12, step: 0.5, value: s.micGain, 'aria-label': 'Microphone boost', disabled: s.micAuto,
    oninput: (e) => { const x = +e.target.value; saveSettings({ micGain: x }); Mic.setGain(x); val.textContent = `${x}x`; } });
  val.textContent = s.micAuto ? 'auto' : `${s.micGain}x`;
  const auto = h('label', { class: 'check', for: 'micAuto' }, h('input', { type: 'checkbox', id: 'micAuto', checked: s.micAuto, onchange: (e) => {
    saveSettings({ micAuto: e.target.checked });
    slider.disabled = e.target.checked;
    val.textContent = e.target.checked ? 'auto' : `${settings().micGain}x`;
    if (!e.target.checked) Mic.setGain(settings().micGain);
    if (Mic.stream) toast('Re-open the microphone (next pass) for the browser part of automatic volume to change.');
  } }), 'Automatic volume');
  const pick = h('select', { id: 'micDevice', 'aria-label': 'Microphone', class: 'mic-select', onchange: async (e) => {
    saveSettings({ micDeviceId: e.target.value || null });
    if (Mic.stream) {
      if (Session.rec) { toast('The new microphone is used from the next pass.'); return; }
      await Mic.reopen();
    }
  } }, h('option', { value: '' }, 'Default microphone'));
  const fillDevices = async () => {
    const list = await Mic.devices();
    const cur = settings().micDeviceId || '';
    mount(pick, h('option', { value: '' }, 'Default microphone'),
      list.filter((d) => d.deviceId && d.deviceId !== 'default').map((d, i) => h('option', { value: d.deviceId, selected: d.deviceId === cur }, d.label || `Microphone ${i + 1}`)));
  };
  fillDevices();
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', () => { if (pick.isConnected) fillDevices(); });
  pick.addEventListener('focus', fillDevices); // names appear once the browser has mic permission
  const el = h('div', { class: 'mic-control' }, icon('mic'), pick, meter, auto, slider, val);
  const tick = () => {
    if (!el.isConnected) return;
    const pct = clamp((Mic.level + 60) / 60, 0, 1) * 100;
    fill.style.width = pct + '%';
    fill.style.background = Mic.level > -3 ? 'var(--red)' : Mic.level > -35 ? 'var(--green)' : 'var(--wattle)';
    if (settings().micAuto && Mic.gain) val.textContent = `auto ${Mic.gain.gain.value.toFixed(1)}x`;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return el;
}

/* a recording: compressed file (for keeping) + 16 kHz samples (for analysis) */
function pickMime() {
  const opts = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  for (const m of opts) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
class Recording {
  constructor() { this.chunks = []; this.pcm = []; this.startCtx = null; this.len = 0; }
  start() {
    const mime = pickMime();
    this.rec = new MediaRecorder(Mic.recordStream(), mime ? { mimeType: mime } : undefined);
    this.rec.ondataavailable = (e) => e.data && e.data.size && this.chunks.push(e.data);
    this.off = Mic.on((samples, t) => {
      if (this.startCtx == null) this.startCtx = t;
      this.pcm.push(samples); this.len += samples.length;
    });
    this.rec.start(250);
    this.startedAt = performance.now();
  }
  stop() {
    return new Promise((res) => {
      this.off && this.off();
      const finish = () => {
        const all = new Float32Array(this.len);
        let o = 0;
        for (const p of this.pcm) { all.set(p, o); o += p.length; }
        res({ blob: new Blob(this.chunks, { type: this.rec.mimeType || 'audio/webm' }), samples: all, startCtx: this.startCtx });
      };
      if (this.rec.state === 'inactive') finish();
      else { this.rec.onstop = finish; this.rec.stop(); }
    });
  }
  /* live: samples captured since an index */
  liveSamples() {
    const all = new Float32Array(this.len);
    let o = 0;
    for (const p of this.pcm) { all.set(p, o); o += p.length; }
    return all;
  }
}

/* play a recording / blob URL, returns the element */
const Player2 = {
  el: null,
  async play(ref, { onend } = {}) {
    this.stop();
    const url = typeof ref === 'string' && !ref.includes(':') ? ref : await Store.blobUrl(ref);
    if (!url) { toast("That recording couldn't be found.", 'bad'); return null; }
    const a = new window.Audio(url);
    this.el = a;
    a.onended = () => { onend && onend(); };
    a.play().catch(() => toast("The recording couldn't play in this browser.", 'bad'));
    return a;
  },
  stop() { if (this.el) { this.el.pause(); this.el = null; } },
};

/* tiny event bus */
const Bus = {
  map: new Map(),
  on(ev, fn) { if (!this.map.has(ev)) this.map.set(ev, new Set()); this.map.get(ev).add(fn); },
  emit(ev, ...args) { (this.map.get(ev) || []).forEach((fn) => fn(...args)); },
};
