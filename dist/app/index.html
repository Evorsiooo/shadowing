function checkinRecordControls(week, task, redraw) {
  const wrap = h('div', { class: 'row' });
  const status = h('span', { class: 'small muted' });
  let rec = null, timer = null, t0 = 0;
  const cur = checkinFor(week);
  const has = cur && cur.recs && cur.recs[task.key] && cur.recs[task.key].length;
  const stop = async () => {
    clearInterval(timer);
    if (!rec) return;
    const res = await rec.stop();
    rec = null;
    Mic.close();
    await saveCheckinTake(week, task.key, res.blob, res.samples);
    toast('Saved.', 'good');
    redraw();
  };
  const start = async () => {
    if (task.key === 'answer') {
      const c = ensureCheckin(week);
      if (!c.questions || c.questions.length <= (c.recs.answer || []).length) {
        const q = pickQuestion();
        Store.patch('checkins', c.id, { questions: [...(c.questions || []), q] });
        const qEl = $(`#ciQ-${week}`);
        if (qEl) { qEl.hidden = false; qEl.lastChild.textContent = q; }
        toast('Question revealed. Start answering now.');
      }
    }
    AudioEng.getCtx();
    if (!(await Mic.open())) { mount(status, h('span', { class: 'formerr' }, Mic.error)); return; }
    rec = new Recording();
    rec.start();
    t0 = performance.now();
    mount(wrap, btn('Stop and save', stop, { kind: 'danger', icon: 'stop' }), status);
    timer = setInterval(() => {
      const s = (performance.now() - t0) / 1000;
      // the target is soft: going over is fine, so finish the sentence; a hard stop only at 3x the target
      if (!task.secs) status.textContent = `${fmtTime(s)} recording`;
      else if (s < task.secs) status.textContent = `${Math.ceil(task.secs - s)} s left`;
      else { status.textContent = `Time’s up: finish your sentence, then stop (+${fmtTime(s - task.secs)})`; status.style.color = 'var(--ochre)'; status.style.fontWeight = '800'; }
      if (task.secs && s >= task.secs * 3) stop();
    }, 250);
  };
  wrap.append(
    btn(has ? 'Record another take' : task.key === 'answer' ? 'Reveal question and record' : 'Record', start, { kind: has ? '' : 'primary', icon: 'mic', size: 'sm' }),
    filePickButton('Upload a file', 'audio/*,video/*', async (f) => { try { const samples = await AudioEng.decodeBlob(f); await saveCheckinTake(week, task.key, f, samples); toast('Saved.', 'good'); redraw(); } catch (e) { toast(`That file couldn’t be read (${e.message || 'error'}).`, 'bad'); } }, { size: 'sm', kind: 'ghost', icon: 'upload' }),
    status);

}

async function deleteCheckinTake(week, key, recId) {
  const c = checkinFor(week);
  if (!c) return;
  const list = c.recs[key] || [];
  const idx = list.indexOf(recId);
  if (idx < 0) return;
  const rec = Store.get('recordings', recId);
  const recs = { ...c.recs, [key]: list.filter((x) => x !== recId) };
  const fields = { recs };
  // each answer take has its own question; drop it too (it stays marked as seen)
  if (key === 'answer' && c.questions) fields.questions = c.questions.filter((_, i) => i !== idx);
  // measures follow the latest remaining take
  const measures = { ...(c.measures || {}) };
  const last = Store.get('recordings', recs[key].slice(-1)[0]);
  if (last && last.measures) measures[key] = last.measures; else delete measures[key];
  fields.measures = measures;
  Store.patch('checkins', c.id, fields);
  if (rec) {
    await Store.deleteBlob(rec.ref);
    delete Store.data.recordings[recId];
    Store.schedule('recordings', recId, 0);
  }
  toast('Take deleted.');
}

function pickQuestion() {
  const meta = appMeta();
  const used = new Set(meta.usedQuestions || []);
  const all = langContent().questions;
  const fresh = all.filter((q) => !used.has(q));
  const q = (fresh.length ? fresh : all)[Math.floor(Math.random() * (fresh.length || all.length))];
  Store.patch('meta', 'app', { usedQuestions: [...used, q] });
  return q;
}

async function saveCheckinTake(week, key, blob, samples) {
  const c = ensureCheckin(week);
  let ref;
  try { ref = await Store.putBlob(blob, 'checkin'); } catch (e) { toast(`The recording couldn’t be stored (${e.message || e.code || 'error'}).`, 'bad', 6000); return; }
  let measures = null, analysis = null;
  if (samples && samples.length > SR) {
    const m = DSP.modelFromSamples(samples, settings().pitchSmoothing);
    measures = m.measures;
    analysis = { onset: m.onset };
  }
  const r = Store.put('recordings', { kind: 'checkin', week, task: key, ref, mime: blob.type, created: new Date().toISOString(), measures, analysis, durationSec: samples ? round(samples.length / SR, 1) : null });
  const recs = { ...c.recs, [key]: [...(c.recs[key] || []), r.id] };
  const lagWin = sessionsLagBefore(c.date || dayKey());
  const allMeasures = { ...(c.measures || {}) };
  if (measures) allMeasures[key] = measures;
  allMeasures.lag = lagWin;
  Store.patch('checkins', c.id, { recs, measures: allMeasures, date: c.date || dayKey() });
  if (week === 0 && !settings().programmeStart) saveSettings({ programmeStart: c.date || dayKey() });
  if (checkinHasAll(checkinFor(week))) { celebrate(1); toast(`Week ${week} check-in complete!`, 'good'); }
}
function sessionsLagBefore(date) {
  const from = addDays(date, -28);
  const lags = [];
  for (const s of Store.all('sessions')) if (s.date >= from && s.date <= date) for (const p of s.passes || []) if (p.lag != null) lags.push(p.lag);
  return lags.length ? round(mean(lags), 2) : null;
}

function modelReference() {

}

/* ---------- blind listener pack ---------- */
async function exportListenerPack() {
  toast('Building the pack… this can take a little while.');
  const items = [];
  for (const w of CHECKIN_WEEKS) {
    const c = checkinFor(w);
    if (!c) continue;
    const id = (c.recs.answer || []).slice(-1)[0] || (c.recs.retell || []).slice(-1)[0];
    const r = Store.get('recordings', id);
    if (!r) continue;
    const blob = await Store.getBlob(r.ref);
    if (!blob) continue;
    try {
      const x = await AudioEng.decodeBlob(blob);
      items.push({ kind: 'checkin', week: w, samples: excerpt(x, 20) });
    } catch { /* skip undecodable */ }
  }
  // one or two clips of real speakers of the target accent, from your library
  const clips = shuffle(Store.all('clips').filter((c) => !c.archived && !c.noisy));
  for (const c of clips) {
    if (items.filter((i) => i.kind === 'model').length >= 2) break;
    const v = Store.get('videos', c.videoId);
    const st = await VideoAudio.ensure(v, c.start, Math.min(c.end, c.start + 20));
    if (!st || st.status !== 'ready') continue;
    items.push({ kind: 'model', clipId: c.id, samples: VideoAudio.slice(v.id, c.start, Math.min(c.end, c.start + 20)) });
  }
  if (items.filter((i) => i.kind === 'checkin').length < 1) { toast('Record at least one check-in first.', 'bad'); return; }
  const mixed = shuffle(items);
  const letters = 'ABCDEFGHIJ';
  const enc = new TextEncoder();
  const files = mixed.map((it, i) => ({ name: `Sample ${letters[i]}.wav`, data: DSP.wav(it.samples) }));
  const sheet = ['Listener name,Sample,Rating (1 = no foreign accent; 9 = very strong accent),What gave it away?']
    .concat(mixed.map((_, i) => `,${letters[i]},,`)).join('\n');
  files.push({ name: 'rating-sheet.csv', data: enc.encode(sheet) });
  files.push({ name: 'instructions.txt', data: enc.encode(`Thanks for helping!\n\nListen to each sample once or twice, in any order. For each one, rate how strong a foreign (non-${targetAccent().short}) accent you hear:\n1 = no foreign accent at all, 9 = very strong foreign accent.\nThen write a few words on what gave it away (a sound, the rhythm, the melody...).\nFill in rating-sheet.csv and send it back.\n`) });
  const zip = makeZip(files);
  const pack = Store.put('meta', { id: `pack-${uid()}`, kind: 'listenerPack', created: new Date().toISOString(), items: mixed.map((it, i) => ({ label: letters[i], kind: it.kind, week: it.week, clipId: it.clipId })), ratings: [] });
  const name = `listener-pack-${dayKey()}.zip`;
  if (Caps.downloads) {
    try { await Caps.downloads.save({ filename: name, data: zip }); toast('Pack saved.', 'good'); } catch (e) { if (e.code !== 'declined') toast(`Couldn’t save the file (${e.code}).`, 'bad'); }
  } else {
    const a = h('a', { href: URL.createObjectURL(zip), download: name });
    document.body.appendChild(a); a.click(); a.remove();
  }
  toast(`Pack ${fmtDay(dayKey())} keeps the answer key here, so the listeners can't see which is which.`);
  return pack;
}
function excerpt(x, secs) {
  const a = DSP.analyse(x.length > SR * 90 ? x.subarray(0, SR * 90) : x);
  const on = DSP.onset(a.db) * HOP;
  return x.subarray(on, Math.min(x.length, on + secs * SR));
}
function listenerPacks() { return Store.all('meta').filter((m) => m.kind === 'listenerPack').sort((a, b) => (a.created < b.created ? 1 : -1)); }

function openRatings() {
  const packs = listenerPacks();
  if (!packs.length) { toast('Export a listener pack first.'); return; }
  const pack = packs[0];
  const F = { listener: '', vals: {} };
  const form = h('form', { class: 'stack', onsubmit: (e) => {
    e.preventDefault();
    const rows = pack.items.map((it) => ({ label: it.label, rating: +F.vals[it.label]?.rating || null, comment: F.vals[it.label]?.comment || '' })).filter((r) => r.rating >= 1 && r.rating <= 9);
    if (!rows.length) { toast('Enter at least one rating from 1 to 9.'); return; }
    Store.patch('meta', pack.id, { ratings: [...(pack.ratings || []), { listener: F.listener.trim() || 'Listener', rows, at: dayKey() }] });
    toast('Ratings saved.', 'good');
    openProgress('measures');
  } },
  h('label', { class: 'field', for: 'rListener' }, 'Listener name', h('input', { type: 'text', id: 'rListener', oninput: (e) => { F.listener = e.target.value; } })),
  h('div', { class: 'table-wrap' }, h('table', null, h('thead', null, h('tr', null, h('th', null, 'Sample'), h('th', null, 'Rating 1–9'), h('th', null, 'What gave it away?'))),
    h('tbody', null, pack.items.map((it) => h('tr', null, h('td', null, it.label),
      h('td', null, h('input', { type: 'number', min: 1, max: 9, id: `r-${it.label}`, style: { width: '80px' }, oninput: (e) => { (F.vals[it.label] ||= {}).rating = e.target.value; } })),
      h('td', null, h('input', { type: 'text', id: `c-${it.label}`, oninput: (e) => { (F.vals[it.label] ||= {}).comment = e.target.value; } }))))))),
  h('div', { class: 'row' }, h('button', { type: 'submit', class: 'btn primary' }, h('span', null, 'Save ratings'))));
  openModal([modalHead('Enter listener ratings', `Pack from ${fmtDay(dayKey(new Date(pack.created)))} · ${(pack.ratings || []).length} listener(s) so far`), form]);
}
function ratingAverages() {
  const out = new Map();
  for (const p of listenerPacks()) {
    for (const r of p.ratings || []) for (const row of r.rows) {
      const it = p.items.find((i) => i.label === row.label);
      if (!it) continue;
      const label = it.kind === 'model' ? `${targetAccent().short} speaker (reference)` : it.week === 0 ? 'Baseline' : `Week ${it.week}`;
      if (!out.has(label)) out.set(label, []);
      out.get(label).push(row.rating);
    }
  }
  return [...out.entries()].map(([label, arr]) => ({ label, avg: mean(arr), n: arr.length }));
}

/* ---- 86-push.js ---- */
/* ---------- push notifications: practice reminders on this device ---------- */
/* The service worker (/sw.js, built from src/site/sw.js) shows the notifications. Each device that
   turns them on gets its own push subscription, which the server keeps with the user's reminder
   channels (server/reminders.js). On iPhone and iPad, Safari only offers push to a site that has
   been added to the Home Screen and opened from there. */
const Push = {
  reg: null,
  supported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  ios() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  installed() { return navigator.standalone === true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches); },
  permission() { return 'Notification' in window ? Notification.permission : 'unsupported'; },
  async register() {
    if (!('serviceWorker' in navigator)) return null;
    try { this.reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' }); } catch (e) { console.warn('service worker not registered', e); }
    return this.reg;
  },
  async registration() {
    if (!('serviceWorker' in navigator)) return null;
    return this.reg || (await navigator.serviceWorker.getRegistration('/').catch(() => null)) || this.register();
  },
  /** This device's subscription, or null. */
  async current() {
    if (!this.supported()) return null;
    const reg = await this.registration();
    return reg ? reg.pushManager.getSubscription().catch(() => null) : null;
  },
  /** Ask for permission (must run straight from a tap), subscribe, and hand the subscription to the server. */
  async enable(publicKey) {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      throw new Error(perm === 'denied'
        ? 'Notifications are blocked for this site. Allow them in your browser’s site settings (or the system notification settings), then try again.'
        : 'Notifications weren’t allowed.');
    }
    if (!(await this.registration())) throw new Error('This browser couldn’t start the notification service.');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    // a subscription made for a different server key can't receive our messages
    if (sub && sub.options && sub.options.applicationServerKey && b64url(sub.options.applicationServerKey) !== publicKey) { await sub.unsubscribe(); sub = null; }
    if (!sub) {
      try {
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: fromB64url(publicKey) });
      } catch (e) {
        // "Registration failed - push service error": the browser couldn't reach its own push service
        if (e && (e.name === 'AbortError' || /push service/i.test(e.message || ''))) {
          throw new Error(/Brave/.test(navigator.userAgent) || navigator.brave
            ? 'Brave has push turned off. Turn on “Use Google services for push messaging” in brave://settings/privacy, restart Brave, and try again.'
            : 'This browser couldn’t reach its notification service. A VPN, firewall or ad blocker may be blocking it, or this browser may not support push. Try again without them, or in Chrome, Edge, Firefox or Safari.');
        }
        throw e;
      }
    }
    await Api.req('POST', '/api/reminders/push', { subscription: sub.toJSON(), label: deviceLabel() });
    return sub;
  },
  /** Stop notifications on this device (server first, so a failed unsubscribe still stops them). */
  async disable() {
    const sub = await this.current();
    if (!sub) return;
    await Api.req('DELETE', '/api/reminders/push', { endpoint: sub.endpoint }).catch(() => {});
    await sub.unsubscribe().catch(() => {});
  },
};

function b64url(buf) {
  let s = '';
  for (const b of new Uint8Array(buf)) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromB64url(str) {
  const s = atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}
function deviceLabel() {
  const ua = navigator.userAgent;
  const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' : /Android/.test(ua) ? 'Android'
    : /Mac OS X/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /CrOS/.test(ua) ? 'Chromebook' : /Linux/.test(ua) ? 'Linux' : 'Device';
  const br = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  return br ? `${os} · ${br}` : os;
}

/* The "Notifications" card in Settings → Reminders. `status.push` comes from GET /api/reminders. */
function pushCard(status, { onChange }) {
  const card = h('div', { class: 'card stack' }, h('h3', null, 'Notifications on this device'));
  card.add = (...nodes) => card.append(...nodes.filter(Boolean));
  const push = status && status.push;
  const others = push ? push.devices - (push.thisDevice ? 1 : 0) : 0;
  const more = others > 0 ? h('p', { class: 'small muted' }, `Also on ${others} other device${others === 1 ? '' : 's'}.`) : null;
  if (!status) { card.add(h('p', { class: 'small muted' }, 'Checking…')); return card; }
  if (!push || !push.available) { card.add(h('p', { class: 'muted' }, 'Notifications aren’t available yet. Discord reminders work in the meantime.')); return card; }
  if (!Push.supported()) {
    card.add(Push.ios() && !Push.installed()
      ? h('p', { class: 'muted' }, 'On iPhone and iPad, notifications need the app on your Home Screen: tap the Share button, choose “Add to Home Screen”, open Euno from there, and come back here.')
      : h('p', { class: 'muted' }, 'This browser can’t show notifications from websites. Try Chrome, Edge, Firefox or Safari.'), more);
    return card;
  }
  if (push.thisDevice && Push.permission() === 'granted') {
    card.add(
      h('div', { class: 'row' },
        h('span', { class: 'chip' }, icon('check'), 'On for this device'),
        btn('Turn off here', async () => {
          await Push.disable(); toast('Notifications are off on this device.'); onChange();
        }, { size: 'sm', kind: 'ghost' })),
      more);
    return card;
  }
  const blocked = Push.permission() === 'denied';
  card.add(
    h('p', { class: 'muted' }, 'Get reminders as a notification on this phone or computer. Turn them on on each device you want them on.'),
    blocked ? h('p', { class: 'small muted' }, 'Notifications are blocked for this site. Allow them in your browser’s site settings, then turn them on here.') : null,
    h('div', { class: 'row' },
      btn('Turn on notifications', async () => {
        try {
          await Push.enable(push.publicKey);
          if (!reminderSettings().enabled) saveReminders({ enabled: true });
          toast('Notifications are on for this device.', 'good');
          onChange();
        } catch (e) { toast(e.message, 'bad', 8000); }
      }, { kind: 'primary', size: 'sm', icon: 'bell' })),
    more);
  return card;
}

/* ---- 87-ai.js ---- */
/* ---------- AI feedback with your own key (Settings → AI, and the onboarding 'ai' step) ---------- */
/* The key goes to the server once and is stored encrypted; the app only ever sees its last 4
   characters. Without a key, notes fall back to "Copy prompt for AI". */
function aiPanel({ onboarding = false } = {}) {
  const wrap = h('div', { class: 'stack' });
  if (Store.mode !== 'cloud') {
    mount(wrap, h('p', { class: 'muted' }, 'Using your own AI key needs the online version of the app. Notes still offer a prompt you can copy into any AI chat.'));
    return wrap;
  }
  let st = null; // GET /api/ai: {available, providers, configured, provider, providerName, model, hint}
  let list = null; // {models, cheap} | {error}
  let replacing = false;
  let provider = 'anthropic';
  let filter = '';
  let testMsg = null;
  const keep = (s) => {
    st = { ...st, ...s };
    Api.ai = st.configured ? { provider: st.provider, providerName: st.providerName, model: st.model } : null;
  };
  const loadModels = async () => {
    list = null; draw();
    try { const r = await Api.req('GET', '/api/ai/models'); list = { models: r.models, cheap: r.cheap }; } catch (e) { list = { error: e.message }; }
    draw();
  };

  const keyForm = () => {
    const P = st.providers.find((p) => p.id === provider) || st.providers[0];
    const input = h('input', { type: 'password', id: 'ai-key', placeholder: P.keyHint, autocomplete: 'off', spellcheck: 'false' });
    const save = btn('Save key', async () => {
      if (!input.value.trim()) { toast('Paste your API key first.', 'bad'); return; }
      save.disabled = true;
      try {
        const r = await Api.req('PUT', '/api/ai', { provider, key: input.value.trim() });
        keep(r); replacing = false; testMsg = null;
        list = { models: r.models, cheap: r.model };
        draw(); toast(`Key saved. Using ${r.model}.`, 'good');
      } catch (e) { toast(e.message, 'bad', 7000); save.disabled = false; }
    }, { kind: 'primary', size: 'sm' });
    return h('div', { class: 'stack' },
      h('div', { class: 'seg', role: 'group', 'aria-label': 'AI provider' }, st.providers.map((p) =>
        h('button', { type: 'button', class: p.id === provider ? 'on' : '', 'aria-pressed': String(p.id === provider), onclick: () => { provider = p.id; draw(); } }, p.name))),
      h('label', { class: 'field', for: 'ai-key' }, `${P.name} API key`, input),
      h('p', { class: 'small muted' }, 'Get one at ', h('a', { href: P.keyUrl, target: '_blank', rel: 'noopener noreferrer' }, P.keyUrl.replace(/^https:\/\//, '')),
        '. It’s stored encrypted on our server, only used for your feedback, and never shown again. You pay your provider directly; one answer on the default model costs a tiny fraction of a cent.'),
      h('div', { class: 'row' }, save, replacing ? btn('Cancel', () => { replacing = false; draw(); }, { size: 'sm', kind: 'ghost' }) : null));
  };

  const modelPicker = () => {
    if (!list) return h('p', { class: 'small muted' }, 'Loading models…');
    if (list.error) return h('p', { class: 'small' }, h('span', { class: 'formerr' }, list.error), ' ', btn('Try again', loadModels, { size: 'sm', kind: 'ghost' }));
    let models = list.models;
    if (!models.some((m) => m.id === st.model)) models = [{ id: st.model, name: st.model }, ...models];
    const many = models.length > 30;
    const q = filter.trim().toLowerCase();
    const shown = q ? models.filter((m) => m.id === st.model || `${m.id} ${m.name}`.toLowerCase().includes(q)) : models;
    const label = (m) => `${m.name}${m.name !== m.id ? ` (${m.id})` : ''}${m.id === list.cheap ? ' · cheap and fast' : ''}${m.note ? ` · ${m.note}` : ''}`;
    return h('div', { class: 'stack' },
      many ? h('label', { class: 'field', for: 'ai-filter' }, 'Find a model',
        h('input', { type: 'search', id: 'ai-filter', value: filter, placeholder: 'e.g. haiku, mini, flash', oninput: (e) => { filter = e.target.value; const pos = e.target.selectionStart; draw(); const f = $('#ai-filter'); if (f) { f.focus(); f.setSelectionRange(pos, pos); } } })) : null,
      h('label', { class: 'field', for: 'ai-model' }, 'Model',
        h('select', { id: 'ai-model', onchange: async (e) => {
          try { keep(await Api.req('PUT', '/api/ai', { model: e.target.value })); testMsg = null; draw(); toast(`Now using ${st.model}.`, 'good'); } catch (err) { toast(err.message, 'bad'); }
        } }, shown.map((m) => h('option', { value: m.id, selected: m.id === st.model }, label(m))))),
      list.cheap && st.model !== list.cheap ? h('p', { class: 'small muted' }, 'Short feedback like this doesn’t need a big model. ',
        btn(`Use ${list.cheap}`, async () => { try { keep(await Api.req('PUT', '/api/ai', { model: list.cheap })); draw(); } catch (err) { toast(err.message, 'bad'); } }, { size: 'sm', kind: 'ghost' })) : null);
  };

  const draw = () => {
    if (!st) { mount(wrap, h('p', { class: 'small muted' }, 'Checking…')); return; }
    if (!st.available) { mount(wrap, h('p', { class: 'muted' }, 'AI keys aren’t switched on for this site yet. Notes still offer a prompt you can copy into any AI chat.')); return; }
    const intro = onboarding ? null : h('p', { class: 'muted' }, 'Get feedback on your notes right inside the app, using your own key from Anthropic, OpenAI or OpenRouter. This is optional: without a key, notes give you a prompt to copy into any AI chat.');
    if (!st.configured || replacing) { mount(wrap, intro, keyForm()); return; }
    const test = btn('Test key', async () => {
      test.disabled = true; testMsg = h('span', { class: 'muted' }, 'Asking…'); draw();
      try {
        const r = await Api.req('POST', '/api/ai/test', { profile: profileForAI() });
        testMsg = r.ok ? h('span', { class: 'formok' }, `It works: ${r.model} answered in ${(r.ms / 1000).toFixed(1)} s.`) : h('span', { class: 'formerr' }, 'The model answered, but not in the expected format. Try another model.');
      } catch (e) { testMsg = h('span', { class: 'formerr' }, e.message); }
      draw();
    }, { size: 'sm' });
    mount(wrap, intro,
      h('div', { class: 'row' },
        h('span', { class: 'chip' }, icon('check'), `${st.providerName} key saved (${st.hint})`),
        btn('Replace key', () => { replacing = true; provider = st.provider; draw(); }, { size: 'sm' }),
        btn('Remove key', async () => {
          try { await Api.req('DELETE', '/api/ai'); keep({ configured: false }); list = null; testMsg = null; draw(); toast('Key removed. Notes will offer “Copy prompt for AI”.'); } catch (e) { toast(e.message, 'bad'); }
        }, { size: 'sm', kind: 'ghost' })),
      modelPicker(),
      h('div', { class: 'row' }, test, testMsg ? h('span', { class: 'small', role: 'status' }, testMsg) : null));
  };

  draw();
  Api.req('GET', '/api/ai').then((r) => { keep(r); draw(); if (r.configured) loadModels(); })
    .catch((e) => mount(wrap, h('p', { class: 'formerr' }, e.message)));
  return wrap;
}

async function checkStorage() {
  if (Store.mode === 'cloud') {
    await Api.req('PUT', '/api/docs/meta/probe', { at: new Date().toISOString() });
    await Api.req('DELETE', '/api/docs/meta/probe');
    return { state: 'ok', msg: `Your account’s database saves and reads back${Api.email ? ` (signed in as ${Api.email})` : ''}. Your data follows you to any device.` };
  }
  if (Store.mode === 'artifact') {
    const ref = Caps.db.collection('meta').doc('probe');
    await ref.set({ at: new Date().toISOString() });
    const snap = await ref.get();
    await ref.delete();
    return snap.exists ? { state: 'ok', msg: 'The artifact’s database saves and reads back. Your data follows you to any device.' } : { state: 'fail', msg: 'A test write didn’t read back.' };
  }
  if (Store.mode === 'local') return { state: 'warn', msg: 'Saving works, but only in this browser on this device. Use Settings → Data → Export backup to move it.' };
  return { state: 'fail', msg: 'Storage is blocked here; nothing is kept.' };
}
async function checkFiles() {
  if (Store.blobMode === 'device') {
    // straight to device storage, so the test file never syncs anywhere
    const id = `probe-${uid()}`;
    await DeviceFiles.put(id, new Blob([new Uint8Array(4096)], { type: 'audio/webm' }));
    const back = await DeviceFiles.get(id);
    await DeviceFiles.del(id);
    if (!back || back.size !== 4096) return { state: 'fail', msg: 'A test file didn’t read back from this device’s storage.' };
    const q = await DeviceFiles.estimate();
    const free = q ? ` About ${((q.quota - q.usage) / 1073741824).toFixed(1)} GB free for this browser.` : '';
    return Drive.connected()
      ? { state: 'ok', msg: `Recordings and videos go into your Google Drive, with a copy in this browser for quick playback.${free}` }
      : { state: 'warn', msg: `Recordings and videos are only in this browser. Connect Google Drive in Settings → Storage to keep them safe and on your other devices.${free}` };
  }
  if (Store.blobMode === 'assets') {
    const blob = new Blob([new Uint8Array(2048)], { type: 'video/webm' });
    const r = await Caps.assets.upload(blob, { type: 'video/webm' });
    const list = await Caps.assets.list();
    await Caps.assets.delete(r.id);
    const u = list.usage;
    const mins = Math.floor((u.maxBytes - u.bytes) / (16000 * 60));
    return { state: 'ok', msg: `File storage works. ${(u.bytes / 1048576).toFixed(1)} of ${(u.maxBytes / 1048576).toFixed(0)} MB used, ${u.files}/${u.maxFiles} files; 20 MB per recording maximum (about ${mins} more minutes of recordings at typical quality).` };
  }
  return { state: 'fail', msg: 'Recordings can’t be kept here.' };
}
async function checkMic() {
  AudioEng.getCtx();
  const ok = await Mic.open();
  if (!ok) return { state: 'fail', msg: Mic.error };
  let peak = -100;
  const off = Mic.on((x) => { for (let i = 0; i < x.length; i += 40) peak = Math.max(peak, 20 * Math.log10(Math.abs(x[i]) + 1e-6)); });
  await sleep(1500);
  off();
  if (!Session.active) Mic.close();
  return peak > -70 ? { state: 'ok', msg: `The microphone works (peak level ${peak.toFixed(0)} dB in 1.5 s).` } : { state: 'warn', msg: 'The microphone opened but heard silence. Check the input device.' };
}
async function checkVideoPlays() {
  const v = Player.current();
  if (!v) return { state: '', msg: 'Open a video first.' };
  if (LocalFiles.get(v.id)) return { state: 'warn', msg: 'Playing from a file on this device, so the link wasn’t tested.' };
  const r = await checkPlayable(videoSrc(v));
  return r.ok ? { state: 'ok', msg: `“${v.title}” plays from its ${v.fileRef || v.assetId ? 'stored copy' : 'link'} (${fmtTime(r.duration)} long).` } : { state: 'fail', msg: r.reason };
}
async function checkVideoSound() {
  const v = Player.current();
  if (!v) return { state: '', msg: 'Open a video first.' };
  VideoAudio.cache.delete(v.id);
  const t0 = performance.now();
  const r = await VideoAudio.ensure(v, 0, 10);
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  if (r.status === 'ready') return { state: 'ok', msg: r.method === 'partial'
    ? `The app reads just the part of “${v.title}” it needs (10 s of sound in ${secs} s, decoded with ${r.via}). Pitch and waveform will work.`
    : `The app can read the sound of “${v.title}”, but has to download the whole file each visit (${secs} s here)${r.mp4Failed ? `: ${r.mp4Failed}` : ''}.` };
  return { state: 'fail', msg: r.error };
}
async function checkClaude() {
  if (Store.mode === 'cloud') {
    if (!Api.ai) return { state: 'warn', msg: 'No AI key saved, so notes offer “Copy prompt for AI”. Add a key in Settings → AI to get answers in the app.' };
    const r = await Api.req('POST', '/api/ai/test', { profile: profileForAI() });
    return r.ok ? { state: 'ok', msg: `${Api.ai.providerName} answered with ${r.model} in ${(r.ms / 1000).toFixed(1)} s.` } : { state: 'warn', msg: 'The model answered in an unexpected format. Try another model in Settings → AI.' };
  }
  if (!Caps.sample) return { state: 'fail', msg: Caps.inArtifact ? 'Claude access isn’t available in this view.' : 'This standalone version can’t reach Claude. Notes offer “Copy prompt for Claude” instead.' };
  const r = await Caps.sample('Reply with just the word OK.', { modelTier: 'quick', cache: false });
  return /ok/i.test(r.text) ? { state: 'ok', msg: 'Claude answered. Feedback on notes will use your Claude plan.' } : { state: 'warn', msg: `Claude answered unexpectedly: “${r.text.slice(0, 60)}”` };
}
async function checkPitch() {
  const clips = Store.all('clips').filter((c) => c.model);
  if (!clips.length) return { state: '', msg: 'Save a clip whose sound can be read first.' };
  const rel = clips.map((c) => c.model.reliability || 0);
  const avg = mean(rel);
  const weak = clips.filter((c) => (c.model.reliability || 0) < 0.55);
  return { state: avg > 0.7 ? 'ok' : avg > 0.5 ? 'warn' : 'fail', msg: `On average ${Math.round(avg * 100)}% of voiced speech gets a reliable pitch reading across ${clips.length} clip${clips.length === 1 ? '' : 's'}.${weak.length ? ` ${weak.length} clip${weak.length === 1 ? ' is' : 's are'} patchy (background noise); flag them as noisy if the line jumps.` : ''}` };
}
async function checkAlign() {
  const recs = Store.all('recordings').filter((r) => r.kind === 'pass' && r.score != null).sort((a, b) => (a.created < b.created ? 1 : -1)).slice(0, 12);
  if (!recs.length) return { state: '', msg: 'Record a few passes first.' };
  const good = recs.filter((r) => r.score > 0.3);
  const share = good.length / recs.length;
  return { state: share > 0.75 ? 'ok' : share > 0.4 ? 'warn' : 'fail', msg: `${good.length} of the last ${recs.length} recorded passes lined up automatically (average match ${mean(recs.map((r) => r.score)).toFixed(2)}). When it fails, the manual offset in Settings is used.` };
}

            h('div', { class: 'row' },
              btn('Save webhook', async () => {
                try {
                  const res = await Api.req('PUT', '/api/reminders', { webhook: input.value.trim() });
                  status = { ...status, configured: true, discord: { configured: true, hint: res.hint } }; replacing = false;
                  if (!reminderSettings().enabled) saveReminders({ enabled: true });
                  draw(); toast('Webhook saved. Reminders are on.', 'good');
                } catch (e) { toast(e.message, 'bad', 7000); }
              }, { kind: 'primary', size: 'sm' }),
              replacing ? btn('Cancel', () => { replacing = false; draw(); }, { size: 'sm', kind: 'ghost' }) : null));
        })();
    const dayBtns = [1, 2, 3, 4, 5, 6, 0].map((d) => btn(DAYS[d], () => {
      const days = r.days.includes(d) ? r.days.filter((x) => x !== d) : [...r.days, d];
      saveReminders({ days }); draw();
    }, { size: 'sm', on: r.days.includes(d), pressed: r.days.includes(d) }));
    const last = status && status.last;
    mount(wrap,
      h('p', { class: 'muted' }, 'Get a nudge when it’s time to practise: a notification on your phone or computer, a Discord message, or both. If you’ve already practised that day, it stays quiet.'),
      pushCard(status, { onChange: () => load().catch((e) => toast(e.message, 'bad')) }),
      h('div', { class: 'card stack' }, h('h3', null, 'Discord'),
        h('p', { class: 'small muted' }, 'Reminders posted to a Discord channel, with a link straight to the app.'),
        hook,
        h('label', { class: 'field', for: 'rem-user' }, 'Your Discord user ID (optional, to get pinged)',
          h('input', { type: 'text', id: 'rem-user', inputmode: 'numeric', placeholder: 'e.g. 123456789012345678', value: r.discordUserId, autocomplete: 'off', spellcheck: 'false', onchange: (e) => {
            const id = e.target.value.replace(/\s/g, '');
            if (id && !/^\d{17,20}$/.test(id)) { toast('That doesn’t look like a Discord user ID (17 to 20 digits).', 'bad', 7000); return; }
            saveReminders({ discordUserId: id }); toast(id ? 'You’ll be pinged in reminders.' : 'Reminders won’t ping you.');
          } })),
        h('p', { class: 'small muted' }, 'In Discord: Settings → Advanced → turn on Developer Mode, then right-click your name → Copy User ID. Leave empty for reminders without a ping.')),
      h('div', { class: 'card stack' }, h('h3', null, 'When'),
      h('label', { class: 'check', for: 'rem-on' }, h('input', { type: 'checkbox', id: 'rem-on', checked: r.enabled, disabled: !(status && status.configured), onchange: (e) => { saveReminders({ enabled: e.target.checked }); draw(); } }), 'Send reminders'),
      h('div', { class: 'row' },
        h('label', { class: 'field', for: 'rem-time' }, 'Reminder time', h('input', { type: 'time', id: 'rem-time', value: r.time, step: 900, onchange: (e) => { if (e.target.value) saveReminders({ time: e.target.value }); } })),
        h('label', { class: 'field', for: 'rem-late' }, 'Second nudge if I still haven’t (optional)', h('input', { type: 'time', id: 'rem-late', value: r.lateTime, step: 900, onchange: (e) => saveReminders({ lateTime: e.target.value || '' }) }))),
      h('div', { class: 'stack' }, h('span', { class: 'label' }, 'Days'), h('div', { class: 'row' }, dayBtns)),
      h('label', { class: 'check', for: 'rem-skip' }, h('input', { type: 'checkbox', id: 'rem-skip', checked: r.skipIfDone, onchange: (e) => saveReminders({ skipIfDone: e.target.checked }) }), 'Skip the reminder if I’ve already practised that day'),
      h('label', { class: 'check', for: 'rem-ci' }, h('input', { type: 'checkbox', id: 'rem-ci', checked: r.checkins, onchange: (e) => saveReminders({ checkins: e.target.checked }) }), 'Mention when a check-in is due'),
      h('p', { class: 'small muted' }, `Times are in ${Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'} (this device’s time zone). Reminders go out within 15 minutes of the time you set.`),
      h('div', { class: 'row' },
        btn('Send a test', async () => {
          try { await Api.req('POST', '/api/reminders/test', { appUrl: location.origin, tz: Intl.DateTimeFormat().resolvedOptions().timeZone }); toast('Test sent. Check your notifications or Discord.', 'good'); } catch (e) { toast(e.message, 'bad', 7000); }
        }, { size: 'sm', icon: 'bell', disabled: !(status && status.configured) }),
        last ? h('span', { class: 'small muted' }, `Last reminder ${fmtWhen(last.at)}: ${last.ok ? 'sent' : `failed (${last.error})`}`) : null)));
  };
  draw();
  load().catch((e) => { status = { configured: false, discord: { configured: false } }; draw(); toast(e.message, 'bad'); });
  return wrap;
}
function fmtWhen(iso) {
  const d = new Date(iso);
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function fmtWhen(ms) {
  if (!ms) return '—';
  const d = new Date(ms);
  const days = Math.floor((Date.now() - ms) / 86400000);
  const date = `${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear() === new Date().getFullYear() ? '' : ` ${d.getFullYear()}`}`;
  if (ms > Date.now()) return date; // invite end dates
  return days < 1 ? `today ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : days < 2 ? 'yesterday' : date;
}

async function openAdmin(tab = Admin.tab) {

    body,

    const view = tab === 'users' ? await adminUsersView() : tab === 'signup' ? await adminSignupView() : await adminInboxView();
    if (Admin.tab === tab && body.isConnected) mount(body, view);
  } catch (e) {
    if (body.isConnected) mount(body, h('p', { class: 'muted' }, `Couldn’t load this: ${e.message}`), btn('Try again', () => openAdmin(tab), { size: 'sm' }));

    if (m === mode) return;

    openAdmin('signup');

  const draft = { maxUses: 1, expiresDays: '', note: '' };

    try {
      const { invite } = await Api.req('POST', '/api/admin/invites', draft);

      h('p', { class: 'small muted' }, mode === 'open'
        ? 'Anyone with a Google account can create an account.'
        : 'New people paste an invite code before signing in with Google. People who already have an account sign in as usual.')),
    h('div', { class: 'card' }, h('h3', null, 'New invite code'),
      h('div', { class: 'cards', style: { gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))' } },
        h('label', { class: 'field', for: 'inv-uses' }, 'How many people can use it',
          h('input', { type: 'number', id: 'inv-uses', min: 1, max: 1000, step: 1, value: draft.maxUses, oninput: (e) => { draft.maxUses = e.target.value; } })),

          h('td', null, `${i.uses} of ${i.max_uses}`),

/* the sign-in link with the code filled in, so people don't have to type it */
async function copyInvite(code, created = false) {
  const link = `${location.origin}/auth/google?invite=${encodeURIComponent(code)}`;
  try {
    await navigator.clipboard.writeText(link);
    toast(created ? `Created ${code}. The sign-up link is copied.` : 'Sign-up link copied.', 'good', 6000);
  } catch {
    toast(created ? `Created ${code}. Sign-up link: ${link}` : link, 'good', 12000);
  }
}

function needsOnboarding() { return !profile().onboarded; }

function openOnboarding() {
  const draft = { ...profile() };
  if (!draft.name && Api.name) draft.name = String(Api.name).split(/\s+/)[0].slice(0, 40); // first name from Google
  const W = { i: 0, draft, addVideo: true, baseline: true };
  W.steps = ONBOARDING_STEPS.filter((s) => !s.when || s.when());
  renderOnboarding(W);
}

function renderOnboarding(W) {
  const step = W.steps[W.i];
  const n = W.steps.length;
  const last = W.i === n - 1;
  const go = () => {
    if (step.next && step.next(W) === false) return;
    if (last) finishOnboarding(W); else { W.i++; renderOnboarding(W); }
  };
  const back = () => { W.i--; renderOnboarding(W); };
  const progress = h('ol', { class: 'wiz-progress', style: `--n: ${n}`, 'aria-label': `Step ${W.i + 1} of ${n}` },
    W.steps.map((s, i) => h('li', { class: i < W.i ? 'done' : i === W.i ? 'cur' : '', 'aria-current': i === W.i ? 'step' : null },
      h('i', null), h('span', null, s.label))));
  const form = h('form', { class: 'wiz', novalidate: true, onsubmit: (e) => { e.preventDefault(); go(); } },
    h('div', { class: 'wiz-top' },
      h('span', { class: 'label' }, `Step ${W.i + 1} of ${n}`),
      h('span', { class: 'grow' }),
      btn('', () => closeModal(), { icon: 'close', kind: 'ghost', size: 'sm', title: 'Close (you can finish setting up in Settings)', aria: 'Close' })),
    progress,
    h('div', { class: 'wiz-head' }, h('h2', null, step.title(W)), step.sub ? h('p', { class: 'muted' }, step.sub(W)) : null),
    h('div', { class: 'wiz-body stack' }, step.body(W)),
    h('div', { class: 'wiz-foot' },
      W.i > 0 ? btn('Back', back, { kind: 'ghost', icon: 'back' }) : null,
      h('span', { class: 'grow' }),
      h('button', { type: 'submit', class: 'btn primary big' }, h('span', null, last ? 'Finish' : 'Continue'))));
  // focus the step's first text box, else Continue (not the close button)
  const first = form.querySelector('.wiz-body input:not([type="checkbox"]):not([type="radio"]), .wiz-body textarea') || form.querySelector('button[type="submit"]');
  first.setAttribute('autofocus', '');
  openModal(form, { narrow: true, onClose: () => finishOnboarding(W, true) });
}

/* closing early keeps whatever was saved so far; everything can be changed later in Settings → Profile */
function finishOnboarding(W, closed) {
  saveProfile({ onboarded: new Date().toISOString() });
  lsSet('welcomed', true);
  if (closed) return;
  closeModal(true);
  renderAll();
  if (W.steps.some((s) => s.id === 'video') && W.addVideo) {
    UI.addOpen = true;
    renderSidebar();
    if (!W.baseline || !W.steps.some((s) => s.id === 'baseline')) { openDrawer(); setTimeout(() => { const f = $('#addUrl') || $('#addFile'); if (f) f.focus(); }, 60); }
  }
  if (W.baseline && W.steps.some((s) => s.id === 'baseline')) openCheckins(0);
}

/* ---------- profile fields, shared by onboarding and Settings → Profile; edits go into draft ---------- */
function nameField(draft) {
  return h('label', { class: 'field', for: 'pfName' }, 'What should we call you?',
    h('input', { type: 'text', id: 'pfName', maxlength: 40, autocomplete: 'given-name', placeholder: 'Your first name', value: draft.name, oninput: (e) => { draft.name = e.target.value; } }));
}

/* a list of languages as removable chips, a box to type any language, and one-tap suggestions */
function nativeLanguagesField(draft) {
  let list = splitLanguages(draft.nativeLanguages);
  const tags = h('div', { class: 'tags' });
  const sugg = h('div', { class: 'suggest', 'aria-label': 'Suggestions' });
  const input = h('input', { type: 'text', id: 'pfNative', maxlength: 40, autocomplete: 'off', spellcheck: 'false', placeholder: 'Type a language, then press Enter',
    oninput: () => drawSuggestions(),
    onkeydown: (e) => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        if (input.value.trim()) add(bestMatch());
      } else if (e.key === 'Backspace' && !input.value && list.length) { list.pop(); sync(); }
    },
    onblur: () => { if (input.value.trim()) add(bestMatch(), true); } });
  // what Enter adds: the exact language, else the first suggestion ("fr" -> French), else what was typed
  const bestMatch = () => {
    const typed = input.value.trim(), q = typed.toLowerCase();
    return NATIVE_LANGUAGE_HINTS.find((l) => l.toLowerCase() === q) || NATIVE_LANGUAGE_HINTS.find((l) => !list.includes(l) && l.toLowerCase().startsWith(q)) || typed;
  };
  const sync = (keepFocus = true) => {
    draft.nativeLanguages = joinLanguages(list);
    mount(tags, list.map((l) => h('span', { class: 'tag' }, l,
      h('button', { type: 'button', 'aria-label': `Remove ${l}`, onclick: () => { list = list.filter((x) => x !== l); sync(); } }, icon('close')))));
    input.placeholder = list.length ? 'Add another' : 'Type a language, then press Enter';
    drawSuggestions();
    if (keepFocus) input.focus();
  };
  const add = (l, quiet) => {
    l = l.replace(/\s+/g, ' ').trim().slice(0, 40);
    if (l && !list.some((x) => x.toLowerCase() === l.toLowerCase())) list.push(l);
    input.value = '';
    sync(!quiet);
  };
  const drawSuggestions = () => {
    const q = input.value.trim().toLowerCase();
    const pool = NATIVE_LANGUAGE_HINTS.filter((l) => !list.includes(l));
    const shown = q ? pool.filter((l) => l.toLowerCase().includes(q)).slice(0, 8) : pool.slice(0, 8);
    mount(sugg, shown.map((l) => h('button', { type: 'button', class: 'chip add', onmousedown: (e) => e.preventDefault(), onclick: () => add(l) }, icon('plus'), l)));
  };
  sync(false);
  return h('div', { class: 'field' },
    h('label', { for: 'pfNative' }, 'Languages you speak natively'),
    h('div', { class: 'langpick', onclick: (e) => { if (e.target === e.currentTarget || e.target === tags) input.focus(); } }, tags, input),
    sugg,
    h('p', { class: 'small muted' }, 'Add one or more. Not in the list? Type it and press Enter.'));
}

function targetLanguageField(draft) {
  const langs = Object.entries(LANGUAGES);
  return h('div', { class: 'field' },
    h('span', { class: 'flabel', id: 'pfLangLbl' }, 'Language you’re practising'),
    choiceGroup('pfLang', null, langs.map(([id, l]) => ({ value: id, title: l.name })), draft.targetLanguage, (v) => { draft.targetLanguage = v; }, 'pfLangLbl'),
    langs.length === 1 ? h('p', { class: 'small muted' }, 'More languages are on the way.') : null);
}

function accentField(draft) {
  const lang = LANGUAGES[draft.targetLanguage] || LANGUAGES.en;
  const other = h('label', { class: 'field', for: 'pfAccentOther', hidden: draft.accent !== 'other' }, 'Describe the accent',
    h('input', { type: 'text', id: 'pfAccentOther', maxlength: 80, placeholder: 'e.g. Scottish English', value: draft.accentOther, oninput: (e) => { draft.accentOther = e.target.value; } }));
  return h('div', { class: 'field' },
    h('span', { class: 'flabel', id: 'pfAccentLbl' }, 'Accent you’re aiming for'),
    choiceGroup('pfAccent', null, [
      ...lang.accents.map((a) => ({ value: a.id, title: a.name, hint: a.hint })),
      { value: 'other', title: 'Something else', hint: 'Describe it in your own words.' },
    ], draft.accent, (v) => {
      draft.accent = v; other.hidden = v !== 'other';
      if (v === 'other') setTimeout(() => $('#pfAccentOther') && $('#pfAccentOther').focus(), 0);
    }, 'pfAccentLbl'),
    other);
}

function notesField(draft) {
  return h('label', { class: 'field', for: 'pfNotes' }, h('span', null, 'Anything the AI feedback should know ', h('span', { class: 'muted' }, '(optional)')),
    h('textarea', { id: 'pfNotes', rows: 2, maxlength: 500, placeholder: 'e.g. I understand everything but only started speaking it recently; rhythm is my weak spot.', value: draft.notes, oninput: (e) => { draft.notes = e.target.value; } }));
}

/* a set of radio cards (one choice), styled like the rest of the app instead of a dropdown */
function choiceGroup(name, label, options, value, onchange, labelledby) {
  return h('div', { class: 'choices', role: 'radiogroup', 'aria-label': label || null, 'aria-labelledby': labelledby || null },
    options.map((o) => h('label', { class: 'choice', for: `${name}-${o.value}` },
      h('input', { type: 'radio', name, id: `${name}-${o.value}`, value: o.value, checked: o.value === value, onchange: (e) => { if (e.target.checked) onchange(o.value); } }),
      h('span', { class: 'choice-text' }, h('strong', null, o.title), o.hint ? h('span', { class: 'small muted' }, o.hint) : null))));
}

function profileView() {
  const draft = { ...profile() };
  return h('form', { class: 'stack', onsubmit: (e) => {
    e.preventDefault();
    if (!draft.name.trim()) { toast('Tell us what to call you.', 'bad'); return; }
    if (!splitLanguages(draft.nativeLanguages).length) { toast('Add at least one language you speak.', 'bad'); return; }
    if (draft.accent === 'other' && !draft.accentOther.trim()) { toast('Describe the accent you’re aiming for.', 'bad'); return; }
    saveProfile({ ...draft, name: draft.name.trim() });
    toast('Profile saved.', 'good');
    closeModal();
  } },
  h('div', { class: 'card' }, h('h3', null, 'About you'), h('p', { class: 'small muted' }, 'Used for AI feedback, the listener pack and your check-ins.'),
    nameField(draft), nativeLanguagesField(draft), targetLanguageField(draft)),
  h('div', { class: 'card' }, h('h3', null, 'Your target accent'), accentField(draft), notesField(draft)),
  h('div', { class: 'row' }, h('button', { type: 'submit', class: 'btn primary big' }, h('span', null, 'Save profile')),
    btn('Run the setup again', () => { closeModal(true); openOnboarding(); }, { kind: 'ghost' })));
}

/* ---- 99-main.js ---- */
/* ---------- boot, global rendering, keyboard ---------- */
/* what shows where depends on what you're doing:
   browsing -> today's card under the player; cutting -> the clip editor there;
   in a session -> session card in the right column, pitch/waveform under the player */
const wideLayout = window.matchMedia ? matchMedia('(min-width: 901px)') : { matches: true };
function applyLayout() {
  const mode = Session.active ? 'session' : UI.cutMode || UI.sel ? 'cut' : 'idle';
  const layout = $('.layout'), sess = $('#session'), panel = $('#panel');
  layout.classList.toggle('in-session', mode === 'session');
  layout.classList.toggle('cutting', mode === 'cut');
  if (mode === 'session' && wideLayout.matches) { if (sess.parentElement !== $('#sideSlot')) $('#sideSlot').appendChild(sess); }
  else if (sess.parentElement !== $('#below')) $('#below').insertBefore(sess, panel);
  sess.hidden = mode === 'cut';
  panel.hidden = mode === 'idle';
  if (UI.layoutMode !== mode) { UI.layoutMode = mode; requestAnimationFrame(() => Panel.onTime(Player.time())); }
  scheduleFit();
}

/* Sizes depend only on the window and the video's shape, never on what you're doing, so the
   page doesn't reshuffle when you press a button:
   - the video gets the window height minus a fixed allowance for the panel underneath;
   - the right column takes the width the video doesn't need (within limits);
   - the library or session card beside the player matches its height;
   - the full-width panel underneath fills down to the bottom of the window. */
const BELOW_ALLOWANCE = 250;
let fitQueued = false;
function scheduleFit() {
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => { fitQueued = false; fitLayout(); });
}
function fitLayout() {
  const L = $('.layout');
  if (!wideLayout.matches) {
    L.classList.remove('fit');
    ['--side-w', '--video-h', '--below-h', '--top-h'].forEach((v) => L.style.removeProperty(v));
    return;
  }
  L.classList.add('fit');
  const v = Player.v;
  const ar = v && v.videoWidth && v.videoHeight ? v.videoWidth / v.videoHeight : 16 / 9;
  L.style.setProperty('--video-ar', String(ar));
  const css = getComputedStyle(L);
  const padT = parseFloat(css.paddingTop), padB = parseFloat(css.paddingBottom), padX = parseFloat(css.paddingLeft) + parseFloat(css.paddingRight);
  const gapY = parseFloat(css.rowGap) || 14, gapX = parseFloat(css.columnGap) || 16;
  const top = L.getBoundingClientRect().top + window.scrollY;
  const avail = Math.max(360, window.innerHeight - top - padT - padB);
  const vh = Math.max(avail * 0.5, avail - BELOW_ALLOWANCE - gapY - 6);
  const totalW = L.clientWidth - padX - gapX;
  const sideW = clamp(Math.round(totalW - vh * ar - 6), 360, Math.max(360, Math.min(600, totalW * 0.36)));
  L.style.setProperty('--side-w', `${sideW}px`);
  L.style.setProperty('--video-h', `${Math.floor(vh)}px`);
  const playerH = $('#player').offsetHeight;
  L.style.setProperty('--below-h', `${Math.max(BELOW_ALLOWANCE, Math.floor(avail - playerH - gapY))}px`);
  L.style.setProperty('--top-h', `${playerH}px`); // library / session card: same height as the player
  Panel.onTime(Player.time()); // the chart may have changed size
}

function renderAll() {
  applyLayout();
  renderChips();
  renderBanners();
  renderControls();
  renderScrubber();
  renderSession();
  renderPanel();
  renderSidebar();
  $('#playerEmpty').hidden = !!Player.current();
  if (!Player.current()) renderPlayerEmpty();
}

function onKey(e) {
  const tag = (e.target && e.target.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (isModalOpen()) { if (e.key === 'Escape') closeModal(); return; }
  const k = e.key;
  if (k === ' ' || k === 'Spacebar') {
    if (tag === 'BUTTON') return; // let the focused button act
    e.preventDefault(); Player.toggle();
  } else if (k === 'r' || k === 'R') Player.replayLoop();
  else if (k === 'i' || k === 'I' || k === '[') markEdge('start');
  else if (k === 'o' || k === 'O' || k === ']') markEdge('end');
  else if (k === ',' || k === '<') Player.stepRate(-1);
  else if (k === '.' || k === '>') Player.stepRate(1);
  else if (k === 'l' || k === 'L') { UI.loop = !UI.loop; renderControls(); toast(UI.loop ? 'Loop on' : 'Loop off'); }
  else if (k === 'ArrowLeft') { e.preventDefault(); Player.seek(Player.time() - 2); }
  else if (k === 'ArrowRight') { e.preventDefault(); Player.seek(Player.time() + 2); }
  else if (k === 'Enter' && Session.active && (Session.phase === 'intro' || Session.phase === 'armed')) Session.go();
  else if (k === 'c' || k === 'C') { if (Player.current() && !Session.active) setCutMode(!UI.cutMode); }
  else if (k === 'Escape') { if (UI.drawer) closeDrawer(); else if ((UI.sel || UI.cutMode) && !Session.active) cancelCut(); }
  else if (k === '?') openShortcuts();
}

async function boot() {
  Player.init();
  renderControls();
  mount($('#panel'), h('div', { class: 'panel-msg' }, 'Loading your practice data…'));
  await Store.init();
  if (Store.mode === 'offline') {
    mount($('#panel'), h('div', { class: 'panel-msg' }, 'Not connected.'));
    openModal([
      modalHead(Api.signedOut ? 'Please sign in' : /disabled/i.test(Api.problem || '') ? 'Account disabled' : 'The server isn’t ready'),
      h('p', null, Api.signedOut ? 'Sign in with your Google account to open your practice.' : `The app’s server answered with a problem: ${Api.problem}`),
      Api.signedOut ? btn('Sign in with Google', () => signIn(), { kind: 'primary', size: 'big' }) : btn('Reload', () => location.reload(), { kind: 'primary', size: 'big' }),
    ], { narrow: true });
    return;
  }
  appMeta();
  applyTheme();
  initMedia(); // device storage and Google Drive sync (17-media.js)
  Push.register(); // service worker: reminder notifications, and lets the browser install the app (86-push.js)
  UI.view = settings().defaultView || 'pitch';
  if (UI.videoId && !Store.get('videos', UI.videoId)) UI.videoId = null;
  if (!UI.videoId) {
    const first = Store.all('videos').filter((v) => !v.archived).sort((a, b) => (a.added < b.added ? 1 : -1))[0];
    UI.videoId = first ? first.id : null;
  }
  Player.load(UI.videoId);
  const last = lastClipId();
  if (last && Store.get('clips', last) && Store.get('clips', last).videoId === UI.videoId) { UI.clipId = last; renderAll(); }
  document.addEventListener('keydown', onKey);
  $('#drawerBack').addEventListener('click', closeDrawer);
  Bus.on('videoaudio', () => { Panel.editor = null; renderPanel(); });
  Bus.on('signedout', () => renderBanners());
  window.addEventListener('resize', () => Panel.onTime(Player.time()));
  if (wideLayout.addEventListener) wideLayout.addEventListener('change', () => applyLayout());
  window.addEventListener('resize', scheduleFit);
  Player.v.addEventListener('loadedmetadata', scheduleFit);
  // the row under the player and the banners change height as you work: refit when they do
  if (window.ResizeObserver) { const ro = new window.ResizeObserver(scheduleFit); ro.observe($('#banners')); }
  window.addEventListener('beforeunload', () => { Store.flushAll(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flushAll(); });
  refreshAdminBadge();
  // first launch: the setup wizard (profile, files, first video, AI, baseline); see 90-onboarding.js
  if (needsOnboarding()) openOnboarding();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
