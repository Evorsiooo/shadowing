ip options":{"fr":"Options de l’extrait","es":"Opciones del fragmento"},"No clips yet. Press Cut clips under the video, then drag along the timeline.":{"fr":"Pas encore d’extrait. Appuie sur Découper des extraits sous la vidéo, puis fais glisser le long de la frise.","es":"Aún no hay fragmentos. Pulsa Cortar fragmentos debajo del video y luego arrastra a lo largo de la línea de tiempo."},"Show fewer":{"fr":"Afficher moins","es":"Mostrar menos"},"Show all {n} clips":{"fr":"Afficher les {n} extraits","es":"Mostrar los {n} fragmentos"},"{n} queued|{n} queued":{"fr":"{n} en file|{n} en file","es":"{n} en cola|{n} en cola"},"Clear queue":{"fr":"Vider la file","es":"Vaciar la cola"},"Archived clips ({n})":{"fr":"Extraits archivés ({n})","es":"Fragmentos archivados ({n})"},"Shadow this clip":{"fr":"Faire du shadowing sur cet extrait","es":"Hacer shadowing con este fragmento"},"Edit edges or label":{"fr":"Modifier les bords ou le libellé","es":"Editar bordes o etiqueta"},"History and recordings":{"fr":"Historique et enregistrements","es":"Historial y grabaciones"},"Remove the tick":{"fr":"Retirer la coche","es":"Quitar la marca"},"Mark as done":{"fr":"Marquer comme terminé","es":"Marcar como terminado"},"Unflag noisy":{"fr":"Retirer le signalement de bruit","es":"Quitar la marca de ruido"},"Flag as too noisy":{"fr":"Signaler comme trop bruyant","es":"Marcar como demasiado ruidoso"},"Restore clip":{"fr":"Restaurer l’extrait","es":"Restaurar fragmento"},"Archive clip":{"fr":"Archiver l’extrait","es":"Archivar fragmento"},"Clip archived. Its history is kept.":{"fr":"Extrait archivé. Son historique est conservé.","es":"Fragmento archivado. Se conserva su historial."},"Listen":{"fr":"Écoute","es":"Escucha"},"Shadow":{"fr":"Shadowing","es":"Shadowing"},"Record & compare":{"fr":"Enregistrer et comparer","es":"Grabar y comparar"},"Shadow again":{"fr":"Encore du shadowing","es":"Shadowing otra vez"},"Just listen. Don’t speak yet; take in the rhythm and melody.":{"fr":"Écoute simplement. Ne parle pas encore ; imprègne-toi du rythme et de la mélodie.","es":"Solo escucha. No hables todavía; absorbe el ritmo y la melodía."},"Speak along at the same time as the speaker. Copy everything: rhythm, melody and sounds.":{"fr":"Parle en même temps que le locuteur. Copie tout : rythme, mélodie et sons.","es":"Habla a la vez que el hablante. Cópialo todo: ritmo, melodía y sonidos."},"Headphones on. Shadow one pass while it records, then compare it with the original.":{"fr":"Mets ton casque. Fais un passage de shadowing pendant l’enregistrement, puis compare-le avec l’original.","es":"Ponte los auriculares. Haz una pasada de shadowing mientras se graba y luego compárala con el original."},"Shadow again, copying as closely as you can. The last pass records so you can compare it with step 3.":{"fr":"Refais du shadowing en copiant le plus fidèlement possible. Le dernier passage est enregistré pour que tu puisses le comparer avec l’étape 3.","es":"Vuelve a hacer shadowing, copiando lo más fielmente que puedas. La última pasada se graba para que puedas compararla con el paso 3."},"Start listening":{"fr":"Commencer l’écoute","es":"Empezar a escuchar"},"Start shadowing":{"fr":"Commencer le shadowing","es":"Empezar el shadowing"},"Start recording":{"fr":"Commencer l’enregistrement","es":"Empezar a grabar"},"Start shadowing again":{"fr":"Reprendre le shadowing","es":"Volver a hacer shadowing"},"A session is already running.":{"fr":"Une séance est déjà en cours.","es":"Ya hay una sesión en curso."},"Pick a clip first.":{"fr":"Choisis d’abord un extrait.","es":"Elige primero un fragmento."},"{time} left":{"fr":"{time} restantes","es":"quedan {time}"},"{time} over · that’s fine":{"fr":"{time} de plus · pas de souci","es":"{time} de más · no pasa nada"},"The recording couldn’t be saved ({error}). You can still listen to it now.":{"fr":"L’enregistrement n’a pas pu être sauvegardé ({error}). Tu peux quand même l’écouter maintenant.","es":"No se pudo guardar la grabación ({error}). Aun así puedes escucharla ahora."},"You’re past the shadowing step already. Finish or end the session instead.":{"fr":"Tu as déjà passé l’étape de shadowing. Termine ou arrête plutôt la séance.","es":"Ya pasaste el paso de shadowing. Mejor termina o finaliza la sesión."},"Switched to the 5-minute version. Every bit counts.":{"fr":"Passage à la version 5 minutes. Chaque minute compte.","es":"Cambiado a la versión de 5 minutos. Todo suma."},"Can’t keep up?":{"fr":"Tu n’arrives pas à suivre ?","es":"¿No puedes seguir el ritmo?"},"This clip is {len} long. Shadowing gets much easier with a shorter clip: try cutting it to one sentence of about {sec} seconds. Slowing to 0.75x also helps for a few passes.":{"fr":"Cet extrait dure {len}. Le shadowing devient bien plus facile avec un extrait plus court : essaie de le réduire à une phrase d’environ {sec} secondes. Ralentir à 0,75x aide aussi pendant quelques passages.","es":"Este fragmento dura {len}. El shadowing es mucho más fácil con un fragmento más corto: prueba a recortarlo a una frase de unos {sec} segundos. Bajar a 0,75x también ayuda durante algunas pasadas."},"This clip is {len} long. Shadowing gets much easier with a shorter clip: try cutting it to one sentence. Slowing to 0.75x also helps for a few passes.":{"fr":"Cet extrait dure {len}. Le shadowing devient bien plus facile avec un extrait plus court : essaie de le réduire à une seule phrase. Ralentir à 0,75x aide aussi pendant quelques passages.","es":"Este fragmento dura {len}. El shadowing es mucho más fácil con un fragmento más corto: prueba a recortarlo a una sola frase. Bajar a 0,75x también ayuda durante algunas pasadas."},"Slow to 0.75x":{"fr":"Ralentir à 0,75x","es":"Bajar a 0,75x"},"End and shorten the clip":{"fr":"Arrêter et raccourcir l’extrait","es":"Terminar y acortar el fragmento"},"Keep going":{"fr":"Continuer","es":"Seguir"},"{step}: {n}":{"fr":"{step} : {n}","es":"{step}: {n}"},"Step {n}: {step}":{"fr":"Étape {n} : {step}","es":"Paso {n}     return new Promise((res, rej) => {
      const t = d.transaction(store, 'readonly');
      const s = t.objectStore(store);
      const keys = s.getAllKeys();
      const vals = s.getAll();
      t.oncomplete = () => res(keys.result.map((k, i) => [k, vals.result[i]]));
      t.onerror = () => rej(t.error);
    });
  },
  put(store, key, val) { return this.tx(store, 'readwrite', (s) => s.put(val, key)); },
  del(store, key) { return this.tx(store, 'readwrite', (s) => s.delete(key)); },
  get(store, key) { return this.tx(store, 'readonly', (s) => s.get(key)); },
};

/* ---------- cloud backend (Cloudflare Pages Functions: D1 + the user's own AI key; files stay on the device or in Drive) ---------- */
const Api = {
  on: false,
  email: null,
  role: null,
  ai: null, // {provider, providerName, model} when the user has saved an AI key
  signedOut: false,
  problem: null,
  async req(method, path, body, { raw = false, headers = {} } = {}) {
    let resp;
    try {
      resp = await fetch(path, {
        method, credentials: 'same-origin', redirect: 'manual',
        // x-euno-lang: the server answers its messages in the interface language
        headers: body != null && !raw ? { 'content-type': 'application/json', 'x-euno-lang': LANG, ...headers } : { 'x-euno-lang': LANG, ...headers },
        body: body == null ? undefined : raw ? body : JSON.stringify(body),
      });
    } catch (e) {
      throw Object.assign(new Error(t('The server couldn’t be reached. Check your connection.')), { code: 'network' });
    }
    if (resp.type === 'opaqueredirect' || resp.status === 401) {
      this.signedOut = true;
      Bus.emit('signedout');
      throw Object.assign(new Error(t('You’re signed out. Sign in again to keep saving.')), { code: 'signedout' });
    }
    const ct = resp.headers.get('content-type') || '';
    const data = ct.includes('application/json') ? await resp.json().catch(() => ({})) : null;
    if (!resp.ok) throw Object.assign(new Error((data && data.error) || t('Server error {status}', { status: resp.status })), { code: `http_${resp.status}`, status: resp.status });
    return data;
  },
  async probe() {
    if (location.protocol === 'file:') return false;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch('/api/health', { credentials: 'same-origin', redirect: 'manual', signal: ctl.signal });
      if (r.type === 'opaqueredirect' || r.status === 401) { this.signedOut = true; return false; }
      if (!(r.headers.get('content-type') || '').includes('application/json')) return false;
      const d = await r.json();
      if (!r.ok) { this.problem = d.error || t('Server error {status}', { status: r.status }); return false; }
      this.on = true; this.email = d.email; this.name = d.name || null; this.role = d.role || null; this.ai = d.ai || null;
      this.drive = d.drive || { connected: false }; this.driveAvailable = !!d.driveAvailable;
      return true;
    } catch { return false; } finally { clearTimeout(timer); }
  },
};

const Store = {
  mode: 'memory', // 'cloud' | 'artifact' | 'local' | 'memory'
  blobMode: 'memory', // 'device' (17-media.js) | 'assets' | 'memory'
  data: Object.fromEntries(COLS.map((c) => [c, {}])),
  timers: new Map(),
  chains: new Map(),
  memBlobs: new Map(),
  urlCache: new Map(),
  lastError: null,

  async init() {
    await resolveCaps();
    if (!Caps.inArtifact && (await Api.probe())) {
      try {
        const { data } = await Api.req('GET', '/api/docs');
        for (const col of COLS) Object.assign(this.data[col], data[col] || {});
        this.mode = 'cloud';
        this.blobMode = 'device';
        return;
      } catch (e) { this.lastError = e; Api.problem = e.message; }
    }
    if (Api.signedOut || Api.problem) { this.mode = 'offline'; this.blobMode = 'memory'; return; }
    if (Caps.db) {
      try {
        await Promise.all(COLS.map(async (col) => {
          const snap = await Caps.db.collection(col).get();
          for (const d of snap.docs) this.data[col][d.id] = { ...d.data(), id: d.id };
        }));
        this.mode = 'artifact';
      } catch (e) {
        this.lastError = e;
        console.warn('artifact db unavailable', e);
      }
    }
    if (this.mode !== 'artifact') {
      try {
        const rows = await IDB.all('docs');
        for (const [key, val] of rows) {
          const [col, id] = String(key).split('/');
          if (this.data[col]) this.data[col][id] = val;
        }
        this.mode = 'local';
      } catch (e) {
        this.lastError = e;
        this.mode = 'memory';
      }
    }
    this.blobMode = Caps.assets && this.mode === 'artifact' ? 'assets' : this.mode === 'local' ? 'device' : 'memory';
  },

  all(col) { return Object.values(this.data[col]); },
  get(col, id) { return id ? this.data[col][id] : undefined; },
  put(col, obj) {
    if (!obj.id) obj.id = uid();
    this.data[col][obj.id] = obj;
    this.schedule(col, obj.id);
    return obj;
  },
  patch(col, id, fields) {
    const cur = this.data[col][id];
    if (!cur) return;
    Object.assign(cur, fields);
    this.schedule(col, id);
    return cur;
  },
  /* coalesce a burst of edits into one write per document, one write at a time */
  schedule(col, id, delay = 400) {
    const key = `${col}/${id}`;
    clearTimeout(this.timers.get(key));
    this.timers.set(key, setTimeout(() => this.flushKey(key), delay));
  },
  flushKey(key) {
    this.timers.delete(key);
    const [col, id] = key.split('/');
    const prev = this.chains.get(key) || Promise.resolve();
    const next = prev.then(() => this.write(col, id)).then(() => { this.failed = 0; }).catch((e) => this.onWriteError(e, key));
    this.chains.set(key, next);
    return next;
  },
  async flushAll() {
    const keys = [...this.timers.keys()];
    for (const k of keys) clearTimeout(this.timers.get(k));
    await Promise.all(keys.map((k) => this.flushKey(k)));
  },
  async write(col, id) {
    const doc = this.data[col][id];
    const body = doc ? JSON.parse(JSON.stringify(doc)) : null;
    if (this.mode === 'cloud') {
      const path = `/api/docs/${col}/${encodeURIComponent(id)}`;
      if (body) { delete body.id; await Api.req('PUT', path, body); } else await Api.req('DELETE', path);
    } else if (this.mode === 'artifact') {
      const ref = Caps.db.collection(col).doc(id);
      if (body) { delete body.id; await ref.set(body); } else await ref.delete();
    } else if (this.mode === 'local') {
      if (body) await IDB.put('docs', `${col}/${id}`, body); else await IDB.del('docs', `${col}/${id}`);
    }
  },
  onWriteError(e, key) {
    console.error('save failed', e);
    const code = e && e.code;
    if (code === 'signedout') return; // the sign-in banner explains it; nothing is lost on screen
    if (this.mode === 'cloud' && key && (code === 'network' || (e.status && e.status >= 500))) {
      // keep retrying quietly; the change is still on screen
      this.failed = (this.failed || 0) + 1;
      if (this.failed <= 3 || this.failed % 10 === 0) toast(t('Couldn’t save to the server. Retrying…'), 'bad');
      setTimeout(() => this.schedule(...key.split('/'), 0), Math.min(60000, 3000 * this.failed));
      return;
    }
    if (code === 'quota_exceeded') toast(t('Storage is full. Archive or remove old recordings in Settings → Data.'), 'bad', 7000);
    else if (e && (e.status === 413 || e.status === 429)) toast(e.message, 'bad', 7000); // the server's own words: account full, or slow down
    else toast(t('Couldn’t save a change ({code}). It is kept on screen; try again shortly.', { code: code || 'error' }), 'bad');
  },

  /* ---------- recordings & files ----------
     refs: media:<id> (this device + Drive, 17-media.js), asset:<id> (artifact), mem:<id> (this visit),
     and, read-only, idb:<id> (older local recordings) */
  async putBlob(blob, kind = 'rec') {
    if (this.blobMode === 'device') {
      try { return await Media.add(blob, { kind }); } catch (e) {
        if (e && e.name === 'QuotaExceededError') throw Object.assign(new Error(t('This device’s storage is full.')), { code: 'quota_exceeded' });
        throw e;
      }
    }
    if (this.blobMode === 'assets') {
      const type = /mp4|m4a|aac/.test(blob.type) ? 'video/mp4' : 'video/webm';
      try {
        const r = await Caps.assets.upload(blob, { type });
        this.urlCache.set(`asset:${r.id}`, r.url);
        return `asset:${r.id}`;
      } catch (e) {
        if (e && e.code === 'store_unavailable') {
          await sleep(800 + Math.random() * 600);
          const r = await Caps.assets.upload(blob, { type });
          return `asset:${r.id}`;
        }
        throw e;
      }
    }
    const id = uid();
    this.memBlobs.set(id, blob);
    return `mem:${id}`;
  },
  async blobUrl(ref) {
    if (!ref) return null;
    if (this.urlCache.has(ref)) return this.urlCache.get(ref);
    const [kind, id] = ref.split(':');
    let url = null;
    if (kind === 'asset') url = '/_blob/' + id;
    else {
      const b = await this.getBlob(ref);
      if (b) url = URL.createObjectURL(b);
    }
    if (url) this.urlCache.set(ref, url);
    return url;
  },
  async getBlob(ref) {
    if (!ref) return null;
    const [kind, id] = ref.split(':');
    if (kind === 'mem') return this.memBlobs.get(id) || null;
    if (kind === 'media') return Media.file(id);
    if (kind === 'idb') { try { return (await IDB.get('blobs', id)) || null; } catch { return null; } }
    if (kind === 'asset') {
      const url = this.urlCache.get(ref) || '/_blob/' + id;
      const r = await fetch(url);
      if (!r.ok) return null;
      return r.blob();
    }
    return null;
  },
  async deleteBlob(ref) {
    if (!ref) return;
    const [kind, id] = ref.split(':');
    this.urlCache.delete(ref);
    if (kind === 'mem') this.memBlobs.delete(id);
    else if (kind === 'media') await Media.remove(id);
    else if (kind === 'idb') await IDB.del('blobs', id).catch(() => {});
    else if (kind === 'asset' && Caps.assets) await Caps.assets.delete(id).catch(() => {});
  },

  /* ---------- backup ---------- */
  exportJSON() {
    return JSON.stringify({ app: 'shadowing-practice', version: 1, exportedAt: new Date().toISOString(), data: this.data }, null, 1);
  },
  async importJSON(text) {
    const parsed = JSON.parse(text);
    if (!parsed || parsed.app !== 'shadowing-practice' || !parsed.data) throw new Error(t('This file is not a Euno Shadowing backup.'));
    let n = 0;
    for (const col of COLS) {
      for (const [id, doc] of Object.entries(parsed.data[col] || {})) {
        if (!this.data[col][id]) { this.data[col][id] = { ...doc, id }; this.schedule(col, id, 50 + n * 5); n++; }
      }
    }
    return n;
  },
};
