/* native languages are kept as one comma-separated string (what the AI prompt reads); the picker edits a list */
function splitLanguages(s) { return [...new Set(String(s || '').split(/[,;]/).map((x) => x.trim()).filter(Boolean))]; }
function joinLanguages(list) { return list.join(', ').slice(0, 120); }

function langContent(p = profile()) { return LANGUAGES[p.targetLanguage] || LANGUAGES.en; }
/* the target language's code, falling back to English if the saved one no longer exists */
function targetLang(p = profile()) { return LANGUAGES[p.targetLanguage] ? p.targetLanguage : 'en'; }
/* the target accent: { name, short, spelling }; "Other" uses the learner's own words */
function targetAccent(p = profile()) {
  const lang = langContent(p);
  const known = lang.accents.find((a) => a.id === p.accent);
  if (known) return known;
  const other = String(p.accentOther || '').trim().slice(0, 80);
  if (other) return { name: other, short: other, spelling: null };
  return { name: `a native ${lang.name} accent`, short: N_('native'), spelling: null }; // name goes to the AI (English); short is shown with t()
}

/* check-ins made before languages existed have no lang: they are English */
function checkinLang(c) { return (c && c.lang) || 'en'; }

/* the read-aloud set for a programme: whatever its baseline used, else the language's current set */
function readSentences(c) {
  const lang = langContent();
  const code = targetLang();
  const base = Store.all('checkins').find((x) => x.week === 0 && checkinLang(x) === code);
  const id = (c && c.readSet) || (base && (base.readSet || 'en-0')) || lang.readSet;
  return { id, sentences: lang.readSets[id] || LANGUAGES.en.readSets[id] || lang.readSets[lang.readSet] };
}

/* what the AI needs to know about the learner; shared by the in-app prompt and the server */
function profileForAI(p = profile()) {
  const a = targetAccent(p);
  return {
    nativeLanguages: String(p.nativeLanguages || '').slice(0, 120),
    targetLanguage: langContent(p).name,
    accent: a.name,
    spelling: a.spelling,
    notes: String(p.notes || '').slice(0, 500),
    replyLanguage: UI_LANG_NAMES_EN[LANG] || 'English', // the interface language: feedback is written in it
  };
}

/* ---- 17-media.js ---- */
/* ---------- media files: videos and recordings, on this device with optional Google Drive sync ----------
   Every file the app keeps is a "media" document ({ name, type, size, kind, providers }) and is
   referred to as "media:<id>". The bytes live:
   - on this device, in the browser's own storage (OPFS, or IndexedDB where OPFS can't write);
   - optionally in a cloud provider, recorded in providers: { gdrive: '<Drive file id>' }.
   A device that lacks a file downloads it once from the provider and plays the local copy.
   Dropbox or OneDrive can be added later as another provider with the same four calls
   (upload, download, remove, connected). The server never sees the files. */

/* the browser's own storage on this device */
const DeviceFiles = {
  dirP: null,
  async dir() {
    if (!this.dirP) {
      this.dirP = (async () => {
        if (!navigator.storage || !navigator.storage.getDirectory) return null;
        try {
          const root = await navigator.storage.getDirectory();
          const d = await root.getDirectoryHandle('media', { create: true });
          // some browsers can read OPFS but only write it from a worker; then use IndexedDB instead
          const probe = await d.getFileHandle('.probe', { create: true });
          if (typeof probe.createWritable !== 'function') return null;
          return d;
        } catch { return null; }
      })();
    }
    return this.dirP;
  },
  /* save a Blob or a ReadableStream of bytes under id; onProgress(bytesWritten) */
  async put(id, src, onProgress) {
    const d = await this.dir();
    if (d) {
      const fh = await d.getFileHandle(id, { create: true });
      const w = await fh.createWritable();
      let n = 0;
      const stream = src instanceof Blob ? src.stream() : src;
      try {
        await stream.pipeThrough(new TransformStream({ transform(chunk, ctl) { n += chunk.byteLength; onProgress && onProgress(n); ctl.enqueue(chunk); } })).pipeTo(w);
      } catch (e) {
        await d.removeEntry(id).catch(() => {});
        throw e;
      }
      return;
    }
    const blob = src instanceof Blob ? src : await new Response(src).blob();
    await IDB.put('blobs', `media/${id}`, blob);
    onProgress && onProgress(blob.size);
  },
  async get(id) {
    const d = await this.dir();
    if (d) {
      // a file still being written reads as empty until it's closed
      try { const f = await (await d.getFileHandle(id)).getFile(); if (f.size) return f; } catch { /* not here; try IndexedDB */ }
    }
    try { return (await IDB.get('blobs', `media/${id}`)) || null; } catch { return null; }
  },
  async has(id) {
    const d = await this.dir();
    if (d) { try { if ((await (await d.getFileHandle(id)).getFile()).size) return true; } catch { /* fall through */ } }
    try { return !!(await IDB.get('blobs', `media/${id}`)); } catch { return false; }
  },
  async del(id) {
    const d = await this.dir();
    if (d) await d.removeEntry(id).catch(() => {});
    await IDB.del('blobs', `media/${id}`).catch(() => {});
  },
  /* ask the browser not to clear these files when the device runs low on space */
  async persist() {
    try { return navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; } catch { return false; }
  },
  async persisted() {
    try { return navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false; } catch { return false; }
  },
  async estimate() {
    try { return navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch { return null; }
  },
};

/* Google Drive, straight from the browser with a short-lived token from the server.
   Scope drive.file: the app only sees files it created itself. */
const Drive = {
  id: 'gdrive',
  name: 'Google Drive',
  FOLDER: 'Euno Shadowing',
  status: { connected: false },
  available: false,
  tok: null,
  exp: 0,
  connected() { return Store.mode === 'cloud' && !!this.status.connected; },
  async refreshStatus() {
    if (Store.mode !== 'cloud') return this.status;
    try { this.status = await Api.req('GET', '/api/drive'); } catch { /* keep the last known status */ }
    Bus.emit('sync');
    return this.status;
  },
  async token(force) {
    if (!force && this.tok && Date.now() < this.exp - 120_000) return this.tok;
    try {
      const r = await Api.req('POST', '/api/drive/token');
      this.tok = r.accessToken; this.exp = r.expiresAt;
      return this.tok;
    } catch (e) {
      if (e.status === 409) { this.status = { connected: false }; Bus.emit('sync'); }
      throw e;
    }
  },
  async call(method, url, { body, headers = {}, json = true } = {}) {
    for (let attempt = 0; ; attempt++) {
      const tok = await this.token(attempt > 0);
      let r;
      try { r = await fetch(url, { method, body, headers: { authorization: `Bearer ${tok}`, ...headers } }); } catch {
        throw Object.assign(new Error(t('Google Drive couldn’t be reached. Check your connection.')), { code: 'network' });
      }
      if (r.status === 401 && attempt === 0) continue;
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        throw Object.assign(new Error(t('Google Drive: {msg}', { msg: (d.error && d.error.message) || t('error {status}', { status: r.status }) })), { status: r.status });
      }
      return json ? r.json() : r;
    }
  },
  /* the app's folder; its id is kept in the synced meta/storage doc so every device uses the same one */
  async folder() {
    const meta = Store.get('meta', 'storage') || {};
    if (meta.driveFolder) {
      try {
        const f = await this.call('GET', `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(meta.driveFolder)}?fields=id,trashed`);
        if (!f.trashed) return f.id;
      } catch (e) { if (e.status !== 404) throw e; }
    }
    const q = encodeURIComponent(`name = '${this.FOLDER}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`);
    const found = await this.call('GET', `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`);
    const id = found.files && found.files[0] ? found.files[0].id
      : (await this.call('POST', 'https://www.googleapis.com/drive/v3/files?fields=id', {
        body: JSON.stringify({ name: this.FOLDER, mimeType: 'application/vnd.google-apps.folder', description: 'Videos and recordings from Euno Shadowing (shadowing.euno.cc).' }),
        headers: { 'content-type': 'application/json' },
      })).id;
    Store.put('meta', { ...(Store.get('meta', 'storage') || {}), id: 'storage', driveFolder: id });
    return id;
  },
  /* resumable upload in 8 MB pieces, so a dropped connection only repeats one piece */
  async upload(blob, doc, onProgress) {
    const folder = await this.folder();
    const meta = { name: doc.name || `${doc.kind || 'file'}-${doc.id}`, parents: [folder], appProperties: { euno: '1', mediaId: doc.id, kind: doc.kind || '' } };
    const type = blob.type || doc.type || 'application/octet-stream';
    const start = await this.call('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id', {
      body: JSON.stringify(meta), json: false,
      headers: { 'content-type': 'application/json; charset=UTF-8', 'x-upload-content-type': type, 'x-upload-content-length': String(blob.size) },
    });
    const session = start.headers.get('location');
    if (!session) throw new Error(t('Google Drive didn’t start the upload.'));
    const PIECE = 8 * 1024 * 1024;
    let off = 0;
    if (!blob.size) {
      const r = await fetch(session, { method: 'PUT', body: blob });
      if (!r.ok) throw new Error(t('Google Drive: upload failed ({status}).', { status: r.status }));
      return (await r.json()).id;
    }
    for (let tries = 0; ;) {
      const end = Math.min(blob.size, off + PIECE);
      let r;
      try {
        r = await fetch(session, { method: 'PUT', body: blob.slice(off, end), headers: { 'content-range': `bytes ${off}-${end - 1}/${blob.size}` } });
      } catch { r = null; }
      if (r && (r.status === 200 || r.status === 201)) { onProgress && onProgress(1); return (await r.json()).id; }
      if (r && r.status === 308) {
        const range = r.headers.get('range');
        off = range ? Number(range.split('-')[1]) + 1 : 0;
        tries = 0;
        onProgress && onProgress(off / blob.size);
        continue;
      }
      if (r && r.status >= 400 && r.status < 500 && r.status !== 408 && r.status !== 429) throw new Error(t('Google Drive: upload failed ({status}).', { status: r.status }));
      if (++tries > 4) throw new Error(t('The upload to Google Drive kept failing. It will try again later.'));
      await sleep(1000 * 2 ** tries);
      // ask where the upload got to
      try {
        const q = await fetch(session, { method: 'PUT', headers: { 'content-range': `bytes */${blob.size}` } });
        if (q.status === 200 || q.status === 201) return (await q.json()).id;
        if (q.status === 308) { const range = q.headers.get('range'); off = range ? Number(range.split('-')[1]) + 1 : 0; }
      } catch { /* try the piece again */ }
    }
  },
  /* a Response whose body streams the file */
  async download(fileId) {
    return this.call('GET', `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`, { json: false });
  },
  async remove(fileId) {
    try { await this.call('DELETE', `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}`, { json: false }); } catch (e) { if (e.status !== 404) throw e; }
  },
  /* connect: a Google consent screen in a small window, so whatever you were doing stays open */
  connect() {
    if (Store.mode !== 'cloud') { toast(t('Sign in first to connect Google Drive.'), 'bad'); return Promise.resolve(false); }
    if (!this.available) { toast(t('Google Drive sync isn’t switched on for this site yet.'), 'bad', 6000); return Promise.resolve(false); }
    const w = window.open('/auth/drive?next=/auth/drive/done', 'euno-drive', 'popup,width=520,height=680');
    if (!w) { Store.flushAll().then(() => { location.href = `/auth/drive?next=${encodeURIComponent(location.pathname)}`; }); return Promise.resolve(false); }
    // Some browsers report the window as closed while it's on Google's pages, so coming back
    // to this window also checks (for a while), not just the window closing.
    return new Promise((res) => {
      let settled = false;
      const stop = () => { clearInterval(timer); window.removeEventListener('focus', check); };
      const check = async () => {
        if (settled === 'connected') return;
        await this.refreshStatus();
        if (!this.connected()) return;
        stop();
        if (settled !== true) res(true);
        settled = 'connected';
        toast(this.status.email ? t('Google Drive connected ({email}). Your files will sync to it.', { email: this.status.email }) : t('Google Drive connected. Your files will sync to it.'), 'good', 5000);
        Sync.kick(500);
      };
      window.addEventListener('focus', check);
      const timer = setInterval(async () => {
        if (!w.closed) return;
        clearInterval(timer);
        await check();
        if (!settled) { settled = true; res(false); }
      }, 700);
      setTimeout(stop, 10 * 60_000);
    });
  },
  async disconnect() {
    await Api.req('DELETE', '/api/drive');
    this.tok = null; this.exp = 0;
    this.status = { connected: false };
    Bus.emit('sync');
  },
};

/* the providers files can sync to; Dropbox and OneDrive slot in here later */
const PROVIDERS = [Drive];

const Media = {
  doc(id) { return Store.get('media', id); },
  idOf(ref) { return typeof ref === 'string' && ref.startsWith('media:') ? ref.slice(6) : null; },
  /* keep a new file (a Blob, or a ReadableStream with meta.size/meta.type): on this device now,
     and in Drive when sync is on */
  async add(src, { kind = 'rec', name = '', type = '', size = 0 } = {}, onProgress) {
    const id = uid();
    const isBlob = src instanceof Blob;
    const total = isBlob ? src.size : size;
    await DeviceFiles.put(id, src, onProgress && ((n) => onProgress(total ? Math.min(1, n / total) : 0)));
    const saved = isBlob ? src : await DeviceFiles.get(id);
    Store.put('media', { id, name: name || (isBlob && src.name) || `${kind}-${id}`, type: ((isBlob ? src.type : type) || '').split(';')[0], size: saved ? saved.size : total, kind, created: new Date().toISOString(), providers: {} });
    if (!lsGet('persistAsked', false)) { lsSet('persistAsked', true); DeviceFiles.persist(); }
    Sync.kick();
    return `media:${id}`;
  },
  /* put a file back on this device under its existing id (it was missing here) */
  async restore(id, blob, onProgress) {
    await DeviceFiles.put(id, blob, onProgress && ((n) => onProgress(blob.size ? n / blob.size : 1)));
    const d = this.doc(id);
    if (d) Store.patch('media', id, { size: blob.size, type: d.type || (blob.type || '').split(';')[0] });
    this.missing.delete(id);
    Sync.kick();
  },
  pending: new Map(), // id -> promise of a download in progress
  missing: new Set(),
  /* the file as a Blob/File on this device, downloading it once from a provider if needed */
  /* downloads in progress: id -> { fraction, listeners } so every caller sees the progress */
  downloads: new Map(),
  async file(id, onProgress) {
    const local = await DeviceFiles.get(id);
    if (local) return local;
    const d = this.doc(id);
    if (!d) return null;
    const p = PROVIDERS.find((x) => d.providers && d.providers[x.id] && x.connected());
    if (!p) { this.missing.add(id); return null; }
    if (!this.pending.has(id)) {
      const dl = { fraction: 0, listeners: new Set() };
      this.downloads.set(id, dl);
      const job = (async () => {
        const r = await p.download(d.providers[p.id]);
        const total = Number(r.headers.get('content-length')) || d.size || 0;
        await DeviceFiles.put(id, r.body, (n) => {
          if (!total) return;
          dl.fraction = Math.min(1, n / total);
          for (const f of dl.listeners) f(dl.fraction);
        });
        return DeviceFiles.get(id);
      })();
      this.pending.set(id, job);
      job.finally(() => { this.pending.delete(id); this.downloads.delete(id); });
    }
    const dl = this.downloads.get(id);
    if (onProgress && dl) { dl.listeners.add(onProgress); onProgress(dl.fraction); }
    try { return await this.pending.get(id); } catch (e) {
      console.warn('download failed', e);
      if (e.status === 404) { Store.patch('media', id, { providers: { ...d.providers, [p.id]: undefined } }); this.missing.add(id); return null; }
      throw e;
    } finally {
      if (onProgress && dl) dl.listeners.delete(onProgress);
    }
  },
  /* delete everywhere: this device, the providers, and the document */
  async remove(id) {
    const d = this.doc(id);
    await DeviceFiles.del(id);
    if (d && d.providers) {
      for (const p of PROVIDERS) if (d.providers[p.id] && p.connected()) await p.remove(d.providers[p.id]).catch((e) => console.warn('remote delete failed', e));
    }
    if (d) { delete Store.data.media[id]; Store.schedule('media', id, 50); }
  },
  /* free space here: drop device copies of files that are safely in a provider */
  async evictSynced() {
    let n = 0, bytes = 0;
    for (const d of Store.all('media')) {
      if (!PROVIDERS.some((p) => d.providers && d.providers[p.id])) continue;
      if (!(await DeviceFiles.has(d.id))) continue;
      await DeviceFiles.del(d.id); n++; bytes += d.size || 0;
    }
    for (const u of LocalFiles.urls.values()) URL.revokeObjectURL(u);
    LocalFiles.map.clear(); LocalFiles.urls.clear();
    return { n, bytes };
  },
};

/* uploads files that aren't in Drive yet, one at a time, in the background */
const Sync = {
  running: false,
  state: { total: 0, done: 0, current: null, progress: 0, error: null },
  timer: null,
  kick(delay = 1500) {
    if (!Drive.connected()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run(), delay);
  },
  todo() { return Store.all('media').filter((d) => !(d.providers && d.providers.gdrive)); },
  async run() {
    if (this.running || !Drive.connected()) return;
    this.running = true;
    const list = this.todo();
    this.state = { total: list.length, done: 0, current: null, progress: 0, error: null };
    Bus.emit('sync');
    try {
      for (const d of list) {
        const blob = await DeviceFiles.get(d.id);
        if (!blob) { this.state.done++; continue; } // not on this device; the device that has it uploads it
        this.state.current = d.name; this.state.currentId = d.id; this.state.progress = 0;
        Bus.emit('sync');
        const fileId = await Drive.upload(blob, d, (f) => { this.state.progress = f; Bus.emit('sync'); });
        const cur = Store.get('media', d.id);
        if (cur) Store.patch('media', d.id, { providers: { ...(cur.providers || {}), gdrive: fileId } });
        else await Drive.remove(fileId).catch(() => {}); // deleted while uploading
        this.state.done++;
        Bus.emit('sync');
      }
    } catch (e) {
      console.warn('sync stopped', e);
      this.state.error = e.message;
      if (!this.warned) { this.warned = true; toast(t('Google Drive sync paused: {msg}', { msg: e.message }), 'bad', 7000); }
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.run(), 60_000);
    } finally {
      this.running = false;
      this.state.current = null;
      Bus.emit('sync');
    }
  },
};

/* a video's stored file, found on this device or fetched from Drive, handed to the player */
async function attachVideoFile(vid) {
  const id = Media.idOf(vid.fileRef);
  if (!id || LocalFiles.get(vid.id)) return true;
  const el = $('#playerError');
  const d = Media.doc(id);
  let shown = false;
  const mb = (n) => (n / 1048576).toFixed(0);
  const show = (f) => {
    const pct = Math.round(f * 100);
    // build the panel once, then only move the bar
    if (!shown || !el.querySelector('.dl-bar')) {
      mount(el, h('h3', null, t('Getting your video ready')), h('p', null, t('Downloading “{title}” from your Google Drive to this device. It only happens once on each device.', { title: vid.title })),
        h('div', { class: 'bar big dl-bar' }, h('i')), h('p', { class: 'small muted dl-label' }));
      el.hidden = false;
    }
    shown = true;
    el.querySelector('.dl-bar > i').style.width = `${pct}%`;
    el.querySelector('.dl-label').textContent = d && d.size ? t('{pct}% · {done} of {total} MB', { pct, done: mb(f * d.size), total: mb(d.size) }) : `${pct}%`;
  };
  try {
    const file = await Media.file(id, (f) => { if (Player.current() && Player.current().id === vid.id) show(f); });
    if (!file) { if (Player.current() && Player.current().id === vid.id) showMissingVideo(vid); return false; }
    LocalFiles.set(vid.id, file);
    if (Player.current() && Player.current().id === vid.id) {
      if (shown) Player.hideError();
      Player.reloadSrc();
      ensureModels(vid);
      loadSelAudio();
    }
    return true;
  } catch (e) {
    if (Player.current() && Player.current().id === vid.id) {
      mount(el, h('h3', null, t('This video didn’t download')), h('p', null, e.message), h('div', { class: 'row', style: { justifyContent: 'center' } }, btn(t('Try again'), () => attachVideoFile(vid), { kind: 'primary' })));
      el.hidden = false;
    }
    return false;
  }
}

function showMissingVideo(vid) {
  const el = $('#playerError');
  const id = Media.idOf(vid.fileRef);
  const d = Media.doc(id);
  const inDrive = d && d.providers && d.providers.gdrive;
  mount(el,
    h('h3', null, t('This video isn’t on this device')),
    h('p', null, inDrive
      ? t('“{name}” is in your Google Drive, but Drive isn’t connected here. Connect it to download the video, or pick the same file from this device.', { name: (d && d.name) || vid.title })
      : Store.mode === 'cloud'
        ? t('“{name}” was added on another device and isn’t synced. Pick the same file from this device to keep practising here, and turn on Google Drive sync in Settings → Storage so your devices share files.', { name: (d && d.name) || vid.title })
        : t('“{name}” was added on another device and isn’t synced. Pick the same file from this device to keep practising here.', { name: (d && d.name) || vid.title })),
    h('div', { class: 'row', style: { justifyContent: 'center' } },
      inDrive && Store.mode === 'cloud' ? btn(t('Connect Google Drive'), async () => { if (await Drive.connect()) attachVideoFile(vid); }, { kind: 'primary' }) : null,
      filePickButton(t('Re-add the file'), 'video/*,audio/*', async (f) => {
        toast(t('Saving the file on this device…'));
        try { await Media.restore(id, f); Player.hideError(); attachVideoFile(vid); } catch (e) { toast(t('The file couldn’t be saved ({msg}).', { msg: e.message || e.name }), 'bad', 7000); }
      }, { kind: inDrive ? '' : 'primary', icon: 'folder' })));
  el.hidden = false;
}

/* ---------- where files live: Google Drive by default; "only this browser" is an opt-in ---------- */
function storagePrefs() { return Store.get('meta', 'storage') || {}; }
function deviceOnly() { return !!storagePrefs().deviceOnly; }
function setDeviceOnly(on) {
  Store.put('meta', { ...storagePrefs(), id: 'storage', deviceOnly: !!on });
  if (on) DeviceFiles.persist(); // the browser may say no; that's fine
  Bus.emit('sync');
}

/* where one file is, in a few words: for the library and Settings → Storage */
function mediaStatus(ref) {
  const id = Media.idOf(ref);
  const d = id && Media.doc(id);
  if (!d) return null;
  if (d.providers && d.providers.gdrive) return t('in Drive');
  if (Sync.running && Sync.state.currentId === id) return t('uploading {pct}%', { pct: Math.round(Sync.state.progress * 100) });
  if (Drive.connected()) return t('waiting to upload');
  return t('this browser only');
}

function storageCounts() {
  const all = Store.all('media');
  const inDrive = (k) => all.filter((d) => (k ? d.kind === k : true) && d.providers && d.providers.gdrive).length;
  const total = (k) => all.filter((d) => (k ? d.kind === k : true)).length;
  return { all: all.length, inDrive: inDrive(), videos: [inDrive('video'), total('video')], recs: [all.filter((d) => d.kind !== 'video' && d.providers && d.providers.gdrive).length, all.filter((d) => d.kind !== 'video').length] };
}

function driveSummary() {
  if (Store.mode !== 'cloud') return t('Sign in to keep your files in Google Drive.');
  if (!Drive.connected()) return t('Not connected.');
  const c = storageCounts();
  const s = Sync.state;
  const parts = [
    Drive.status.email ? t('Connected as {email}.', { email: Drive.status.email }) : t('Connected.'),
    t('Videos: {n} of {total} in Drive.', { n: c.videos[0], total: c.videos[1] }),
    t('Recordings: {n} of {total} in Drive.', { n: c.recs[0], total: c.recs[1] }),
  ];
  if (Sync.running && s.current) parts.push(t('Uploading “{name}” ({pct}%).', { name: s.current, pct: Math.round(s.progress * 100) }));
  if (s.error && !Sync.running) parts.push(t('Paused: {msg}', { msg: s.error }));
  return parts.join(' ');
}

/* onboarding: connect Drive (recommended), or carry on and decide later */
function storageStepBody() {
  const wrap = h('div', { class: 'stack' });
  const draw = () => {
    storageView.redraw = () => { if (wrap.isConnected) draw(); };
    const on = Drive.connected();
    mount(wrap,
      h('div', { class: 'card' }, h('h3', null, t('Google Drive (recommended)')),
        h('p', { class: 'small muted' }, t('Your videos and recordings go into a “Euno Shadowing” folder in your own Drive, so they’re safe and on every device you sign in on. The app can only see files it puts there, and our server never stores them.')),
        on ? h('p', { class: 'small' }, icon('check'), ' ', Drive.status.email ? t('Connected as {email}.', { email: Drive.status.email }) : t('Connected.'))
          : Store.mode === 'cloud' ? h('div', { class: 'row' }, btn(t('Connect Google Drive'), async () => { await Drive.connect(); draw(); }, { kind: 'primary' })) : null),
      h('p', { class: 'small muted' }, on ? t('You can disconnect it any time in Settings → Storage.') : t('Not now? Press Continue. You can connect Google Drive later in Settings → Storage. Until then, files stay in this browser only.')));
  };
  draw();
  return wrap;
}

function storageView() {
  const root = h('div', { class: 'stack' });
  const draw = async () => {
    const all = Store.all('media');
    const here = (await Promise.all(all.map((d) => DeviceFiles.has(d.id)))).filter(Boolean).length;
    const pending = Drive.connected() ? all.filter((d) => !(d.providers && d.providers.gdrive)) : [];
    const mb = (b) => `${(b / 1048576).toFixed(b < 10 * 1048576 ? 1 : 0)} MB`;
    const cached = all.filter((d) => d.providers && d.providers.gdrive);
    const cloud = Store.mode === 'cloud';
    mount(root,
      h('div', { class: 'card' }, h('h3', null, 'Google Drive'),
        h('p', null, driveSummary()),
        h('p', { class: 'small muted' }, t('Your videos and recordings live in a “Euno Shadowing” folder in your own Drive, so they’re on every device you sign in on. The app can only see files it puts there, and our server never stores them. Dropbox and OneDrive are coming later.')),
        pending.length ? h('details', null, h('summary', null, tp(pending.length, '{n} file not in Drive yet', '{n} files not in Drive yet')),
          h('ul', { class: 'small', style: { margin: '6px 0 0', paddingLeft: '20px' } }, pending.slice(0, 30).map((d) => h('li', null, `${d.name} (${mediaStatus(`media:${d.id}`)})`))),
          h('p', { class: 'small muted' }, t('A file added on another device uploads from that device.'))) : null,
        !cloud ? null : Drive.connected()
          ? h('div', { class: 'row' },
            pending.length ? btn(t('Upload now'), () => { Sync.warned = false; Sync.kick(0); }, { size: 'sm', icon: 'upload' }) : null,
            btn(t('Disconnect'), async () => {
              if (!confirm(t('Disconnect Google Drive? Files already in your Drive stay there. New files will only be kept in this browser.'))) return;
              try { await Drive.disconnect(); toast(t('Google Drive disconnected.')); } catch (e) { toast(e.message, 'bad'); }
              draw();
            }, { size: 'sm', kind: 'ghost' }))
          : h('div', { class: 'row' }, btn(t('Connect Google Drive'), async () => { await Drive.connect(); draw(); }, { kind: 'primary', size: 'sm' }))),
      h('details', { class: 'card' }, h('summary', null, h('strong', null, t('This browser'))),
        h('p', { class: 'small muted' }, Drive.connected()
          ? t('Files you open are kept in this browser so they play instantly and work offline: {n} of {total} right now. If the browser clears them, they download again from Drive.', { n: here, total: all.length })
          : t('Files you open are kept in this browser so they play instantly and work offline: {n} of {total} right now.', { n: here, total: all.length })),
        Drive.connected() && cached.length && here ? h('div', { class: 'row' }, btn(t('Free up space'), async () => { const r = await Media.evictSynced(); toast(tp(r.n, 'Removed {n} file ({size}) from this browser. It’s still in your Drive.', 'Removed {n} files ({size}) from this browser. They’re still in your Drive.', { size: mb(r.bytes) }), 'good'); if (!Session.active) Player.load(UI.videoId, { keepClip: true }); draw(); }, { size: 'sm' })) : null,
        !Drive.connected() ? h('label', { class: 'check', for: 'stDeviceOnly' },
          h('input', { type: 'checkbox', id: 'stDeviceOnly', checked: deviceOnly(), onchange: (e) => { setDeviceOnly(e.target.checked); draw(); } }),
          t('Keep files only in this browser, without Google Drive')) : null,
        !Drive.connected() && deviceOnly() ? h('p', { class: 'small muted' }, t('Files are only on this device, and the browser can clear them if the device runs very low on space. Export a backup from Settings → Data now and then, and keep your original video files.')) : null));
  };
  draw();
  storageView.redraw = () => { if (root.isConnected) draw(); };
  return root;
}

/* after Store.init(): Drive status, background sync, and redrawing Settings → Storage as uploads progress */
function initMedia() {
  Drive.status = Api.drive || { connected: false };
  Drive.available = !!Api.driveAvailable;
  let queued = false;
  Bus.on('sync', () => {
    if (queued) return;
    queued = true;
    setTimeout(() => {
      queued = false;
      if (storageView.redraw) storageView.redraw();
      if (!UI.addOpen && !UI.editVideoId) renderSidebar(); // "in Drive" / "uploading" on each video
    }, 400);
  });
  handleDriveReturn();
  Sync.kick(4000);
}

/* coming back from connecting Drive without the small window (pop-ups blocked) */
function handleDriveReturn() {
  const q = new URLSearchParams(location.search);
  const r = q.get('drive');
  if (!r) return;
  if (r === 'connected') { toast(t('Google Drive connected. Your files will sync to it.'), 'good', 5000); Sync.kick(); }
  else if (r === 'cancelled') toast(t('Google Drive wasn’t connected. You can connect it any time in Settings → Storage.'), '', 6000);
  else toast(q.get('reason') || t('Google Drive couldn’t be connected.'), 'bad', 8000);
  q.delete('drive'); q.delete('reason');
  history.replaceState(null, '', location.pathname + (q.toString() ? `?${q}` : '') + location.hash);
}

/* ---- 20-dsp.js ---- */
/* ---------- signal analysis: pitch (YIN), loudness, alignment, rough measures ---------- */
const SR = 16000; // analysis sample rate
const HOP = 160; // 10 ms
const HOP_S = HOP / SR;
const WIN = 400; // 25 ms analysis window
const F0_MIN = 65;
const F0_MAX = 450;

const DSP = {
  /* simple anti-aliased decimation (box filter + linear interpolation) */
  resample(input, fromRate, toRate = SR) {
    if (fromRate === toRate) return Float32Array.from(input);
    const ratio = fromRate / toRate;
    const n = Math.floor(input.length / ratio);
    const out = new Float32Array(n);
    const half = Math.max(0, Math.floor(ratio / 2));
    for (let i = 0; i < n; i++) {
      const c = i * ratio;
      const j = Math.floor(c);
      if (half > 0) {
        let s = 0, cnt = 0;
        for (let k = j - half; k <= j + half; k++) if (k >= 0 && k < input.length) { s += input[k]; cnt++; }
        out[i] = cnt ? s / cnt : 0;
      } else {
        const f = c - j;
        out[i] = (input[j] || 0) * (1 - f) + (input[j + 1] || 0) * f;
      }
    }
    return out;
  },

  /* YIN pitch estimate on x[start .. start+WIN+tauMax) */
  yin(x, start, diff) {
    const tauMin = Math.floor(SR / F0_MAX);
    const tauMax = Math.floor(SR / F0_MIN);
    if (start + WIN + tauMax > x.length) return [0, 0];
    diff[0] = 1;
    let running = 0;
    for (let tau = 1; tau <= tauMax; tau++) {
      let s = 0;
      for (let j = 0; j < WIN; j++) {
        const d = x[start + j] - x[start + j + tau];
        s += d * d;
      }
      running += s;
      diff[tau] = running > 0 ? (s * tau) / running : 1;
    }
    const thr = 0.15;
    let tau = -1;
    for (let t = tauMin; t <= tauMax; t++) {
      if (diff[t] < thr) {
        while (t + 1 <= tauMax && diff[t + 1] < diff[t]) t++;
        tau = t;
        break;
      }
    }
    if (tau < 0) {
      // no dip under threshold: take the global minimum but report low confidence
      let best = tauMin;
      for (let t = tauMin; t <= tauMax; t++) if (diff[t] < diff[best]) best = t;
      tau = best;
    }
    const a = diff[tau - 1] ?? diff[tau], b = diff[tau], c = diff[tau + 1] ?? diff[tau];
    const denom = a - 2 * b + c;
    const shift = denom ? (0.5 * (a - c)) / denom : 0;
    const t = tau + clamp(shift, -1, 1);
    return [SR / t, clamp(1 - b, 0, 1)];
  },

  rmsDb(x, start, len) {
    let s = 0;
    const end = Math.min(x.length, start + len);
    for (let i = start; i < end; i++) s += x[i] * x[i];
    const r = Math.sqrt(s / Math.max(1, end - start));
    return 20 * Math.log10(r + 1e-6);
  },

  /* analyse a mono 16 kHz signal: per 10 ms frame, f0 (Hz, 0 = none), confidence, loudness (dB) */
  analyse(x) {
    const n = Math.max(0, Math.floor((x.length - WIN) / HOP));
    const f0 = new Float32Array(n), conf = new Float32Array(n), db = new Float32Array(n);
    const diff = new Float32Array(Math.floor(SR / F0_MIN) + 2);
    for (let i = 0; i < n; i++) db[i] = this.rmsDb(x, i * HOP, WIN);
    const loud = percentile(Array.from(db), 0.95);
    const gate = loud - 30;
    for (let i = 0; i < n; i++) {
      if (db[i] < gate) continue;
      const [f, c] = this.yin(x, i * HOP, diff);
      f0[i] = f; conf[i] = c;
    }
    return { f0, conf, db, hop: HOP_S };
  },

  /* smooth, remove unreliable stretches and octave jumps; returns Float32 Hz with NaN for gaps */
  cleanPitch(f0, conf, smoothing = 5) {
    const n = f0.length;
    const out = new Float32Array(n).fill(NaN);
    for (let i = 0; i < n; i++) if (f0[i] > 0 && conf[i] > 0.75) out[i] = f0[i];
    // octave-jump fix against a running median
    const med = median(Array.from(out));
    if (isFinite(med)) {
      for (let i = 0; i < n; i++) {
        const v = out[i];
        if (!isFinite(v)) continue;
        const r = v / med;
        if (r > 1.8 && r < 2.3) out[i] = v / 2;
        else if (r < 0.56 && r > 0.43) out[i] = v * 2;
        else if (r > 2.6 || r < 0.38) out[i] = NaN;
      }
    }
    // median filter
    const k = Math.max(1, Math.floor(smoothing / 2));
    const sm = new Float32Array(n).fill(NaN);
    for (let i = 0; i < n; i++) {
      if (!isFinite(out[i])) continue;
      const win = [];
      for (let j = i - k; j <= i + k; j++) if (j >= 0 && j < n && isFinite(out[j])) win.push(out[j]);
      sm[i] = median(win);
    }
    // drop islands shorter than 40 ms
    let i = 0;
    while (i < n) {
      if (!isFinite(sm[i])) { i++; continue; }
      let j = i;
      while (j < n && isFinite(sm[j])) j++;
      if (j - i < 4) for (let q = i; q < j; q++) sm[q] = NaN;
      i = j;
    }
    return sm;
  },

  /* semitones relative to the speaker's own median pitch */
  toSemitones(hz) {
    const ref = median(Array.from(hz));
    const st = Array.from(hz, (v) => (isFinite(v) && isFinite(ref) ? 12 * Math.log2(v / ref) : null));
    return { st, refHz: isFinite(ref) ? ref : null };
  },

  /* the compact "model line" stored with each clip */
  modelFromSamples(x, smoothing) {
    const a = this.analyse(x);
    const clean = this.cleanPitch(a.f0, a.conf, smoothing);
    const { st, refHz } = this.toSemitones(clean);
    const voiced = Array.from(a.f0).filter((v) => v > 0).length;
    const reliable = st.filter((v) => v != null).length;
    return {
      hop: HOP_S,
      st: st.map((v) => (v == null ? null : Math.round(v * 10) / 10)),
      db: Array.from(a.db, (v) => Math.round(v)),
      refHz: refHz && Math.round(refHz),
      onset: this.onset(a.db) * HOP_S,
      reliability: voiced ? round(reliable / voiced, 2) : 0,
      measures: this.measures(a.db, st),
    };
  },

  /* first frame where loudness rises well above the noise floor for 50 ms */
  onset(db, startAt = 0) {
    const arr = Array.from(db);
    const floor = percentile(arr, 0.1);
    const peak = percentile(arr, 0.97);
    const thr = Math.max(floor + 12, peak - 28);
    for (let i = startAt; i < arr.length - 5; i++) {
      let ok = true;
      for (let k = 0; k < 5; k++) if (arr[i + k] < thr) { ok = false; break; }
      if (ok) return i;
    }
    return 0;
  },

  /* normalised envelope for alignment */
  envForAlign(db) {
    const arr = Array.from(db, (v) => (v == null ? -80 : v));
    const floor = percentile(arr, 0.15);
    const peak = percentile(arr, 0.98);
    const span = Math.max(6, peak - floor);
    const e = arr.map((v) => clamp((v - floor) / span, 0, 1));
    const m = mean(e);
    return e.map((v) => v - m);
  },

  /* best shift d (frames) such that user[t + d] ~ model[t]; positive d = user behind */
  xcorr(model, user, minLag, maxLag) {
    let best = 0, bestScore = -Infinity;
    const scores = [];
    for (let d = minLag; d <= maxLag; d++) {
      let s = 0, na = 0, nb = 0;
      for (let t = 0; t < model.length; t++) {
        const u = t + d;
        if (u < 0 || u >= user.length) continue;
        s += model[t] * user[u]; na += model[t] * model[t]; nb += user[u] * user[u];
      }
      const score = na && nb ? s / Math.sqrt(na * nb) : -1;
      scores.push(score);
      if (score > bestScore) { bestScore = score; best = d; }
    }
    // confidence: how much the peak stands out from the rest
    const sorted = scores.slice().sort((a, b) => b - a);
    const second = sorted[Math.min(sorted.length - 1, 25)] ?? -1;
    return { lag: best, score: bestScore, margin: bestScore - second };
  },

  /* syllable-ish nuclei: loudness peaks in voiced stretches */
  nuclei(db, st) {
    const n = db.length;
    const sm = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0, c = 0;
      for (let k = -3; k <= 3; k++) if (i + k >= 0 && i + k < n) { s += db[i + k]; c++; }
      sm[i] = s / c;
    }
    const peak = percentile(Array.from(sm), 0.97);
    const peaks = [];
    for (let i = 4; i < n - 4; i++) {
      if (sm[i] < peak - 22) continue;
      if (!(sm[i] >= sm[i - 1] && sm[i] > sm[i + 1])) continue;
      const voiced = st ? [i - 2, i, i + 2].some((j) => st[j] != null) : true;
      if (!voiced) continue;
      // prominence: dip of at least 2 dB to each side before the next peak
      let l = i, r = i;
      while (l > 0 && sm[l - 1] <= sm[l] + 0.2 && i - l < 25) l--;
      while (r < n - 1 && sm[r + 1] <= sm[r] + 0.2 && r - i < 25) r++;
      if (sm[i] - Math.max(sm[l], sm[r]) < 2) continue;
      if (peaks.length && i - peaks[peaks.length - 1].i < 8) {
        if (sm[i] > peaks[peaks.length - 1].v) peaks[peaks.length - 1] = { i, v: sm[i], l, r };
        continue;
      }
      peaks.push({ i, v: sm[i], l, r });
    }
    // width at -6 dB as a rough syllable length
    for (const p of peaks) {
      let a = p.i, b = p.i;
      while (a > 0 && sm[a] > p.v - 6) a--;
      while (b < n - 1 && sm[b] > p.v - 6) b++;
      p.dur = (b - a) * HOP_S;
    }
    return peaks;
  },

  /* rough, clearly-labelled measures (not an accent score) */
  measures(db, st) {
    const arr = Array.from(db);
    const floor = percentile(arr, 0.1), peak = percentile(arr, 0.97);
    const speech = arr.filter((v) => v > Math.max(floor + 10, peak - 30)).length * HOP_S;
    const peaks = this.nuclei(arr, st);
    const vols = peaks.map((p) => p.v);
    const cut = percentile(vols, 0.7);
    const stressed = peaks.filter((p) => p.v >= cut).map((p) => p.dur);
    const unstressed = peaks.filter((p) => p.v < cut).map((p) => p.dur);
    const stv = (st || []).filter((v) => v != null);
    return {
      rate: speech > 0.5 ? round(peaks.length / speech, 2) : null,
      stressRatio: stressed.length && unstressed.length ? round(mean(stressed) / mean(unstressed), 2) : null,
      range: stv.length > 20 ? round(percentile(stv, 0.9) - percentile(stv, 0.1), 1) : null,
      syllables: peaks.length,
      speechSec: round(speech, 1),
    };
  },

  /* quiet stretches (pauses) in a dB envelope: [{a, b}] in frames */
  pauses(db, minFrames = 15) {
    const arr = Array.from(db);
    const floor = percentile(arr, 0.1), peak = percentile(arr, 0.97);
    const thr = Math.max(floor + 8, peak - 26);
    const out = [];
    let i = 0;
    while (i < arr.length) {
      if (arr[i] >= thr) { i++; continue; }
      let j = i;
      while (j < arr.length && arr[j] < thr) j++;
      if (j - i >= minFrames) out.push({ a: i, b: j });
      i = j;
    }
    return { pauses: out, thr };
  },

  /* 16-bit mono WAV encoder (used for the blind listener pack) */
  wav(samples, rate = SR) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data');
    v.setUint32(40, samples.length * 2, true);
    let peak = 0;
    for (let i = 0; i < samples.length; i++) peak = Math.max(peak, Math.abs(samples[i]));
    const g = peak > 0 ? 0.89 / peak : 1;
    for (let i = 0; i < samples.length; i++) v.setInt16(44 + i * 2, clamp(samples[i] * g, -1, 1) * 32767, true);
    return new Uint8Array(buf);
  },
};

/* ---- 25-mp4audio.js ---- */
/* ---------- read just a stretch of audio from an MP4, without downloading the whole video ----------
   Finds the audio track's sample table in the file's index (moov box), fetches only the byte
   ranges that hold the audio for the requested time span, and decodes them with WebCodecs.
   Decodes with WebCodecs where the browser has it, otherwise wraps the AAC frames as an ADTS stream
   for the ordinary audio decoder. Errors marked .permanent mean this file can't be read in pieces
   here; anything else (a network blip) is worth retrying. */
const permanent = (msg) => Object.assign(new Error(msg), { permanent: true });
const Mp4Audio = {
  tables: new Map(), // cache key -> parsed audio track (sample table etc.)

  /* a byte reader over a URL (HTTP Range) or a local File */
  reader(src) {
    if (src instanceof Blob) {
      return { size: async () => src.size, read: async (a, b) => new Uint8Array(await src.slice(a, b + 1).arrayBuffer()) };
    }
    let total = null;
    const read = async (a, b) => {
      const r = await fetch(src, { headers: { range: `bytes=${a}-${b}` }, credentials: 'same-origin' });
      if (r.status !== 206) throw r.ok ? permanent('no range support') : new Error(`HTTP ${r.status}`);
      const cr = r.headers.get('content-range');
      if (cr && total == null) total = +cr.split('/')[1];
      return new Uint8Array(await r.arrayBuffer());
    };
    return { read, size: async () => { if (total == null) await read(0, 15); return total; } };
  },

  async track(key, rd) {
    if (this.tables.has(key)) return this.tables.get(key);
    const total = await rd.size();
    // walk the top-level boxes until we reach moov (often at the end of downloaded videos)
    let off = 0, moov = null;
    while (off < total) {
      const hb = await rd.read(off, Math.min(total - 1, off + 15));
      const dv = new DataView(hb.buffer, hb.byteOffset, hb.byteLength);
      let size = dv.getUint32(0);
      const type = String.fromCharCode(hb[4], hb[5], hb[6], hb[7]);
      if (size === 1) size = Number(dv.getBigUint64(8));
      else if (size === 0) size = total - off;
      if (size < 8) throw permanent('bad box');
      if (type === 'moov') { moov = await rd.read(off, off + size - 1); break; }
      off += size;
    }
    if (!moov) throw permanent('no moov');
    const t = this.parseMoov(moov);
    this.tables.set(key, t);
    return t;
  },

  boxes(u8, start, end) {
    const out = [];
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let p = start;
    while (p + 8 <= end) {
      let size = dv.getUint32(p), hdr = 8;
      const type = String.fromCharCode(u8[p + 4], u8[p + 5], u8[p + 6], u8[p + 7]);
      if (size === 1) { size = Number(dv.getBigUint64(p + 8)); hdr = 16; } else if (size === 0) size = end - p;
      if (size < hdr) break;
      out.push({ type, start: p, body: p + hdr, end: Math.min(end, p + size) });
      p += size;
    }
    return out;
  },
  child(u8, box, type) { return this.boxes(u8, box.body, box.end).find((b) => b.type === type); },

  parseMoov(u8) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const moov = this.boxes(u8, 0, u8.length)[0];
    for (const trak of this.boxes(u8, moov.body, moov.end).filter((b) => b.type === 'trak')) {
      const mdia = this.child(u8, trak, 'mdia');
      const hdlr = mdia && this.child(u8, mdia, 'hdlr');
      if (!hdlr || String.fromCharCode(...u8.subarray(hdlr.body + 8, hdlr.body + 12)) !== 'soun') continue;
      const mdhd = this.child(u8, mdia, 'mdhd');
      const timescale = u8[mdhd.body] === 1 ? dv.getUint32(mdhd.body + 20) : dv.getUint32(mdhd.body + 12);
      // edit list: media time where the track starts (skips encoder priming)
      let mediaStart = 0;
      const edts = this.child(u8, trak, 'edts');
      const elst = edts && this.child(u8, edts, 'elst');
      if (elst) {
        const v = u8[elst.body], n = dv.getUint32(elst.body + 4);
        for (let i = 0, p = elst.body + 8; i < n; i++) {
          const mt = v === 1 ? Number(dv.getBigInt64(p + 8)) : dv.getInt32(p + 4);
          p += v === 1 ? 20 : 12;
          if (mt >= 0) { mediaStart = mt; break; }
        }
      }
      const stbl = this.child(u8, this.child(u8, mdia, 'minf'), 'stbl');
      const cfg = this.audioConfig(u8, dv, this.child(u8, stbl, 'stsd'));
      // sample sizes
      const stsz = this.child(u8, stbl, 'stsz');
      const fixed = dv.getUint32(stsz.body + 4), count = dv.getUint32(stsz.body + 8);
      const sizes = new Uint32Array(count);
      for (let i = 0; i < count; i++) sizes[i] = fixed || dv.getUint32(stsz.body + 12 + i * 4);
      // chunk offsets
      const stco = this.child(u8, stbl, 'stco'), co64 = this.child(u8, stbl, 'co64');
      const cb = stco || co64, nChunks = dv.getUint32(cb.body + 4);
      const chunkOff = new Float64Array(nChunks);
      for (let i = 0; i < nChunks; i++) chunkOff[i] = co64 ? Number(dv.getBigUint64(cb.body + 8 + i * 8)) : dv.getUint32(cb.body + 8 + i * 4);
      // samples per chunk -> byte offset of every sample
      const stsc = this.child(u8, stbl, 'stsc'), nStsc = dv.getUint32(stsc.body + 4);
      const offsets = new Float64Array(count);
      let s = 0;
      for (let e = 0; e < nStsc; e++) {
        const first = dv.getUint32(stsc.body + 8 + e * 12) - 1, per = dv.getUint32(stsc.body + 12 + e * 12);
        const last = e + 1 < nStsc ? dv.getUint32(stsc.body + 8 + (e + 1) * 12) - 1 : nChunks;
        for (let c = first; c < last && s < count; c++) {
          let o = chunkOff[c];
          for (let k = 0; k < per && s < count; k++) { offsets[s] = o; o += sizes[s]; s++; }
        }
      }
      // decode times
      const stts = this.child(u8, stbl, 'stts'), nStts = dv.getUint32(stts.body + 4);
      const dts = new Float64Array(count);
      let t = 0; s = 0;
      for (let e = 0; e < nStts; e++) {
        const n = dv.getUint32(stts.body + 8 + e * 8), d = dv.getUint32(stts.body + 12 + e * 8);
        for (let k = 0; k < n && s < count; k++) { dts[s++] = t; t += d; }
      }
      return { timescale, mediaStart, sizes, offsets, dts, count, ...cfg };
    }
    throw permanent('no audio track');
  },

  audioConfig(u8, dv, stsd) {
    const entry = this.boxes(u8, stsd.body + 8, stsd.end)[0];
    if (!entry || (entry.type !== 'mp4a' && entry.type !== 'Opus')) throw permanent(`audio codec ${entry && entry.type} not supported`);
    const b = entry.body;
    const version = dv.getUint16(b + 8);
    const channels = dv.getUint16(b + 16);
    const rate = dv.getUint32(b + 24) >>> 16;
    const childStart = b + 28 + (version === 1 ? 16 : version === 2 ? 36 : 0);
    if (entry.type === 'Opus') return { codec: 'opus', channels, rate: 48000, asc: undefined };
    const esds = this.boxes(u8, childStart, entry.end).find((x) => x.type === 'esds');
    if (!esds) throw permanent('no esds');
    // walk the MPEG-4 descriptors down to DecoderSpecificInfo (the AudioSpecificConfig)
    let p = esds.body + 4;
    const desc = () => { const tag = u8[p++]; let len = 0, c; do { c = u8[p++]; len = (len << 7) | (c & 0x7f); } while (c & 0x80); return { tag, len }; };
    let d = desc();
    if (d.tag !== 3) throw permanent('bad esds');
    p += 2; const flags = u8[p++];
    if (flags & 0x80) p += 2;
    if (flags & 0x40) p += 1 + u8[p];
    if (flags & 0x20) p += 2;
    d = desc();
    if (d.tag !== 4) throw permanent('bad esds');
    const oti = u8[p];
    if (oti !== 0x40 && oti !== 0x66 && oti !== 0x67) throw permanent('not AAC');
    p += 13;
    d = desc();
    if (d.tag !== 5) throw permanent('no AudioSpecificConfig');
    const asc = u8.slice(p, p + d.len);
    let aot = asc[0] >> 3;
    if (aot === 31) aot = 32 + (((asc[0] & 7) << 3) | (asc[1] >> 5));
    return { codec: `mp4a.40.${aot}`, channels, rate, asc };
  },

  /* can this browser decode the track with WebCodecs? */
  async webCodecs(T) {
    if (typeof AudioDecoder === 'undefined') return null;
    const cfg = { codec: T.codec, sampleRate: T.rate, numberOfChannels: T.channels };
    if (T.asc) cfg.description = T.asc;
    try { return (await AudioDecoder.isConfigSupported(cfg)).supported ? cfg : null; } catch { return null; }
  },

  /* decode [t0, t1] seconds to mono 16 kHz */
  async extract(key, src, t0, t1, onProgress) {
    const rd = this.reader(src);
    const T = await this.track(key, rd);
    const cfg = await this.webCodecs(T);
    if (!cfg && !T.asc) throw permanent(`${T.codec} audio can't be decoded in pieces in this browser`);
    const secOf = (i) => (T.dts[i] - T.mediaStart) / T.timescale;
    let i0 = 0, i1 = T.count - 1;
    while (i0 < T.count - 1 && secOf(i0 + 1) <= t0) i0++;
    i0 = Math.max(0, i0 - 2); // a little pre-roll for the decoder
    while (i1 > i0 && secOf(i1) > t1) i1--;
    // group samples into byte ranges (audio sits in chunks between video data)
    const ranges = [];
    for (let i = i0; i <= i1; i++) {
      const a = T.offsets[i], b = a + T.sizes[i] - 1;
      const last = ranges[ranges.length - 1];
      if (last && a - last.b <= 16384) { last.b = Math.max(last.b, b); last.i1 = i; } else ranges.push({ a, b, i0: i, i1: i });
    }
    const bufs = new Array(ranges.length);
    let done = 0, next = 0;
    const worker = async () => {
      while (next < ranges.length) {
        const k = next++;
        bufs[k] = await rd.read(ranges[k].a, ranges[k].b);
        done++;
        onProgress && onProgress(done / ranges.length);
      }
    };
    await Promise.all(Array.from({ length: Math.min(6, ranges.length) }, worker));
    const frames = [];
    ranges.forEach((r, k) => {
      for (let i = r.i0; i <= r.i1; i++) { const o = T.offsets[i] - r.a; frames.push({ i, data: bufs[k].subarray(o, o + T.sizes[i]) }); }
    });
    const startSec = secOf(i0);
    let mono, rate, via = 'WebCodecs';
    if (cfg) {
      try { ({ mono, rate } = await this.decodeWebCodecs(T, cfg, frames, startSec, secOf(i1))); } catch (e) { if (!T.asc) throw e; }
    }
    if (!mono) {
      const adts = this.adts(T, frames);
      try { mono = await AudioEng.decode(adts.buffer); } catch (e) { throw permanent(`AAC can't be decoded in this browser (${e.message || e.name})`); }
      rate = SR; via = 'ADTS';
    }
    // trim to the asked span and resample
    const a = clamp(Math.round((t0 - startSec) * rate), 0, mono.length);
    const b = clamp(Math.round((t1 - startSec) * rate), a, mono.length);
    return { samples: rate === SR ? mono.slice(a, b) : DSP.resample(mono.subarray(a, b), rate, SR), t0: startSec + a / rate, t1: startSec + b / rate, via };
  },

  async decodeWebCodecs(T, cfg, frames, startSec, endSec) {
    const outRate = T.rate;
    const total = Math.ceil((endSec - startSec + 0.2) * outRate);
    const mono = new Float32Array(total);
    let err = null;
    const dec = new AudioDecoder({
      output: (ad) => {
        const n = ad.numberOfFrames, ch = ad.numberOfChannels;
        const at = Math.round((ad.timestamp / 1e6 - startSec) * outRate);
        const tmp = new Float32Array(n);
        for (let c = 0; c < ch; c++) {
          ad.copyTo(tmp, { planeIndex: c, format: 'f32-planar' });
          for (let j = 0; j < n; j++) if (at + j >= 0 && at + j < total) mono[at + j] += tmp[j] / ch;
        }
        ad.close();
      },
      error: (e) => { err = e; },
    });
    dec.configure(cfg);
    const secOf = (i) => (T.dts[i] - T.mediaStart) / T.timescale;
    for (const f of frames) dec.decode(new EncodedAudioChunk({ type: 'key', timestamp: Math.round(secOf(f.i) * 1e6), data: f.data }));
    await dec.flush();
    dec.close();
    if (err) throw err;
    return { mono, rate: outRate };
  },

  /* AAC frames -> an ADTS stream (what .aac files are), which every browser's audio decoder reads */
  adts(T, frames) {
    const asc = T.asc;
    const aot = asc[0] >> 3, sfi = ((asc[0] & 7) << 1) | (asc[1] >> 7), chans = (asc[1] >> 3) & 15;
    if (aot < 1 || aot > 4 || sfi > 12 || !chans) throw permanent('this AAC flavour can’t be decoded in pieces in this browser');
    const out = new Uint8Array(frames.reduce((n, f) => n + f.data.length + 7, 0));
    let p = 0;
    for (const f of frames) {
      const len = f.data.length + 7;
      out[p] = 0xff; out[p + 1] = 0xf1;
      out[p + 2] = ((aot - 1) << 6) | (sfi << 2) | (chans >> 2);
      out[p + 3] = ((chans & 3) << 6) | (len >> 11);
      out[p + 4] = (len >> 3) & 0xff;
      out[p + 5] = ((len & 7) << 5) | 0x1f;
      out[p + 6] = 0xfc;
      out.set(f.data, p + 7);
      p += len;
    }
    return out;
  },
};

/* ---- 30-audio.js ---- */
/* ---------- audio plumbing: context, reading video audio, microphone, recording ---------- */
const AudioEng = {
  ctx: null,
  getCtx() {
    if (!this.ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = new C({ latencyHint: 'interactive' });
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  /* decode any audio/video bytes to mono 16 kHz */
  async decode(arrayBuffer) {
    const C = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const off = new C(1, SR, SR);
    const ab = await new Promise((res, rej) => {
      const p = off.decodeAudioData(arrayBuffer, res, rej);
      if (p && p.then) p.then(res, rej);
    });
    if (ab.sampleRate === SR && ab.numberOfChannels === 1) return ab.getChannelData(0).slice();
    const ch0 = ab.getChannelData(0);
    let mono = ch0;
    if (ab.numberOfChannels > 1) {
      mono = new Float32Array(ch0.length);
      for (let c = 0; c < ab.numberOfChannels; c++) {
        const d = ab.getChannelData(c);
        for (let i = 0; i < d.length; i++) mono[i] += d[i] / ab.numberOfChannels;
      }
    }
    return DSP.resample(mono, ab.sampleRate, SR);
  },
  async decodeBlob(blob) { return this.decode(await blob.arrayBuffer()); },
};

/* reading a video's soundtrack (needs CORS from the host, a stored copy, or a local file) */
const VideoAudio = {
  cache: new Map(), // videoId -> {status, segments: [{t0, t1, samples}], full, error, progress, mp4Failed, chain}
  state(videoId) { return this.cache.get(videoId) || { status: 'idle' }; },
  entry(videoId) {
    if (!this.cache.has(videoId)) this.cache.set(videoId, { status: 'idle', segments: [], full: null, chain: Promise.resolve() });
    return this.cache.get(videoId);
  },
  /* samples for [t0, t1] if already decoded, else null */
  slice(videoId, t0, t1) {
    const e = this.cache.get(videoId);
    if (!e) return null;
    if (e.full) {
      const a = clamp(Math.floor(t0 * SR), 0, e.full.length), b = clamp(Math.floor(t1 * SR), 0, e.full.length);
      return e.full.subarray(a, b);
    }
    const seg = e.segments.find((g) => g.t0 <= t0 + 0.02 && g.t1 >= t1 - 0.02);
    if (!seg) return null;
    const a = clamp(Math.round((t0 - seg.t0) * SR), 0, seg.samples.length), b = clamp(Math.round((t1 - seg.t0) * SR), 0, seg.samples.length);
    return seg.samples.subarray(a, b);
  },
  /* make sure [t0, t1] is decoded: reads only that stretch of an MP4; falls back to the whole file */
  ensure(video, t0, t1, onProgress) {
    const e = this.entry(video.id);
    t0 = Math.max(0, t0);
    const job = e.chain.then(async () => {
      if (this.slice(video.id, t0, t1)) return e;
      e.status = 'loading'; e.progress = 0;
      Bus.emit('videoaudio', video.id);
      const local = LocalFiles.get(video.id);
      const src = local || videoSrc(video);
      if (!e.mp4Failed) {
        // a little extra either side, so small edge nudges don't need another fetch
        const want0 = Math.max(0, t0 - 1), want1 = t1 + 1;
        let lastErr = null;
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const r = await Mp4Audio.extract(`${video.id}|${local ? local.name : src}`, src, want0, want1, (f) => { e.progress = f; onProgress && onProgress(f); });
            // pad with silence where the file has no audio (before the track starts, past the end), so the span is fully covered
            const pre = Math.max(0, Math.round((r.t0 - want0) * SR)), post = Math.max(0, Math.round((want1 - r.t1) * SR));
            const samples = new Float32Array(pre + r.samples.length + post);
            samples.set(r.samples, pre);
            e.segments.push({ t0: Math.min(want0, r.t0), t1: Math.max(want1, r.t1), samples });
            if (e.segments.length > 24) e.segments.shift();
            e.status = 'ready'; e.error = null; e.method = 'partial'; e.via = r.via;
            Bus.emit('videoaudio', video.id);
            return e;
          } catch (err) {
            lastErr = err;
            if (err.permanent) break;
            await sleep(600 * (attempt + 1)); // a network blip: try again rather than falling back to the whole file
          }
        }
        if (!lastErr.permanent) {
          e.status = 'error';
          e.error = t('Couldn’t read the video’s sound ({msg}). Try again in a moment.', { msg: lastErr.message || t('network error') });
          Bus.emit('videoaudio', video.id);
          return e;
        }
        e.mp4Failed = lastErr.message || String(lastErr);
        console.info('partial audio read unavailable, decoding the whole file:', e.mp4Failed);
      }
      // reading the whole file is only sensible for small files; a long video would mean downloading hundreds of MB
      const size = local ? 0 : video.size || 0;
      if (size > 150 * 1024 * 1024) {
        e.status = 'error';
        e.error = t('This video’s sound can’t be read in pieces in this browser ({reason}), and the file is too big ({mb} MB) to read whole. Chrome or Edge can read it.', { reason: e.mp4Failed, mb: Math.round(size / 1048576) });
        Bus.emit('videoaudio', video.id);
        return e;
      }
      await this.decodeWhole(video, e, onProgress);
      Bus.emit('videoaudio', video.id);
      return e;
    });
    e.chain = job.catch(() => {});
    return job;
  },
  async decodeWhole(video, entry, onProgress) {
    try {
      let buf;
      const local = LocalFiles.get(video.id);
      if (local) buf = await local.arrayBuffer();
      else {
        const src = videoSrc(video);
        let resp;
        try {
          resp = await fetch(src, src.startsWith('/') ? { credentials: 'same-origin' } : { mode: 'cors', credentials: 'omit' });
        } catch (e) {
          throw Object.assign(new Error('blocked'), { code: 'blocked' });
        }
        if (!resp.ok) throw Object.assign(new Error(`HTTP ${resp.status}`), { code: 'http' });
        const total = +resp.headers.get('content-length') || 0;
        if (resp.body && total) {
          const reader = resp.body.getReader();
          const parts = [];
          let got = 0;
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            parts.push(value); got += value.length;
            entry.progress = got / total;
            onProgress && onProgress(entry.progress);
          }
          const all = new Uint8Array(got);
          let o = 0;
          for (const p of parts) { all.set(p, o); o += p.length; }
          buf = all.buffer;
        } else buf = await resp.arrayBuffer();
      }
      entry.status = 'decoding';
      entry.full = await AudioEng.decode(buf);
      entry.status = 'ready'; entry.error = null; entry.method = 'whole';
    } catch (e) {
      entry.status = 'error';
      entry.error = e.code === 'blocked'
        ? t('This video’s host doesn’t let the app read its sound (no CORS permission, or the page’s security rules block it). Playback still works if the video plays. For the waveform and pitch line, load a copy of the video file from this device.')
        : e.code === 'http' ? t('The video link answered with an error ({msg}).', { msg: e.message }) : t('The sound couldn’t be decoded ({msg}).', { msg: e.message || t('unknown error') });
    }
  },
};

/* video files open in this visit: picked on this device, or read from device storage (17-media.js) */
const LocalFiles = {
  map: new Map(),
  urls: new Map(),
  set(videoId, file) {
    this.map.set(videoId, file);
    const old = this.urls.get(videoId);
    if (old) URL.revokeObjectURL(old);
    this.urls.set(videoId, URL.createObjectURL(file));
    VideoAudio.cache.delete(videoId);
  },
  get(videoId) { return this.map.get(videoId); },
  url(videoId) { return this.urls.get(videoId); },
};

function videoSrc(v) {
  if (!v) return '';
  // a stored file (fileRef) plays once attachVideoFile() has put it in LocalFiles
  return LocalFiles.url(v.id) || (v.fileRef ? '' : v.assetId ? '/_blob/' + v.assetId : v.url);
}

/* ---------- microphone ---------- */
const Mic = {
  stream: null, source: null, gain: null, proc: null, sink: null, dest: null,
  listeners: new Set(),
  error: null,
  level: -100, // last chunk's loudness (dBFS, after gain)
  speech: null, // running estimate of speech loudness, for automatic gain
  async open() {
    if (this.stream && this.stream.active) return true;
    const s = settings();
    const ctx = AudioEng.getCtx();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      this.error = t('This browser view has no microphone access.');
      return false;
    }
    try {
      const audio = { echoCancellation: !!s.echoCancellation, noiseSuppression: !!s.noiseSuppression, autoGainControl: !!s.micAuto, channelCount: 1 };
      try {
        this.stream = await navigator.mediaDevices.getUserMedia({ audio: s.micDeviceId ? { ...audio, deviceId: { exact: s.micDeviceId } } : audio });
      } catch (e) {
        // the chosen mic is unplugged: fall back to the default one
        if (!s.micDeviceId || (e.name !== 'OverconstrainedError' && e.name !== 'NotFoundError')) throw e;
        this.stream = await navigator.mediaDevices.getUserMedia({ audio });
        toast(t('Your chosen microphone isn’t connected, so the default one is being used.'));
      }
    } catch (e) {
      this.error = e && e.name === 'NotAllowedError'
        ? (Caps.inArtifact
          ? t('Microphone access was refused. Inside a Claude artifact the microphone is blocked; use the website version to record, or upload recordings from your phone.')
          : t('Microphone access was refused. Allow the microphone for this site in your browser’s address bar, then try again.'))
        : e && e.name === 'NotFoundError' ? t('No microphone was found.') : t('The microphone couldn’t start ({name}).', { name: (e && e.name) || 'error' });
      return false;
    }
    this.error = null;
    // mic → gain (sensitivity) → analysis + recording
    this.source = ctx.createMediaStreamSource(this.stream);
    this.gain = ctx.createGain();
    this.gain.gain.value = s.micAuto ? (this.autoGain || 1) : s.micGain;
    this.dest = ctx.createMediaStreamDestination();
    this.proc = ctx.createScriptProcessor(2048, 1, 1);
    this.sink = ctx.createGain();
    this.sink.gain.value = 0;
    this.source.connect(this.gain);
    this.gain.connect(this.proc);
    this.gain.connect(this.dest);
    this.proc.connect(this.sink);
    this.sink.connect(ctx.destination);
    let carry = new Float32Array(0);
    this.proc.onaudioprocess = (e) => {
      const input = e.inputBuffer.getChannelData(0);
      const t = ctx.currentTime - input.length / ctx.sampleRate; // approx. capture time of first sample
      let sum = 0;
      for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
      this.level = 20 * Math.log10(Math.sqrt(sum / input.length) + 1e-6);
      this.adapt();
      // resample with carry-over so chunks join cleanly
      const joined = new Float32Array(carry.length + input.length);
      joined.set(carry); joined.set(input, carry.length);
      const ratio = ctx.sampleRate / SR;
      const n = Math.floor(joined.length / ratio);
      const out = DSP.resample(joined.subarray(0, Math.floor(n * ratio)), ctx.sampleRate, SR);
      carry = joined.slice(Math.floor(n * ratio));
      for (const fn of this.listeners) fn(out, t);
    };
    return true;
  },
  /* automatic sensitivity: nudge the gain so speech sits around -20 dBFS */
  adapt() {
    if (!this.gain || !settings().micAuto) return;
    const lvl = this.level;
    const g = this.gain.gain.value;
    const raw = lvl - 20 * Math.log10(g); // level before our gain
    // background noise: follows quiet chunks fast, loud ones very slowly
    this.noise = this.noise == null ? raw : raw < this.noise ? this.noise * 0.7 + raw * 0.3 : this.noise * 0.998 + raw * 0.002;
    if (lvl < -65 || raw < this.noise + 12) return; // only speech, well above the room's noise, sets the volume
    // follow loud stretches quickly, quiet ones slowly, so only speech sets the level
    this.speech = this.speech == null ? raw : raw > this.speech ? this.speech * 0.7 + raw * 0.3 : this.speech * 0.995 + raw * 0.005;
    const want = clamp(10 ** ((-20 - this.speech) / 20), 1, 30);
    const next = g + (want - g) * 0.08;
    this.gain.gain.value = next;
    this.autoGain = next;
  },
  async reopen() {
    const listeners = this.listeners;
    const wasOpen = !!this.stream;
    this.close();
    this.listeners = listeners;
    if (wasOpen) await this.open();
  },
  async devices() {
    try { return (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput'); } catch { return []; }
  },
  setGain(x) {
    if (this.gain) this.gain.gain.value = x;
  },
  /* stream for MediaRecorder: the boosted signal when available */
  recordStream() { return this.dest ? this.dest.stream : this.stream; },
  close() {
    try { [this.proc, this.source, this.gain, this.sink].forEach((n) => n && n.disconnect()); } catch { /* already closed */ }
    if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
    this.stream = this.source = this.gain = this.proc = this.sink = this.dest = null;
    this.level = -100;
    this.noise = null;
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
};

/* a recording: compressed file (for keeping) + 16 kHz samples (for analysis) */
function pickMime() {
  const opts = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  for (const m of opts) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
class Recording {
  constructor() { this.chunks = []; this.pcm = []; this.startCtx = null; this.len = 0; }
  start() {
    const mime = pickMime();
    this.rec = new MediaRecorder(Mic.recordStream(), mime ? { mimeType: mime } : undefined);
    this.rec.ondataavailable = (e) => e.data && e.data.size && this.chunks.push(e.data);
    this.off = Mic.on((samples, t) => {
      if (this.startCtx == null) this.startCtx = t;
      this.pcm.push(samples); this.len += samples.length;
    });
    this.rec.start(250);
    this.startedAt = performance.now();
  }
  stop() {
    return new Promise((res) => {
      this.off && this.off();
      const finish = () => {
        const all = new Float32Array(this.len);
        let o = 0;
        for (const p of this.pcm) { all.set(p, o); o += p.length; }
        res({ blob: new Blob(this.chunks, { type: this.rec.mimeType || 'audio/webm' }), samples: all, startCtx: this.startCtx });
      };
      if (this.rec.state === 'inactive') finish();
      else { this.rec.onstop = finish; this.rec.stop(); }
    });
  }
  /* live: samples captured since an index */
  liveSamples() {
    const all = new Float32Array(this.len);
    let o = 0;
    for (const p of this.pcm) { all.set(p, o); o += p.length; }
    return all;
  }
}

/* play a recording / blob URL, returns the element */
const Player2 = {
  el: null,

    if (!url) { toast(t('That recording couldn’t be found.'), 'bad'); return null; }
