<style>
/* Layout: one working screen — player + session strip + analysis panel on the left, tall video library on the right (drawer on phones). */
:root {
  --bg: #f4f8f1;
  --surface: #ffffff;
  --surface-2: #eaf2e5;
  --line: #d5e2cd;
  --fg: #1d2a19;
  --muted: #5b6b55;
  --green: #45b52a;
  --green-dark: #2f8a19;
  --green-soft: #def3d3;
  --green-ink: #2f8a19;
  --on-green: #ffffff;
  --wattle: #f2b705;
  --wattle-dark: #c08f00;
  --wattle-soft: #fff1c4;
  --ochre: #ff8a1f;
  --sky: #1c95e0;
  --sky-dark: #136fa8;
  --sky-soft: #d9eefb;
  --red: #e0474c;
  --red-soft: #fde1e1;
  --amber: #e89b00;
  --shadow: 0 2px 0 rgba(29, 42, 25, 0.08);
  --video-bg: #0f140e;
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 11px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111710;
    --surface: #192118;
    --surface-2: #212c1f;
    --line: #2d3a2a;
    --fg: #e6efe2;
    --muted: #97a891;
    --green: #5ccc3c;
    --green-dark: #3a9a20;
    --green-soft: #22391b;
    --green-ink: #5ccc3c;
    --on-green: #0d1a09;
    --wattle: #ffc928;
    --wattle-dark: #c99a00;
    --wattle-soft: #3a3214;
    --ochre: #ff9a3d;
    --sky: #4cb2f2;
    --sky-dark: #2580bb;
    --sky-soft: #15303f;
    --red: #ff6b6f;
    --red-soft: #3d1c1d;
    --amber: #ffb52e;
    --shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    --video-bg: #050705;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111710;
  --surface: #192118;
  --surface-2: #212c1f;
  --line: #2d3a2a;
  --fg: #e6efe2;
  --muted: #97a891;
  --green: #5ccc3c;
  --green-dark: #3a9a20;
  --green-soft: #22391b;
  --green-ink: #5ccc3c;
  --on-green: #0d1a09;
  --wattle: #ffc928;
  --wattle-dark: #c99a00;
  --wattle-soft: #3a3214;
  --ochre: #ff9a3d;
  --sky: #4cb2f2;
  --sky-dark: #2580bb;
  --sky-soft: #15303f;
  --red: #ff6b6f;
  --red-soft: #3d1c1d;
  --amber: #ffb52e;
  --shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
  --video-bg: #050705;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.12rem; }
h4 { font-size: 0.98rem; }
p { margin: 0; }
a { color: var(--sky); }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num { font-variant-numeric: tabular-nums; }
.label {
  font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1 1 auto; min-width: 0; }
.spacer { flex: 1 1 auto; }

/* ---------- buttons ---------- */
.btn {
  --b-bg: var(--surface);
  --b-fg: var(--fg);
  --b-edge: var(--line);
  appearance: none;
  border: 2px solid var(--b-edge);
  border-bottom-width: 4px;
  background: var(--b-bg);
  color: var(--b-fg);
  font: 800 0.88rem/1 var(--font-body);
  letter-spacing: 0.02em;
  height: 40px;
  padding: 0 14px;
  border-radius: var(--r-sm);
  flex: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  white-space: nowrap;
  transition: transform 0.06s, filter 0.15s;
  text-decoration: none;
}
.btn:hover { filter: brightness(1.04); }
.btn:active { transform: translateY(2px); filter: brightness(0.96); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { --b-bg: var(--green); --b-fg: var(--on-green); --b-edge: var(--green-dark); }
.btn.blue { --b-bg: var(--sky); --b-fg: #fff; --b-edge: var(--sky-dark); }
.btn.wattle { --b-bg: var(--wattle); --b-fg: #2a2000; --b-edge: var(--wattle-dark); }
.btn.danger { --b-bg: var(--surface); --b-fg: var(--red); --b-edge: var(--red); }
.btn.ghost { border-color: transparent; background: transparent; border-bottom-width: 2px; padding: 0 10px; }
/* three sizes, each a fixed height, so buttons in a row always line up */
.btn.sm { height: 32px; padding: 0 10px; font-size: 0.8rem; border-bottom-width: 3px; }
.btn.big { height: 50px; padding: 0 22px; font-size: 1rem; border-radius: var(--r-md); }
.btn.icon { width: 40px; padding: 0; }
.btn.icon.sm { width: 32px; }
.btn.icon.big { width: 50px; }
.btn.on { --b-bg: var(--green-soft); --b-edge: var(--green); --b-fg: var(--green-ink); }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.seg button {
  appearance: none; border: 0; background: var(--surface); color: var(--fg); font: 800 0.8rem/1 var(--font-body);
  height: 36px; padding: 0 11px; cursor: pointer;
}
.seg.sm button { height: 28px; padding: 0 9px; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button.on { background: var(--green); color: var(--on-green); }

/* ---------- form controls: one look for every native control, in both themes ---------- */
input:where(:not([type="checkbox"], [type="radio"], [type="range"], [type="file"], [type="color"], [type="hidden"])), textarea, select {
  font: inherit; font-weight: 600; color: var(--fg); background-color: var(--surface); border: 2px solid var(--line);
  border-radius: var(--r-sm); padding: 8px 12px; width: 100%; min-width: 0; min-height: 42px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.75; font-weight: 600; }
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
input:where(:hover:not(:focus, [disabled])), textarea:where(:hover:not(:focus, [disabled])), select:where(:hover:not(:focus, [disabled])) { border-color: color-mix(in srgb, var(--line), var(--muted) 35%); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--sky); box-shadow: 0 0 0 3px var(--sky-soft); }
input[disabled], textarea[disabled], select[disabled] { opacity: 0.55; cursor: not-allowed; }
/* dropdowns: our own chevron instead of the browser's */
select {
  appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%;
  background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
}
select option { background: var(--surface); color: var(--fg); }
/* time and date pickers: tidy the browser's clock and calendar buttons */
input[type="time"], input[type="date"] { font-variant-numeric: tabular-nums; cursor: text; }
input[type="time"]::-webkit-calendar-picker-indicator, input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; border-radius: 6px; padding: 2px; }
input[type="time"]::-webkit-calendar-picker-indicator:hover, input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; background: var(--surface-2); }
input[type="time"]::-webkit-datetime-edit-fields-wrapper, input[type="date"]::-webkit-datetime-edit-fields-wrapper { padding: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; }
label.field { display: flex; flex-direction: column; gap: 5px; font-weight: 700; font-size: 0.85rem; }
div.field { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
div.field > label, .flabel { font-weight: 700; }
label.check { display: inline-flex; gap: 10px; align-items: center; font-weight: 700; font-size: 0.88rem; cursor: pointer; }
/* checkboxes and radios */
input[type="checkbox"], input[type="radio"] {
  appearance: none; -webkit-appearance: none; flex: none; margin: 0; cursor: pointer;
  width: 22px; height: 22px; border: 2px solid var(--line); border-bottom-width: 3px; background: var(--surface);
  border-radius: 7px; display: inline-grid; place-items: center; transition: background-color 0.12s, border-color 0.12s;
}
input[type="radio"] { border-radius: 50%; border-bottom-width: 2px; }
input[type="checkbox"]:hover:not([disabled]), input[type="radio"]:hover:not([disabled]) { border-color: var(--green); }
input[type="checkbox"]:checked { background: var(--green); border-color: var(--green-dark); }
input[type="checkbox"]:checked::after { content: ""; width: 10px; height: 6px; border: solid var(--on-green); border-width: 0 0 3px 3px; transform: translateY(-2px) rotate(-45deg); }
input[type="checkbox"]:indeterminate { background: var(--green); border-color: var(--green-dark); }
input[type="checkbox"]:indeterminate::after { content: ""; width: 10px; height: 3px; background: var(--on-green); border-radius: 2px; }
input[type="radio"]:checked { border-color: var(--green); }
input[type="radio"]:checked::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
input[type="checkbox"][disabled], input[type="radio"][disabled] { opacity: 0.45; cursor: not-allowed; }
input[type="range"] { accent-color: var(--green); }

/* radio cards: a choice shown as tappable cards instead of a dropdown */
.choices { display: grid; gap: 8px; }
.choice {
  display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: var(--r-md); cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; transition: border-color 0.12s, background-color 0.12s;
}
.choice:hover { border-color: color-mix(in srgb, var(--line), var(--green) 45%); }
.choice:has(input:checked) { border-color: var(--green); background: var(--green-soft); }
.choice:has(input:focus-visible) { outline: 3px solid var(--sky); outline-offset: 2px; }
.choice input:focus-visible { outline: none; }
.choice-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: 0.92rem; }
.choice-text .small { font-weight: 600; }

/* language picker: chips plus a type-to-add box */
.langpick {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 6px; min-height: 46px; cursor: text;
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-sm); transition: border-color 0.15s, box-shadow 0.15s;
}
.langpick:focus-within { border-color: var(--sky); box-shadow: 0 0 0 3px var(--sky-soft); }
.langpick .tags { display: contents; }
.langpick input[type="text"] { border: 0; box-shadow: none; padding: 4px 6px; min-height: 30px; flex: 1 1 140px; width: auto; background: transparent; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 11px; border-radius: 999px; background: var(--green-soft); color: var(--green-ink); font-weight: 800; font-size: 0.86rem; }
.tag button { appearance: none; border: 0; background: transparent; color: inherit; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; }
.tag button:hover { background: color-mix(in srgb, var(--green) 25%, transparent); }
.tag svg { width: 13px; height: 13px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest:empty { display: none; }
.chip.add { font-size: 0.8rem; padding: 3px 10px 3px 7px; border: 2px solid var(--line); background: var(--surface); }
.chip.add:hover { border-color: var(--green); }
.chip.add svg { width: 14px; height: 14px; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 2px solid var(--line); background: var(--surface);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; color: var(--green); display: flex; align-items: baseline; gap: 6px; }
.brand small { font-family: var(--font-body); font-size: 0.78rem; font-weight: 800; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  background: var(--surface-2); font-weight: 800; font-size: 0.85rem; border: 2px solid transparent;
}
.chip { color: var(--fg); }
button.chip { font-family: inherit; cursor: pointer; }
.chip svg { width: 18px; height: 18px; color: var(--green); }
.chip.streak svg { color: var(--ochre); }
.chip.streak.cold svg { color: var(--muted); }
.topnav { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.only-phone { display: none !important; }

/* ---------- banners ---------- */
.banners { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 0; }
.banner {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r-md);
  background: var(--wattle-soft); border: 2px solid var(--wattle); font-weight: 700;
}
.banner.info { background: var(--sky-soft); border-color: var(--sky); }
.banner.good { background: var(--green-soft); border-color: var(--green); }
.banner p { flex: 1 1 260px; min-width: 0; }

/* ---------- layout ---------- */
/* Top row: the player, and beside it the library (or the session card) at the same height.
   Bottom row, full width: today's card, the clip editor or the pitch panel.
   On wide screens fitLayout() sets the right column's width and the video's height from the window size only,
   so they stay put whatever you're doing. */
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w, 340px); gap: 14px 16px; padding: 14px 16px 16px;
  grid-template-areas: "player side" "below below"; align-items: start;
}
.player { grid-area: player; min-width: 0; }
.below { grid-area: below; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
#sideSlot:empty { display: none; }
.side { grid-area: side; }

/* ---------- player ---------- */
.player {
  position: relative; background: var(--video-bg); border-radius: var(--r-lg); overflow: hidden;
  border: 3px solid var(--line);
}
.player video { display: block; width: 100%; aspect-ratio: var(--video-ar, 16 / 9); max-height: var(--video-h, 62vh); background: var(--video-bg); object-fit: contain; }
.player-empty, .player-error {
  position: absolute; inset: 0 0 92px 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 20px; color: #e6efe2;
}
.player-empty h2 { color: #fff; }
.player-error { background: rgba(10, 14, 9, 0.88); }
.player-error p { max-width: 52ch; }
.controls { background: linear-gradient(transparent, rgba(5, 8, 5, 0.75) 30%); padding: 22px 14px 10px; position: absolute; left: 0; right: 0; bottom: 0; color: #fff; }
.scrubber { position: relative; height: 34px; cursor: pointer; touch-action: none; user-select: none; }
.scrub-track { position: absolute; left: 0; right: 0; top: 19px; height: 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.25); }
.scrub-progress { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ochre); border-radius: 4px; }
.scrub-head { position: absolute; top: 14px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; border: 3px solid var(--ochre); pointer-events: none; }
.player.cutting .scrubber { cursor: crosshair; }
.player.cutting .scrub-track { background: rgba(76, 178, 242, 0.45); }
.scrub-sel { position: absolute; top: 10px; height: 24px; background: rgba(76, 178, 242, 0.35); border: 2px solid var(--sky); border-radius: 6px; pointer-events: none; }
.bracket {
  position: absolute; top: 9px; height: 26px; min-width: 12px; border: 3px solid var(--wattle); border-top-width: 3px;
  border-radius: 3px; background: transparent; padding: 0; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) left / 5px 100% no-repeat, linear-gradient(#000 0 0) right / 5px 100% no-repeat;
          mask: linear-gradient(#000 0 0) left / 5px 100% no-repeat, linear-gradient(#000 0 0) right / 5px 100% no-repeat;
}
.bracket-hit { position: absolute; top: 4px; height: 30px; cursor: pointer; background: transparent; border: 0; padding: 0; }
.bracket-hit:hover + .bracket, .bracket.sel { border-color: #fff; }
.bracket.sel { border-width: 4px; }
.bracket-tick { position: absolute; top: -10px; width: 20px; height: 18px; margin-left: -10px; color: var(--green); pointer-events: none; filter: drop-shadow(0 1px 0 rgba(0,0,0,.5)); }
.ctrl-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.ctrl-row .btn { --b-bg: rgba(255, 255, 255, 0.12); --b-fg: #fff; --b-edge: rgba(255, 255, 255, 0.18); }
.ctrl-row .btn.on { --b-bg: var(--green); --b-edge: var(--green-dark); --b-fg: var(--on-green); }
.ctrl-row .seg { border-color: rgba(255, 255, 255, 0.2); }
.ctrl-row .seg button { background: rgba(255, 255, 255, 0.1); color: #fff; }
.ctrl-row .seg button + button { border-left-color: rgba(255, 255, 255, 0.2); }
.ctrl-row .seg button.on { background: var(--green); color: var(--on-green); }
.time { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 0.85rem; padding: 0 6px; }
.vol { width: 80px; }
/* keep the controls on one row when the player is narrow: drop the volume slider, then labels */
.controls { container-type: inline-size; }
@container (max-width: 860px) { .vol { display: none; } #loopBtn .txt, #cutBtn .txt { display: none; } }
@container (max-width: 700px) { #kbBtn { display: none; } }
.hover-time { position: absolute; top: -16px; transform: translateX(-50%); font-size: 0.72rem; font-weight: 800; background: #000; color: #fff; padding: 1px 6px; border-radius: 6px; pointer-events: none; }

/* ---------- session strip ---------- */
.session { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow); }
.session.active { border-color: var(--green); }
.steps { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; }
.step { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.step-name { font-weight: 800; font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.cur .step-name { color: var(--green-ink); }
.bar { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 999px; transition: width 0.3s; }
.step.done .bar > i { width: 100%; }
.bar.big { height: 16px; }
.session-main { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.counter { font-family: var(--font-display); font-weight: 600; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.counter small { font-size: 1rem; color: var(--muted); }
.timer { font-weight: 800; font-variant-numeric: tabular-nums; }
.session-hint { font-weight: 700; color: var(--muted); }
.pass-card { margin-top: 12px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
.lag { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.idle-cta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.idle-cta .grow p { margin-top: 2px; }
.queue-pill { font-size: 0.8rem; font-weight: 800; background: var(--sky-soft); color: var(--sky-dark); padding: 3px 9px; border-radius: 999px; }

/* ---------- analysis panel ---------- */
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 12px 14px 14px; box-shadow: var(--shadow); }
.panel-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.panel canvas { display: block; width: 100%; height: 220px; border-radius: var(--r-sm); background: var(--surface-2); touch-action: none; }
.panel canvas.editor { height: 170px; cursor: ew-resize; }
/* wide screens: the panel under the player reaches the bottom of the window; the chart stretches to fill it */
.layout.fit.cutting .below, .layout.fit.in-session .below { height: var(--below-h, auto); }
.layout.fit.cutting .below > .panel, .layout.fit.in-session .below > .panel { flex: 1 1 auto; display: flex; flex-direction: column; }
.layout.fit.cutting .below > .panel > *, .layout.fit.in-session .below > .panel > * { flex-shrink: 0; }
.layout.fit .below > .panel > canvas.analysis { flex: 1 1 0; height: 0; min-height: 150px; }
.layout.fit .below > .panel > canvas.editor { flex: 1 1 0; height: 0; min-height: 80px; }
.panel-msg { padding: 22px 12px; text-align: center; color: var(--muted); font-weight: 700; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.editor-row { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; align-items: flex-end; }
.efield { display: flex; flex-direction: column; gap: 3px; }
.efield.grow { flex: 1 1 120px; }
.efield .label { margin: 0; }
.nudge { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.len { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; padding: 3px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.len.good { background: var(--green-soft); color: var(--green-ink); }
.len.warn { background: var(--wattle-soft); color: var(--wattle-dark); }
.len.bad { background: var(--red-soft); color: var(--red); }
.warnline { color: var(--red); font-weight: 700; font-size: 0.86rem; margin-top: 4px; }
.warnline:empty { display: none; }

/* ---------- sidebar ---------- */
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.sidebar {
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 12px;
  max-height: calc(100vh - 96px); overflow: auto; box-shadow: var(--shadow);
}
/* during a session the session card takes the right column (and the library steps aside) */
.layout.in-session .side .sidebar { display: none; }
.layout.fit .side { position: static; height: var(--top-h, auto); }
.layout.fit .side > .sidebar { flex: 1 1 auto; min-height: 0; max-height: none; }
.layout.fit #sideSlot { height: 100%; }
.layout.fit #sideSlot > .session { height: 100%; }
.side .session { overflow: auto; }
.side .session .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.side .session .counter { font-size: 1.6rem; }
.vlist { display: flex; flex-direction: column; gap: 8px; }
.vitem { border: 2px solid var(--line); border-radius: var(--r-md); padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.vitem.open { border-color: var(--green); background: var(--green-soft); }
.vitem-title { font-weight: 800; cursor: pointer; overflow-wrap: anywhere; }
.vitem .meta { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
.vprog { height: 8px; }
.clist { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.citem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: var(--r-sm); background: var(--surface); border: 2px solid var(--line); }
.citem.sel { border-color: var(--wattle); }
.citem .clabel { font-weight: 800; font-size: 0.86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.citem .cmeta { font-size: 0.75rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.tick { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.tick.done { background: var(--green); color: var(--on-green); }
.tick svg { width: 14px; height: 14px; }
details.archived > summary { cursor: pointer; font-weight: 800; color: var(--muted); font-size: 0.88rem; padding: 4px 0; }
.addform { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: var(--r-md); background: var(--surface-2); }
.formerr { color: var(--red); font-weight: 700; font-size: 0.85rem; }
.formok { color: var(--green-ink); font-weight: 700; font-size: 0.85rem; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(8, 12, 7, 0.55); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px 24px; overflow: auto; }
.modal { background: var(--bg); border: 2px solid var(--line); border-radius: var(--r-lg); width: min(880px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal.narrow { width: min(520px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; }
/* ---------- first-run wizard ---------- */
.wiz { display: flex; flex-direction: column; gap: 16px; }
.wiz-top { display: flex; align-items: center; gap: 8px; margin: -4px -6px -8px 0; }
.wiz-progress { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 6px; }
.wiz-progress li { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.wiz-progress i { display: block; height: 8px; border-radius: 999px; background: var(--surface-2); transition: background-color 0.25s; }
.wiz-progress li.done i { background: var(--green); }
.wiz-progress li.cur i { background: linear-gradient(90deg, var(--green) 50%, var(--green-soft) 50%); }
.wiz-progress span { font-size: 0.7rem; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wiz-progress li.cur span { color: var(--green-ink); }
.wiz-head { display: flex; flex-direction: column; gap: 6px; }
.wiz-head h2 { font-size: 1.6rem; }
.wiz-body { gap: 14px; animation: wiz-in 0.22s ease-out; }
.wiz-foot { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
@keyframes wiz-in { from { opacity: 0; transform: translateX(12px); } }
ul.ticks { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
ul.ticks li { position: relative; padding-left: 26px; }
ul.ticks li::before { content: ""; position: absolute; left: 4px; top: 5px; width: 10px; height: 6px; border: solid var(--green); border-width: 0 0 3px 3px; transform: rotate(-45deg); }
@media (max-width: 520px) { .wiz-progress span { display: none; } .wiz-head h2 { font-size: 1.35rem; } }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.stat { font-family: var(--font-display); font-weight: 600; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.cal { display: grid; grid-template-columns: auto repeat(7, minmax(0, 30px)); justify-content: start; gap: 4px; font-size: 0.72rem; font-weight: 800; color: var(--muted); align-items: center; }
.cal .d { aspect-ratio: 1; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; color: transparent; max-width: 100%; }
.cal .d.full { background: var(--green); color: var(--on-green); }
.cal .d.bad { background: var(--wattle); color: #2a2000; }
.cal .d.today { outline: 2px solid var(--sky); outline-offset: 1px; }
.cal .d.future { opacity: 0.35; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.diag { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; align-items: start; }
.diag .st { font-weight: 800; font-size: 0.78rem; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.diag .st.ok { background: var(--green-soft); color: var(--green-ink); }
.diag .st.fail { background: var(--red-soft); color: var(--red); }
.diag .st.warn { background: var(--wattle-soft); color: var(--wattle-dark); }
.reply { background: var(--surface); border: 2px solid var(--sky); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.reply h4 { color: var(--sky-dark); }
.issue-pill { display: inline-flex; gap: 6px; align-items: center; background: var(--wattle-soft); border: 2px solid var(--wattle); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 0.8rem; }
.kbd { display: inline-block; min-width: 26px; text-align: center; font-weight: 800; font-size: 0.8rem; padding: 3px 7px; border-radius: 7px; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; }
.keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; align-items: center; }
.audio-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
audio { max-width: 100%; height: 36px; }
.trend svg { width: 100%; height: auto; display: block; }
.trend text { fill: var(--muted); font: 700 11px var(--font-body); }

/* ---------- toasts & confetti ---------- */
.toasts { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 80; width: min(480px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: var(--r-md); font-weight: 800; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); animation: pop 0.25s ease-out; pointer-events: auto; }
.toast.bad { background: var(--red); color: #fff; }
.toast.good { background: var(--green); color: var(--on-green); }
@keyframes pop { from { transform: translateY(10px) scale(0.96); opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }
.celebrate { text-align: center; align-items: center; }
.celebrate .big-num { font-family: var(--font-display); font-size: 3.4rem; font-weight: 700; color: var(--green); line-height: 1; }

/* calm mode while speaking: no transitions or pulses */
body.calm .bar > i { transition: none; }
body.calm .toast { animation: none; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

    padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);

  .player video { max-height: 40vh; }
  .controls { position: static; background: #0b100a; padding-top: 10px; }

  .topnav .btn .txt { display: none; }
}

  .steps .step-name { font-size: 0.7rem; }
  .counter { font-size: 1.6rem; }
  .vol { display: none; }
}

.mic-control { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.85rem; }
.mic-control > svg { width: 18px; height: 18px; color: var(--muted); }

.mic-meter > i { transition: none; }
.mic-control input[type="range"] { width: 110px; }
.mic-control select.mic-select { width: auto; max-width: 220px; padding: 5px 32px 5px 10px; min-height: 34px; font-size: 0.85rem; }

.efield.grow input { height: 32px; min-height: 32px; padding: 5px 10px; }

e. Allow them in your browser’s site settings, then turn them on here.":{"fr":"Les notifications sont bloquées pour ce site. Autorise-les dans les réglages du site de ton navigateur, puis active-les ici.","es":"Las notificaciones están bloqueadas para este sitio. Permítelas en la configuración del sitio de tu navegador y luego actívalas aquí."},"Turn on notifications":{"fr":"Activer les notifications","es":"Activar notificaciones"},"Notifications are on for this device.":{"fr":"Les notifications sont activées sur cet appareil.","es":"Las notificaciones están activadas en este dispositivo."},"Notifications on this device":{"fr":"Notifications sur cet appareil","es":"Notificaciones en este dispositivo"},"Also on {n} other device.|Also on {n} other devices.":{"fr":"Aussi sur {n} autre appareil.|Aussi sur {n} autres appareils.","es":"También en {n} dispositivo más.|También en {n} dispositivos más."},"Connecting AI apps needs the online version of the app.":{"fr":"Pour connecter des applis d’IA, il faut la version en ligne de l’appli.","es":"Para conectar apps de IA necesitas la versión en línea de la app."},"Address copied.":{"fr":"Adresse copiée.","es":"Dirección copiada."},"Let Claude, ChatGPT or Gemini read your practice: your sessions, notes, issues and progress. They can ask things like “what did I struggle with this week?” They can’t change anything, and they never see your recordings, AI keys or Discord webhook.":{"fr":"Laisse Claude, ChatGPT ou Gemini lire ta pratique : tes séances, notes, points faibles et progrès. Ils peuvent répondre à des questions comme « sur quoi j’ai eu du mal cette semaine ? ». Ils ne peuvent rien modifier et ne voient jamais tes enregistrements, tes clés d’IA ni ton webhook Discord.","es":"Deja que Claude, ChatGPT o Gemini lean tu práctica: tus sesiones, notas, puntos débiles y progreso. Pueden responder cosas como “¿con qué me costó más esta semana?”. No pueden cambiar nada y nunca ven tus grabaciones, tus claves de IA ni tu webhook de Discord."},"Server address":{"fr":"Adresse du serveur","es":"Dirección del servidor"},"Copy":{"fr":"Copier","es":"Copiar"},"Settings → Connectors → Add custom connector. Paste the address and leave the advanced settings empty.":{"fr":"Settings → Connectors → Add custom connector. Colle l’adresse et laisse les réglages avancés vides.","es":"Settings → Connectors → Add custom connector. Pega la dirección y deja vacía la configuración avanzada."},"Settings → Apps → Advanced settings → turn on Developer mode, then Create app. Paste the address and choose OAuth. Needs a paid plan.":{"fr":"Settings → Apps → Advanced settings → active Developer mode, puis Create app. Colle l’adresse et choisis OAuth. Il faut un abonnement payant.","es":"Settings → Apps → Advanced settings → activa Developer mode y luego Create app. Pega la dirección y elige OAuth. Necesita un plan de pago."},"Settings → Connected apps → Add a custom app. Paste the address and leave Client ID and Client secret empty.":{"fr":"Settings → Connected apps → Add a custom app. Colle l’adresse et laisse Client ID et Client secret vides.","es":"Settings → Connected apps → Add a custom app. Pega la dirección y deja vacíos Client ID y Client secret."},"You’ll be asked to sign in here and allow the app.":{"fr":"On te demandera de te connecter ici et d’autoriser l’appli.","es":"Se te pedirá iniciar sesión aquí y permitir la app."},"Connected":{"fr":"Connectées","es":"Conectadas"},"No apps connected yet.":{"fr":"Aucune appli connectée pour l’instant.","es":"Aún no hay apps conectadas."},"Disconnect":{"fr":"Déconnecter","es":"Desconectar"},"connected {date}, last used {used}":{"fr":"connectée le {date}, utilisée pour la dernière fois le {used}","es":"conectada el {date}, usada por última vez el {used}"},"connected {date}":{"fr":"connectée le {date}","es":"conectada el {date}"},"Disconnect {name}? It loses access straight away. You can connect it again later.":{"fr":"Déconnecter {name} ? L’accès est coupé tout de suite. Tu pourras la reconnecter plus tard.","es":"¿Desconectar {name}? Pierde el acceso al instante. Puedes volver a conectarla más tarde."},"{name} disconnected.":{"fr":"{name} est déconnectée.","es":"{name} se desconectó."},"in sync":{"fr":"synchro","es":"sincronizado"},"{a} s behind":{"fr":"{a} s de retard","es":"{a} s de retraso"},"{a} s ahead":{"fr":"{a} s d’avance","es":"{a} s de adelanto"},"Close":{"fr":"Fermer","es":"Cerrar"},"The server couldn’t be reached. Check your connection.":{"fr":"Impossible de joindre le serveur. Vérifie ta connexion.","es":"No se pudo conectar con el servidor. Revisa tu conexión."},"You’re signed out. Sign in again to keep saving.":{"fr":"Tu es déconnecté. Reconnecte-toi pour continuer à enregistrer.","es":"Se cerró tu sesión. Vuelve a iniciar sesión para seguir guardando."},"Server error {status}":{"fr":"Erreur du serveur {status}","es":"Error del servidor {status}"},"Couldn’t save to the server. Retrying…":{"fr":"Impossible d’enregistrer sur le serveur. Nouvel essai…","es":"No se pudo guardar en el servidor. Reintentando…"},"Storage is full. Archive or remove old recordings in Settings → Data.":{"fr":"Le stockage est plein. Archive ou supprime d’anciens enregistrements dans Réglages → Données.","es":"El almacenamiento está lleno. Archiva o elimina grabaciones antiguas en Ajustes → Datos."},"Couldn’t save a change ({code}). It is kept on screen; try again shortly.":{"fr":"Impossible d’enregistrer une modification ({code}). Elle reste à l’écran ; réessaie dans un instant.","es":"No se pudo guardar un cambio ({code}). Sigue en pantalla; vuelve a intentarlo en un momento."},"This device’s storage is full.":{"fr":"Le stockage de cet appareil est plein.","es":"El almacenamiento de este dispositivo está lleno."},"This file is not a Euno Shadowing backup.":{"fr":"Ce fichier n’est pas une sauvegarde Euno Shadowing.","es":"Este archivo no es una copia de seguridad de Euno Shadowing."},"Google Drive couldn’t be reached. Check your connection.":{"fr":"Impossible de joindre Google Drive. Vérifie ta connexion.","es":"No se pudo conectar con Google Drive. Revisa tu conexión."},"Google Drive: {msg}":{"fr":"Google Drive : {msg}","es":"Google Drive: {msg}"},"error {status}":{"fr":"erreur {status}","es":"error {status}"},"Google Drive didn’t start the upload.":{"fr":"Google Drive n’a pas lancé l’envoi.","es":"Google Drive no inició la subida."},"Google Drive: upload failed ({status}).":{"fr":"Google Drive : l’envoi a échoué ({status}).","es":"Google Drive: la subida falló ({status})."},"The upload to Google Drive kept failing. It will try again later.":{"fr":"L’envoi vers Google Drive échoue sans cesse. Il sera relancé plus tard.","es":"La subida a Google Drive sigue fallando. Se volverá a intentar más tarde."},"Sign in first to connect Google Drive.":{"fr":"Connecte-toi d’abord pour relier Google Drive.","es":"Inicia sesión primero para conectar Google Drive."},"Google Drive sync isn’t switched on for this site yet.":{"fr":"La synchronisation Google Drive n’est pas encore activée sur ce site.","es":"La sincronización con Google Drive aún no está activada en este sitio."},"Google Drive connected ({email}). Your files will sync to it.":{"fr":"Google Drive connecté ({email}). Tes fichiers vont s’y synchroniser.","es":"Google Drive conectado ({email}). Tus archivos se sincronizarán ahí."},"Google Drive connected. Your files will sync to it.":{"fr":"Google Drive connecté. Tes fichiers vont s’y synchroniser.","es":"Google Drive conectado. Tus archivos se sincronizarán ahí."},"Google Drive sync paused: {msg}":{"fr":"Synchronisation Google Drive en pause : {msg}","es":"Sincronización con Google Drive en pausa: {msg}"},"Getting your video ready":{"fr":"Préparation de ta vidéo","es":"Preparando tu video"},"Downloading “{title}” from your Google Drive to this device. It only happens once on each device.":{"fr":"Téléchargement de « {title} » depuis ton Google Drive vers cet appareil. Ça n’arrive qu’une fois par appareil.","es":"Descargando “{title}” de tu Google Drive a este dispositivo. Solo pasa una vez en cada dispositivo."},"{pct}% · {done} of {total} MB":{"fr":"{pct} % · {done} sur {total} Mo","es":"{pct} % · {done} de {total} MB"},"This video didn’t download":{"fr":"Cette vidéo ne s’est pas téléchargée","es":"Este video no se descargó"},"Try again":{"fr":"Réessayer","es":"Reintentar"},"This video isn’t on this device":{"fr":"Cette vidéo n’est pas sur cet appareil","es":"Este video no está en este dispositivo"},"“{name}” is in your Google Drive, but Drive isn’t connected here. Connect it to download the video, or pick the same file from this device.":{"fr":"« {name} » est dans ton Google Drive, mais Drive n’est pas connecté ici. Connecte-le pour télécharger la vidéo, ou choisis le même fichier sur cet appareil.","es":"“{name}” está en tu Google Drive, pero Drive no está conectado aquí. Conéctalo para descargar el video o elige el mismo archivo en este dispositivo."},"“{name}” was added on another device and isn’t synced. Pick the same file from this device to keep practising here, and turn on Google Drive sync in Settings → Storage so your devices share files.":{"fr":"« {name} » a été ajouté sur un autre appareil et n’est pas synchronisé. Choisis le même fichier sur cet appareil pour t’entraîner ici, et active la synchronisation Google Drive dans Réglages → Stockage pour que tes appareils partagent leurs fichiers.","es":"“{name}” se agregó en otro dispositivo y no está sincronizado. Elige el mismo archivo en este dispositivo para seguir practicando aquí y activa la sincronización con Google Drive en Ajustes → Almacenamiento para que tus dispositivos compartan archivos."},"“{name}” was added on another device and isn’t synced. Pick the same file from this device to keep practising here.":{"fr":"« {name} » a été ajouté sur un autre appareil et n’est pas synchronisé. Choisis le même fichier sur cet appareil pour t’entraîner ici.","es":"“{name}” se agregó en otro dispositivo y no está sincronizado. Elige el mismo archivo en este dispositivo para seguir practicando aquí."},"Connect Google Drive":{"fr":"Connecter Google Drive","es":"Conectar Google Drive"},"Re-add the file":{"fr":"Rajouter le fichier","es":"Volver a añadir el archivo"},"Saving the file on this device…":{"fr":"Enregistrement du fichier sur cet appareil…","es":"Guardando el archivo en este dispositivo…"},"The file couldn’t be saved ({msg}).":{"fr":"Impossible d’enregistrer le fichier ({msg}).","es":"No se pudo guardar el archivo ({msg})."},"in Drive":{"fr":"dans Drive","es":"en Drive"},"uploading {pct}%":{"fr":"envoi {pct} %","es":"subiendo {pct} %"},"waiting to upload":{"fr":"en attente d’envoi","es":"esperando para subir"},"this browser only":{"fr":"ce navigateur uniquement","es":"solo en este navegador"},"Sign in to keep your files in Google Drive.":{"fr":"Connecte-toi pour garder tes fichiers dans Google Drive.","es":"Inicia sesión para guardar tus archivos en Google Drive."},"Not connected.":{"fr":"Non connecté.","es":"No conectado."},"Connected as {email}.":{"fr":"Connecté en tant que {email}.","es":"Conectado como {email}."},"Connected.":{"fr":"Connecté.","es":"Conectado."},"Videos: {n} of {total} in Drive.":{"fr":"Vidéos : {n} sur {total} dans Drive.","es":"Videos: {n} de {total} en Drive."},"Recordings: {n} of {total} in Drive.":{"fr":"Enregistrements : {n} sur {total} dans Drive.","es":"Grabaciones: {n} de {total} en Drive."},"Uploading “{name}” ({pct}%).":{"fr":"Envoi de « {name} » ({pct} %).","es":"Subiendo “{name}” ({pct} %)."},"Paused: {msg}":{"fr":"En pause : {msg}","es":"En pausa: {msg}"},"Google Drive (recommended)":{"fr":"Google Drive (recommandé)","es":"Google Drive (recomendado)"},"Your videos and recordings go into a “Euno Shadowing” folder in your own Drive, so they’re safe and on every device you sign in on. The app can only see files it puts there, and our server never stores them.":{"fr":"Tes vidéos et enregistrements vont dans un dossier « Euno Shadowing » de ton propre Drive : ils sont en sécurité et sur tous les appareils où tu te connectes. L’appli ne voit que les fichiers qu’elle y dépose, et notre serveur ne les stocke jamais.","es":"Tus videos y grabaciones van a una carpeta “Euno Shadowing” en tu propio Drive, así que están seguros y en todos los dispositivos donde inicies sesión. La app solo ve los archivos que pone ahí y nuestro servidor nunca los guarda."},"You can disconnect it any time in Settings → Storage.":{"fr":"Tu peux le déconnecter quand tu veux dans Réglages → Stockage.","es":"Puedes desconectarlo cuando quieras en Ajustes → Almacenamiento."},"Not now? Press Continue. You can connect Google Drive later in Settings → Storage. Until then, files stay in this browser only.":{"fr":"Pas maintenant ? Appuie sur Continuer. Tu pourras connecter Google Drive plus tard dans Réglages → Stockage. D’ici là, les fichiers restent uniquement dans ce navigateur.","es":"¿Ahora no? Pulsa Continuar. Puedes conectar Google Drive más tarde en Ajustes → Almacenamiento. Mientras tanto, los archivos se quedan solo en este navegador."},"Your videos and recordings live in a “Euno Shadowing” folder in your own Drive, so they’re on every device you sign in on. The app can only see files it puts there, and our server never stores them. Dropbox and OneDrive are coming later.":{"fr":"Tes vidéos et enregistrements sont rangés dans un dossier « Euno Shadowing » de ton propre Drive, donc sur tous les appareils où tu te connectes. L’appli ne voit que les fichiers qu’elle y dépose, et notre serveur ne les stocke jamais. Dropbox et OneDrive arriveront plus tard.","es":"Tus videos y grabaciones están en una carpeta “Euno Shadowing” en tu propio Drive, así que los tienes en todos los dispositivos donde inicies sesión. La app solo ve los archivos que pone ahí y nuestro servidor nunca los guarda. Dropbox y OneDrive llegarán más adelante."},"{n} file not in Drive yet|{n} files not in Drive yet":{"fr":"{n} fichier pas encore dans Drive|{n} fichiers pas encore dans Drive","es":"{n} archivo aún no está en Drive|{n} archivos aún no están en Drive"},"A file added on another device uploads from that device.":{"fr":"Un fichier ajouté sur un autre appareil est envoyé depuis cet appareil-là.","es":"Un archivo añadido en otro dispositivo se sube desde ese dispositivo."},"Upload now":{"fr":"Envoyer maintenant","es":"Subir ahora"},"Disconnect Google Drive? Files already in your Drive stay there. New files will only be kept in this browser.":{"fr":"Déconnecter Google Drive ? Les fichiers déjà dans ton Drive y restent. Les nouveaux fichiers seront gardés uniquement dans ce navigateur.","es":"¿Desconectar Google Drive? Los archivos que ya están en tu Drive se quedan ahí. Los archivos nuevos solo se guardarán en este navegador."},"Google Drive disconnected.":{"fr":"Google Drive déconnecté.","es":"Google Drive desconectado."},"This browser":{"fr":"Ce navigateur","es":"Este navegador"},"Files you open are kept in this browser so they play instantly and work offline: {n} of {total} right now. If the browser clears them, they download again from Drive.":{"fr":"Les fichiers que tu ouvres sont gardés dans ce navigateur pour se lancer tout de suite et marcher hors ligne : {n} sur {total} en ce moment. Si le navigateur les efface, ils se retéléchargent depuis Drive.","es":"Los archivos que abres se guardan en este navegador para que se reproduzcan al instante y funcionen sin conexión: {n} de {total} ahora mismo. Si el navegador los borra, se vuelven a descargar de Drive."},"Files you open are kept in this browser so they play instantly and work offline: {n} of {total} right now.":{"fr":"Les fichiers que tu ouvres sont gardés dans ce navigateur pour se lancer tout de suite et marcher hors ligne : {n} sur {total} en ce moment.","es":"Los archivos que abres se guardan en este navegador para que se reproduzcan al instante y funcionen sin conexión: {n} de {total} ahora mismo."},"Free up space":{"fr":"Libérer de l’espace","es":"Liberar espacio"},"Removed {n} file ({size}) from this browser. It’s still in your Drive.|Removed {n} files ({size}) from this browser. They’re still in your Drive.":{"fr":"{n} fichier ({size}) retiré de ce navigateur. Il est toujours dans ton Drive.|{n} fichiers ({size}) retirés de ce navigateur. Ils sont toujours dans ton Drive.","es":"Se quitó {n} archivo ({size}) de este navegador. Sigue en tu Drive.|Se quitaron {n} archivos ({size}) de este navegador. Siguen en tu Drive."},"Keep files only in this browser, without Google Drive":{"fr":"Garder les fichiers uniquement dans ce navigateur, sans Google Drive","es":"Guardar los archivos solo en este navegador, sin Google Drive"},"Files are only on this device, and the browser can clear them if the device runs very low on space. Export a backup from Settings → Data now and then, and keep your original video files.":{"fr":"Les fichiers sont uniquement sur cet appareil, et le navigateur peut les effacer si l’appareil manque vraiment de place. Exporte une sauvegarde depuis Réglages → Données de temps en temps, et garde tes fichiers vidéo d’origine.","es":"Los archivos solo están en este dispositivo y el navegador puede borrarlos si se queda casi sin espacio. Exporta una copia de seguridad desde Ajustes → Datos de vez en cuando y conserva tus archivos de video originales."},"Google Drive wasn’t connected. You can connect it any time in Settings → Storage.":{"fr":"Google Drive n’a pas été connecté. Tu peux le connecter quand tu veux dans Réglages → Stockage.","es":"Google Drive no se conectó. Puedes conectarlo cuando quieras en Ajustes → Almacenamiento."},"Google Drive couldn’t be connected.":{"fr":"Impossible de connecter Google Drive.","es":"No se pudo conectar Google Drive."},"Couldn’t read the video’s sound ({msg}). Try again in a moment.":{"fr":"Impossible de lire le son de la vidéo ({msg}). Réessaie dans un instant.","es":"No se pudo leer el sonido del video ({msg}). Vuelve a intentarlo en un momento."},"network error":{"fr":"erreur réseau","es":"error de red"},"This video’s sound can’t be read in pieces in this browser ({reason}), and the file is too big ({mb} MB) to read whole. Chrome or Edge can read it.":{"fr":"Ce navigateur ne peut pas lire le son de cette vidéo par morceaux ({reason}), et le fichier est trop gros ({mb} Mo) pour être lu en entier. Chrome ou Edge savent le lire.","es":"Este navegador no puede leer el sonido de este video por partes ({reason}) y el archivo es demasiado grande ({mb} MB) para leerlo entero. Chrome o Edge pueden leerlo."},"This video’s host doesn’t let the app read its sound (no CORS permission, or the page’s security rules block it). Playback still works if the video plays. For the waveform and pitch line, load a copy of the video file from this device.":{"fr":"Le site qui héberge cette vidéo ne laisse pas l’appli lire son son (pas d’autorisation CORS, ou les règles de sécurité de la page le bloquent). La lecture marche quand même si la vidéo se lance. Pour la forme d’onde et la courbe de mélodie, charge une copie du fichier vidéo depuis cet appareil.","es":"El sitio que aloja este video no deja que la app lea su sonido (no hay permiso CORS o las reglas de seguridad de la página lo bloquean). La reproducción sigue funcionando si el video se reproduce. Para la forma de onda y la línea de entonación, carga una copia del archivo de video desde este dispositivo."},"The video link answered with an error ({msg}).":{"fr":"Le lien de la vidéo a renvoyé une erreur ({msg}).","es":"El enlace del video respondió con un error ({msg})."},"The sound couldn’t be decoded ({msg}).":{"fr":"Impossible de décoder le son ({msg}).","es":"No se pudo decodificar el sonido ({msg})."},"unknown error":{"fr":"erreur inconnue","es":"error desconocido"},"This browser view has no microphone access.":{"fr":"Cette vue du navigateur n’a pas accès au micro.","es":"Esta vista del navegador no tiene acceso al micrófono."},"Your chosen microphone isn’t connected, so the default one is being used.":{"fr":"Le micro choisi n’est pas branché, donc celui par défaut est utilisé.","es":"El micrófono que elegiste no está conectado, así que se usa el predeterminado."},"Microphone access was refused. Inside a Claude artifact the microphone is blocked; use the website version to record, or upload recordings from your phone.":{"fr":"L’accès au micro a été refusé. Dans un artifact Claude, le micro est bloqué : utilise la version site web pour enregistrer, ou importe des enregistrements depuis ton téléphone.","es":"Se denegó el acceso al micrófono. Dentro de un artifact de Claude el micrófono está bloqueado; usa la versión web para grabar o sube grabaciones desde tu teléfono."},"Microphone access was refused. Allow the microphone for this site in your browser’s address bar, then try again.":{"fr":"L’accès au micro a été refusé. Autorise le micro pour ce site dans la barre d’adresse du navigateur, puis réessaie.","es":"Se denegó el acceso al micrófono. Permite el micrófono para este sitio en la barra de direcciones del navegador y vuelve a intentarlo."},"No microphone was found.":{"fr":"Aucun micro trouvé.","es":"No se encontró ningún micrófono."},"The microphone couldn’t start ({name}).":{"fr":"Le micro n’a pas pu démarrer ({name}).","es":"El micrófono no pudo iniciarse ({name})."},"Microphone level":{"fr":"Niveau du micro","es":"Nivel del micrófono"},"Microphone boost":{"fr":"Amplification du micro","es":"Amplificación del micrófono"},"auto":{"fr":"auto","es":"auto"},"Re-open the microphone (next pass) for the browser part of automatic volume to change.":{"fr":"Rouvre le micro (au prochain passage) pour que la partie navigateur du volume automatique change.","es":"Vuelve a abrir el micrófono (en la próxima pasada) para que cambie la parte del navegador del volumen automático."},"Automatic volume":{"fr":"Volume automatique","es":"Volumen automático"},"Microphone":{"fr":"Micro","es":"Micrófono"},"The new microphone is used from the next pass.":{"fr":"Le nouveau micro sera utilisé dès le prochain passage.","es":"El nuevo micrófono se usará desde la próxima pasada."},"Default microphone":{"fr":"Micro par défaut","es":"Micrófono predeterminado"},"Microphone {n}":{"fr":"Micro {n}","es":"Micrófono {n}"},"That recording couldn’t be found.":{"fr":"Impossible de trouver cet enregistrement.","es":"No se encontró esa grabación."},"The recording couldn’t play in this browser.":{"fr":"Cet enregistrement ne peut pas être lu dans ce navigateur.","es":"La grabación no se pudo reproducir en este navegador."},"Finish or end the current session before opening another video.":{"fr":"Termine ou arrête la séance en cours avant d’ouvrir une autre vidéo.","es":"Termina o detén la sesión actual antes de abrir otro video."},"This looks like a share page, not a direct video file. Share pages from Google Drive, MEGA, YouTube and similar sites don’t play here. Use a direct link that ends in .mp4.":{"fr":"On dirait une page de partage, pas un fichier vidéo direct. Les pages de partage de Google Drive, MEGA, YouTube et sites similaires ne se lisent pas ici. Utilise un lien direct qui finit par .mp4.","es":"Parece una página para compartir, no un archivo de video directo. Las páginas para compartir de Google Drive, MEGA, YouTube y sitios parecidos no se reproducen aquí. Usa un enlace directo que termine en .mp4."},"The saved file didn’t play. This browser may not play its format; an .mp4 file works everywhere.":{"fr":"Le fichier enregistré ne s’est pas lancé. Ce navigateur ne lit peut-être pas son format ; un fichier .mp4 marche partout.","es":"El archivo guardado no se reprodujo. Puede que este navegador no lea su formato; un archivo .mp4 funciona en todas partes."},"Inside a Claude artifact, videos from other websites are blocked by the page’s security rules. Pick the same video file from this device, or store a short copy here (20 MB maximum).":{"fr":"Dans un artifact Claude, les vidéos d’autres sites sont bloquées par les règles de sécurité de la page. Choisis le même fichier vidéo sur cet appareil, ou stocke ici une copie courte (20 Mo maximum).","es":"Dentro de un artifact de Claude, los videos de otros sitios están bloqueados por las reglas de seguridad de la página. Elige el mismo archivo de video en este dispositivo o guarda aquí una copia corta (20 MB como máximo)."},"The link didn’t load as a video. Check it opens directly as an .mp4 file in a new tab.":{"fr":"Le lien ne s’est pas chargé comme une vidéo. Vérifie qu’il s’ouvre directement comme un fichier .mp4 dans un nouvel onglet.","es":"El enlace no se cargó como video. Comprueba que se abra directamente como un archivo .mp4 en una pestaña nueva."},"This video won’t play":{"fr":"Cette vidéo ne se lance pas","es":"Este video no se reproduce"},"Use a file from this device":{"fr":"Utiliser un fichier de cet appareil","es":"Usar un archivo de este dispositivo"},"Store a copy (under 20 MB)":{"fr":"Stocker une copie (moins de 20 Mo)","es":"Guardar una copia (menos de 20 MB)"},"Open original link":{"fr":"Ouvrir le lien d’origine","es":"Abrir el enlace original"},"Playing “{name}” from this device. Pick it again next visit.":{"fr":"Lecture de « {name} » depuis cet appareil. Choisis-le à nouveau la prochaine fois.","es":"Reproduciendo “{name}” desde este dispositivo. Vuelve a elegirlo en tu próxima visita."},"Saved. It’s uploading to your Google Drive for your other devices.":{"fr":"Enregistré. Il s’envoie vers ton Google Drive pour tes autres appareils.","es":"Guardado. Se está subiendo a tu Google Drive para tus otros dispositivos."},"Saved on this device.":{"fr":"Enregistré sur cet appareil.","es":"Guardado en este dispositivo."},"That file is {mb} MB. Stored copies must be under 20 MB; cut a shorter section first, or use “Use a file from this device”.":{"fr":"Ce fichier fait {mb} Mo. Les copies stockées doivent faire moins de 20 Mo : coupe d’abord un passage plus court, ou utilise « Utiliser un fichier de cet appareil ».","es":"Ese archivo pesa {mb} MB. Las copias guardadas deben pesar menos de 20 MB; recorta primero una parte más corta o usa “Usar un archivo de este dispositivo”."},"Uploading a copy…":{"fr":"Envoi d’une copie…","es":"Subiendo una copia…"},"Copy stored. It will play on every device.":{"fr":"Copie stockée. Elle se lira sur tous tes appareils.","es":"Copia guardada. Se reproducirá en todos tus dispositivos."},"Upload failed ({code}). Storage is full.":{"fr":"L’envoi a échoué ({code}). Le stockage est plein.","es":"La subida falló ({code}). El almacenamiento está lleno."},"Upload failed ({code}).":{"fr":"L’envoi a échoué ({code}).","es":"La subida falló ({code})."},"Pause (Space)":{"fr":"Pause (Espace)","es":"Pausa (Espacio)"},"Play (Space)":{"fr":"Lecture (Espace)","es":"Reproducir (Espacio)"},"Replay the loop (R)":{"fr":"Rejouer la boucle (R)","es":"Repetir el bucle (R)"},"Speed":{"fr":"Vitesse","es":"Velocidad"},"Speed (, and .)":{"fr":"Vitesse (, et .)","es":"Velocidad (, y .)"},"Loop":{"fr":"Boucle","es":"Bucle"},"Loop the clip (L)":{"fr":"Lire l’extrait en boucle (L)","es":"Repetir el fragmento en bucle (L)"},"Mute":{"fr":"Couper le son","es":"Silenciar"},"Volume":{"fr":"Volume","es":"Volumen"},"Cut clips":{"fr":"Découper","es":"Cortar fragmentos"},"Clip mode: drag on the timeline to select a new clip (C)":{"fr":"Mode découpe : fais glisser sur la frise pour sélectionner un nouvel extrait (C)","es":"Modo de corte: arrastra en la línea de tiempo para seleccionar un fragmento nuevo (C)"},"Mark clip start at the playhead (I or [)":{"fr":"Marquer le début de l’extrait à la tête de lecture (I ou [)","es":"Marcar el inicio del fragmento en el cabezal (I o [)"},"End":{"fr":"Fin","es":"Fin"},"Mark clip end at the playhead (O or ])":{"fr":"Marquer la fin de l’extrait à la tête de lecture (O ou ])","es":"Marcar el final del fragmento en el cabezal (O o ])"},"Keyboard shortcuts (?)":{"fr":"Raccourcis clavier (?)","es":"Atajos de teclado (?)"},"Clip mode: drag on the timeline to select a clip, or press I and O while it plays.":{"fr":"Mode découpe : fais glisser sur la frise pour sélectionner un extrait, ou appuie sur I et O pendant la lecture.","es":"Modo de corte: arrastra en la línea de tiempo para seleccionar un fragmento, o pulsa I y O mientras se reproduce."},"Clip start marked at {time}":{"fr":"Début de l’extrait marqué à {time}","es":"Inicio del fragmento marcado en {time}"},"Clip end marked at {time}":{"fr":"Fin de l’extrait marquée à {time}","es":"Final del fragmento marcado en {time}"},"done":{"fr":"fait","es":"hecho"},"Select {clip}":{"fr":"Sélectionner {clip}","es":"Seleccionar {clip}"},"Pick a video from your library":{"fr":"Choisis une vidéo dans ta bibliothèque","es":"Elige un video de tu biblioteca"},"Add your first video":{"fr":"Ajoute ta première vidéo","es":"Añade tu primer video"},"Open a video on the right, then choose a clip, or press Cut clips to make a new one.":{"fr":"Ouvre une vidéo à droite, puis choisis un extrait, ou appuie sur Découper pour en créer un nouveau.","es":"Abre un video a la derecha y elige un fragmento, o pulsa Cortar fragmentos para crear uno nuevo."},"Pick a video of someone with the accent you want: an interview or a talk where one person speaks clearly works best.":{"fr":"Choisis une vidéo de quelqu’un qui a l’accent que tu veux : une interview ou une conférence où une seule personne parle clairement, c’est l’idéal.","es":"Elige un video de alguien con el acento que quieres: lo mejor es una entrevista o una charla donde una persona hable con claridad."},"Open the library":{"fr":"Ouvrir la bibliothèque","es":"Abrir la biblioteca"},"Add a video":{"fr":"Ajouter une vidéo","es":"Añadir un video"},"Clip {n} ({time})":{"fr":"Extrait {n} ({time})","es":"Fragmento {n} ({time})"},"Finish or end the current session first.":{"fr":"Termine ou arrête d’abord la séance en cours.","es":"Primero termina o detén la sesión actual."},"Start@@clip edge":{"fr":"Début","es":"Inicio"},"New clip":{"fr":"Nouvel extrait","es":"Nuevo fragmento"},"Done":{"fr":"Terminé","es":"Listo"},"Leave clip mode (Esc)":{"fr":"Quitter le mode découpe (Échap)","es":"Salir del modo de corte (Esc)"},"Select a part of the video on the scrub bar by dragging along it.":{"fr":"Sélectionne un passage de la vidéo en faisant glisser le long de la barre de lecture.","es":"Selecciona una parte del video arrastrando a lo largo de la barra de reproducción."},"Or play the video and press Start (I) under the video where the sentence begins, then End (O) where it finishes.":{"fr":"Ou lance la vidéo et appuie sur Début (I) sous la vidéo là où la phrase commence, puis sur Fin (O) là où elle se termine.","es":"O reproduce el video y pulsa Inicio (I) debajo del video donde empieza la frase, y luego Fin (O) donde termina."},"Analysis panel":{"fr":"Panneau d’analyse","es":"Panel de análisis"},"Select a clip to see the speaker’s pitch line, or press Cut clips under the video to make a new one.":{"fr":"Sélectionne un extrait pour voir la courbe de mélodie du locuteur, ou appuie sur Découper des extraits sous la vidéo pour en créer un.","es":"Selecciona un fragmento para ver la línea de entonación del hablante, o pulsa Cortar fragmentos debajo del video para crear uno nuevo."},"Pitch or loudness of the speaker and you on one chart":{"fr":"Mélodie ou volume du locuteur et de toi sur un seul graphique","es":"Entonación o volumen del hablante y tuyo en un solo gráfico"},"Pitch or loudness lanes: speaker on top, you below":{"fr":"Pistes de mélodie ou de volume : le locuteur en haut, toi en bas","es":"Pistas de entonación o volumen: el hablante arriba, tú abajo"},"View":{"fr":"Affichage","es":"Vista"},"Pitch":{"fr":"Mélodie","es":"Entonación"},"Waveform":{"fr":"Forme d’onde","es":"Forma de onda"},"Layout":{"fr":"Disposition","es":"Disposición"},"Speaker on top, you below":{"fr":"Le locuteur en haut, toi en bas","es":"El hablante arriba, tú abajo"},"Separate":{"fr":"Séparé","es":"Separado"},"Both lines on one chart":{"fr":"Les deux courbes sur un seul graphique","es":"Las dos líneas en un solo gráfico"},"Overlaid":{"fr":"Superposé","es":"Superpuesto"},"Edit clip":{"fr":"Modifier l’extrait","es":"Editar fragmento"},"Change the clip’s start, end, length or label":{"fr":"Modifier le début, la fin, la durée ou le libellé de l’extrait","es":"Cambiar el inicio, el final, la duración o la etiqueta del fragmento"},"Flagged noisy":{"fr":"Signalé bruyant","es":"Marcado como ruidoso"},"Too noisy?":{"fr":"Trop de bruit ?","es":"¿Demasiado ruido?"},"Clip flagged as too noisy. Its pitch line is shown faded.":{"fr":"Extrait signalé comme trop bruyant. Sa courbe de mélodie est affichée en pâle.","es":"Fragmento marcado como demasiado ruidoso. Su línea de entonación se muestra atenuada."},"Noisy flag removed.":{"fr":"Signalement de bruit retiré.","es":"Marca de ruido quitada."},"Flag this clip as too noisy for a reliable pitch line":{"fr":"Signaler cet extrait comme trop bruyant pour une courbe de mélodie fiable","es":"Marcar este fragmento como demasiado ruidoso para una línea de entonación fiable"},"Reading the video’s sound… {pct}":{"fr":"Lecture du son de la vidéo… {pct}","es":"Leyendo el sonido del video… {pct}"},"Load the video file from this device":{"fr":"Charger le fichier vidéo depuis cet appareil","es":"Cargar el archivo de video desde este dispositivo"},"The model line for this clip hasn’t been worked out yet.":{"fr":"La courbe modèle de cet extrait n’a pas encore été calculée.","es":"La línea modelo de este fragmento aún no se ha calculado."},"Work it out now":{"fr":"La calculer maintenant","es":"Calcularla ahora"},"Last pass: {lag} (manual offset)":{"fr":"Dernier passage : {lag} (décalage manuel)","es":"Última pasada: {lag} (desfase manual)"},"Last pass: {lag}":{"fr":"Dernier passage : {lag}","es":"Última pasada: {lag}"},"Pitch line unreliable in places":{"fr":"Courbe de mélodie peu fiable par endroits","es":"Línea de entonación poco fiable en algunos tramos"},"▲ higher":{"fr":"▲ plus aigu","es":"▲ más agudo"},"▼ lower":{"fr":"▼ plus grave","es":"▼ más grave"},"Speaker":{"fr":"Locuteur","es":"Hablante"},"You":{"fr":"Toi","es":"Tú"},"each voice’s own average":{"fr":"moyenne propre à chaque voix","es":"promedio propio de cada voz"},"speaker’s average":{"fr":"moyenne du locuteur","es":"promedio del hablante"},"your average":{"fr":"ta moyenne","es":"tu promedio"},"Microphone unavailable":{"fr":"Micro indisponible","es":"Micrófono no disponible"},"Your line appears here when you record a pass":{"fr":"Ta courbe apparaît ici quand tu enregistres un passage","es":"Tu línea aparece aquí cuando grabas una pasada"},"Zoomed waveform of the selection; drag the yellow edges onto quiet gaps":{"fr":"Forme d’onde agrandie de la sélection ; fais glisser les bords jaunes sur les silences","es":"Forma de onda ampliada de la selección; arrastra los bordes amarillos hasta los silencios"},"Type a time like 3:35.2 or a number of seconds.":{"fr":"Saisis un temps comme 3:35.2 ou un nombre de secondes.","es":"Escribe un tiempo como 3:35.2 o un número de segundos."},"Start":{"fr":"Commencer","es":"Empezar"},"Length (s)":{"fr":"Durée (s)","es":"Duración (s)"},"A few words of what’s said (optional)":{"fr":"Quelques mots de ce qui est dit (facultatif)","es":"Unas palabras de lo que se dice (opcional)"},"Reading the video’s sound for the zoomed waveform…":{"fr":"Lecture du son de la vidéo pour la forme d’onde agrandie…","es":"Leyendo el sonido del video para la forma de onda ampliada…"},"{error} You can still cut the clip with the nudge buttons and by ear.":{"fr":"{error} Tu peux quand même découper l’extrait avec les boutons d’ajustement et à l’oreille.","es":"{error} Aun así puedes cortar el fragmento con los botones de ajuste y de oído."},"Load the file":{"fr":"Charger le fichier","es":"Cargar el archivo"},"aim for {min}–{max} s":{"fr":"vise {min}–{max} s","es":"apunta a {min}–{max} s"},"Play selection":{"fr":"Lire la sélection","es":"Reproducir selección"},"Cancel":{"fr":"Annuler","es":"Cancelar"},"Discard the selection and leave clip mode (Esc)":{"fr":"Abandonner la sélection et quitter le mode découpe (Échap)","es":"Descartar la selección y salir del modo de corte (Esc)"},"Save and shadow":{"fr":"Enregistrer et faire du shadowing","es":"Guardar y hacer shadowing"},"Save the clip and start a session with it":{"fr":"Enregistrer l’extrait et commencer une séance avec","es":"Guardar el fragmento y empezar una sesión con él"},"Save changes":{"fr":"Enregistrer les modifications","es":"Guardar cambios"},"Save clip":{"fr":"Enregistrer l’extrait","es":"Guardar fragmento"},"Start 0.1 s earlier":{"fr":"Commencer 0,1 s plus tôt","es":"Empezar 0,1 s antes"},"Start 0.1 s later":{"fr":"Commencer 0,1 s plus tard","es":"Empezar 0,1 s después"},"Snap":{"fr":"Caler","es":"Ajustar"},"Move the start into the nearest pause":{"fr":"Placer le début dans la pause la plus proche","es":"Mover el inicio a la pausa más cercana"},"End 0.1 s earlier":{"fr":"Finir 0,1 s plus tôt","es":"Terminar 0,1 s antes"},"End 0.1 s later":{"fr":"Finir 0,1 s plus tard","es":"Terminar 0,1 s después"},"Move the end into the nearest pause":{"fr":"Placer la fin dans la pause la plus proche","es":"Mover el final a la pausa más cercana"},"Label":{"fr":"Libellé","es":"Etiqueta"},"Stop":{"fr":"Arrêter","es":"Detener"},"The waveform isn’t available, so there are no gaps to snap to. Nudge by ear instead.":{"fr":"La forme d’onde n’est pas disponible, donc pas de silence où caler le bord. Ajuste plutôt à l’oreille.","es":"La forma de onda no está disponible, así que no hay silencios donde ajustar. Ajusta de oído."},"No pause found within 2 seconds of that edge.":{"fr":"Aucune pause trouvée à moins de 2 secondes de ce bord.","es":"No se encontró ninguna pausa a menos de 2 segundos de ese borde."},"Snapping there would make the clip too short.":{"fr":"Caler le bord là rendrait l’extrait trop court.","es":"Ajustar ahí dejaría el fragmento demasiado corto."},"The start lands mid-word. Move it into a gap.":{"fr":"Le début tombe au milieu d’un mot. Place-le dans un silence.","es":"El inicio cae a mitad de una palabra. Muévelo a un silencio."},"The end lands mid-word. Move it into a gap so the sentence isn’t cut in half.":{"fr":"La fin tombe au milieu d’un mot. Place-la dans un silence pour ne pas couper la phrase en deux.","es":"El final cae a mitad de una palabra. Muévelo a un silencio para no cortar la frase por la mitad."},"Waveform unavailable":{"fr":"Forme d’onde indisponible","es":"Forma de onda no disponible"},"Clip updated.":{"fr":"Extrait mis à jour.","es":"Fragmento actualizado."},"Clip saved. Cut another, or shadow it now.":{"fr":"Extrait enregistré. Découpes-en un autre, ou fais du shadowing dessus maintenant.","es":"Fragmento guardado. Corta otro o haz shadowing con él ahora."},"Videos":{"fr":"Vidéos","es":"Videos"},"Add video":{"fr":"Ajouter une vidéo","es":"Añadir video"},"Close library":{"fr":"Fermer la bibliothèque","es":"Cerrar la biblioteca"},"No videos yet. Add a video file or a direct link to an .mp4 file to get started.":{"fr":"Pas encore de vidéo. Ajoute un fichier vidéo ou un lien direct vers un fichier .mp4 pour commencer.","es":"Aún no hay videos. Añade un archivo de video o un enlace directo a un archivo .mp4 para empezar."},"Archived ({n})":{"fr":"Archivées ({n})","es":"Archivados ({n})"},"Where the video comes from":{"fr":"Provenance de la vidéo","es":"De dónde viene el video"},"A file on this device":{"fr":"Un fichier sur cet appareil","es":"Un archivo en este dispositivo"},"From a link":{"fr":"Depuis un lien","es":"Desde un enlace"},"It goes into your Google Drive, so it’s on all your devices.":{"fr":"Elle va dans ton Google Drive, donc elle est sur tous tes appareils.","es":"Se guarda en tu Google Drive, así que está en todos tus dispositivos."},"It’s kept in this browser only.":{"fr":"Elle est conservée dans ce navigateur uniquement.","es":"Se guarda solo en este navegador."},"It stays in this browser only until you connect Google Drive.":{"fr":"Elle reste uniquement dans ce navigateur tant que tu n’as pas connecté Google Drive.","es":"Se queda solo en este navegador hasta que conectes Google Drive."},"Video file (any length)":{"fr":"Fichier vidéo (toute durée)","es":"Archivo de video (cualquier duración)"},"Direct link to the .mp4 file":{"fr":"Lien direct vers le fichier .mp4","es":"Enlace directo al archivo .mp4"},"Keep a copy, so it still plays if the link stops working (recommended)":{"fr":"Garder une copie, pour qu’elle reste lisible si le lien ne marche plus (recommandé)","es":"Guardar una copia, para que siga reproduciéndose si el enlace deja de funcionar (recomendado)"},"Title":{"fr":"Titre","es":"Título"},"e.g. Interview, part 1":{"fr":"ex. Interview, partie 1","es":"p. ej., Entrevista, parte 1"},"Speaker (optional)":{"fr":"Locuteur (facultatif)","es":"Hablante (opcional)"},"Who’s speaking":{"fr":"Qui parle","es":"Quién habla"},"Copy and add":{"fr":"Copier et ajouter","es":"Copiar y añadir"},"Check and add":{"fr":"Vérifier et ajouter","es":"Comprobar y añadir"},"Untitled video":{"fr":"Vidéo sans titre","es":"Video sin título"},"Video added. Press Cut clips, then drag along the timeline to make your first clip.":{"fr":"Vidéo ajoutée. Appuie sur Découper des extraits, puis fais glisser le long de la frise pour créer ton premier extrait.","es":"Video añadido. Pulsa Cortar fragmentos y luego arrastra a lo largo de la línea de tiempo para crear tu primer fragmento."},"Choose a video file first.":{"fr":"Choisis d’abord un fichier vidéo.","es":"Elige primero un archivo de video."},"Saving {mb} MB on this device…":{"fr":"Enregistrement de {mb} Mo sur cet appareil…","es":"Guardando {mb} MB en este dispositivo…"},"Saving on this device… {pct}%":{"fr":"Enregistrement sur cet appareil… {pct} %","es":"Guardando en este dispositivo… {pct} %"},"There isn’t enough free space on this device for that file.":{"fr":"Il n’y a pas assez d’espace libre sur cet appareil pour ce fichier.","es":"No hay suficiente espacio libre en este dispositivo para ese archivo."},"The file couldn’t be saved ({error}).":{"fr":"Le fichier n’a pas pu être enregistré ({error}).","es":"No se pudo guardar el archivo ({error})."},"Paste a full link starting with https://":{"fr":"Colle un lien complet commençant par https://","es":"Pega un enlace completo que empiece por https://"},"That’s a share page, not a video file. Links from Google Drive, MEGA, YouTube or Dropbox share pages won’t play. Download the file, then add it with “A file on this device”.":{"fr":"C’est une page de partage, pas un fichier vidéo. Les liens de pages de partage Google Drive, MEGA, YouTube ou Dropbox ne se lisent pas. Télécharge le fichier, puis ajoute-le avec « Un fichier sur cet appareil ».","es":"Es una página para compartir, no un archivo de video. Los enlaces de páginas para compartir de Google Drive, MEGA, YouTube o Dropbox no se reproducen. Descarga el archivo y luego añádelo con «Un archivo en este dispositivo»."},"Downloading a copy…":{"fr":"Téléchargement d’une copie…","es":"Descargando una copia…"},"That site doesn’t let the app download its videos.":{"fr":"Ce site ne permet pas à l’appli de télécharger ses vidéos.","es":"Ese sitio no permite que la app descargue sus videos."},"The link answered with an error (HTTP {status}).":{"fr":"Le lien a répondu par une erreur (HTTP {status}).","es":"El enlace respondió con un error (HTTP {status})."},"That link is a web page, not a video file. Use a direct link to an .mp4 file.":{"fr":"Ce lien mène à une page web, pas à un fichier vidéo. Utilise un lien direct vers un fichier .mp4.","es":"Ese enlace es una página web, no un archivo de video. Usa un enlace directo a un archivo .mp4."},"Downloading a copy… {pct}%":{"fr":"Téléchargement d’une copie… {pct} %","es":"Descargando una copia… {pct} %"},"{error} You can download the file yourself and add it with “A file on this device”, or add the link without a copy.":{"fr":"{error} Tu peux télécharger le fichier toi-même et l’ajouter avec « Un fichier sur cet appareil », ou ajouter le lien sans copie.","es":"{error} Puedes descargar el archivo tú mismo y añadirlo con «Un archivo en este dispositivo», o añadir el enlace sin copia."},"Add the link without a copy":{"fr":"Ajouter le lien sans copie","es":"Añadir el enlace sin copia"},"Checking the link plays…":{"fr":"Vérification de la lecture du lien…","es":"Comprobando que el enlace se reproduce…"},"Add it anyway":{"fr":"L’ajouter quand même","es":"Añadirlo de todos modos"},"The link loaded but has no playable video.":{"fr":"Le lien s’est chargé mais ne contient pas de vidéo lisible.","es":"El enlace se cargó, pero no tiene video reproducible."},"The link didn’t load. Inside a Claude artifact, videos from other websites are blocked, so this check always fails here. Add it anyway and play it from a file on this device, or use the standalone version of the app.":{"fr":"Le lien ne s’est pas chargé. Dans un artifact Claude, les vidéos d’autres sites sont bloquées, donc cette vérification échoue toujours ici. Ajoute-la quand même et lis-la depuis un fichier sur cet appareil, ou utilise la version autonome de l’appli.","es":"El enlace no se cargó. Dentro de un artifact de Claude, los videos de otros sitios están bloqueados, así que esta comprobación siempre falla aquí. Añádelo de todos modos y reprodúcelo desde un archivo en este dispositivo, o usa la versión independiente de la app."},"That link isn’t a playable video file. Check it opens directly as an .mp4 in a new tab.":{"fr":"Ce lien n’est pas un fichier vidéo lisible. Vérifie qu’il s’ouvre directement comme un .mp4 dans un nouvel onglet.","es":"Ese enlace no es un archivo de video reproducible. Comprueba que se abre directamente como .mp4 en una pestaña nueva."},"The link didn’t load. Check the address and that the file is still online.":{"fr":"Le lien ne s’est pas chargé. Vérifie l’adresse et que le fichier est toujours en ligne.","es":"El enlace no se cargó. Comprueba la dirección y que el archivo siga en línea
