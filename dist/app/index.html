/* ---------- blind listener pack ---------- */
async function exportListenerPack() {
  toast(t('Building the pack… this can take a little while.'));
  const items = [];
  for (const w of CHECKIN_WEEKS) {
    const c = checkinFor(w);
    if (!c) continue;
    const id = (c.recs.answer || []).slice(-1)[0] || (c.recs.retell || []).slice(-1)[0];
    const r = Store.get('recordings', id);
    if (!r) continue;
    const blob = await Store.getBlob(r.ref);
    if (!blob) continue;
    try {
      const x = await AudioEng.decodeBlob(blob);
      items.push({ kind: 'checkin', week: w, samples: excerpt(x, 20) });
    } catch { /* skip undecodable */ }
  }
  // one or two clips of real speakers of the target accent, from your library
  const clips = shuffle(Store.all('clips').filter((c) => !c.archived && !c.noisy));
  for (const c of clips) {
    if (items.filter((i) => i.kind === 'model').length >= 2) break;
    const v = Store.get('videos', c.videoId);
    const st = await VideoAudio.ensure(v, c.start, Math.min(c.end, c.start + 20));
    if (!st || st.status !== 'ready') continue;
    items.push({ kind: 'model', clipId: c.id, samples: VideoAudio.slice(v.id, c.start, Math.min(c.end, c.start + 20)) });
  }
  if (items.filter((i) => i.kind === 'checkin').length < 1) { toast(t('Record at least one check-in first.'), 'bad'); return; }
  const mixed = shuffle(items);
  const letters = 'ABCDEFGHIJ';
  const enc = new TextEncoder();
  const files = mixed.map((it, i) => ({ name: t('Sample {letter}.wav', { letter: letters[i] }), data: DSP.wav(it.samples) }));
  const csvCell = (x) => (/[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x);
  const sheet = [[t('Listener name'), t('Sample'), t('Rating (1 = no foreign accent; 9 = very strong accent)'), t('What gave it away?')].map(csvCell).join(',')]
    .concat(mixed.map((_, i) => `,${letters[i]},,`)).join('\n');
  files.push({ name: 'rating-sheet.csv', data: enc.encode(sheet) });
  files.push({ name: 'instructions.txt', data: enc.encode(t('Thanks for helping!\n\nListen to each sample once or twice, in any order. For each one, rate how strong a foreign (non-{accent}) accent you hear:\n1 = no foreign accent at all, 9 = very strong foreign accent.\nThen write a few words on what gave it away (a sound, the rhythm, the melody...).\nFill in rating-sheet.csv and send it back.\n', { accent: t(targetAccent().short) })) });
  const zip = makeZip(files);
  const pack = Store.put('meta', { id: `pack-${uid()}`, kind: 'listenerPack', lang: targetLang(), created: new Date().toISOString(), items: mixed.map((it, i) => ({ label: letters[i], kind: it.kind, week: it.week, clipId: it.clipId })), ratings: [] });
  const name = `listener-pack-${dayKey()}.zip`;
  if (Caps.downloads) {
    try { await Caps.downloads.save({ filename: name, data: zip }); toast(t('Pack saved.'), 'good'); } catch (e) { if (e.code !== 'declined') toast(t('Couldn’t save the file ({error}).', { error: e.code }), 'bad'); }
  } else {
    const a = h('a', { href: URL.createObjectURL(zip), download: name });
    document.body.appendChild(a); a.click(); a.remove();
  }
  toast(t('Pack {date} keeps the answer key here, so the listeners can’t see which is which.', { date: fmtDay(dayKey()) }));
  return pack;
}
function excerpt(x, secs) {
  const a = DSP.analyse(x.length > SR * 90 ? x.subarray(0, SR * 90) : x);
  const on = DSP.onset(a.db) * HOP;
  return x.subarray(on, Math.min(x.length, on + secs * SR));
}
function listenerPacks() { const lang = targetLang(); return Store.all('meta').filter((m) => m.kind === 'listenerPack' && checkinLang(m) === lang).sort((a, b) => (a.created < b.created ? 1 : -1)); }

function openRatings() {
  const packs = listenerPacks();
  if (!packs.length) { toast(t('Export a listener pack first.')); return; }
  const pack = packs[0];
  const F = { listener: '', vals: {} };
  const form = h('form', { class: 'stack', onsubmit: (e) => {
    e.preventDefault();
    const rows = pack.items.map((it) => ({ label: it.label, rating: +F.vals[it.label]?.rating || null, comment: F.vals[it.label]?.comment || '' })).filter((r) => r.rating >= 1 && r.rating <= 9);
    if (!rows.length) { toast(t('Enter at least one rating from 1 to 9.')); return; }
    Store.patch('meta', pack.id, { ratings: [...(pack.ratings || []), { listener: F.listener.trim() || 'Listener', rows, at: dayKey() }] });
    toast(t('Ratings saved.'), 'good');
    openProgress('measures');
  } },
  h('label', { class: 'field', for: 'rListener' }, t('Listener name'), h('input', { type: 'text', id: 'rListener', oninput: (e) => { F.listener = e.target.value; } })),
  h('div', { class: 'table-wrap' }, h('table', null, h('thead', null, h('tr', null, h('th', null, t('Sample')), h('th', null, t('Rating 1–9')), h('th', null, t('What gave it away?')))),
    h('tbody', null, pack.items.map((it) => h('tr', null, h('td', null, it.label),
      h('td', null, h('input', { type: 'number', min: 1, max: 9, id: `r-${it.label}`, style: { width: '80px' }, oninput: (e) => { (F.vals[it.label] ||= {}).rating = e.target.value; } })),
      h('td', null, h('input', { type: 'text', id: `c-${it.label}`, oninput: (e) => { (F.vals[it.label] ||= {}).comment = e.target.value; } }))))))),
  h('div', { class: 'row' }, h('button', { type: 'submit', class: 'btn primary' }, h('span', null, t('Save ratings')))));
  openModal([modalHead(t('Enter listener ratings'), tp((pack.ratings || []).length, 'Pack from {date} · {n} listener so far', 'Pack from {date} · {n} listeners so far', { date: fmtDay(dayKey(new Date(pack.created))) })), form]);
}
function ratingAverages() {
  const out = new Map();
  for (const p of listenerPacks()) {
    for (const r of p.ratings || []) for (const row of r.rows) {
      const it = p.items.find((i) => i.label === row.label);
      if (!it) continue;
      const label = it.kind === 'model' ? t('{accent} speaker (reference)', { accent: t(targetAccent().short) }) : it.week === 0 ? t('Baseline') : t('Week {n}', { n: it.week });
      if (!out.has(label)) out.set(label, []);
      out.get(label).push(row.rating);
    }
  }
  return [...out.entries()].map(([label, arr]) => ({ label, avg: mean(arr), n: arr.length }));
}

/* ---- 86-push.js ---- */
/* ---------- push notifications: practice reminders on this device ---------- */
/* The service worker (/sw.js, built from src/site/sw.js) shows the notifications. Each device that
   turns them on gets its own push subscription, which the server keeps with the user's reminder
   channels (server/reminders.js). On iPhone and iPad, Safari only offers push to a site that has
   been added to the Home Screen and opened from there. */
const Push = {
  reg: null,
  supported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  ios() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  installed() { return navigator.standalone === true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches); },
  permission() { return 'Notification' in window ? Notification.permission : 'unsupported'; },
  async register() {
    if (!('serviceWorker' in navigator)) return null;
    try { this.reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' }); } catch (e) { console.warn('service worker not registered', e); }
    return this.reg;
  },
  async registration() {
    if (!('serviceWorker' in navigator)) return null;
    return this.reg || (await navigator.serviceWorker.getRegistration('/').catch(() => null)) || this.register();
  },
  /** This device's subscription, or null. */
  async current() {
    if (!this.supported()) return null;
    const reg = await this.registration();
    return reg ? reg.pushManager.getSubscription().catch(() => null) : null;
  },
  /** Ask for permission (must run straight from a tap), subscribe, and hand the subscription to the server. */
  async enable(publicKey) {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      throw new Error(perm === 'denied'
        ? t('Notifications are blocked for this site. Allow them in your browser’s site settings (or the system notification settings), then try again.')
        : t('Notifications weren’t allowed.'));
    }
    if (!(await this.registration())) throw new Error(t('This browser couldn’t start the notification service.'));
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    // a subscription made for a different server key can't receive our messages
    if (sub && sub.options && sub.options.applicationServerKey && b64url(sub.options.applicationServerKey) !== publicKey) { await sub.unsubscribe(); sub = null; }
    if (!sub) {
      try {
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: fromB64url(publicKey) });
      } catch (e) {
        // "Registration failed - push service error": the browser couldn't reach its own push service
        if (e && (e.name === 'AbortError' || /push service/i.test(e.message || ''))) {
          throw new Error(/Brave/.test(navigator.userAgent) || navigator.brave
            ? t('Brave has push turned off. Turn on “Use Google services for push messaging” in brave://settings/privacy, restart Brave, and try again.')
            : t('This browser couldn’t reach its notification service. A VPN, firewall or ad blocker may be blocking it, or this browser may not support push. Try again without them, or in Chrome, Edge, Firefox or Safari.'));
        }
        throw e;
      }
    }
    await Api.req('POST', '/api/reminders/push', { subscription: sub.toJSON(), label: deviceLabel() });
    return sub;
  },
  /** Stop notifications on this device (server first, so a failed unsubscribe still stops them). */
  async disable() {
    const sub = await this.current();
    if (!sub) return;
    await Api.req('DELETE', '/api/reminders/push', { endpoint: sub.endpoint }).catch(() => {});
    await sub.unsubscribe().catch(() => {});
  },
};

function b64url(buf) {
  let s = '';
  for (const b of new Uint8Array(buf)) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromB64url(str) {
  const s = atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}
function deviceLabel() {
  const ua = navigator.userAgent;
  const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' : /Android/.test(ua) ? 'Android'
    : /Mac OS X/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /CrOS/.test(ua) ? 'Chromebook' : /Linux/.test(ua) ? 'Linux' : 'Device';
  const br = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  return br ? `${os} · ${br}` : os;
}

/* The "Notifications" card in Settings → Reminders. `status.push` comes from GET /api/reminders. */
function pushCard(status, { onChange }) {
  const card = h('div', { class: 'card stack' }, h('h3', null, t('Notifications on this device')));
  card.add = (...nodes) => card.append(...nodes.filter(Boolean));
  const push = status && status.push;
  const others = push ? push.devices - (push.thisDevice ? 1 : 0) : 0;
  const more = others > 0 ? h('p', { class: 'small muted' }, tp(others, 'Also on {n} other device.', 'Also on {n} other devices.')) : null;
  if (!status) { card.add(h('p', { class: 'small muted' }, t('Checking…'))); return card; }
  if (!push || !push.available) { card.add(h('p', { class: 'muted' }, t('Notifications aren’t available yet. Discord reminders work in the meantime.'))); return card; }
  if (!Push.supported()) {
    card.add(Push.ios() && !Push.installed()
      ? h('p', { class: 'muted' }, t('On iPhone and iPad, notifications need the app on your Home Screen: tap the Share button, choose “Add to Home Screen”, open Euno from there, and come back here.'))
      : h('p', { class: 'muted' }, t('This browser can’t show notifications from websites. Try Chrome, Edge, Firefox or Safari.')), more);
    return card;
  }
  if (push.thisDevice && Push.permission() === 'granted') {
    card.add(
      h('div', { class: 'row' },
        h('span', { class: 'chip' }, icon('check'), t('On for this device')),
        btn(t('Turn off here'), async () => {
          await Push.disable(); toast(t('Notifications are off on this device.')); onChange();
        }, { size: 'sm', kind: 'ghost' })),
      more);
    return card;
  }
  const blocked = Push.permission() === 'denied';
  card.add(
    h('p', { class: 'muted' }, t('Get reminders as a notification on this phone or computer. Turn them on on each device you want them on.')),
    blocked ? h('p', { class: 'small muted' }, t('Notifications are blocked for this site. Allow them in your browser’s site settings, then turn them on here.')) : null,
    h('div', { class: 'row' },
      btn(t('Turn on notifications'), async () => {
        try {
          await Push.enable(push.publicKey);
          if (!reminderSettings().enabled) saveReminders({ enabled: true });
          toast(t('Notifications are on for this device.'), 'good');
          onChange();
        } catch (e) { toast(e.message, 'bad', 8000); }
      }, { kind: 'primary', size: 'sm', icon: 'bell' })),
    more);
  return card;
}

async function safeRun(fn) { try { return await fn(); } catch (e) { return { state: 'fail', msg: t('Error: {error}', { error: e.message || e.code || e }) }; } }

async function checkStorage() {
  if (Store.mode === 'cloud') {
    await Api.req('PUT', '/api/docs/meta/probe', { at: new Date().toISOString() });
    await Api.req('DELETE', '/api/docs/meta/probe');
    return { state: 'ok', msg: Api.email ? t('Your account’s database saves and reads back (signed in as {email}). Your data follows you to any device.', { email: Api.email }) : t('Your account’s database saves and reads back. Your data follows you to any device.') };
  }
  if (Store.mode === 'artifact') {
    const ref = Caps.db.collection('meta').doc('probe');
    await ref.set({ at: new Date().toISOString() });
    const snap = await ref.get();
    await ref.delete();
    return snap.exists ? { state: 'ok', msg: t('The artifact’s database saves and reads back. Your data follows you to any device.') } : { state: 'fail', msg: t('A test write didn’t read back.') };
  }
  if (Store.mode === 'local') return { state: 'warn', msg: t('Saving works, but only in this browser on this device. Use Settings → Data → Export backup to move it.') };
  return { state: 'fail', msg: t('Storage is blocked here; nothing is kept.') };
}
async function checkFiles() {
  if (Store.blobMode === 'device') {
    // straight to device storage, so the test file never syncs anywhere
    const id = `probe-${uid()}`;
    await DeviceFiles.put(id, new Blob([new Uint8Array(4096)], { type: 'audio/webm' }));
    const back = await DeviceFiles.get(id);
    await DeviceFiles.del(id);
    if (!back || back.size !== 4096) return { state: 'fail', msg: t('A test file didn’t read back from this device’s storage.') };
    const q = await DeviceFiles.estimate();
    const free = q ? ` ${t('About {gb} GB free for this browser.', { gb: fmtNum((q.quota - q.usage) / 1073741824, 1) })}` : '';
    return Drive.connected()
      ? { state: 'ok', msg: t('Recordings and videos go into your Google Drive, with a copy in this browser for quick playback.') + free }
      : { state: 'warn', msg: t('Recordings and videos are only in this browser. Connect Google Drive in Settings → Storage to keep them safe and on your other devices.') + free };
  }
  if (Store.blobMode === 'assets') {
    const blob = new Blob([new Uint8Array(2048)], { type: 'video/webm' });
    const r = await Caps.assets.upload(blob, { type: 'video/webm' });
    const list = await Caps.assets.list();
    await Caps.assets.delete(r.id);
    const u = list.usage;
    const mins = Math.floor((u.maxBytes - u.bytes) / (16000 * 60));
    return { state: 'ok', msg: t('File storage works. {used} of {max} MB used, {files}/{maxFiles} files; 20 MB per recording maximum (about {mins} more minutes of recordings at typical quality).', { used: (u.bytes / 1048576).toFixed(1), max: (u.maxBytes / 1048576).toFixed(0), files: u.files, maxFiles: u.maxFiles, mins }) };
  }
  return { state: 'fail', msg: t('Recordings can’t be kept here.') };
}
async function checkMic() {
  AudioEng.getCtx();
  const ok = await Mic.open();
  if (!ok) return { state: 'fail', msg: Mic.error };
  let peak = -100;
  const off = Mic.on((x) => { for (let i = 0; i < x.length; i += 40) peak = Math.max(peak, 20 * Math.log10(Math.abs(x[i]) + 1e-6)); });
  await sleep(1500);
  off();
  if (!Session.active) Mic.close();
  return peak > -70 ? { state: 'ok', msg: t('The microphone works (peak level {db} dB in 1.5 s).', { db: peak.toFixed(0) }) } : { state: 'warn', msg: t('The microphone opened but heard silence. Check the input device.') };
}
async function checkVideoPlays() {
  const v = Player.current();
  if (!v) return { state: '', msg: t('Open a video first.') };
  if (LocalFiles.get(v.id)) return { state: 'warn', msg: t('Playing from a file on this device, so the link wasn’t tested.') };
  const r = await checkPlayable(videoSrc(v));
  return r.ok ? { state: 'ok', msg: v.fileRef || v.assetId ? t('“{title}” plays from its stored copy ({time} long).', { title: v.title, time: fmtTime(r.duration) }) : t('“{title}” plays from its link ({time} long).', { title: v.title, time: fmtTime(r.duration) }) } : { state: 'fail', msg: r.reason };
}
async function checkVideoSound() {
  const v = Player.current();
  if (!v) return { state: '', msg: t('Open a video first.') };
  VideoAudio.cache.delete(v.id);
  const t0 = performance.now();
  const r = await VideoAudio.ensure(v, 0, 10);
  const secs = fmtNum((performance.now() - t0) / 1000, 1);
  if (r.status === 'ready') return { state: 'ok', msg: r.method === 'partial'
    ? t('The app reads just the part of “{title}” it needs (10 s of sound in {secs} s, decoded with {via}). Pitch and waveform will work.', { title: v.title, secs, via: r.via })
    : t('The app can read the sound of “{title}”, but has to download the whole file each visit ({secs} s here){why}.', { title: v.title, secs, why: r.mp4Failed ? `: ${r.mp4Failed}` : '' }) };
  return { state: 'fail', msg: r.error };
}
async function checkClaude() {
  if (Store.mode === 'cloud') {
    if (!Api.ai) return { state: 'warn', msg: t('No AI key saved, so notes offer “Copy prompt for AI”. Add a key in Settings → AI to get answers in the app.') };
    const r = await Api.req('POST', '/api/ai/test', { profile: profileForAI() });
    return r.ok ? { state: 'ok', msg: t('{provider} answered with {model} in {secs} s.', { provider: Api.ai.providerName, model: r.model, secs: (r.ms / 1000).toFixed(1) }) } : { state: 'warn', msg: t('The model answered in an unexpected format. Try another model in Settings → AI.') };
  }
  if (!Caps.sample) return { state: 'fail', msg: Caps.inArtifact ? t('Claude access isn’t available in this view.') : t('This standalone version can’t reach Claude. Notes offer “Copy prompt for Claude” instead.') };
  const r = await Caps.sample('Reply with just the word OK.', { modelTier: 'quick', cache: false });
  return /ok/i.test(r.text) ? { state: 'ok', msg: t('Claude answered. Feedback on notes will use your Claude plan.') } : { state: 'warn', msg: t('Claude answered unexpectedly: “{text}”', { text: r.text.slice(0, 60) }) };
}
async function checkPitch() {
  const clips = Store.all('clips').filter((c) => c.model);
  if (!clips.length) return { state: '', msg: t('Save a clip whose sound can be read first.') };
  const rel = clips.map((c) => c.model.reliability || 0);
  const avg = mean(rel);
  const weak = clips.filter((c) => (c.model.reliability || 0) < 0.55);
  return { state: avg > 0.7 ? 'ok' : avg > 0.5 ? 'warn' : 'fail', msg: tp(clips.length, 'On average {pct}% of voiced speech gets a reliable pitch reading across {n} clip.', 'On average {pct}% of voiced speech gets a reliable pitch reading across {n} clips.', { pct: Math.round(avg * 100) }) + (weak.length ? ` ${tp(weak.length, '{n} clip is patchy (background noise); flag it as noisy if the line jumps.', '{n} clips are patchy (background noise); flag them as noisy if the line jumps.')}` : '') };
}
async function checkAlign() {
  const recs = Store.all('recordings').filter((r) => r.kind === 'pass' && r.score != null).sort((a, b) => (a.created < b.created ? 1 : -1)).slice(0, 12);
  if (!recs.length) return { state: '', msg: t('Record a few passes first.') };
  const good = recs.filter((r) => r.score > 0.3);
  const share = good.length / recs.length;
  return { state: share > 0.75 ? 'ok' : share > 0.4 ? 'warn' : 'fail', msg: t('{good} of the last {total} recorded passes lined up automatically (average match {score}). When it fails, the manual offset in Settings is used.', { good: good.length, total: recs.length, score: mean(recs.map((r) => r.score)).toFixed(2) }) };
}

function fmtWhen(ms) {
  if (!ms) return '—';
  const d = new Date(ms);
  const days = Math.floor((Date.now() - ms) / 86400000);
  const date = fmtDate(d, d.getFullYear() === new Date().getFullYear() ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
  if (ms > Date.now()) return date; // invite end dates
  return days < 1 ? t('today {time}', { time: `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` }) : days < 2 ? t('yesterday') : date;
}

  } catch {
    toast(created ? t('Created {code}. Sign-up link: {link}', { code, link }) : link, 'good', 12000);

function needsOnboarding() { return !profile().onboarded; }

function openOnboarding() {
  const draft = { ...profile() };
  if (!draft.name && Api.name) draft.name = String(Api.name).split(/\s+/)[0].slice(0, 40); // first name from Google
  const W = { i: 0, draft, addVideo: true, baseline: true };
  W.steps = ONBOARDING_STEPS.filter((s) => !s.when || s.when());
  renderOnboarding(W);

function renderOnboarding(W) {
  const step = W.steps[W.i];
  const n = W.steps.length;
  const last = W.i === n - 1;
  const go = () => {
    if (step.next && step.next(W) === false) return;
    if (last) finishOnboarding(W); else { W.i++; renderOnboarding(W); }
  };
  const back = () => { W.i--; renderOnboarding(W); };
  const progress = h('ol', { class: 'wiz-progress', style: `--n: ${n}`, 'aria-label': t('Step {i} of {n}', { i: W.i + 1, n }) },
    W.steps.map((s, i) => h('li', { class: i < W.i ? 'done' : i === W.i ? 'cur' : '', 'aria-current': i === W.i ? 'step' : null },
      h('i', null), h('span', null, t(s.label)))));
  const form = h('form', { class: 'wiz', novalidate: true, onsubmit: (e) => { e.preventDefault(); go(); } },
    h('div', { class: 'wiz-top' },
      h('span', { class: 'label' }, t('Step {i} of {n}', { i: W.i + 1, n })),
      h('span', { class: 'grow' }),
      btn('', () => closeModal(), { icon: 'close', kind: 'ghost', size: 'sm', title: t('Close (you can finish setting up in Settings)'), aria: t('Close') })),

    h('div', { class: 'wiz-head' }, h('h2', null, step.title(W)), step.sub ? h('p', { class: 'muted' }, step.sub(W)) : null),
    h('div', { class: 'wiz-body stack' }, step.body(W)),

      h('span', { class: 'grow' }),
      h('button', { type: 'submit', class: 'btn primary big' }, h('span', null, last ? t('Finish') : t('Continue')))));
  // focus the step's first text box, else Continue (not the close button)
  const first = form.querySelector('.wiz-body input:not([type="checkbox"]):not([type="radio"]), .wiz-body textarea') || form.querySelector('button[type="submit"]');
  first.setAttribute('autofocus', '');
  openModal(form, { narrow: true, onClose: () => finishOnboarding(W, true) });

/* closing early keeps whatever was saved so far; everything can be changed later in Settings → Profile */
function finishOnboarding(W, closed) {
  saveProfile({ onboarded: new Date().toISOString() });

/* a list of languages as removable chips, a box to type any language, and one-tap suggestions */
function nativeLanguagesField(draft) {
  let list = splitLanguages(draft.nativeLanguages);
  const tags = h('div', { class: 'tags' });
  const sugg = h('div', { class: 'suggest', 'aria-label': t('Suggestions') });
  const input = h('input', { type: 'text', id: 'pfNative', maxlength: 40, autocomplete: 'off', spellcheck: 'false', placeholder: t('Type a language, then press Enter'),
    oninput: () => drawSuggestions(),
    onkeydown: (e) => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        if (input.value.trim()) add(bestMatch());
      } else if (e.key === 'Backspace' && !input.value && list.length) { list.pop(); sync(); }
    },
    onblur: () => { if (input.value.trim()) add(bestMatch(), true); } });
  // what Enter adds: the exact language, else the first suggestion ("fr" -> French), else what was typed
  const bestMatch = () => {
    const typed = input.value.trim(), q = typed.toLowerCase();
    // matches the English name or the name in the interface language; the English name is what's stored
    const names = (l) => [l.toLowerCase(), t(l).toLowerCase()];
    return NATIVE_LANGUAGE_HINTS.find((l) => names(l).includes(q)) || NATIVE_LANGUAGE_HINTS.find((l) => !list.includes(l) && names(l).some((x) => x.startsWith(q))) || typed;
  };
  const sync = (keepFocus = true) => {
    draft.nativeLanguages = joinLanguages(list);
    mount(tags, list.map((l) => h('span', { class: 'tag' }, t(l),
      h('button', { type: 'button', 'aria-label': t('Remove {lang}', { lang: t(l) }), onclick: () => { list = list.filter((x) => x !== l); sync(); } }, icon('close')))));
    input.placeholder = list.length ? t('Add another') : t('Type a language, then press Enter');
    drawSuggestions();
    if (keepFocus) input.focus();
  };
  const add = (l, quiet) => {
    l = l.replace(/\s+/g, ' ').trim().slice(0, 40);
    if (l && !list.some((x) => x.toLowerCase() === l.toLowerCase() || t(x).toLowerCase() === l.toLowerCase())) list.push(l);
    input.value = '';
    sync(!quiet);
  };
  const drawSuggestions = () => {
    const q = input.value.trim().toLowerCase();
    const pool = NATIVE_LANGUAGE_HINTS.filter((l) => !list.includes(l));
    const shown = q ? pool.filter((l) => l.toLowerCase().includes(q) || t(l).toLowerCase().includes(q)).slice(0, 8) : pool.slice(0, 8);
    mount(sugg, shown.map((l) => h('button', { type: 'button', class: 'chip add', onmousedown: (e) => e.preventDefault(), onclick: () => add(l) }, icon('plus'), t(l))));
  };
  sync(false);
  return h('div', { class: 'field' },
    h('label', { for: 'pfNative' }, t('Languages you speak natively')),
    h('div', { class: 'langpick', onclick: (e) => { if (e.target === e.currentTarget || e.target === tags) input.focus(); } }, tags, input),
    sugg,
    h('p', { class: 'small muted' }, t('Add one or more. Not in the list? Type it and press Enter.')));
}

/* ---- 99-main.js ---- */
/* ---------- boot, global rendering, keyboard ---------- */
/* what shows where depends on what you're doing:
   browsing -> today's card under the player; cutting -> the clip editor there;
   in a session -> session card in the right column, pitch/waveform under the player */
const wideLayout = window.matchMedia ? matchMedia('(min-width: 901px)') : { matches: true };
function applyLayout() {
  const mode = Session.active ? 'session' : UI.cutMode || UI.sel ? 'cut' : 'idle';
  const layout = $('.layout'), sess = $('#session'), panel = $('#panel');
  layout.classList.toggle('in-session', mode === 'session');
  layout.classList.toggle('cutting', mode === 'cut');
  if (mode === 'session' && wideLayout.matches) { if (sess.parentElement !== $('#sideSlot')) $('#sideSlot').appendChild(sess); }
  else if (sess.parentElement !== $('#below')) $('#below').insertBefore(sess, panel);
  sess.hidden = mode === 'cut';
  panel.hidden = mode === 'idle';
  if (UI.layoutMode !== mode) { UI.layoutMode = mode; requestAnimationFrame(() => Panel.onTime(Player.time())); }
  scheduleFit();
}

/* Sizes depend only on the window and the video's shape, never on what you're doing, so the
   page doesn't reshuffle when you press a button:
   - the video gets the window height minus a fixed allowance for the panel underneath;
   - the right column takes the width the video doesn't need (within limits);
   - the library or session card beside the player matches its height;
   - the full-width panel underneath fills down to the bottom of the window. */
const BELOW_ALLOWANCE = 250;
let fitQueued = false;
function scheduleFit() {
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => { fitQueued = false; fitLayout(); });
}
function fitLayout() {
  const L = $('.layout');
  if (!wideLayout.matches) {
    L.classList.remove('fit');
    ['--side-w', '--video-h', '--below-h', '--top-h'].forEach((v) => L.style.removeProperty(v));
    return;
  }
  L.classList.add('fit');
  const v = Player.v;
  const ar = v && v.videoWidth && v.videoHeight ? v.videoWidth / v.videoHeight : 16 / 9;
  L.style.setProperty('--video-ar', String(ar));
  const css = getComputedStyle(L);
  const padT = parseFloat(css.paddingTop), padB = parseFloat(css.paddingBottom), padX = parseFloat(css.paddingLeft) + parseFloat(css.paddingRight);
  const gapY = parseFloat(css.rowGap) || 14, gapX = parseFloat(css.columnGap) || 16;
  const top = L.getBoundingClientRect().top + window.scrollY;
  const avail = Math.max(360, window.innerHeight - top - padT - padB);
  const vh = Math.max(avail * 0.5, avail - BELOW_ALLOWANCE - gapY - 6);
  const totalW = L.clientWidth - padX - gapX;
  const sideW = clamp(Math.round(totalW - vh * ar - 6), 360, Math.max(360, Math.min(600, totalW * 0.36)));
  L.style.setProperty('--side-w', `${sideW}px`);
  L.style.setProperty('--video-h', `${Math.floor(vh)}px`);
  const playerH = $('#player').offsetHeight;
  L.style.setProperty('--below-h', `${Math.max(BELOW_ALLOWANCE, Math.floor(avail - playerH - gapY))}px`);
  L.style.setProperty('--top-h', `${playerH}px`); // library / session card: same height as the player
  Panel.onTime(Player.time()); // the chart may have changed size
}

/* labels written in index.html are set here, so they follow the interface language */
function renderStaticLabels() {
  $('#scrubber').setAttribute('aria-label', t('Video timeline'));
  $('#sidebar').setAttribute('aria-label', t('Video library'));
}

  renderStaticLabels();

  renderBanners();
  renderControls();
  renderScrubber();
  renderSession();
  renderPanel();
  renderSidebar();
  $('#playerEmpty').hidden = !!Player.current();
  if (!Player.current()) renderPlayerEmpty();

function onKey(e) {
  const tag = (e.target && e.target.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (isModalOpen()) { if (e.key === 'Escape') closeModal(); return; }
  const k = e.key;
  if (k === ' ' || k === 'Spacebar') {
    if (tag === 'BUTTON') return; // let the focused button act
    e.preventDefault(); Player.toggle();
  } else if (k === 'r' || k === 'R') Player.replayLoop();
  else if (k === 'i' || k === 'I' || k === '[') markEdge('start');
  else if (k === 'o' || k === 'O' || k === ']') markEdge('end');
  else if (k === ',' || k === '<') Player.stepRate(-1);
  else if (k === '.' || k === '>') Player.stepRate(1);
  else if (k === 'l' || k === 'L') { UI.loop = !UI.loop; renderControls(); toast(UI.loop ? t('Loop on') : t('Loop off')); }
  else if (k === 'ArrowLeft') { e.preventDefault(); Player.seek(Player.time() - 2); }
  else if (k === 'ArrowRight') { e.preventDefault(); Player.seek(Player.time() + 2); }
  else if (k === 'Enter' && Session.active && (Session.phase === 'intro' || Session.phase === 'armed')) Session.go();
  else if (k === 'c' || k === 'C') { if (Player.current() && !Session.active) setCutMode(!UI.cutMode); }
  else if (k === 'Escape') { if (UI.drawer) closeDrawer(); else if ((UI.sel || UI.cutMode) && !Session.active) cancelCut(); }
  else if (k === '?') openShortcuts();
}

    openModal([

  applyTheme();
  initMedia(); // device storage and Google Drive sync (17-media.js)
  Push.register(); // service worker: reminder notifications, and lets the browser install the app (86-push.js)
  UI.view = settings().defaultView || 'pitch';
  if (UI.videoId && !Store.get('videos', UI.videoId)) UI.videoId = null;
  if (!UI.videoId) {
    const first = Store.all('videos').filter((v) => !v.archived).sort((a, b) => (a.added < b.added ? 1 : -1))[0];
    UI.videoId = first ? first.id : null;
  }
  Player.load(UI.videoId);
  const last = lastClipId();
  if (last && Store.get('clips', last) && Store.get('clips', last).videoId === UI.videoId) { UI.clipId = last; renderAll(); }
  document.addEventListener('keydown', onKey);
  $('#drawerBack').addEventListener('click', closeDrawer);
  Bus.on('videoaudio', () => { Panel.editor = null; renderPanel(); });
  Bus.on('signedout', () => renderBanners());
  window.addEventListener('resize', () => Panel.onTime(Player.time()));
  if (wideLayout.addEventListener) wideLayout.addEventListener('change', () => applyLayout());
  window.addEventListener('resize', scheduleFit);
  Player.v.addEventListener('loadedmetadata', scheduleFit);
  // the row under the player and the banners change height as you work: refit when they do
  if (window.ResizeObserver) { const ro = new window.ResizeObserver(scheduleFit); ro.observe($('#banners')); }
  window.addEventListener('beforeunload', () => { Store.flushAll(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flushAll(); });
  refreshAdminBadge();
  // first launch: the setup wizard (profile, files, first video, AI, baseline); see 90-onboarding.js
  if (needsOnboarding()) openOnboarding();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>

</body>
</html>
