# Cloudflare Pages project: static app in dist/, backend in functions/.
# scripts/setup.mjs fills in database_id.
name = "shadowing"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Accounts with these (Google-verified) emails are admins. Comma-separated.
ADMIN_EMAILS = "evorsio1@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "shadowing"
database_id = "fe8dc4c5-4122-44b1-b4da-fcbeda64ac41"
migrations_dir = "migrations"

# Read-only leftovers from before files moved to the device and Google Drive (docs/STORAGE.md).
# Remove this binding once every file has been moved out.
[[r2_buckets]]
binding = "FILES"
bucket_name = "shadowing-files"

# The reminders Worker (workers/reminders): the API pokes it so its schedule keeps running.
[[services]]
binding = "REMINDERS"
service = "shadowing-reminders"

# Secrets (set with `npx wrangler pages secret put NAME`, never committed):
#   GOOGLE_CLIENT_ID      OAuth client for Sign in with Google (docs/ACCOUNTS.md)
#   GOOGLE_CLIENT_SECRET
#   KEY_ENCRYPTION_KEY    32 random bytes, base64: seals Drive tokens (and AI keys) per user
#   TURNSTILE_SECRET      optional: spam check for the contact form
#   ANTHROPIC_API_KEY     optional, admin-only until bring-your-own-key AI ships
