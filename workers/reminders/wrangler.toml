# Reminders for the shadowing app (Pages Functions can't run on a schedule).
# Scheduling is a Durable Object alarm, not a cron trigger (the account's free crons are in use).
name = "shadowing-reminders"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "shadowing"
database_id = "fe8dc4c5-4122-44b1-b4da-fcbeda64ac41"

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]
