<title>Shadowing Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/*@STYLES@*/
</style>

<header class="topbar">
  <div class="brand">Shadowing <small>practice</small></div>
  <div class="chips" id="chips"></div>
  <nav class="topnav" id="topnav"></nav>
</header>
<div class="banners" id="banners"></div>

<main class="layout">
  <section class="stage" aria-label="Practice">
    <div class="player" id="player">
      <video id="video" playsinline preload="auto"></video>
      <div class="player-empty" id="playerEmpty"></div>
      <div class="player-error" id="playerError" hidden></div>
      <div class="controls" id="controls">
        <div class="scrubber" id="scrubber" aria-label="Video timeline">
          <div class="scrub-track" id="scrubTrack"><div class="scrub-progress" id="scrubProgress"></div></div>
          <div id="scrubClips"></div>
          <div class="scrub-sel" id="scrubSel" hidden></div>
          <div class="scrub-head" id="scrubHead"></div>
          <div class="hover-time" id="hoverTime" hidden></div>
        </div>
        <div class="ctrl-row" id="ctrlRow"></div>
      </div>
    </div>
    <div class="session" id="session"></div>
    <div class="panel" id="panel"></div>
  </section>
  <aside class="sidebar" id="sidebar" aria-label="Video library"></aside>
</main>
<div class="drawer-back" id="drawerBack" hidden></div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti"></canvas>

<script>
/*@SCRIPTS@*/
</script>
